<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告编制 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .return-detail { font-size: 12px; line-height: 1.5; color: #64748b; white-space: pre-line; }
    #return-toast {
      position: fixed; top: 24px; right: 24px; z-index: 9999;
      display: flex; align-items: center; gap: 8px;
      min-width: 280px; max-width: 420px;
      padding: 12px 16px; border-radius: 4px;
      background: #fff; border: 1px solid #fecaca; box-shadow: 0 4px 12px rgba(15, 23, 42, .12);
      color: #334155; font-size: 13px; opacity: 0; transform: translateY(-8px);
      transition: opacity .2s, transform .2s; pointer-events: none;
    }
    #return-toast.show { opacity: 1; transform: translateY(0); }
    #return-toast .icon { color: #ef4444; font-size: 16px; }
    #ai-returned-banner .ai-returned-scroll {
      max-height: 7.25rem; overflow-y: auto; overflow-x: hidden;
      padding: 0 1rem 0.75rem;
    }
    #ai-returned-banner .ai-returned-line {
      display: flex; align-items: center; gap: 0.5rem;
      min-height: 2.25rem; padding: 0.35rem 0;
      border-bottom: 1px dashed #fecaca; font-size: 13px;
    }
    #ai-returned-banner .ai-returned-line:last-child { border-bottom: none; }
    #ai-returned-banner .ai-returned-line .ai-line-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-return-pill {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 9999px; border: 1px solid #f87171;
      background: linear-gradient(90deg, #fef2f2, #fff7ed);
      padding: 2px 8px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.02em; color: #b91c1c; vertical-align: middle;
      box-shadow: 0 0 0 1px rgba(254, 202, 202, 0.4);
    }
    tr.ai-return-row > td:first-child { box-shadow: inset 3px 0 0 #ef4444; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700" data-cat-col="off">

  <div id="return-toast" role="alert"><i class="fa fa-times-circle icon"></i><span id="return-toast-msg"></span></div>

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告编制
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_sample" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">是否关联框架合同</label>
          <select id="f_frame" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-500 outline-none focus:border-blue-500">
            <option value="">请选择</option>
            <option>是</option><option>否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">框架合同编号</label>
          <input id="f_contract" type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托单位</label>
          <input id="f_unit" type="text" placeholder="请输入委托单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-3 xl:justify-end">
          <button onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div id="ai-returned-banner" data-annotate="ai-returned" class="mt-4 hidden rounded border border-red-200 bg-red-50 text-sm shadow-sm">
      <div id="ai-returned-head" class="border-b border-red-100 px-4 py-2.5 font-medium text-red-700"></div>
      <div id="ai-returned-scroll" class="ai-returned-scroll"></div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1400px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">优先等级</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="col-record">报告记录</th>
              <!-- 透明检测延至明年：列暂时隐藏，相关弹窗与逻辑保留便于恢复 -->
              <th class="hidden border border-slate-200 px-3 py-2 font-medium" data-annotate="col-transparency">透明度等级 / 溯源</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="report-ops">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 5 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">3</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10 条/页</option></select>
      </div>
    </div>
  </div>

  <!-- 退回原因弹窗（报告编制 → 数据审核） -->
  <div id="returnModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[520px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">退回原因</h3>
        <button type="button" onclick="closeReturnModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5 text-sm">
        <div class="flex items-start gap-3">
          <label class="mt-2 w-16 flex-shrink-0 text-right text-slate-600"><span class="text-red-500">*</span> 原因：</label>
          <textarea id="returnReason" rows="5" placeholder="请输入原因" class="flex-1 rounded border border-slate-300 px-3 py-2 outline-none focus:border-blue-500"></textarea>
        </div>
        <p class="mt-3 pl-[4.5rem] text-xs text-slate-400">退回后流程节点回到「数据审核」</p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeReturnModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button type="button" onclick="confirmReturn()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">确定</button>
      </div>
    </div>
  </div>

  <!-- 报告列表弹窗（编制） -->
  <div id="compileListModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[1100px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">报告列表</h3>
        <button type="button" onclick="closeCompileListModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <table class="w-full min-w-[980px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-2 py-2 w-10"><input type="checkbox" id="compileCheckAll" onchange="toggleCompileCheckAll(this.checked)" /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">生成时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">审核意见</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">签发意见</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-36">退回详情</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-24">操作</th>
            </tr>
          </thead>
          <tbody id="compileListBody"></tbody>
        </table>
        <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
          <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">2</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeCompileListModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmCompile()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white" data-annotate="compile-confirm">编制</button>
      </div>
    </div>
  </div>

  <!-- 报告记录弹窗 -->
  <div id="reportRecordModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[90vh] w-[960px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">报告记录</h3>
        <button type="button" onclick="closeReportRecordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <table class="w-full min-w-[860px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">审核</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">签发</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">处理</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">收费审批</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">发放</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-20">操作</th>
            </tr>
          </thead>
          <tbody id="reportRecordBody"></tbody>
        </table>
        <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
          <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 报告操作日志弹窗（叠在报告记录之上） -->
  <div id="reportLogModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[640px] max-w-[92vw] rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">报告操作日志</h3>
        <button type="button" onclick="closeReportLogModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5">
        <div id="reportLogList" class="space-y-5 max-h-[60vh] overflow-y-auto"></div>
        <div class="mt-5 flex justify-center gap-1 text-sm text-slate-500">
          <button type="button" class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
          <button type="button" class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
          <button type="button" class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 透明度等级选择弹窗 -->
  <div id="levelModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[560px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">选择报告透明度等级</h3>
        <button type="button" onclick="closeLevelModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <p id="levelModalHint" class="mb-3 rounded bg-slate-50 px-3 py-2 text-xs text-slate-500"></p>
        <div id="levelOptions" class="space-y-2"></div>
        <div id="levelResult" class="mt-3 hidden rounded-lg border p-3 text-sm"></div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeLevelModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmLevel()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script src="js/short-link-qr.js"></script>
  <script src="js/report-trace.js"></script>
  <script src="js/report-trace-l1.js"></script>

      ReportReviewMock.aiReturnedReports().forEach(function (r) {
        if (!grouped[r.entrustCode]) grouped[r.entrustCode] = r;
      });
      var nextId = ROWS.reduce(function (m, row) { return Math.max(m, typeof row.id === 'number' ? row.id : m); }, 0) + 1;
      Object.keys(grouped).forEach(function (code) {
        if (ROWS.some(function (row) { return row.code === code; })) return;
        var ent = ReportReviewMock.getEntrust(code);
        if (!ent) return;
        ROWS.unshift({
          id: nextId++,

          contract: ent.contract || '/',
          unit: ent.customer,
          sample: ent.sample,
          acceptDate: ent.acceptDate || '',
          dueDate: ent.requireDate || '',
          priority: ent.priority || '常规',
          sales: '',
          compiler: ent.compiler || 'admin',
          aiReturnedHighlight: true,
        });
      });

    function renderLevelOptions() {
      document.getElementById('levelOptions').innerHTML = ReportTrace.LEVELS.map(function (lv) {

        if (chk.ok) { tag = chk.note ? '可出具·选低' : '可出具'; tagCls = 'bg-green-100 text-green-700'; }
        else if (chk.blockedBy === 'authorized') { tag = '超出授权·需重新评定'; tagCls = 'bg-red-100 text-red-700'; }
        else { tag = '预留·暂不可出具'; tagCls = 'bg-amber-100 text-amber-700'; }

        return '<label class="flex cursor-pointer items-start gap-2 rounded-lg border p-3 hover:bg-slate-50 ' + (_levelPick === lv.level ? 'border-blue-400 bg-blue-50' : 'border-slate-200') + '">' +

          '<p class="mt-0.5 text-xs text-slate-500">' + lv.brief + '</p>' +
          (chk.missing && chk.missing.length ? '<p class="mt-1 text-[11px] text-amber-600">待补能力：' + chk.missing.join('、') + '</p>' : '') +

    function confirmLevel() {
      if (!_levelPick) { alert('请选择一个透明度等级'); return; }
      var row = ROWS.filter(function (r) { return r.id === _levelRowId; })[0];
      if (!row) return;
      var chk = ReportTrace.canIssue(_levelPick);
      var box = document.getElementById('levelResult');
      var pickName = ReportTrace.levelName(_levelPick).split(' ')[0];
      box.classList.remove('hidden');
      if (chk.ok) {
        row.level = _levelPick; row.reservedLevel = null;
        box.className = 'mt-3 rounded-lg border border-green-200 bg-green-50 p-3 text-sm text-green-700';
        box.innerHTML = '<i class="fa fa-check-circle"></i> 已选定 <b>' + pickName + '</b>。' +

          ' 报告签发后将生成唯一溯源码并印刷于报告首页。';
      } else if (chk.blockedBy === 'capability') {
        row.reservedLevel = _levelPick; row.level = null;
        box.className = 'mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-700';
        box.innerHTML = '<i class="fa fa-clock-o"></i> 已登记 <b>' + pickName + '</b> 升级预留。当前能力未就绪（' +

      for (var i = 0; i < codes.length; i++) {
        var list = REPORTS_BY_ENTRUST[codes[i]];
        for (var j = 0; j < list.length; j++) {
          if (list[j].id === reportId) return list[j];
        }
      }
      return null;
    }

    function renderReportLogList(logs) {
      var box = document.getElementById('reportLogList');
      if (!logs || !logs.length) {
        box.innerHTML = '<p class="py-6 text-center text-sm text-slate-400">暂无操作日志</p>';
        return;
      }
      box.innerHTML = logs.map(function (item) {
        return '<div class="relative border-l-2 border-slate-200 pl-5">' +
          '<span class="absolute -left-[7px] top-1 h-3 w-3 rounded-full border-2 border-blue-500 bg-white"></span>' +
          '<div class="text-sm text-slate-500">' + item.time + '</div>' +
          '<div class="mt-1 text-sm text-slate-700">' + item.text + '</div></div>';
      }).join('');
    }

    function openReportLogModal(reportId) {
      var report = findReportById(reportId);
      renderReportLogList(report && report.logs ? report.logs : []);
      var modal = document.getElementById('reportLogModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeReportLogModal() {
      var modal = document.getElementById('reportLogModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function openCompileListModal(code) {
      activeEntrustCode = code || '';
      renderCompileList(activeEntrustCode);
      var modal = document.getElementById('compileListModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCompileListModal() {
      var modal = document.getElementById('compileListModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleCompileCheckAll(checked) {
      document.querySelectorAll('.compile-row-check').forEach(function (el) { el.checked = checked; });
    }

    function confirmCompile() {
      var n = document.querySelectorAll('.compile-row-check:checked').length;
      if (!n) { alert('请至少选择一份报告'); return; }
      closeCompileListModal();
      alert('已打开 Word 在线编制（原型演示），共 ' + n + ' 份报告');
    }

    function openReportRecordModal(code) {
      activeEntrustCode = code || '';
      renderReportRecordList(activeEntrustCode);
      var modal = document.getElementById('reportRecordModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReportRecordModal() {
      closeReportLogModal();
      var modal = document.getElementById('reportRecordModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('reportLogModal').addEventListener('click', function (e) {
      if (e.target === this) closeReportLogModal();
    });

    var returnRowId = null;

    function showModal(id) {
      var m = document.getElementById(id);
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function hideModal(id) {
      var m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function showReturnBlockedToast() {
      var el = document.getElementById('return-toast');
      document.getElementById('return-toast-msg').textContent = '还有报告正在审批中,无法退回!';
      el.classList.add('show');
      clearTimeout(showReturnBlockedToast._t);
      showReturnBlockedToast._t = setTimeout(function () { el.classList.remove('show'); }, 2800);
    }

    function openReturnModal(rowId) {
      var row = null;
      for (var i = 0; i < ROWS.length; i++) {
        if (ROWS[i].id === rowId) { row = ROWS[i]; break; }
      }
      if (!row) return;
      // 一单生成多份报告：若已有报告编制完成并流转到下一审批节点，整单禁止退回（与报告列表/报告记录同源）
      if (hasReportInApproval(row.code)) {
        showReturnBlockedToast();
        return;
      }
      returnRowId = rowId;
      document.getElementById('returnReason').value = '';
      showModal('returnModal');
    }
    function closeReturnModal() {
      returnRowId = null;
      hideModal('returnModal');
    }
    function confirmReturn() {
      var reason = document.getElementById('returnReason').value.trim();
      if (!reason) {
        alert('请填写退回原因');
        return;
      }
      if (returnRowId == null) return;
      var idx = -1;
      for (var i = 0; i < ROWS.length; i++) {
        if (ROWS[i].id === returnRowId) { idx = i; break; }
      }
      if (idx < 0) { closeReturnModal(); return; }
      var row = ROWS[idx];
      ROWS.splice(idx, 1);
      closeReturnModal();
      renderTable();
      alert('已将 ' + row.code + ' 退回至「数据审核」\n原因：' + reason);
    }

    document.getElementById('returnModal').addEventListener('click', function (e) {
      if (e.target === this) closeReturnModal();
    });

    function doSearch() {
      var code = document.getElementById('f_code').value.trim();
      var sample = document.getElementById('f_sample').value.trim();
      var filtered = ROWS.filter(function (r) {
        if (code && r.code.indexOf(code) < 0) return false;
        if (sample && r.sample.indexOf(sample) < 0) return false;
        return true;
      });
      renderTable(filtered);
    }

    function doReset() {
      document.getElementById('f_code').value = '';
      document.getElementById('f_sample').value = '';
      document.getElementById('f_frame').value = '';
      document.getElementById('f_contract').value = '';
      document.getElementById('f_unit').value = '';
      renderTable();
    }

    renderTable();
    renderAiReturnedBanner();

    // AI 审核不通过自动退回：报告审核阶段命中严重项的报告会被 AI 退回本环节（报告编制），此处置顶提示（与报告审核页同源）
    function renderAiReturnedBanner() {
      var box = document.getElementById('ai-returned-banner');
      var head = document.getElementById('ai-returned-head');
      var scroll = document.getElementById('ai-returned-scroll');
      if (!box || !head || !scroll || !window.ReportReviewMock) return;
      var list = ReportReviewMock.aiReturnedReports();
      if (!list.length) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      var byEntrust = {};
      list.forEach(function (it) {
        if (!byEntrust[it.entrustCode]) {
          byEntrust[it.entrustCode] = { entrustCode: it.entrustCode, customer: it.customer, sample: it.sample, reports: [] };
        }
        byEntrust[it.entrustCode].reports.push(it);
      });
      var entrustLines = Object.keys(byEntrust).map(function (code) { return byEntrust[code]; });
      head.innerHTML = '<i class="fa fa-exclamation-triangle mr-1"></i>AI 审核不通过自动退回（' +
        entrustLines.length + ' 个委托任务 · ' + list.length + ' 份报告待重新编制）';
      scroll.innerHTML = entrustLines.map(function (ent) {
        var brief = ent.reports.map(function (r) {
          return r.reportNo + '（' + r.reasons.map(function (x) { return x.rule_id; }).join('、') + '）';
        }).join('；');
        return '<div class="ai-returned-line">' +
          '<span class="ai-line-main text-slate-700" title="' + ent.entrustCode + ' · ' + ent.customer + ' · ' + ent.sample + '">' +
          '<b>' + ent.entrustCode + '</b>（' + ent.customer + ' · ' + ent.sample + '）— ' + brief +
          '</span>' +
          '<a href="report-compile-edit.html?entrust=' + encodeURIComponent(ent.entrustCode) + '" class="flex-shrink-0 text-blue-600 hover:underline">去修订</a>' +
          '</div>';
      }).join('');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'ai-returned', selector: '[data-annotate="ai-returned"]', position: 'bottom', title: 'AI 审核不通过自动退回', content: '<strong>需求逻辑：</strong>报告流转到「报告审核」时自动跑 AI 预审，命中严重项的报告不进人工审核、直接自动退回「报告编制」，编制人需在本环节优先处理。<br>' +
            '<strong>展示规则：</strong>固定高度红色提示区（内部滚动），<strong>一行一个委托任务</strong>：委托编号、客户/样品、本单下被退回报告摘要与「去修订」；下方主查询列表<strong>同步展示</strong>这些委托（委托编号旁带 AI 退回徽标）。无退回时整条隐藏。<br>' +
            '<strong>交互逻辑：</strong>数据与「报告审核」页同源；点「编制」弹窗中 AI 退回的报告在编号旁显示渐变「AI 自动退回」标签与规则摘要。演示 SC2026/0238 / 0238-03（C02-5）。', tag: '报告编制' },
        { id: 'compile-ai-tag', selector: '[data-ai-return="1"]', position: 'left', title: '编制列表 · AI 自动退回标识', content: '<strong>展示规则：</strong>命中 AI 严重项自动退回的报告：行背景淡红渐变，报告编号下挂「AI 自动退回」胶囊标签与规则摘要；默认勾选便于优先修订。<br><strong>交互逻辑：</strong>与顶部提示条、主列表委托行同源。', tag: '报告列表' },
        { id: 'report-list-ops', selector: '[data-annotate="report-ops"]', position: 'top-left', title: '操作', content: '<strong>需求逻辑：</strong>报告列表是编制入口；编制发现问题可直接退回上一环节「数据审核」修正后重提。<br>' +
            '<strong>展示规则：</strong>操作列：「报告生成」「编制」「退回」。<br>' +
            '<strong>交互逻辑：</strong>「报告生成」跳转报告编制编辑页；「编制」弹出报告列表；「退回」见独立批注。AI 预审入口在侧边栏「报告审核 / AI 审核工作台」。', tag: '报告编制' },
        { id: 'report-return', selector: '[data-annotate="report-return"]', position: 'left', title: '退回（整单，受多报告审批约束）', content: '<strong>需求逻辑：</strong>编制发现问题可把委托整单退回「数据审核」；但一单可能生成多份报告，若其中已有报告编制完成并流转到下一节点（报告审核等），再退回会把已在审批中的报告一并打乱，因此此时禁止退回。<br>' +
            '<strong>展示规则：</strong>操作列橙色「退回」；拦截时右上角错误提示「还有报告正在审批中,无法退回!」。<br>' +
            '<strong>交互逻辑：</strong>① 该委托下全部报告仍停在编制节点 → 弹出「退回原因」（必填），确认后行离开本列表，流程回到「数据审核」。② 任一报告已进入下一审批节点 → 不打开弹窗，仅提示「还有报告正在审批中,无法退回!」。演示：委托 SC2026/0099 已有报告在审批中，点退回即见拦截。', tag: '报告编制' },
        { id: 'report-col-record', selector: '[data-annotate="col-record"]', position: 'top', title: '报告记录', content: '<strong>需求逻辑：</strong>报告要经过编制、审核、签发、发放多个节点，列表页要能直接看到每份报告卡在哪个节点、谁签的；与「编制」弹窗里的报告列表共用同一份进度数据，编号与节点必须一致。<br>' +
            '<strong>展示规则：</strong>「报告记录」列/链接；弹窗列为序号、报告编号、编制、审核、签发、处理、收费审批、发放、操作（日志）；已发生节点显示「人 + 时间 + 意见」，未发生为 —，卡在审核中显示「审批中」。<br>' +
            '<strong>交互逻辑：</strong>按当前委托打开；演示 SC2026/0099：-01 编制完成后退回编制（审核不通过），-02 已提交报告审核（审批中）——与点「编制」看到的意见/退回详情同源。', tag: '报告编制' },
        { id: 'report-gen-link', selector: '[data-annotate="report-generate"]', position: 'left', title: '报告生成', content: '<strong>需求逻辑：</strong>演示要能一键走到完整生成流程，因此给一个默认委托入口。<br>' +
            '<strong>展示规则：</strong>「报告生成」链接，演示委托 SCZN202508/0009 · 实壁塑料电缆导管 PVC-C。<br>' +
            '<strong>交互逻辑：</strong>点击进入报告编制编辑页；换其它委托从委托列表进入。', tag: '报告编制' },
        { id: 'compile-modal', selector: '[data-annotate="compile-confirm"]', position: 'left', title: '编制确认', content: '<strong>需求逻辑：</strong>一次可能要多份报告同时编制，先勾选再进编辑器，避免误改；列表中的审核/签发意见与退回详情必须与「报告记录」弹窗进度一致。<br>' +
            '<strong>展示规则：</strong>弹窗列出该委托下报告：编号、试样、名称、生成时间、审核意见、签发意见、退回详情；意见取值与报告记录同源（未发生 — / 审批中 / 审核不通过等）。<br>' +
            '<strong>交互逻辑：</strong>勾选后点「编制」进入 Word 在线编辑（原型演示），关闭弹窗不改变报告状态。', tag: '报告列表' },
        // 透明检测延至明年：列已隐藏，对应批注暂不挂载（col-transparency / rl-level）
        {
          id: 'rl-record',
          selector: '#reportRecordBody',
          position: 'bottom-right',
          title: '报告记录（节点留痕，与编制列表同源）',
          wide: true,
          content: '<strong>需求逻辑：</strong>报告从编制到发放经过六个节点；「编制」弹窗与「报告记录」弹窗读同一份委托报告进度，避免同一委托两套编号或节点互相矛盾。<br>' +
          '<strong>展示规则：</strong>列为序号、报告编号、编制、审核、签发、处理、收费审批、发放、操作；单元格显示「人 + 时间」（有意见时附加），未发生为 —，当前卡在审核显示「审批中」；操作列蓝色「日志」。<br>' +
          '<strong>交互逻辑：</strong>由列表「报告记录」入口按委托打开；点「日志」叠出报告操作日志；关闭回到列表，不改变数据。',
          tag: '报告列表'
        },
        {
          id: 'report-op-log',
          selector: '#reportLogList',
          position: 'bottom-right',
          title: '报告操作日志',
          wide: true,
          content: '<strong>需求逻辑：</strong>单份报告的流转动作要可追溯（谁在哪个节点把报告提交/退回到哪），与报告记录节点进度同源。<br>' +
          '<strong>展示规则：</strong>弹窗标题「报告操作日志」；时间轴（蓝圈空心点 + 时间 + 文案），文案形如「admin 在 报告编制 将 报告编号为SC2026/0099-02的报告 提交至 报告审核」。<br>' +
          '<strong>交互逻辑：</strong>报告记录操作列点「日志」打开（叠在记录弹窗之上）；点遮罩或 × 关闭，记录弹窗仍保留。',
          tag: '报告列表'
        },
      ] });
    }
  </script>
