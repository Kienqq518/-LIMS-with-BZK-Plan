<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告编制 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .return-detail { font-size: 12px; line-height: 1.5; color: #64748b; white-space: pre-line; }
    /* 编制 · 报告列表弹窗：卡片 + 退回时间轴（多次退回追加，不覆盖） */
    #compileListModal .compile-report-card {
      border: 1px solid #e2e8f0; border-radius: 8px; background: #fff;
      overflow: hidden;
    }
    #compileListModal .compile-report-card.is-ai-return {
      border-color: #fecaca;
      background: linear-gradient(180deg, #fff7f7 0%, #fff 48%);
      box-shadow: inset 3px 0 0 #ef4444;
    }
    #compileListModal .compile-report-meta {
      display: grid; gap: 0.65rem 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (min-width: 900px) {
      #compileListModal .compile-report-meta {
        grid-template-columns: 1.1fr 1.4fr 0.9fr 0.7fr 0.7fr;
      }
    }
    #compileListModal .compile-meta-label {
      display: block; font-size: 11px; color: #94a3b8; margin-bottom: 2px;
    }
    #compileListModal .compile-returns {
      border-top: 1px dashed #e2e8f0; background: #f8fafc;
      padding: 0.75rem 1rem 0.9rem;
    }
    #compileListModal .compile-returns-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.5rem; margin-bottom: 0.65rem;
    }
    #compileListModal .return-timeline { position: relative; margin: 0; padding: 0; list-style: none; }
    #compileListModal .return-timeline > li {
      position: relative; padding: 0 0 0.85rem 1.15rem;
      border-left: 2px solid #e2e8f0; margin-left: 0.35rem;
    }
    #compileListModal .return-timeline > li:last-child { padding-bottom: 0; border-left-color: transparent; }
    #compileListModal .return-timeline > li::before {
      content: ''; position: absolute; left: -5px; top: 0.35rem;
      width: 8px; height: 8px; border-radius: 9999px;
      background: #fff; border: 2px solid #94a3b8;
    }
    #compileListModal .return-timeline > li.is-latest::before { border-color: #ef4444; background: #fecaca; }
    #compileListModal .return-timeline > li.is-ai::before { border-color: #f97316; background: #ffedd5; }
    #compileListModal .return-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 600;
      background: #fff; border: 1px solid #e2e8f0; color: #475569;
    }
    #compileListModal .return-chip.is-ai { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
    #compileListModal .return-chip.is-latest { border-color: #fca5a5; color: #b91c1c; background: #fef2f2; }
    #return-toast {
      position: fixed; top: 24px; right: 24px; z-index: 9999;
      display: flex; align-items: center; gap: 8px;
      min-width: 280px; max-width: 420px;
      padding: 12px 16px; border-radius: 4px;
      background: #fff; border: 1px solid #fecaca; box-shadow: 0 4px 12px rgba(15, 23, 42, .12);
      color: #334155; font-size: 13px; opacity: 0; transform: translateY(-8px);
      transition: opacity .2s, transform .2s; pointer-events: none;
    }
    #return-toast.show { opacity: 1; transform: translateY(0); }
    #return-toast .icon { color: #ef4444; font-size: 16px; }
    .ai-return-pill {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 9999px; border: 1px solid #f87171;
      background: linear-gradient(90deg, #fef2f2, #fff7ed);
      padding: 2px 8px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.02em; color: #b91c1c; vertical-align: middle;
      box-shadow: 0 0 0 1px rgba(254, 202, 202, 0.4);
    }
    tr.ai-return-row > td:first-child { box-shadow: inset 3px 0 0 #ef4444; }
    /* 主列表：冻结「操作」列加宽 + 实底，避免横向滚动时与编制人/优先等级列文字叠在一起 */
    .report-list-table tbody tr.ai-return-row { background-color: #fff7f7; }
    .report-list-table tbody tr.ai-return-row:hover { background-color: #fef2f2; }
    .report-list-table th[data-col-key="操作"],
    .report-list-table td[data-col-key="操作"],
    .report-list-table th.report-list-ops-col,
    .report-list-table td.report-list-ops-cell {
      min-width: 10rem; width: 10rem; max-width: 10rem;
      box-sizing: border-box; vertical-align: middle;
    }
    .report-list-table td.cc-fz-r,
    .report-list-table th.cc-fz-r {
      background-color: #fff !important; z-index: 5;
    }
    .report-list-table tr.ai-return-row td.cc-fz-r {
      background-color: #fff7f7 !important;
    }
    .report-list-table tr.ai-return-row:hover td.cc-fz-r {
      background-color: #fef2f2 !important;
    }
    .report-list-table .report-list-ops {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 0.35rem 0.55rem;
      line-height: 1.5;
    }
    .report-list-table .report-list-ops > * { flex-shrink: 0; white-space: nowrap; }
    .report-list-table .entrust-code-stack {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.5rem;
      line-height: 1.45; max-width: 15rem;
    }
    .report-list-table td[data-col-key="委托编号"] { min-width: 10.5rem; }
    .report-list-table td[data-col-key="编制人"],
    .report-list-table td[data-col-key="优先等级"] { white-space: nowrap; }

    /* 报告记录 · 操作日志：审批时间轴（节点 / 处理人 / 状态 / 意见） */
    #reportRecordModal .audit-legend {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; color: #64748b;
    }
    #reportRecordModal .audit-legend span { display: inline-flex; align-items: center; gap: 4px; }
    #reportRecordModal .lg-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 999px; box-sizing: border-box;
      border: 2px solid; background: #fff; vertical-align: -1px;
    }
    #reportRecordModal .lg-pass { border-color: #3b82f6; background: #3b82f6; }
    #reportRecordModal .lg-reject { border-color: #ef4444; background: #ef4444; }
    #reportRecordModal .lg-pending { border-color: #f59e0b; background: #fff; }
    #reportRecordModal .audit-log-scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }
    #reportRecordModal .audit-tl { list-style: none; margin: 0; padding: 2px 2px 0 0; }
    #reportRecordModal .audit-tl-item {
      display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 14px;
    }
    #reportRecordModal .audit-rail { position: relative; }
    #reportRecordModal .audit-rail::after {
      content: ""; position: absolute; left: 50%; top: 20px; bottom: 0; width: 2px;
      transform: translateX(-50%); background: var(--audit-rail, #3b82f6);
    }
    #reportRecordModal .audit-tl-item:last-child .audit-rail::after { display: none; }
    #reportRecordModal .audit-dot {
      position: relative; z-index: 1; display: block;
      width: 16px; height: 16px; margin: 2px auto 0; box-sizing: border-box;
      border-radius: 999px; border: 2px solid var(--audit-dot, #3b82f6);
      background: var(--audit-dot, #3b82f6);
    }
    #reportRecordModal .audit-tl-item.is-pending .audit-dot { background: #fff; }
    #reportRecordModal .audit-tl-item.is-pass { --audit-rail: #3b82f6; --audit-dot: #3b82f6; }
    #reportRecordModal .audit-tl-item.is-reject { --audit-rail: #ef4444; --audit-dot: #ef4444; }
    #reportRecordModal .audit-tl-item.is-pending { --audit-rail: #f59e0b; --audit-dot: #f59e0b; }
    #reportRecordModal .audit-main { min-width: 0; padding: 0 0 20px; }
    #reportRecordModal .audit-tl-item:last-child .audit-main { padding-bottom: 2px; }
    #reportRecordModal .audit-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    }
    #reportRecordModal .audit-title {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      font-size: 14px; font-weight: 500; color: #334155;
    }
    #reportRecordModal .audit-time {
      flex-shrink: 0; font-size: 13px; color: #64748b; font-variant-numeric: tabular-nums;
    }
    #reportRecordModal .audit-no {
      display: inline-flex; align-items: center; flex-shrink: 0; white-space: nowrap;
      border-radius: 999px; background: #f1f5f9; padding: 1px 8px;
      font-size: 12px; font-weight: 400; color: #475569; font-variant-numeric: tabular-nums;
    }
    #reportRecordModal .audit-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px;
    }
    #reportRecordModal .audit-person {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      border-radius: 999px; background: #f3f4f6; padding: 2px 10px 2px 2px;
      font-size: 13px; color: #475569;
    }
    #reportRecordModal .audit-avatar {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 22px; height: 22px; border-radius: 999px; color: #fff; font-size: 12px; line-height: 1;
    }
    #reportRecordModal .audit-status {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; white-space: nowrap;
    }
    #reportRecordModal .audit-status.is-muted { color: #64748b; }
    #reportRecordModal .audit-status.is-pass { color: #16a34a; }
    #reportRecordModal .audit-status.is-reject { color: #dc2626; }
    #reportRecordModal .audit-status.is-pending { color: #d97706; }
    #reportRecordModal .audit-opinion {
      margin-top: 10px; border-radius: 6px; background: #f3f4f6; padding: 8px 12px;
    }
    #reportRecordModal .audit-opinion-kicker { font-size: 12px; line-height: 1.5; color: #64748b; }
    #reportRecordModal .audit-opinion-text { margin-top: 2px; font-size: 13px; line-height: 1.55; color: #4b5563; }
    #reportRecordModal .audit-opinion-kicker:last-child { margin: 0; font-size: 13px; color: #4b5563; }
    #reportRecordModal.rr-mask {
      position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, .45);
    }
    #reportRecordModal.rr-mask.hidden { display: none; }
    #reportRecordModal .rr-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;
      width: min(1120px, 96vw); background: #fff;
      box-shadow: -8px 0 28px rgba(15, 23, 42, .16);
      display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform .22s ease;
    }
    #reportRecordModal.open .rr-panel { transform: translateX(0); }
    #reportRecordModal .rr-body { flex: 1; overflow: auto; }
    #reportRecordModal .audit-log-scroll { max-height: none; overflow: visible; }
    .report-return-wrap { display: inline-flex; cursor: not-allowed; }
    .report-return-btn.is-disabled {
      border: 0; background: transparent; padding: 0; color: #94a3b8;
      cursor: not-allowed; pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="return-toast" role="alert"><i class="fa fa-times-circle icon"></i><span id="return-toast-msg"></span></div>

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告编制
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_sample" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品大类</label>
          <select id="f_cat" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500">
            <option value="">请选择样品大类</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">是否关联框架合同</label>
          <select id="f_frame" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-500 outline-none focus:border-blue-500">
            <option value="">请选择</option>
            <option>是</option><option>否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">框架合同编号</label>
          <input id="f_contract" type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托单位</label>
          <input id="f_unit" type="text" placeholder="请输入委托单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-3 xl:justify-end">
          <button onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="report-list-table w-full min-w-[1520px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium whitespace-nowrap">样品大类</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">优先等级</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <!-- 透明检测延至明年：列暂时隐藏，相关弹窗与逻辑保留便于恢复 -->
              <th class="hidden border border-slate-200 px-3 py-2 font-medium" data-annotate="col-transparency">透明度等级 / 溯源</th>
              <th class="report-list-ops-col border border-slate-200 px-3 py-2 font-medium whitespace-nowrap" data-annotate="report-ops">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 5 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">3</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10 条/页</option></select>
      </div>
    </div>
  </div>

  <!-- 退回原因弹窗（报告编制 → 数据审核） -->
  <div id="returnModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[520px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">退回原因</h3>
        <button type="button" onclick="closeReturnModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5 text-sm">
        <div class="flex items-start gap-3">
          <label class="mt-2 w-16 flex-shrink-0 text-right text-slate-600"><span class="text-red-500">*</span> 原因：</label>
          <textarea id="returnReason" rows="5" placeholder="请输入原因" class="flex-1 rounded border border-slate-300 px-3 py-2 outline-none focus:border-blue-500"></textarea>
        </div>
        <p class="mt-3 pl-[4.5rem] text-xs text-slate-400">退回后流程节点回到「数据审核」</p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeReturnModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button type="button" onclick="confirmReturn()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">确定</button>
      </div>
    </div>
  </div>

  <!-- 报告列表弹窗（编制）：卡片列表 + 退回时间轴（多次追加，不覆盖） -->
  <div id="compileListModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[960px] max-w-full flex-col rounded-lg bg-white shadow-xl" data-annotate="compile-list-modal">
      <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-6 py-3">
        <div>
          <h3 class="text-base font-medium text-slate-800">报告编制</h3>
          <p id="compileListSubtitle" class="mt-0.5 text-xs text-slate-500"></p>
        </div>
        <button type="button" onclick="closeCompileListModal()" class="text-slate-400 hover:text-slate-600" aria-label="关闭"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex items-center justify-between gap-3 border-b border-slate-50 bg-slate-50/80 px-6 py-2 text-xs text-slate-500">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="compileCheckAll" onchange="toggleCompileCheckAll(this.checked)" />
          <span>全选本页</span>
        </label>
        <span>退回记录按时间倒序追加，历史原因保留不覆盖</span>
      </div>
      <div id="compileListBody" class="flex-1 space-y-3 overflow-auto px-6 py-4"></div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeCompileListModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmCompile()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white" data-annotate="compile-confirm">编制</button>
      </div>
    </div>
  </div>

  <!-- 报告记录：右侧抽屉（节点进度 + 操作日志） -->
  <div id="reportRecordModal" class="rr-mask hidden">
    <aside class="rr-panel" data-annotate="rl-record-merged" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <div>
          <h3 class="text-base font-medium text-slate-800">报告记录</h3>
          <p id="reportRecordSubtitle" class="mt-0.5 text-xs text-slate-500"></p>
        </div>

      ReportReviewMock.aiReturnedReports().forEach(function (r) { map[r.reportNo] = r; });

      if (row && row.aiAutoReturn) return true;

    }

    function ensureAiReturnedEntrustsInRows() {
      if (!window.ReportReviewMock) return;
      var grouped = {};
      ReportReviewMock.aiReturnedReports().forEach(function (r) {
        if (!grouped[r.entrustCode]) grouped[r.entrustCode] = r;
      });
      var nextId = ROWS.reduce(function (m, row) { return Math.max(m, typeof row.id === 'number' ? row.id : m); }, 0) + 1;
      Object.keys(grouped).forEach(function (code) {
        if (ROWS.some(function (row) { return row.code === code; })) return;
        var ent = ReportReviewMock.getEntrust(code);
        if (!ent) return;
        ROWS.unshift({
          id: nextId++,
          code: code,
          contract: ent.contract || '/',
          unit: ent.customer,
          sample: ent.sample,
          acceptDate: ent.acceptDate || '',
          dueDate: ent.requireDate || '',
          priority: ent.priority || '常规',
          sales: '',
          compiler: ent.compiler || 'admin',
          aiReturnedHighlight: true,
        });
      });
    }

        else { tag = '预留·暂不可出具'; tagCls = 'bg-amber-100 text-amber-700'; }
        var checked = (_levelPick === lv.level) ? 'checked' : '';
        return '<label class="flex cursor-pointer items-start gap-2 rounded-lg border p-3 hover:bg-slate-50 ' + (_levelPick === lv.level ? 'border-blue-400 bg-blue-50' : 'border-slate-200') + '">' +

    var activeReportLogFilter = 'all'; // 'all' | report id number

    function findReportById(reportId) {
      var codes = Object.keys(REPORTS_BY_ENTRUST);
      for (var i = 0; i < codes.length; i++) {
        var list = REPORTS_BY_ENTRUST[codes[i]];
        for (var j = 0; j < list.length; j++) {
          if (list[j].id === reportId) return list[j];
        }
      }
      return null;
    }

    var AUDIT_FORWARD_NODES = { '报告审核': 1, '报告签发': 1, '报告处理': 1, '收费审批': 1, '报告发放': 1 };
    var NODES_AFTER_COMPILE = { '报告审核': 1, '报告签发': 1, '报告处理': 1, '收费审批': 1, '报告发放': 1, '任务归档': 1, '任务完成': 1 };

    function reportWasReturned(row) {
      if (row.returns && row.returns.length) return true;
      return (row.logs || []).some(function (log) { return /退回至/.test(log.text || ''); });
    }

    function reportsPastCompile(code) {
      return reportsOf(code).filter(function (row) {
        return row.inApproval || !!NODES_AFTER_COMPILE[row.node];
      });
    }

    function parseReportLogText(text) {
      var flow = String(text || '').match(/^(.+?)\s+在\s+(\S+)\s+将\s+报告编号为(\S+?)的报告\s+(自动退回至|再次提交至|提交至|退回至)\s+(\S+?)(?:（([^）]+)）)?$/);
      if (flow) {
        return {
          actor: flow[1].trim(),
          node: flow[2].trim(),
          verb: flow[4],
          target: flow[5].trim(),
          note: (flow[6] || '').trim()
        };
      }
      var gen = String(text || '').match(/^(.+?)\s+在\s+(\S+)\s+生成\s+报告编号为(\S+?)的报告$/);
      if (gen) {
        return { actor: gen[1].trim(), node: gen[2].trim(), verb: '生成', target: '', note: '' };
      }
      var judge = String(text || '').match(/^(.+?)\s+在\s+(\S+)\s+将\s+报告编号为(\S+?)的报告\s+判定为(.+)$/);
      if (judge) {
        return { actor: judge[1].trim(), node: judge[2].trim(), verb: '判定为', target: judge[4].trim(), note: '' };
      }
      return { actor: '', node: '操作记录', verb: '', target: '', note: '', raw: String(text || '') };
    }

    function reasonForLog(row, time, actor) {
      var list = (row && row.returns) || [];
      var i;
      for (i = 0; i < list.length; i++) {
        if (list[i].time === time && list[i].by === actor) return list[i].reason || '';
      }
      for (i = 0; i < list.length; i++) {
        if (list[i].time === time) return list[i].reason || '';
      }
      return '';
    }

    function presentReportLog(parsed, row, time, extraReason) {
      var actor = parsed.actor || '';
      var node = parsed.node || '操作记录';
      var blank = { node: node, actor: actor, tone: 'pass', status: '操作记录', statusTone: 'muted', icon: 'fa-circle-o', opinionKicker: '', opinion: parsed.raw || '' };
      if (parsed.raw) return blank;
      if (parsed.verb === '生成') {
        return { node: '报告生成', actor: actor, tone: 'pass', status: '生成报告', statusTone: 'muted', icon: 'fa-pencil-square-o', opinionKicker: '', opinion: '' };
      }
      if (parsed.verb === '判定为') {
        var passed = parsed.target === '通过';
        return {
          node: node, actor: actor, tone: 'pass',
          status: parsed.target || '需人工复核',
          statusTone: passed ? 'pass' : 'pending',
          icon: passed ? 'fa-check-circle' : 'fa-exclamation-circle',
          opinionKicker: '', opinion: extraReason || ''
        };
      }
      if (parsed.verb === '自动退回至') {
        return {
          node: node, actor: actor, tone: 'reject', status: '自动退回', statusTone: 'reject', icon: 'fa-bolt',
          opinionKicker: '退回至' + parsed.target + (parsed.note ? '（' + parsed.note + '）' : ''),
          opinion: reasonForLog(row, time, actor)
        };
      }
      if (parsed.verb === '退回至') {
        return {
          node: node, actor: actor, tone: 'reject', status: '审批拒绝', statusTone: 'reject', icon: 'fa-minus-circle',
          opinionKicker: '退回至' + parsed.target,
          opinion: reasonForLog(row, time, actor)
        };
      }
      if ((parsed.verb === '提交至' || parsed.verb === '再次提交至') && AUDIT_FORWARD_NODES[node]) {
        return { node: node, actor: actor, tone: 'pass', status: '审批通过', statusTone: 'pass', icon: 'fa-check-circle', opinionKicker: '', opinion: '' };
      }
      if (parsed.verb === '提交至' || parsed.verb === '再次提交至') {
        return {
          node: node, actor: actor, tone: 'pass',
          status: (parsed.verb === '再次提交至' ? '再次提交至' : '提交至') + parsed.target,
          statusTone: 'muted', icon: 'fa-pencil-square-o', opinionKicker: '', opinion: ''
        };
      }
      return blank;
    }

    function reportNoChip(reportNo) {
      return String(reportNo || '');
    }

    function collectEntrustLogs(code, filterId) {
      var list = reportsOf(code);
      var items = [];
      list.forEach(function (row) {
        if (filterId !== 'all' && row.id !== filterId) return;
        (row.logs || []).forEach(function (log) {
          var view = presentReportLog(parseReportLogText(log.text), row, log.time, log.reason || '');
          items.push({
            time: log.time,
            reportNo: row.reportNo,
            reportId: row.id,
            pending: false,
            node: view.node,
            actor: view.actor,
            tone: view.tone,
            status: view.status,
            statusTone: view.statusTone,
            icon: view.icon,
            opinionKicker: view.opinionKicker,
            opinion: view.opinion
          });
        });
        if (row.inApproval || NODES_AFTER_COMPILE[row.node]) {
          items.push({
            time: '',
            reportNo: row.reportNo,
            reportId: row.id,
            pending: true,
            node: row.node || '报告审核',
            actor: '',
            tone: 'pending',
            status: '审批中',
            statusTone: 'pending',
            icon: 'fa-clock-o',
            opinionKicker: '',
            opinion: ''
          });
        } else if (row.node === '报告编制') {
          items.push({
            time: '',
            reportNo: row.reportNo,
            reportId: row.id,
            pending: true,
            node: '报告编制',
            actor: '',
            tone: 'pending',
            status: '当前节点',
            statusTone: 'pending',
            icon: 'fa-circle-o',
            opinionKicker: '',
            opinion: ''
          });
        } else if (row.node) {
          items.push({
            time: '',
            reportNo: row.reportNo,
            reportId: row.id,
            pending: true,
            node: row.node,
            actor: '',
            tone: 'pending',
            status: '当前节点',
            statusTone: 'pending',
            icon: 'fa-circle-o',
            opinionKicker: '',
            opinion: ''
          });
        }
      });
      items.sort(function (a, b) {
        var desc = getLogOrder() === 'desc';
        if (a.pending !== b.pending) return a.pending ? (desc ? -1 : 1) : (desc ? 1 : -1);
        if (a.time === b.time) return 0;
        if (desc) return a.time < b.time ? 1 : -1;
        return a.time < b.time ? -1 : 1;
      });
      return items;
    }

    var LOG_ORDER_KEY = 'lims-report-log-order';
    function getLogOrder() {
      try { return localStorage.getItem(LOG_ORDER_KEY) === 'desc' ? 'desc' : 'asc'; } catch (e) { return 'asc'; }
    }
    function setLogOrder(order) {
      try { localStorage.setItem(LOG_ORDER_KEY, order === 'desc' ? 'desc' : 'asc'); } catch (e) { /* ignore */ }
    }
    function syncLogOrderButtons() {
      var desc = getLogOrder() === 'desc';
      document.querySelectorAll('[data-log-order-btn]').forEach(function (btn) {
        btn.innerHTML = desc
          ? '<i class="fa fa-sort-amount-desc"></i> 时间倒序'
          : '<i class="fa fa-sort-amount-asc"></i> 时间正序';
        btn.setAttribute('title', desc ? '当前最新在上。点击改为时间正序（从上往下递增）' : '当前从上往下时间递增。点击改为时间倒序');
      });
    }
    function toggleLogOrder() {
      setLogOrder(getLogOrder() === 'asc' ? 'desc' : 'asc');
      syncLogOrderButtons();
      if (activeEntrustCode) renderMergedReportLogs(activeEntrustCode);
    }

    function auditAvatarColor(name) {
      if (!name) return '#94a3b8';
      if (name.indexOf('AI') === 0) return '#6366f1';
      if (name.indexOf('自动') === 0) return '#0ea5e9';
      var palette = ['#fb923c', '#38bdf8', '#34d399', '#a78bfa', '#f472b6', '#3b82f6', '#f59e0b', '#14b8a6'];
      var n = 0;
      for (var i = 0; i < name.length; i++) n = (n * 33 + name.charCodeAt(i)) >>> 0;
      return palette[n % palette.length];
    }

    function auditAvatarMark(name) {
      if (!name) return '';
      if (name.indexOf('AI') === 0) return '<i class="fa fa-bolt"></i>';
      if (name.indexOf('自动') === 0) return '<i class="fa fa-magic"></i>';
      var ch = String(name).replace(/\./g, '').charAt(0) || String(name).charAt(0);
      if (ch && ch.charCodeAt(0) < 128) ch = ch.toUpperCase();
      return escapeHtml(ch);
    }

    function renderReportLogFilter(code) {
      var list = reportsOf(code);
      var box = document.getElementById('reportLogFilter');
      var chips = [{ id: 'all', label: '全部' }].concat(list.map(function (r) {
        return { id: r.id, label: r.reportNo.split('/').pop() || r.reportNo };
      }));
      box.innerHTML = chips.map(function (c) {
        var active = String(activeReportLogFilter) === String(c.id);
        var cls = active
          ? 'rounded-full bg-blue-600 px-2.5 py-0.5 text-xs text-white'
          : 'rounded-full border border-slate-200 bg-white px-2.5 py-0.5 text-xs text-slate-600 hover:border-blue-300 hover:text-blue-600';
        return '<button type="button" class="' + cls + '" data-log-filter="' + c.id + '" onclick="setReportLogFilter(\'' + String(c.id).replace(/'/g, '') + '\')">' + c.label + '</button>';
      }).join('');
    }

    function setReportLogFilter(id) {
      activeReportLogFilter = id === 'all' ? 'all' : Number(id);
      renderReportLogFilter(activeEntrustCode);
      renderMergedReportLogs(activeEntrustCode);
      highlightRecordRow(activeReportLogFilter);
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function highlightRecordRow(filterId) {
      document.querySelectorAll('#reportRecordBody tr[data-report-id]').forEach(function (tr) {
        var match = filterId !== 'all' && Number(tr.getAttribute('data-report-id')) === Number(filterId);
        tr.classList.toggle('bg-blue-50', match);
        tr.classList.toggle('ring-1', match);
        tr.classList.toggle('ring-inset', match);
        tr.classList.toggle('ring-blue-200', match);
      });
    }

    function renderMergedReportLogs(code) {
      var box = document.getElementById('reportLogList');
      var logs = collectEntrustLogs(code, activeReportLogFilter);
      if (window.AuditLog) logs = AuditLog.present(logs, getLogOrder());
      if (!logs.length) {
        box.innerHTML = '<p class="py-6 text-center text-sm text-slate-400">暂无操作日志</p>';
        return;
      }
      var showNo = activeReportLogFilter === 'all';
      box.innerHTML = '<ol class="audit-tl">' + logs.map(function (item) {
        if (window.AuditLog) return AuditLog.itemHtml(item, { no: showNo ? reportNoChip(item.reportNo) : '' });
        var person = item.actor
          ? '<span class="audit-person"><span class="audit-avatar" style="background:' + auditAvatarColor(item.actor) + '">' + auditAvatarMark(item.actor) + '</span>' + escapeHtml(item.actor) + '</span>'
          : '';
        var no = showNo
          ? '<span class="audit-no" title="' + escapeHtml(item.reportNo) + '">' + escapeHtml(reportNoChip(item.reportNo)) + '</span>'
          : '';
        var time = item.time ? '<time class="audit-time">' + escapeHtml(item.time) + '</time>' : '';
        var status = '<span class="audit-status is-' + item.statusTone + '"><i class="fa ' + item.icon + '" aria-hidden="true"></i>' + escapeHtml(item.status) + '</span>';
        var opinion = '';
        if (item.opinion || item.opinionKicker) {
          opinion = '<div class="audit-opinion">' +
            (item.opinionKicker ? '<div class="audit-opinion-kicker">' + escapeHtml(item.opinionKicker) + '</div>' : '') +
            (item.opinion ? '<div class="audit-opinion-text">' + escapeHtml(item.opinion) + '</div>' : '') +
            '</div>';
        }
        var headRight = (item.pending && !item.actor) ? status : time;
        var row = (item.pending && !item.actor) ? '' : ('<div class="audit-row">' + person + status + '</div>');
        return '<li class="audit-tl-item is-' + item.tone + '">' +
          '<div class="audit-rail" aria-hidden="true"><span class="audit-dot"></span></div>' +
          '<div class="audit-main">' +
            '<div class="audit-head"><div class="audit-title"><span>' + escapeHtml(item.node) + '</span>' + no + '</div>' + headRight + '</div>' +
            row +
            opinion +
          '</div></li>';
      }).join('') + '</ol>';
    }

    function renderReportRecordList(code) {
      var list = reportsOf(code);
      var body = document.getElementById('reportRecordBody');
      var sub = document.getElementById('reportRecordSubtitle');
      if (sub) sub.textContent = code ? ('委托 ' + code + ' · 共 ' + list.length + ' 份报告') : '';
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="8" class="px-3 py-6 text-center text-slate-400">该委托暂无报告记录</td></tr>';
        document.getElementById('reportLogFilter').innerHTML = '';
        document.getElementById('reportLogList').innerHTML = '<p class="py-6 text-center text-sm text-slate-400">暂无操作日志</p>';
        return;
      }
      body.innerHTML = list.map(function (row, i) {
        var auditCell = stageCell(row.audit);
        if (!row.audit && row.inApproval && row.node === '报告审核') {
          auditCell = '<span class="text-amber-600">审批中</span>';
        }
        return '<tr class="cursor-pointer hover:bg-slate-50" data-report-id="' + row.id + '" onclick="setReportLogFilter(' + row.id + ')">' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5 font-medium text-slate-800">' + row.reportNo + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + stageCell(row.compile) + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + auditCell + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + stageCell(row.sign) + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + stageCell(row.process) + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + stageCell(row.fee) + '</td>' +
          '<td class="border-b border-slate-100 px-3 py-2.5">' + stageCell(row.issue) + '</td></tr>';
      }).join('');
      renderReportLogFilter(code);
      renderMergedReportLogs(code);
      highlightRecordRow(activeReportLogFilter);
    }

    function openCompileListModal(code) {
      activeEntrustCode = code || '';
      renderCompileList(activeEntrustCode);
      var modal = document.getElementById('compileListModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCompileListModal() {
      var modal = document.getElementById('compileListModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleCompileCheckAll(checked) {
      document.querySelectorAll('.compile-row-check').forEach(function (el) { el.checked = checked; });
    }

    function confirmCompile() {
      var n = document.querySelectorAll('.compile-row-check:checked').length;
      if (!n) { alert('请至少选择一份报告'); return; }
      closeCompileListModal();
      alert('已打开 Word 在线编制（原型演示），共 ' + n + ' 份报告');
    }

    var reportRecordHideTimer = null;

    function openReportRecordModal(code) {
      activeEntrustCode = code || '';
      activeReportLogFilter = 'all';
      renderReportRecordList(activeEntrustCode);
      syncLogOrderButtons();
      var modal = document.getElementById('reportRecordModal');
      clearTimeout(reportRecordHideTimer);
      modal.classList.remove('hidden');
      requestAnimationFrame(function () { modal.classList.add('open'); });
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeReportRecordModal() {
      var modal = document.getElementById('reportRecordModal');
      modal.classList.remove('open');
      clearTimeout(reportRecordHideTimer);
      reportRecordHideTimer = setTimeout(function () { modal.classList.add('hidden'); }, 220);
    }

    document.getElementById('reportRecordModal').addEventListener('click', function (e) {
      if (e.target === this) closeReportRecordModal();
    });

    var returnRowId = null;

    function showModal(id) {
      var m = document.getElementById(id);
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function hideModal(id) {
      var m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function showReturnBlockedToast() {
      var el = document.getElementById('return-toast');
      document.getElementById('return-toast-msg').textContent = '该委托已有报告流转到「报告编制」之后，整单不能退回数据审核';
      el.classList.add('show');
      clearTimeout(showReturnBlockedToast._t);
      showReturnBlockedToast._t = setTimeout(function () { el.classList.remove('show'); }, 2800);
    }

    function openReturnModal(rowId) {
      var row = null;
      for (var i = 0; i < ROWS.length; i++) {
        if (ROWS[i].id === rowId) { row = ROWS[i]; break; }
      }
      if (!row) return;
      if (reportsPastCompile(row.code).length) {
        showReturnBlockedToast();
        return;
      }
      returnRowId = rowId;
      document.getElementById('returnReason').value = '';
      showModal('returnModal');
    }
    function closeReturnModal() {
      returnRowId = null;
      hideModal('returnModal');
    }
    function confirmReturn() {
      var reason = document.getElementById('returnReason').value.trim();
      if (!reason) return;
      if (returnRowId == null) return;
      var idx = -1;
      for (var i = 0; i < ROWS.length; i++) {
        if (ROWS[i].id === returnRowId) { idx = i; break; }
      }
      if (idx < 0) { closeReturnModal(); return; }
      var row = ROWS[idx];
      if (window.ReturnStore) {
        ReturnStore.push({ code: row.code, from: '报告编制', to: '数据审核', reason: reason, kind: '人工' });
      }
      ROWS.splice(idx, 1);
      closeReturnModal();
      renderTable();
    }

    document.getElementById('returnModal').addEventListener('click', function (e) {
      if (e.target === this) closeReturnModal();
    });

    function doSearch() {
      var code = document.getElementById('f_code').value.trim();
      var sample = document.getElementById('f_sample').value.trim();
      var cat = (document.getElementById('f_cat') && document.getElementById('f_cat').value) || '';
      var filtered = ROWS.filter(function (r) {
        if (code && r.code.indexOf(code) < 0) return false;
        if (sample && r.sample.indexOf(sample) < 0) return false;
        if (cat && catOf(r.sample) !== cat) return false;
        return true;
      });
      renderTable(filtered);
    }

    function doReset() {
      document.getElementById('f_code').value = '';
      document.getElementById('f_sample').value = '';
      document.getElementById('f_frame').value = '';
      document.getElementById('f_contract').value = '';
      document.getElementById('f_unit').value = '';
      if (document.getElementById('f_cat')) document.getElementById('f_cat').value = '';
      renderTable();
    }

    (function fillCatOptions() {
      var sel = document.getElementById('f_cat');
      if (!sel || sel.options.length > 1) return;
      var st = window.SampleDataStore;
      var labels = st && st.CAT_LABELS
        ? Object.keys(st.CAT_LABELS).map(function (k) { return st.CAT_LABELS[k]; })
        : ['电力物资类', '安全工器具类', '环境检测', '工程检测'];
      labels.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c; sel.appendChild(o);
      });
    })();

    renderTable();
    if (window.ReturnUI) ReturnUI.mountBanner('报告编制');

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'ai-returned', selector: '[data-annotate="ai-returned"]', position: 'bottom', title: 'AI 自动退回条幅', content: '<strong>需求逻辑：</strong>编制名单只把 AI 严重项自动退回放在查询表上方，方便编制人优先处理；人工退回仍走委托行标签，不占这条幅。<br>' +
            '<strong>展示规则：</strong>红框随内容增高，到最大高度后内部滚动。按报告一张卡片：编号、AI 标签、来源节点与时间同一行，右侧「去处理」。其他流程页主查询表上方不再放退回红框。<br>' +
            '<strong>交互逻辑：</strong>数据来自 returns[] 且 kind=AI。演示 SC2026/0238-03（L1-b-1）。', tag: '报告编制' },
        { id: 'compile-ai-tag', selector: '[data-ai-return="1"]', position: 'left', title: '编制列表 · AI 自动退回标识', content: '<strong>展示规则：</strong>命中 AI 严重项自动退回的报告：卡片左边红条 + 淡红底，「AI 自动退回」胶囊与规则摘要；默认勾选便于优先修订。<br><strong>交互逻辑：</strong>与顶部提示条、主列表委托行同源。', tag: '报告列表' },
        { id: 'compile-returns', selector: '[data-annotate="compile-returns"]', position: 'bottom', title: '退回记录（追加不覆盖）', content: '<strong>需求逻辑：</strong>同一份报告可能被退回多次；每次退回的节点、退回人、时间、原因都必须留存，新退回不得覆盖旧原因。<br>' +
            '<strong>展示规则：</strong>卡片下方「退回记录」时间轴，按时间倒序；每条含「第 N 次」、节点（AI 自动退回单独标注）、原因、退回人、时间；最新一条红点高亮。<br>' +
            '<strong>交互逻辑：</strong>数据为 returns[] 追加写入。演示：SC2026/0238-03 仅 AI 严重项自动退回 1 次；SC2026/0238-02 为 AI「需人工复核」后由李审核退回 1 次。', tag: '报告列表' },
        { id: 'report-list-ops', selector: '[data-annotate="report-ops"]', position: 'top-left', title: '操作', content: '<strong>需求逻辑：</strong>生成、编制、看记录都在同一份委托的工作台里完成，列表只留一个入口，避免三扇门各看一半。<br>' +
            '<strong>展示规则：</strong>操作列：「去处理」「退回」。<br>' +
            '<strong>交互逻辑：</strong>「去处理」进入编制工作台（补生成、编辑已有报告、看记录）；「退回」见独立批注。不能对单份报告从编制退回数据审核。', tag: '报告编制' },
        { id: 'report-return', selector: '[data-annotate="report-return"]', position: 'left', title: '退回（整单，后续节点置灰）', content: '<strong>需求逻辑：</strong>退回只能按整个委托打回「数据审核」，不能单份报告退。若该委托下任意报告已经离开「报告编制」（报告审核及之后），再退会把后续流程一并打乱，因此退回置灰。<br>' +
            '<strong>展示规则：</strong>可退时为橙色「退回」；不可退时按钮置灰，鼠标悬停说明是哪些报告、停在哪个节点。<br>' +
            '<strong>交互逻辑：</strong>全部报告仍在「报告编制」→ 弹出「退回原因」。任一报告已到后续节点 → 按钮不可点。演示：SC2026/0238 因 0238-01 在报告签发而置灰；SC2026/0099 因 0099-02 在报告审核而置灰。', tag: '报告编制' },
        { id: 'report-handle-link', selector: '[data-annotate="report-handle"]', position: 'left', title: '去处理', content: '<strong>需求逻辑：</strong>一份委托下可能同时有待生成试样、待修订报告和审批中的报告，只开一扇门进编制工作台。<br>' +
            '<strong>展示规则：</strong>操作列「去处理」，演示委托 SCZN202508/0009。<br>' +
            '<strong>交互逻辑：</strong>点击进入编制工作台；报告记录、编辑、补生成都在工作台内。', tag: '报告编制' },
        { id: 'compile-modal', selector: '[data-annotate="compile-list-modal"]', position: 'left', title: '编制 · 报告编制弹窗', content: '<strong>需求逻辑：</strong>一次可能要多份报告同时编制，先勾选再进编辑器；有退回的报告要把历次退回原因摊开看清。<br>' +
            '<strong>展示规则：</strong>标题为「报告编制」。卡片含勾选、编号、样品、名称、生成时间、审核·签发意见；有退回的卡片展开退回记录。不再提供单份「退回」。<br>' +
            '<strong>交互逻辑：</strong>勾选后点「编制」进入 Word 在线编辑（原型演示）。整单退回只在主列表操作。', tag: '报告编制' },
        // 透明检测延至明年：列已隐藏，对应批注暂不挂载（col-transparency / rl-level）
        {
          id: 'rl-record',
          selector: '[data-annotate="rl-record-merged"]',
          position: 'bottom-right',
          title: '报告记录（节点进度 + 操作日志同屏）',
          wide: true,
          content: '<strong>需求逻辑：</strong>打开「报告记录」就要同时看到节点签署留痕与流转过程，从右侧抽屉展开，不挡左侧列表。<br>' +
          '<strong>展示规则：</strong>上半「节点进度」表；下半操作日志默认时间正序（从上往下递增），可切倒序。已完成步骤为实心色点（蓝=流转，红=退回）；当前步骤为空心黄点。筛选为「全部」时标题旁用完整报告编号。<br>' +
          '<strong>交互逻辑：</strong>默认展示该委托全部日志；点表格行或芯片筛选对应报告。时间顺序点一次即写入浏览器，所有报告记录共用，下次打开仍用这个顺序。',
          tag: '报告列表'
        },
        {
          id: 'report-op-log',
          selector: '[data-annotate="rl-record-logs"]',
          position: 'top-right',
          title: '操作日志（嵌入报告记录）',
          wide: true,
          content: '<strong>需求逻辑：</strong>单份/整单报告的流转动作可追溯（谁在哪个节点提交/退回、意见是什么）。<br>' +
          '<strong>展示规则：</strong>审批时间轴默认正序，可切倒序，选择会记住。已完成：蓝=生成/提交/审批通过/需人工复核，红=审批拒绝/自动退回。当前步空心黄点。系统在节点之间的自动推进不单独占点，只标出「上一节点 → 下一节点」。多报告同屏时标题旁用完整报告编号。<br>' +
          '<strong>交互逻辑：</strong>与上方节点进度同一抽屉。点行或芯片只筛日志，不改数据。',
          tag: '报告列表'
        },
      ] });
    }
  </script>
