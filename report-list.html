<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告编制 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .return-detail { font-size: 12px; line-height: 1.5; color: #64748b; white-space: pre-line; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告编制
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_sample" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">是否关联框架合同</label>
          <select id="f_frame" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-500 outline-none focus:border-blue-500">
            <option value="">请选择</option>
            <option>是</option><option>否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">框架合同编号</label>
          <input id="f_contract" type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托单位</label>
          <input id="f_unit" type="text" placeholder="请输入委托单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-3 xl:justify-end">
          <button onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1400px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-12">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">优先等级</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="col-record">报告记录</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="col-transparency">透明度等级 / 溯源</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="report-ops">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 5 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">3</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10 条/页</option></select>
      </div>
    </div>
  </div>

  <!-- 报告列表弹窗（编制） -->
  <div id="compileListModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[1100px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">报告列表</h3>
        <button type="button" onclick="closeCompileListModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <table class="w-full min-w-[980px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-2 py-2 w-10"><input type="checkbox" id="compileCheckAll" onchange="toggleCompileCheckAll(this.checked)" /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-12">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">生成时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">审核意见</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">签发意见</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-36">退回详情</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-24">操作</th>
            </tr>
          </thead>
          <tbody id="compileListBody"></tbody>
        </table>
        <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
          <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">2</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeCompileListModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmCompile()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white" data-annotate="compile-confirm">编制</button>
      </div>
    </div>
  </div>

  <!-- 报告记录弹窗 -->
  <div id="reportRecordModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[90vh] w-[960px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">报告记录</h3>
        <button type="button" onclick="closeReportRecordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <table class="w-full min-w-[860px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-12">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">审核</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">签发</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">处理</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">收费审批</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">发放</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-16">操作</th>
            </tr>
          </thead>
          <tbody id="reportRecordBody"></tbody>
        </table>
        <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
          <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
          <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 透明度等级选择弹窗 -->
  <div id="levelModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[560px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">选择报告透明度等级</h3>
        <button type="button" onclick="closeLevelModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4">
        <p id="levelModalHint" class="mb-3 rounded bg-slate-50 px-3 py-2 text-xs text-slate-500"></p>
        <div id="levelOptions" class="space-y-2"></div>
        <div id="levelResult" class="mt-3 hidden rounded-lg border p-3 text-sm"></div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeLevelModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmLevel()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script src="js/short-link-qr.js"></script>
  <script src="js/report-trace.js"></script>
  <script src="js/report-trace-l1.js"></script>
  <script>
    var ROWS = [
      { id: 0, code: 'SC2026/02240101', contract: 'SG-2026-0224', unit: '国网某某供电公司', sample: '实壁类塑料电缆导管_直管-PVC-C', acceptDate: '2026-02-24', dueDate: '2026-03-05', priority: '高', sales: '王', compiler: '自动出报', level: 1, reservedLevel: null, traceCode: 'R1u8P' },
      { id: 2, code: 'SC2026/0099', contract: 'HT11213322', unit: '杭州数蚕智能科技有限公司', sample: '绝缘操作杆', acceptDate: '2025-07-17', dueDate: '', priority: '常规', sales: '', compiler: 'admin', demo: false, level: 3, reservedLevel: null, traceCode: 'R3a2K' },
      { id: 3, code: 'SCZN202508/0007', contract: '—', unit: '国网某某供电公司', sample: '实壁类塑料电缆导管_直管-PVC-C', acceptDate: '2025-07-16', dueDate: '2025-07-25', priority: '高', sales: '李', compiler: '张..', level: null, reservedLevel: 2, traceCode: 'R2c9X' },
      { id: 4, code: 'SCZN202508/0006', contract: 'HT99887766', unit: '杭州数蚕智能科技有限公司', sample: '绝缘操作杆', acceptDate: '2025-07-15', dueDate: '2025-08-01', priority: '', sales: '', compiler: '赵..', level: 4, reservedLevel: null, traceCode: 'R4b7M' },
      { id: 5, code: 'SCZN202508/0005', contract: '—', unit: '某某建设集团', sample: '混凝土试块', acceptDate: '2025-07-14', dueDate: '', priority: '', sales: '', compiler: '陈..', level: null, reservedLevel: null, traceCode: null }
    ];

    var COMPILE_LIST_DEMO = [
      {
        id: 1, reportNo: 'SC2026/0003-01',
        sampleNos: ['SCZN202508/0009-0102', 'SCZN202508/0009-0103'],
        reportName: 'SC2026-0099-01检测报告.docx',
        createdAt: '2026-07-17 14:30:00',
        auditOpinion: '审核不通过',
        signOpinion: '签发不通过',
        returnDetail: '退回节点：报告审核\n退回原因：数据填写不完整\n退回人：admin\n退回时间：2026-07-17 15:00:00'
      },
      {
        id: 2, reportNo: 'SC2026/0003-02',
        sampleNos: ['SCZN202508/0009-0101'],
        reportName: 'SC2026-0099-02检测报告.docx',
        createdAt: '2026-07-16 10:20:00',
        auditOpinion: '—',
        signOpinion: '—',
        returnDetail: '—'
      }
    ];

    var REPORT_RECORD_DEMO = [
      {
        id: 1, reportNo: 'SC2026/0099-01',
        compile: { user: 'admin', date: '2026年07月17日' },
        audit: { user: 'admin', date: '2026年07月17日' },
        sign: { user: 'admin', date: '2026年07月17日' },
        process: { user: 'admin', date: '2026年07月17日' },
        fee: { user: 'admin', date: '2026年07月17日' },
        issue: { user: 'admin', date: '2026年07月17日' }
      }
    ];

    function stageCell(stage) {
      if (!stage || !stage.user) return '—';
      return stage.user + '<br><span class="text-xs text-slate-400">' + stage.date + '</span>';
    }

    /** 透明度等级列：已选定→徽标+查看溯源；预留→提示；未设定→设置等级 */
    function transparencyCell(row) {
      var out = '';
      if (row.level) {
        var name = ReportTrace.levelName(row.level).split(' ')[0];
        out += '<span class="rounded-full bg-blue-100 px-2 py-0.5 text-xs text-blue-700">' + name + '</span>';
        if (row.traceCode) {
          out += ' <a href="report-verify.html?code=' + row.traceCode + '" target="_blank" class="ml-1 text-blue-600 hover:underline"><i class="fa fa-qrcode"></i> 查看溯源</a>';
        }
        out += ' <a href="#" class="ml-1 text-slate-400 hover:underline" onclick="openLevelModal(' + row.id + ');return false;">改</a>';
      } else if (row.reservedLevel) {
        var rname = ReportTrace.levelName(row.reservedLevel).split(' ')[0];
        out += '<span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs text-amber-700" title="已登记升级预留，能力就绪后方可出具">' + rname + '（预留）</span>';
        if (row.traceCode) out += ' <a href="report-verify.html?code=' + row.traceCode + '" target="_blank" class="ml-1 text-blue-600 hover:underline"><i class="fa fa-eye"></i> 预览</a>';
        out += ' <a href="#" class="ml-1 text-slate-400 hover:underline" onclick="openLevelModal(' + row.id + ');return false;">改</a>';
      } else {
        out += '<a href="#" class="text-blue-600 hover:underline" onclick="openLevelModal(' + row.id + ');return false;"><i class="fa fa-tag mr-1"></i>设置等级</a>';
      }
      return out;
    }

    var _levelRowId = null;
    var _levelPick = null;

    /** 打开等级选择弹窗 */
    function openLevelModal(rowId) {
      _levelRowId = rowId;
      var row = ROWS.filter(function (r) { return r.id === rowId; })[0];
      _levelPick = row ? (row.level || row.reservedLevel || null) : null;
      document.getElementById('levelModalHint').innerHTML =
        '规则：单报告可选等级 ≤ min（能力门禁, 实验室授权等级）。当前实验室授权等级 <b>' +
        ReportTrace.levelName(ReportTrace.AUTHORIZED_LEVEL).split(' ')[0] + '</b>；一/二级为预留等级，可选但暂不放行出具（登记升级预留）。';
      renderLevelOptions();
      document.getElementById('levelResult').classList.add('hidden');
      var modal = document.getElementById('levelModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function closeLevelModal() {
      var modal = document.getElementById('levelModal');
      modal.classList.add('hidden'); modal.classList.remove('flex');
    }

    /** 渲染四级选项 + 门禁状态 */
    function renderLevelOptions() {
      document.getElementById('levelOptions').innerHTML = ReportTrace.LEVELS.map(function (lv) {
        var chk = ReportTrace.canIssue(lv.level);
        var tag, tagCls;
        if (chk.ok) { tag = chk.note ? '可出具·选低' : '可出具'; tagCls = 'bg-green-100 text-green-700'; }
        else if (chk.blockedBy === 'authorized') { tag = '超出授权·需重新评定'; tagCls = 'bg-red-100 text-red-700'; }
        else { tag = '预留·暂不可出具'; tagCls = 'bg-amber-100 text-amber-700'; }
        var checked = (_levelPick === lv.level) ? 'checked' : '';
        return '<label class="flex cursor-pointer items-start gap-2 rounded-lg border p-3 hover:bg-slate-50 ' + (_levelPick === lv.level ? 'border-blue-400 bg-blue-50' : 'border-slate-200') + '">' +
          '<input type="radio" name="lvopt" class="mt-1" value="' + lv.level + '" ' + checked + ' onchange="pickLevel(' + lv.level + ')" />' +
          '<div class="flex-1"><div class="flex items-center justify-between"><span class="text-sm font-medium text-slate-700">' + lv.name + '</span>' +
          '<span class="rounded-full px-2 py-0.5 text-[11px] ' + tagCls + '">' + tag + '</span></div>' +
          '<p class="mt-0.5 text-xs text-slate-500">' + lv.brief + '</p>' +
          (chk.missing && chk.missing.length ? '<p class="mt-1 text-[11px] text-amber-600">待补能力：' + chk.missing.join('、') + '</p>' : '') +
          '</div></label>';
      }).join('');
    }

    function pickLevel(level) { _levelPick = level; renderLevelOptions(); }

    /** 确定：按门禁分流——可出具则选定；预留则登记；低于授权则确认后选定 */
    function confirmLevel() {
      if (!_levelPick) { alert('请选择一个透明度等级'); return; }
      var row = ROWS.filter(function (r) { return r.id === _levelRowId; })[0];
      if (!row) return;
      var chk = ReportTrace.canIssue(_levelPick);
      var box = document.getElementById('levelResult');
      var pickName = ReportTrace.levelName(_levelPick).split(' ')[0];
      box.classList.remove('hidden');
      if (chk.ok) {
        row.level = _levelPick; row.reservedLevel = null;
        box.className = 'mt-3 rounded-lg border border-green-200 bg-green-50 p-3 text-sm text-green-700';
        box.innerHTML = '<i class="fa fa-check-circle"></i> 已选定 <b>' + pickName + '</b>。' +
          (chk.note ? '（' + chk.note + '）' : '') +
          ' 报告签发后将生成唯一溯源码并印刷于报告首页。';
      } else if (chk.blockedBy === 'capability') {
        row.reservedLevel = _levelPick; row.level = null;
        box.className = 'mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-700';
        box.innerHTML = '<i class="fa fa-clock-o"></i> 已登记 <b>' + pickName + '</b> 升级预留。当前能力未就绪（' +
          chk.missing.join('、') + '），本次<b>不可出具</b>；待对应模块接入且能力门禁通过后方可签发。';
      } else {
        box.className = 'mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700';
        box.innerHTML = '<i class="fa fa-exclamation-triangle"></i> <b>' + pickName + '</b> ' + chk.reason + '。未写入选定。';
      }
      renderTable();
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function renderTable(list) {
      var data = list || ROWS;
      document.getElementById('tableBody').innerHTML = data.map(function (row, i) {
        var genLink = row.demo
          ? '<a href="report-compile-edit.html?entrust=' + encodeURIComponent(row.code) + '" class="text-blue-600 hover:underline" data-annotate="report-generate"><i class="fa fa-pencil mr-1"></i>报告生成</a>'
          : '<a href="report-compile-edit.html?entrust=' + encodeURIComponent(row.code) + '" class="text-blue-600 hover:underline"><i class="fa fa-pencil mr-1"></i>报告生成</a>';
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="entrust-detail.html?code=' + encodeURIComponent(row.code) + '" class="text-blue-600 hover:underline">' + row.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="#" class="text-blue-600 hover:underline" onclick="return false;">' + row.contract + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.unit + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.acceptDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (row.dueDate || '—') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (row.priority || '—') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (row.sales || '—') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.compiler + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="#" class="text-blue-600 hover:underline" onclick="openReportRecordModal();return false;">报告记录</a></td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + transparencyCell(row) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + genLink +
          ' <a href="#" class="ml-3 text-blue-600 hover:underline" onclick="openCompileListModal();return false;">编制</a></td></tr>';
      }).join('');
      document.getElementById('totalText').textContent = '共 ' + data.length + ' 条';
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function renderCompileList() {
      document.getElementById('compileListBody').innerHTML = COMPILE_LIST_DEMO.map(function (row, i) {
        var samples = row.sampleNos.join('<br>');
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-2 py-2 text-center"><input type="checkbox" class="compile-row-check" data-id="' + row.id + '" ' + (i === 0 ? 'checked' : '') + ' /></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.reportNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 text-xs leading-5">' + samples + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="#" class="text-blue-600 hover:underline" onclick="return false;">' + row.reportName + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.createdAt + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.auditOpinion + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.signOpinion + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><div class="return-detail">' + row.returnDetail + '</div></td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' +
          '<button class="text-red-500 hover:underline" onclick="alert(\'删除（原型演示）\')"><i class="fa fa-trash-o"></i></button> ' +
          '<button class="ml-2 text-orange-500 hover:underline" onclick="alert(\'退回（原型演示）\')"><i class="fa fa-reply"></i></button></td></tr>';
      }).join('');
    }

    function renderReportRecordList() {
      document.getElementById('reportRecordBody').innerHTML = REPORT_RECORD_DEMO.map(function (row, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.reportNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.compile) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.audit) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.sign) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.process) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.fee) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + stageCell(row.issue) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><button class="text-blue-600 hover:underline" onclick="alert(\'日志（原型演示）\')">日志</button></td></tr>';
      }).join('');
    }

    function openCompileListModal() {
      renderCompileList();
      var modal = document.getElementById('compileListModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCompileListModal() {
      var modal = document.getElementById('compileListModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleCompileCheckAll(checked) {
      document.querySelectorAll('.compile-row-check').forEach(function (el) { el.checked = checked; });
    }

    function confirmCompile() {
      var n = document.querySelectorAll('.compile-row-check:checked').length;
      if (!n) { alert('请至少选择一份报告'); return; }
      closeCompileListModal();
      alert('已打开 Word 在线编制（原型演示），共 ' + n + ' 份报告');
    }

    function openReportRecordModal() {
      renderReportRecordList();
      var modal = document.getElementById('reportRecordModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReportRecordModal() {
      var modal = document.getElementById('reportRecordModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function doSearch() {
      var code = document.getElementById('f_code').value.trim();
      var sample = document.getElementById('f_sample').value.trim();
      var filtered = ROWS.filter(function (r) {
        if (code && r.code.indexOf(code) < 0) return false;
        if (sample && r.sample.indexOf(sample) < 0) return false;
        return true;
      });
      renderTable(filtered);
    }

    function doReset() {
      document.getElementById('f_code').value = '';
      document.getElementById('f_sample').value = '';
      document.getElementById('f_frame').value = '';
      document.getElementById('f_contract').value = '';
      document.getElementById('f_unit').value = '';
      renderTable();
    }

    renderTable();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'report-list-ops', selector: '[data-annotate="report-ops"]', position: 'top-left', title: '操作', content: '<strong>需求逻辑：</strong>报告列表是编制与签发的总入口，两个动作职责不同：「报告生成」产出文件，「编制」修改文件内容。<br>' +
            '<strong>展示规则：</strong>操作列：「报告生成」「编制」。<br>' +
            '<strong>交互逻辑：</strong>「报告生成」跳转报告编制编辑页；「编制」弹出报告列表，勾选后进入 Word 在线编制（PageOffice）。', tag: '报告编制' },
        { id: 'report-col-record', selector: '[data-annotate="col-record"]', position: 'top', title: '报告记录', content: '<strong>需求逻辑：</strong>报告要经过编制、审核、签发、发放多个节点，列表页要能直接看到每份报告卡在哪个节点、谁签的。<br>' +
            '<strong>展示规则：</strong>「报告记录」列/链接。<br>' +
            '<strong>交互逻辑：</strong>点击弹出报告记录表：序号、报告编号、编制、审核、签发、处理、收费审批、发放、操作（日志）。', tag: '报告编制' },
        { id: 'report-gen-link', selector: '[data-annotate="report-generate"]', position: 'left', title: '报告生成', content: '<strong>需求逻辑：</strong>演示要能一键走到完整生成流程，因此给一个默认委托入口。<br>' +
            '<strong>展示规则：</strong>「报告生成」链接，演示委托 SCZN202508/0009 · 实壁塑料电缆导管 PVC-C。<br>' +
            '<strong>交互逻辑：</strong>点击进入报告编制编辑页；换其它委托从委托列表进入。', tag: '报告编制' },
        { id: 'compile-modal', selector: '[data-annotate="compile-confirm"]', position: 'left', title: '编制确认', content: '<strong>需求逻辑：</strong>一次可能要多份报告同时编制，先勾选再进编辑器，避免误改。<br>' +
            '<strong>展示规则：</strong>弹窗列出该委托下可编制的报告，含报告编号与试样编号。<br>' +
            '<strong>交互逻辑：</strong>勾选后点「编制」进入 Word 在线编辑（原型演示），关闭弹窗不改变报告状态。', tag: '报告列表' },
        { id: 'col-transparency', selector: '[data-annotate="col-transparency"]', position: 'top', title: '透明度等级 / 溯源', content: '<strong>需求逻辑：</strong>透明度等级决定报告可核验到什么程度，必须在签发前选定；等级越高对采集能力要求越高，因此一/二级为预留等级：可选但受能力门禁拦截，暂不放行出具（登记升级预留）。<br>' +
            '<strong>展示规则：</strong>「透明度等级」列展示所选等级；「溯源」列在签发后显示唯一溯源码与「查看溯源」。<br>' +
            '<strong>交互逻辑：</strong>检测前为本次报告选定等级（四级）；签发后生成溯源码印刷于报告首页，「查看溯源」即打开扫码公开页。', tag: '透明检测' },
        {
          id: 'rl-record',
          selector: '#reportRecordBody',
          position: 'bottom-right',
          title: '报告记录（节点留痕）',
          wide: true,
          content: '<strong>需求逻辑：</strong>报告从编制到发放经过编制、审核、签发、处理、收费审批、发放六个节点，列表页需就地核对每个节点的经办人与时间。<br>' +
          '<strong>展示规则：</strong>列为序号、报告编号、编制、审核、签发、处理、收费审批、发放、操作；单元格显示「人 + 时间」，未发生的节点为空；操作列可看该报告的流转日志。<br>' +
          '<strong>交互逻辑：</strong>由列表「报告编号」或「记录」入口打开；关闭回到列表，不改变数据。',
          tag: '报告列表'
        },
        {
          id: 'rl-level',
          selector: '#levelOptions',
          position: 'bottom-right',
          title: '选择报告透明度等级（能力与授权双门禁）',
          wide: true,
          content: '<strong>需求逻辑：</strong>透明报告分四级（一级全要素透明 → 四级可公示），等级越高对采集能力要求越高；实验室只能出具「能力已就绪」且「不超出授权」的等级，所以选等级不是自由选，而是被两道门禁约束。<br>' +
          '<strong>展示规则：</strong>四个等级逐条列出，每条含等级名与简述（是否含视频、照片张数、是否人工录入）；当前能力未就绪的等级标注不可选并说明缺失项；低于授权等级的标注「选低，业务确认即可，不属降级出具」。<br>' +
          '<strong>交互逻辑：</strong>选中后下方即时给出结论（可出具 / 被能力拦截 / 超出授权须重新评定）；点「确定」按所选等级重新生成报告预览，点「取消」放弃。',
          tag: '报告列表'
        },
      ] });
    }
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
