<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合格证验真 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-700 flex items-center justify-center p-6">
  <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-lg text-center">
    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-green-600 text-2xl">
      <i class="fa fa-check"></i>
    </div>
    <h1 class="text-lg font-semibold text-slate-800">合格证验真页（Mock）</h1>
    <p class="mt-2 text-sm text-slate-500">短链扫码后 302 跳转至此页面</p>
    <div id="verifyInfo" class="mt-6 rounded border border-slate-200 bg-slate-50 p-4 text-left text-sm space-y-2"></div>
    <p class="mt-4 text-xs text-slate-400">完整验真地址将在正式环境中由短链服务重定向</p>
    <button onclick="history.back()" class="mt-6 rounded bg-blue-600 px-5 py-2 text-sm text-white hover:bg-blue-700">返回</button>
  </div>
  <script src="js/short-link-qr.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      var sampleNo = ShortLinkQR.getSampleNo(code);
      var longUrl = ShortLinkQR.getLongUrl(code);
      var el = document.getElementById('verifyInfo');
      if (!code || !sampleNo) {
        el.innerHTML = '<p class="text-red-500">无效短链代码</p>';
        return;
      }
      el.innerHTML =
        '<p><span class="text-slate-500">短链代码：</span><strong>' + code + '</strong></p>' +
        '<p><span class="text-slate-500">试样编号：</span><strong>' + sampleNo + '</strong></p>' +
        '<p><span class="text-slate-500">验真状态：</span><span class="text-green-600">有效</span></p>' +
        '<p class="text-xs text-slate-400 break-all mt-2">原完整链接：' + (longUrl || '-') + '</p>';
    })();
  </script>
</body>
</html>
