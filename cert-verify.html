<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合格证验真 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-lg p-4 pt-8">
    <div class="rounded-lg bg-white shadow-lg overflow-hidden">
      <div class="bg-blue-600 px-6 py-4 text-center text-white">
        <i class="fa fa-flask text-2xl mb-2"></i>
        <h1 class="text-lg font-semibold">智慧实验室 · 合格证验真</h1>
        <p class="text-xs text-blue-100 mt-1">扫码验真 · 公开查询</p>
      </div>
      <div class="px-6 py-5">
        <div id="verifyStatus" class="mb-4 flex items-center gap-2 rounded-lg px-4 py-3"></div>
        <div id="verifyInfo" class="space-y-3 text-sm"></div>
        <div id="verifyRules" class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4 text-xs text-slate-600 leading-relaxed"></div>
        <p class="mt-4 text-xs text-slate-400 leading-relaxed">
          微信、支付宝或手机相机扫描标签二维码均可打开本页。
        </p>
      </div>
    </div>
  </div>
  <script src="js/short-link-qr.js"></script>
  <script>
    (function () {
      var MOCK_DETAIL = {
        'SC2026/00790101': { name: '绝缘操作杆', spec: '10kV', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', inspectors: 'cs222、cs3', org: '杭州数蚕智能科技有限公司' },
        'SC2026/00730101': { name: '绝缘操作杆', spec: '10kV', inspectDate: '2026-06-10', reinspectDate: '2027-06-09', inspectors: 'admin', org: '杭州数蚕智能科技有限公司' },
        'SC2026/00990101': { name: '验电器（过期样例）', spec: '10kV', inspectDate: '2024-06-02', reinspectDate: '2025-06-01', inspectors: 'admin', org: '杭州数蚕智能科技有限公司' },
        'SC2026/00990201': { name: '安全带（作废样例）', spec: '-', inspectDate: '2026-01-01', reinspectDate: '2027-12-31', inspectors: 'admin', org: '杭州数蚕智能科技有限公司' }
      };

      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      var result = ShortLinkQR.getVerifyResult(code);
      var el = document.getElementById('verifyInfo');
      var statusEl = document.getElementById('verifyStatus');
      var rulesEl = document.getElementById('verifyRules');

      rulesEl.innerHTML =
        '<p class="font-medium text-slate-700 mb-2">验真判定规则</p>' +
        '<p class="mb-1"><span class="text-green-600 font-medium">✓ 有效：</span>短链存在且未过期、未作废，对应报告已签发且在再检日期之前。</p>' +
        '<p class="mb-1"><span class="text-red-500 font-medium">✗ 无效：</span>① 短链不存在/已失效 ② 超过再检日期 ③ 合格证已作废/撤回（含<strong>流程从报告签发后续退回到报告签发及之前</strong>，已发短链自动作废）④ 报告尚未到达报告签发阶段。</p>' +
        '<p class="text-slate-400 mt-2">原型演示：有效 Ab3K9 · 过期 Ex1p1 · 回退作废 Rv0k1 · 不存在 XXXXX</p>';

      function row(label, val) {
        return '<div class="flex border-b border-slate-100 py-2.5"><span class="w-24 flex-shrink-0 text-slate-500">' + label + '</span><span class="flex-1 text-slate-800">' + val + '</span></div>';
      }

      if (!result.ok) {
        statusEl.className = 'mb-4 flex items-center gap-2 rounded-lg bg-red-50 px-4 py-3 text-red-600';
        statusEl.innerHTML = '<i class="fa fa-times-circle text-xl"></i><span class="font-medium">短链无效，无法验真</span>';

        var reasonDetail = {
          not_found: '系统中查无此短链映射，可能为伪造标签、短链已过期清理或非本实验室发放。',
          empty: '未识别到短链参数，请重新扫描合格证二维码。',
          expired: '该试样已超过再检日期，合格证自动失效，需重新送检。',
          revoked: '该合格证已被作废或撤回。若委托从「报告签发」后续流程回退到「报告签发」及之前，系统自动作废已发放短链，已打印标签扫码亦无效，需重新到达报告签发后续阶段后重打。',
        };

        el.innerHTML =
          '<p class="text-slate-700 mb-3"><strong>无效原因：</strong>' + result.message + '</p>' +
          '<p class="text-slate-500 text-xs">' + (reasonDetail[result.reason] || '') + '</p>';

        if (result.entry) {
          var d = MOCK_DETAIL[result.entry.sampleNo] || {};
          el.innerHTML += '<div class="mt-4 pt-3 border-t border-slate-100">' +
            row('试样编号', result.entry.sampleNo) +
            row('试样名称', d.name || '-') +
            row('再检日期', result.entry.reinspectDate || d.reinspectDate || '-') +
            '</div>';
        }
        return;
      }

      var sampleNo = result.entry.sampleNo;
      var detail = MOCK_DETAIL[sampleNo] || {
        name: '安全工器具', spec: '-', inspectDate: '2026-06-01', reinspectDate: result.entry.reinspectDate || '2027-05-31', inspectors: 'admin', org: '杭州数蚕智能科技有限公司'
      };

      statusEl.className = 'mb-4 flex items-center gap-2 rounded-lg bg-green-50 px-4 py-3 text-green-700';
      statusEl.innerHTML = '<i class="fa fa-check-circle text-xl"></i><span class="font-medium">短链有效，验真通过</span>';

      el.innerHTML =
        row('试样编号', sampleNo) +
        row('试样名称', detail.name) +
        row('型号规格', detail.spec) +
        row('检验日期', detail.inspectDate) +
        row('再检日期', detail.reinspectDate) +
        row('检验人员', detail.inspectors) +
        row('检验机构', detail.org) +
        row('验真结论', '<span class="text-green-600 font-medium">合格（在有效期内）</span>') +
        '<div class="pt-2 text-xs text-slate-400">短链 ' + ShortLinkQR.BASE + code + ' → 验真通过</div>';
    })();
  </script>
  <script src="js/message-store.js" defer></script>
  <script src="js/message-center.js" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
