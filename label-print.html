<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标签打印 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #f1f5f9; color: #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      标签打印
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <!-- 搜索区 -->
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">是否关联框架合同</label>
          <select id="f_frame" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-500 outline-none focus:border-blue-500">
            <option value="">请选择是否关联框架合同</option>
            <option>是</option><option>否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">合同编号</label>
          <input id="f_contract" type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input id="f_customer" type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_sample" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-3 xl:justify-end">
          <button onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <!-- 列表区 -->
    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="mb-3 flex items-center justify-end gap-2">
        <button onclick="batchSampleLabel()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">批量打印样品标签</button>
        <button id="btnBatchCert" data-annotate="batch-cert" onclick="openInspectorModal()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">批量打印合格证</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1200px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-10"><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)" /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">送样时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托状态</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" id="thOperation" data-annotate="cert-visibility">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 13 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>50条/页</option></select>
      </div>
    </div>
  </div>

  <!-- 选择人员弹窗 -->
  <div id="inspectorModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[480px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">选择人员</h3>
        <button onclick="closeInspectorModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5">
        <div id="inspectorRow" class="flex items-start gap-3">
          <label class="w-[72px] flex-shrink-0 text-right text-sm text-slate-600">检测员</label>
          <div id="modalInspectorBox" class="flex-1"></div>
        </div>
        <div id="recorderRow" class="mt-2 flex items-start gap-3 hidden">
          <label class="w-[72px] flex-shrink-0 text-right text-sm text-slate-600">记录员</label>
          <div id="modalRecorderBox" class="flex-1"></div>
        </div>
        <p id="personnelTip" class="mt-2 pl-[84px] text-xs text-slate-400"></p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closeInspectorModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button id="btnConfirmInspector" data-annotate="confirm-inspector" onclick="confirmInspector()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/flow-stages.js"></script>
  <script src="js/inspector-select.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var listData = [
      { code: 'SC2026/0080', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-07-09', requireDate: '2026-07-30', status: '样品收样', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0079', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-07-09', requireDate: '2026-07-30', status: '报告发放', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0078', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-07-08', requireDate: '2026-07-28', status: '委托登记', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0077', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-07-07', requireDate: '2026-07-27', status: '报告审核', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0076', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-07-06', requireDate: '2026-07-26', status: '报告审核', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0075', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-12', requireDate: '2026-07-25', status: '报告处理', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0074', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-11', requireDate: '2026-07-24', status: '任务完成', editor: 'admin', judgment: '不合格' },
      { code: 'SC2026/0073', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-10', requireDate: '2026-07-23', status: '任务完成', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0072', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-09', requireDate: '2026-07-22', status: '收费审批', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0071', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-08', requireDate: '2026-07-21', status: '报告签发', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0070', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-07', requireDate: '2026-07-20', status: '任务归档', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0069', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-06', requireDate: '2026-07-19', status: '报告编制', editor: 'admin', judgment: '合格' },
      { code: 'SC2026/0068', contract: '/', customer: '杭州数蚕智能科技有限公司', sendDate: '2026-06-05', requireDate: '2026-07-18', status: '数据审核', editor: 'admin', judgment: '合格' }
    ];

    var filtered = listData.slice();
    var MAX_INSPECTORS = LabelCertConfig.getInspectorMax();
    var MAX_RECORDERS = LabelCertConfig.getRecorderMax();
    var modalInspectors = ['admin'];
    var modalRecorders = [];
    var modalRoles = { needInspectors: true, needRecorders: false };
    var INSPECTOR_OPTIONS = ['admin', 'cs222', 'cs3', '张三', '李四'];
    var modalMode = 'batch';
    var pendingSingleCode = null;
    var STORAGE_INSPECTORS = 'lims_label_print_last_inspectors';
    var STORAGE_RECORDERS = 'lims_label_print_last_recorders';
    var STORAGE_INIT = 'lims_label_print_inspector_inited';

    // 委托编号 → 样品元数据（与批打页 SAMPLE_CATALOG 对齐的精简映射）
    var ENTRUST_SAMPLE_METAS = {
      'SC2026/0079': [{ cat: 'aqgqj', masterId: 'rod' }, { cat: 'aqgqj', masterId: 'electroscope' }],
      'SC2026/0073': [{ cat: 'aqgqj', masterId: 'belt976' }],
      'SC2026/0072': [{ cat: 'aqgqj', masterId: 'electroscope' }],
      'SC2026/0071': [{ cat: 'aqgqj', masterId: 'rod' }],
      'SC2026/0070': [{ cat: 'aqgqj', masterId: 'helmet' }],
      'SC2026/0074': [{ cat: 'aqgqj', masterId: 'blanket' }]
    };

    function canShowCert(item) {
      return FlowStages.canShowCert(item);
    }

    function rolesForSamples(sampleMetas) {
      var needI = false, needR = false;
      var list = sampleMetas && sampleMetas.length
        ? sampleMetas
        : [{ cat: 'aqgqj', masterId: null }];
      list.forEach(function (s) {
        var tpl = LabelCertConfig.resolveTemplate(s.cat || 'aqgqj', 'certificate', s.masterId || null);
        var r = LabelCertConfig.personnelRolesNeeded((tpl && tpl.elements) || []);
        if (r.needInspectors) needI = true;
        if (r.needRecorders) needR = true;
      });
      return { needInspectors: needI, needRecorders: needR };
    }

    function metasForCodes(codes) {
      var metas = [];
      (codes || []).forEach(function (code) {
        var list = ENTRUST_SAMPLE_METAS[code];
        if (list) list.forEach(function (m) { metas.push(m); });
        else metas.push({ cat: 'aqgqj', masterId: null });
      });
      return metas;
    }

    function getLastInspectors() {
      try {
        var raw = localStorage.getItem(STORAGE_INSPECTORS);
        var list = raw ? JSON.parse(raw) : ['admin'];
        return list.slice(0, MAX_INSPECTORS);
      } catch (e) {
        return ['admin'];
      }
    }

    function getLastRecorders() {
      try {
        var raw = localStorage.getItem(STORAGE_RECORDERS);
        var list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list.slice(0, MAX_RECORDERS) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLastPersonnel(inspectors, recorders) {
      localStorage.setItem(STORAGE_INSPECTORS, JSON.stringify((inspectors || []).slice(0, MAX_INSPECTORS)));
      localStorage.setItem(STORAGE_RECORDERS, JSON.stringify((recorders || []).slice(0, MAX_RECORDERS)));
      localStorage.setItem(STORAGE_INIT, '1');
    }

    function hasSelectedBefore() {
      return localStorage.getItem(STORAGE_INIT) === '1';
    }

    function canSkipModal(roles) {
      if (!hasSelectedBefore()) return false;
      if (roles.needInspectors && !getLastInspectors().length) return false;
      if (roles.needRecorders && !getLastRecorders().length) return false;
      return true;
    }

    function updatePersonnelTip() {
      var parts = [];
      if (modalRoles.needInspectors) parts.push('最多选择 ' + MAX_INSPECTORS + ' 名检测员');
      if (modalRoles.needRecorders) parts.push('最多选择 ' + MAX_RECORDERS + ' 名记录员');
      document.getElementById('personnelTip').textContent = parts.join('；');
    }

    function renderModalPersonnel() {
      document.getElementById('inspectorRow').classList.toggle('hidden', !modalRoles.needInspectors);
      document.getElementById('recorderRow').classList.toggle('hidden', !modalRoles.needRecorders);
      if (modalRoles.needInspectors) {
        document.getElementById('modalInspectorBox').innerHTML = InspectorSelect.renderHTML({
          inspectors: modalInspectors,
          options: INSPECTOR_OPTIONS,
          mode: 'modal',
          idx: '',
          prefix: 'modalInsp',
          maxCount: MAX_INSPECTORS,
          addLabel: '添加检测员'
        });
      } else {
        document.getElementById('modalInspectorBox').innerHTML = '';
      }
      if (modalRoles.needRecorders) {
        document.getElementById('modalRecorderBox').innerHTML = InspectorSelect.renderHTML({
          inspectors: modalRecorders,
          options: INSPECTOR_OPTIONS,
          mode: 'modal',
          idx: '',
          prefix: 'modalRec',
          maxCount: MAX_RECORDERS,
          addLabel: '添加记录员'
        });
      } else {
        document.getElementById('modalRecorderBox').innerHTML = '';
      }
      updatePersonnelTip();
    }

    InspectorSelect.bind(document.getElementById('modalInspectorBox'), {
      onAdd: function (_, name) {
        if (modalInspectors.length >= MAX_INSPECTORS) {
          alert('最多只能选择 ' + MAX_INSPECTORS + ' 名检测员');
          return;
        }
        if (modalInspectors.indexOf(name) === -1) modalInspectors.push(name);
        renderModalPersonnel();
      },
      onRemove: function (_, name) {
        modalInspectors = modalInspectors.filter(function (n) { return n !== name; });
        renderModalPersonnel();
      }
    });
    InspectorSelect.bind(document.getElementById('modalRecorderBox'), {
      onAdd: function (_, name) {
        if (modalRecorders.length >= MAX_RECORDERS) {
          alert('最多只能选择 ' + MAX_RECORDERS + ' 名记录员');
          return;
        }
        if (modalRecorders.indexOf(name) === -1) modalRecorders.push(name);
        renderModalPersonnel();
      },
      onRemove: function (_, name) {
        modalRecorders = modalRecorders.filter(function (n) { return n !== name; });
        renderModalPersonnel();
      }
    });
    renderModalPersonnel();

    function renderTable() {
      document.getElementById('tableBody').innerHTML = filtered.map(function (item, i) {
        var showCert = canShowCert(item);
        var certBtn = showCert
          ? '<a id="' + (item.code === 'SC2026/0079' ? 'linkSingleCert' : '') + '" href="#" onclick="onSingleCertClick(event,\'' + item.code + '\')" class="text-green-600 hover:underline"><i class="fa fa-print"></i> 合格证</a>'
          : '';
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5"><input type="checkbox" class="row-check" data-code="' + item.code + '" data-cert="' + (showCert ? '1' : '0') + '" /></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap"><a href="entrust-detail.html" class="text-blue-600 hover:underline">' + item.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">' + item.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' + item.sendDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' + item.requireDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><span class="status-tag">' + item.status + '</span></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.editor + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' +
            '<a href="label-print-preview.html?code=' + encodeURIComponent(item.code) + '" class="text-blue-600 hover:underline">样品标签</a>' +
            (certBtn ? ' <span class="text-slate-300">|</span> ' + certBtn : '') +
            (!showCert && FlowStages.isPostReportSign(item.status) && !FlowStages.isJudgmentPassed(item)
              ? ' <span class="text-xs text-slate-400">（不合格不可打证）</span>' : '') +
          '</td></tr>';
      }).join('');
      document.getElementById('totalText').textContent = '共 ' + filtered.length + ' 条';
      document.getElementById('checkAll').checked = false;
    }

    function toggleAll(checked) {
      document.querySelectorAll('.row-check').forEach(function (cb) { cb.checked = checked; });
    }

    function getSelectedCodes(certOnly) {
      return Array.prototype.map.call(document.querySelectorAll('.row-check:checked'), function (cb) {
        if (certOnly && cb.getAttribute('data-cert') !== '1') return null;
        return cb.getAttribute('data-code');
      }).filter(Boolean);
    }

    function doSearch() {
      var code = document.getElementById('f_code').value.trim();
      var customer = document.getElementById('f_customer').value.trim();
      var sample = document.getElementById('f_sample').value.trim();
      filtered = listData.filter(function (item) {
        if (code && item.code.indexOf(code) === -1) return false;
        if (customer && item.customer.indexOf(customer) === -1) return false;
        if (sample) return false;
        return true;
      });
      renderTable();
    }

    function doReset() {
      ['f_code', 'f_contract', 'f_customer', 'f_sample'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('f_frame').value = '';
      filtered = listData.slice();
      renderTable();
    }

    function batchSampleLabel() {
      var codes = getSelectedCodes(false);
      if (!codes.length) { alert('请先勾选需要打印的委托'); return; }
      location.href = 'label-print-preview.html?codes=' + encodeURIComponent(codes.join(','));
    }

    function personnelQuery(inspectors, recorders) {
      return '&inspectors=' + encodeURIComponent((inspectors || []).join(',')) +
        '&recorders=' + encodeURIComponent((recorders || []).join(','));
    }

    function goSingleCert(code, inspectors, recorders) {
      window.location.href = 'cert-print-single.html?code=' + encodeURIComponent(code) +
        personnelQuery(inspectors, recorders);
    }

    function goBatchCert(codes, inspectors, recorders) {
      window.location.href = 'cert-print-batch.html?codes=' + encodeURIComponent(codes.join(',')) +
        personnelQuery(inspectors, recorders);
    }

    function prepareModalForRoles(roles) {
      modalRoles = roles;
      modalInspectors = roles.needInspectors ? getLastInspectors().slice() : [];
      modalRecorders = roles.needRecorders ? getLastRecorders().slice() : [];
      renderModalPersonnel();
    }

    function tryGoPrint(codes, isSingle) {
      var roles = rolesForSamples(metasForCodes(codes));
      if (!roles.needInspectors && !roles.needRecorders) {
        if (isSingle) goSingleCert(codes[0], [], []);
        else goBatchCert(codes, [], []);
        return true;
      }
      if (canSkipModal(roles)) {
        var insp = roles.needInspectors ? getLastInspectors() : [];
        var rec = roles.needRecorders ? getLastRecorders() : [];
        if (isSingle) goSingleCert(codes[0], insp, rec);
        else goBatchCert(codes, insp, rec);
        return true;
      }
      prepareModalForRoles(roles);
      showModal('inspectorModal');
      return false;
    }

    function onSingleCertClick(e, code) {
      e.preventDefault();
      modalMode = 'single';
      pendingSingleCode = code;
      tryGoPrint([code], true);
    }

    function openInspectorModal() {
      var codes = getSelectedCodes(true);
      if (!codes.length) { alert('请先勾选可打印合格证的委托（报告签发及后续流程，且判定合格）'); return; }
      modalMode = 'batch';
      pendingSingleCode = null;
      tryGoPrint(codes, false);
    }

    function closeInspectorModal() {
      hideModal('inspectorModal');
      pendingSingleCode = null;
    }

    function confirmInspector() {
      if (modalRoles.needInspectors && !modalInspectors.length) { alert('请至少选择 1 名检测员'); return; }
      if (modalRoles.needRecorders && !modalRecorders.length) { alert('请至少选择 1 名记录员'); return; }
      var inspectors = modalRoles.needInspectors ? modalInspectors.slice() : [];
      var recorders = modalRoles.needRecorders ? modalRecorders.slice() : [];
      saveLastPersonnel(inspectors, recorders);
      if (modalMode === 'single' && pendingSingleCode) {
        goSingleCert(pendingSingleCode, inspectors, recorders);
      } else {
        var codes = getSelectedCodes(true);
        if (!codes.length) { alert('请先勾选可打印合格证的委托'); return; }
        goBatchCert(codes, inspectors, recorders);
      }
    }

    function showModal(id) {
      var m = document.getElementById(id);
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function hideModal(id) {
      var m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    document.getElementById('inspectorModal').addEventListener('click', function (e) {
      if (e.target === this) closeInspectorModal();
    });

    renderTable();

    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'single-cert',
          selector: '#linkSingleCert',
          position: 'top-right',
          title: '单个合格证打印',
          wide: true,
          content: '点击「合格证」按目标合格证模版所需角色弹出「选择人员」（检测员/记录员）。<br><br>' +
            '<strong>首次打印：</strong>必须弹出选人弹窗。<br>' +
            '<strong>后续再打印：</strong>若已记忆且覆盖当前所需角色则不再弹窗；缺角色时仍会弹出。',
          tag: '流程 · 图2'
        },
        {
          id: 'cert-visibility',
          selector: '[data-annotate="cert-visibility"]',
          position: 'top-right',
          title: '合格证入口显示条件',
          wide: true,
          content: '操作列「合格证」须同时满足：<br>' +
            '1）委托处于<strong>报告签发及后续流程</strong>；<br>' +
            '2）样品<strong>判定合格</strong>（不合格禁止打证，如 SC2026/0074）。<br><br>' +
            '报告签发之前仅展示「样品标签」。模版由「标签与合格证模版」按样品绑定解析。<br><br>' +
            '<strong>流程回退作废：</strong>短链自动作废，验真显示无效。',
          tag: '业务规则'
        },
        {
          id: 'batch-cert',
          selector: '#btnBatchCert',
          position: 'top-right',
          title: '批量打印合格证',
          content: '多选已签发报告的委托后点击。按所选委托模版推导检测员/记录员需求；首次或记忆不足时弹窗选人，否则直接进入批量打印页。',
          tag: '流程 · 图3'
        },
        {
          id: 'confirm-inspector',
          selector: '#btnConfirmInspector',
          position: 'top-right',
          title: '确认人员',
          content: '单个/批量打印共用此弹窗。确认后记忆检测员与记录员，后续打印在角色齐全时自动带入。',
          tag: '流程 · 图4→5'
        }
      ]
    });
  </script>
</body>
