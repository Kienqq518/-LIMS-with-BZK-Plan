<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试验检测编辑 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <link rel="stylesheet" href="css/record-export-drawer.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }

    .sample-tab {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .sample-tab:hover { border-color: #93c5fd; color: #2563eb; }
    .sample-tab.active {
      border-color: #2563eb;
      color: #2563eb;
      background: #eff6ff;
      font-weight: 500;
    }

    /* 层级：样品大类 → 试验项分组 → 数据表 */
    .test-group {
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      overflow: hidden;
    }
    .test-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(90deg, #f1f5f9 0%, #f8fafc 100%);
      border-bottom: 1px solid #e2e8f0;
      border-left: 4px solid #2563eb;
    }
    .test-group-header .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .test-group-header .group-title .sample-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 3px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .test-group-header .group-title .divider {
      color: #94a3b8;
      font-weight: 400;
    }
    .test-group-header .group-meta {
      flex-shrink: 0;
      font-size: 12px;
      color: #64748b;
    }
    .test-group-body { padding: 0; }

    .detect-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detect-table th, .detect-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
    }
    .detect-table th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 500;
    }
    .detect-table tbody tr:nth-child(even) { background: #fafbfc; }
    .detect-table tbody tr:hover { background: #f1f5f9; }

    .status-done {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #15803d;
      font-weight: 500;
    }
    .status-done::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }
    .status-doing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #2563eb;
      font-weight: 500;
    }
    .status-doing::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
    }
    .concl-pass { color: #15803d; font-weight: 500; }
    .concl-fail { color: #dc2626; font-weight: 500; }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      background: #fff;
    }
    .pager button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #64748b;
    }
    .pager button:hover:not(:disabled) { background: #f8fafc; color: #2563eb; border-color: #93c5fd; }
    .pager button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .pager button:disabled { color: #cbd5e1; cursor: not-allowed; }
    .pager select {
      height: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 0 6px;
      background: #fff;
      color: #64748b;
    }

    .op-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      color: #2563eb;
    }
    .op-btn:hover { background: #eff6ff; }

    .panel-hidden { display: none !important; }

    /* 产品检测通知书：元信息与样品明细分表，避免共用 9 列导致标签挤叠 */
    .task-notice-doc { border: 1px solid #334155; }
    .task-doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
      margin: 0;
    }
    .task-notice-doc .task-doc-meta + .task-doc-data,
    .task-notice-doc .task-doc-data + .task-doc-meta { margin-top: -1px; }
    .task-doc-table th,
    .task-doc-table td {
      border: 1px solid #334155;
      padding: 8px 10px;
      text-align: center;
      vertical-align: middle;
      word-break: break-word;
      overflow-wrap: anywhere;
      color: #1e293b;
    }
    .task-doc-table th {
      background: #f8fafc;
      font-weight: 500;
      color: #475569;
    }
    .task-doc-table .lbl {
      background: #f8fafc;
      color: #475569;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
      font-weight: 500;
    }
    .task-doc-table .text-left { text-align: left; }
    .task-doc-table .items-cell {
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
    }
    .task-doc-meta .lbl { width: 14%; min-width: 5.5em; }
    .task-doc-meta .val { width: 19%; }
    .task-doc-meta .val-wide { width: 53%; }
    .task-doc-meta-3 .lbl { width: 12%; min-width: 5em; }
    .task-doc-meta-3 .val { width: 21.33%; }
    .tag-done {
      display: inline-block;
      border-radius: 3px;
      background: #dcfce7;
      color: #15803d;
      font-size: 12px;
      padding: 2px 8px;
      font-weight: 500;
    }
    .tag-normal {
      display: inline-block;
      border-radius: 3px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      padding: 2px 8px;
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="test-detect.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="test-detect.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">试验检测</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      试验检测编辑
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <!-- 提示条 -->
    <div class="mb-3 flex flex-wrap items-start justify-between gap-3 rounded border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-800" data-annotate="or-sim-retest">
      <div class="flex items-start gap-2">
        <i class="fa fa-info-circle mt-0.5 flex-shrink-0"></i>
        <span>您好！完成所有试验项的检测并导出原始记录单后，该样品才能顺利流转到下一个环节。退回后更改检测结果会使覆盖范围内已导出记录单立刻失效。</span>
      </div>
      <button type="button" class="shrink-0 rounded border border-blue-300 bg-white px-2.5 py-1 text-xs text-blue-700 hover:bg-blue-50" onclick="simulateRecordInvalidate()">
        模拟：退回-更改检测结果（交流耐压）
      </button>
    </div>

    <!-- 样品页签 + 操作 -->
    <div class="mb-3 rounded bg-white px-4 py-3 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2" id="sampleTabs"></div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="openExportDrawer()" class="rounded border border-blue-600 px-3 py-1.5 text-sm text-blue-600 hover:bg-blue-50" data-annotate="export-manage">
            <i class="fa fa-download"></i> 导出管理
          </button>
          <button type="button" onclick="openTaskSheetModal()" class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700" data-annotate="task-sheet">
            <i class="fa fa-file-text-o"></i> 产品检测通知书
          </button>
        </div>
      </div>
      <p class="mt-3 text-sm text-slate-600">
        <span class="font-medium text-slate-700">注：</span>
        将鼠标悬浮在 <i class="fa fa-question-circle text-orange-500" title="不合格原因"></i> 图标上，可查看不合格原因；
        将鼠标悬浮在 <i class="fa fa-info-circle text-blue-500" title="退回原因"></i> 图标上，可查看退回原因
      </p>
      <div class="mt-2 text-xs text-slate-400">
        委托编号：<span id="entrustCode" class="text-slate-600">—</span>
        <span class="mx-2 text-slate-300">|</span>
        客户单位：<span id="customerName" class="text-slate-600">—</span>
      </div>
    </div>

    <!-- 各样品对应的试验项面板 -->
    <div id="panels"></div>
  </div>

  <!-- 行编辑弹窗（原型） -->
  <div id="rowEditModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[560px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 class="text-base font-medium text-slate-800" id="rowEditTitle">编辑检测数据</h3>
        <button onclick="closeRowEdit()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="space-y-3 px-5 py-4 text-sm" id="rowEditBody"></div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-3">
        <button onclick="closeRowEdit()" class="rounded border border-slate-300 px-4 py-1.5 text-sm">取消</button>
        <button onclick="alert('保存成功（原型演示）');closeRowEdit()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">保存</button>
      </div>
    </div>
  </div>

  <!-- 产品检测通知书弹窗 -->
  <div id="taskSheetModal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[980px] max-w-full flex-col rounded-lg bg-white shadow-xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 class="text-base font-medium text-slate-800">产品检测通知书</h3>
        <button type="button" onclick="closeTaskSheetModal()" class="export-drawer-close" title="关闭" aria-label="关闭">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-5">
        <div class="bg-white p-4">
          <h4 class="mb-4 text-center text-lg font-semibold tracking-widest text-slate-800">产品检测通知书</h4>
          <div class="task-notice-doc" id="taskSheetDoc">
            <table class="task-doc-table task-doc-meta" id="taskSheetMetaTop">
              <colgroup>
                <col style="width:14%" />
                <col style="width:33%" />
                <col style="width:14%" />
                <col style="width:39%" />
              </colgroup>
              <tbody id="taskSheetMetaTopBody"></tbody>
            </table>
            <table class="task-doc-table task-doc-data" id="taskSheetTable">
              <colgroup>
                <col style="width:5%" />
                <col style="width:13%" />
                <col style="width:10%" />
                <col style="width:6%" />
                <col style="width:28%" />
                <col style="width:12%" />
                <col style="width:12%" />
                <col style="width:14%" />
              </colgroup>
              <thead id="taskSheetHead"></thead>
              <tbody id="taskSheetBody"></tbody>
            </table>
            <table class="task-doc-table task-doc-meta task-doc-meta-3" id="taskSheetMetaBottom">
              <colgroup>
                <col style="width:12%" />
                <col style="width:21%" />
                <col style="width:14%" />
                <col style="width:20%" />
                <col style="width:12%" />
                <col style="width:21%" />
              </colgroup>
              <tbody id="taskSheetMetaBottomBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-center gap-3 border-t border-slate-100 px-5 py-4">
        <button type="button" onclick="printTaskSheet()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white hover:bg-blue-700">
          打印此页
        </button>
        <button type="button" disabled class="cursor-not-allowed rounded bg-slate-200 px-5 py-1.5 text-sm text-slate-400" title="已接受（当前状态不可操作）">
          已接受
        </button>
      </div>
    </div>
  </div>

  <!-- 记录单导出详情抽屉 -->
  <div id="exportDrawerMask" class="drawer-mask" data-annotate="export-drawer">
    <div class="export-drawer" onclick="event.stopPropagation()">
      <div class="export-drawer-header">
        <div>
          <h3 class="text-base font-medium text-slate-800">记录单导出详情</h3>
          <p class="mt-0.5 text-xs text-slate-400">可临时改生成模式与分组；「保存为该样品默认」只写这一条样品名称(型号)</p>
        </div>
        <button type="button" onclick="closeExportDrawer()" class="export-drawer-close" title="关闭" aria-label="关闭">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="export-drawer-body" id="exportDrawerBody">
        <div id="exportPreviewGroups"></div>
        <div class="export-warn" id="exportSummaryWarn" data-annotate="export-summary-warn"></div>
      </div>
      <div class="export-drawer-footer">
        <label class="export-select-all" data-annotate="export-select-all">
          <input type="checkbox" id="exportCheckAll" onchange="toggleExportCheckAll(this.checked)" />
          全选可导出项
        </label>
        <button type="button" onclick="batchExportRecords()" data-annotate="export-batch" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white hover:bg-blue-700">
          批量导出
        </button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/record-export.js"></script>
  <script src="js/original-record-version.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var entrustCode = params.get('code') || 'SC2026/0052';
    var customer = params.get('customer') || '杭州数蚕智能科技有限公司';

    document.getElementById('entrustCode').textContent = entrustCode;
    document.getElementById('customerName').textContent = customer;

    function pad(n) { return n < 10 ? '0' + n : String(n); }
    /** 试样编号：{委托编号}{样品序号}{试样序号}-{试验序号}，-前末两位为试样自增，-后为试验序号 */
    function buildSpecimenId(entrustCode, sampleCode, specimenIndex, testSeq) {
      return entrustCode + sampleCode + pad(specimenIndex) + '-' + pad(testSeq);
    }
    function specimenIdsForTest(entrustCode, sampleCode, testSeq, count) {
      var list = [];
      for (var i = 1; i <= count; i++) list.push(buildSpecimenId(entrustCode, sampleCode, i, testSeq));
      return list;
    }

    var pageData = {
      samples: [
        {
          id: 'rod',
          name: '绝缘操作杆',
          model: '10kV',
          category: '安全工器具',
          templateKey: 'rod',
          groups: [
            {
              key: 'ac',
              title: '交流耐压试验',
              columns: ['试样编号', '试验设备', '标称值/kV', '试验值/kV', '时间/min', '状态描述', '结论', '室温/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '01', 1, 10).map(function (id, i) {
                return [id, '设备', '45', String(10 + (i % 3)), '1', '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'appear',
              title: '外观及尺寸',
              columns: ['试样编号', '试验设备', '外观', '有效绝缘长度/m', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '01', 2, 10).map(function (id) {
                return [id, '设备', '无缺陷', '1.2', '', '已完成'];
              })
            },
            {
              key: 'dyn',
              title: '抗弯动负荷试验',
              columns: ['试样编号', '试验设备', '试样长度/m', '标称值/N', '试验值/N', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '01', 3, 10).map(function (id, i) {
                return [id, '设备', '1.5', '300', String(295 + i), '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'static',
              title: '抗弯静负荷试验',
              columns: ['试样编号', '试验设备', '试样长度/m', '标称值/N', '试验值/N', '时间/min', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '01', 4, 10).map(function (id, i) {
                return [id, '设备', '1.5', '300', String(298 + (i % 2)), '1', '无异常', i === 3 ? '不合格' : '合格', '23', '1013', '55', i === 3 ? '变形超限' : '', '已完成'];
              })
            }
          ]
        },
        {
          id: 'ladder',
          name: '绝缘硬梯',
          model: '折叠式',
          category: '电网物资',
          templateKey: 'ladder',
          groups: [
            {
              key: 'l-appear',
              title: '外观及尺寸',
              columns: ['试样编号', '试验设备', '外观', '有效绝缘长度/mm', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '02', 1, 10).map(function (id) {
                return [id, '设备', '无缺陷', '3000', '', '已完成'];
              })
            },
            {
              key: 'l-ac',
              title: '交流耐压试验',
              columns: ['试样编号', '试验设备', '电极间距离/m', '标称值/kV', '试验值/kV', '时间/min', '状态描述', '结论', '室温/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '02', 2, 10).map(function (id) {
                return [id, '设备', '0.5', '45', '45', '1', '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'l-h',
              title: '水平强度试验',
              columns: ['试样编号', '试验设备', '标称值/N', '试验值/N', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '02', 3, 10).map(function (id, i) {
                return [id, '设备', '1000', String(980 + i), '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'l-rung',
              title: '横档强度试验',
              columns: ['试样编号', '试验设备', '标称值/N', '试验值/N', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIdsForTest(entrustCode, '02', 4, 10).map(function (id) {
                return [id, '设备', '2500', '2500', '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'l-conn',
              title: '连接装置强度试验',
              columns: ['试样编号', '试验设备', '标称值/N', '试验值/N', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],

    /* ===== 记录单导出详情抽屉 ===== */
    var DEMO_RECORD_RULES = RecordExport.loadRules();

    var RECORD_TEMPLATE_INDEX = {
      rod: {},
      crossarm: { '交流耐压试验': false }
    };

    var DEMO_RECORD_COMBINED = [
      { bindType: 'model', bindTarget: 'rod', bindLabel: '绝缘操作杆', file: '绝缘操作杆_全套记录单.docx', configured: true,
        templates: [{ name: '绝缘操作杆_全套记录单.docx', time: '2026-03-10 09:00', enabled: true, uploader: 'admin' }] }
    ];

    var RECORD_SAMPLE_ANCESTOR = {
      rod: null,
      ladder: null,
      crossarm: null
    };

    var exportPreviewFiles = [];
    var exportSession = {};
    var exportBoardBound = false;

    function ensureExportSession() {
      pageData.samples.forEach(function (sample) {
        if (exportSession[sample.id]) return;
        var rule = RecordExport.resolveRecordRule(sample, DEMO_RECORD_RULES);
        exportSession[sample.id] = RecordExport.initExportSession(sample, rule);
      });
    }

    function sessionRules() {
      return RecordExport.applySessionRules(DEMO_RECORD_RULES, pageData.samples, exportSession);
    }

    function sampleById(id) {
      for (var i = 0; i < pageData.samples.length; i++) {
        if (pageData.samples[i].id === id) return pageData.samples[i];
      }
      return null;
    }

    function markSessionDirty(sampleId) {
      if (exportSession[sampleId]) exportSession[sampleId].dirty = true;
    }

    function testDoneMap(sample) {
      var map = {};
      (sample.groups || []).forEach(function (g) {
        var statusIdx = g.columns.indexOf('状态');
        map[g.title] = statusIdx < 0 || g.rows.every(function (row) { return row[statusIdx] === '已完成'; });
      });
      return map;
    }

    function filesForSample(sampleId) {
      return exportPreviewFiles.filter(function (f) { return f.sampleId === sampleId; });
    }

    function filesForGroup(sampleId, groupIndex) {
      return exportPreviewFiles.filter(function (f) {
        return f.sampleId === sampleId && f.groupIndex === groupIndex;
      });
    }

    function cardStatus(files) {
      if (!files.length) return { status: 'empty', label: '待点亮试验项', detail: '' };
      var ready = files.filter(function (f) { return f.status === 'ready'; }).length;
      if (ready === files.length) return { status: 'ready', label: '就绪', detail: files.length > 1 ? files.length + ' 个文件可导出' : '' };
      var blocked = files.filter(function (f) { return f.status !== 'ready'; })[0];
      return {
        status: blocked.status,
        label: exportStatusLabel(blocked.status),
        detail: blocked.statusDetail || ''
      };
    }

    function exportStatusLabel(status) {
      if (status === 'ready') return '就绪';
      if (status === 'incomplete') return '试验未完成';
      if (status === 'missing_template') return '缺模版';
      if (status === 'empty') return '待点亮试验项';
      return status;
    }

    function renderExportTestTags(tests) {
      return '<div class="export-test-tags">' + tests.map(function (t) {
        var cls = t.done ? 'done' : 'pending';
        var suffix = t.done ? '' : '（未完成）';
        return '<span class="export-test-tag ' + cls + '">' + t.name + suffix + '</span>';
      }).join('') + '</div>';
    }

    function renderPickTag(sampleId, testName, done, selected, groupIndex) {
      var cls = 'export-test-tag is-pick ' + (selected ? 'is-on' : 'is-off') + (done ? '' : ' pending');
      var suffix = done ? '' : '（未完成）';
      return '<span class="' + cls + '" role="button" data-action="toggle-test" data-sample="' + sampleId +
        '" data-group="' + groupIndex + '" data-test="' + testName + '" title="' +
        (selected ? '再次点击取消点亮' : '点击点亮，纳入本文件') + '">' + testName + suffix + '</span>';
    }

    function modeSelectHtml(sampleId, modeKey) {
      return '<select class="export-mode-select" data-sample="' + sampleId + '">' +
        RecordExport.RECORD_MODES.map(function (m) {
          return '<option value="' + m.key + '"' + (m.key === modeKey ? ' selected' : '') + '>' + m.label + '</option>';
        }).join('') + '</select>';
    }

    function renderExportFileRow(file, idx, showSpecimen, annotate) {
      var ready = file.status === 'ready';
      var html = '<tr data-idx="' + idx + '">';
      html += '<td class="col-check"><input type="checkbox" class="export-row-check" data-idx="' + idx + '"' +
        (ready && file.checked ? ' checked' : '') + (ready ? '' : ' disabled') + ' /></td>';
      html += '<td class="col-filename"' + (annotate === 'filename' ? ' data-annotate="export-filename"' : '') + '>' + file.fileName + '</td>';
      if (showSpecimen) {
        html += '<td class="col-specimen"' + (annotate === 'specimen' ? ' data-annotate="export-specimen"' : '') + '>' + (file.specimenId || '—') + '</td>';
      }
      html += '<td' + (annotate === 'tests' ? ' data-annotate="export-tests"' : '') + '>' + renderExportTestTags(file.tests) + '</td>';
      html += '<td class="col-status"' + (annotate === 'status' ? ' data-annotate="export-status"' : '') + '><span class="export-status ' + file.status + '">' +
        exportStatusLabel(file.status) + '</span>' +
        (file.status !== 'ready' ? '<span class="export-status-detail">' + file.statusDetail + '</span>' : '') +
        '</td>';
      html += '<td class="col-op"><button type="button" class="export-op-btn" data-idx="' + idx + '" title="导出"' +
        (annotate === 'op' ? ' data-annotate="export-row-op"' : '') +
        (ready ? '' : ' disabled') +
        '><i class="fa fa-cloud-download"></i></button></td>';
      html += '</tr>';
      return html;
    }

    function renderTableForSample(sample, files) {
      var showSpecimen = RecordExport.modeByKey(exportSession[sample.id].modeKey).dim === 'specimen';
      if (!files.length) {
        return '<div class="px-4 py-8 text-center text-sm text-slate-400">当前模式下暂无可预览的导出文件</div>';
      }
      var html = '<div class="overflow-x-auto"><table class="export-table min-w-full"><thead><tr>';
      html += '<th class="col-check"></th>';
      html += '<th class="col-filename">文件名（预览）</th>';
      if (showSpecimen) html += '<th class="col-specimen">试样编号</th>';
      html += '<th>包含试验项</th><th class="col-status">状态</th><th class="col-op">操作</th>';
      html += '</tr></thead><tbody>';
      files.forEach(function (file) {
        html += renderExportFileRow(file, file._idx, showSpecimen, null);
      });
      html += '</tbody></table></div>';
      return html;
    }

    function renderBoardForSample(sample, sess) {
      var allTests = sample.groups.map(function (g) { return g.title; });
      var doneMap = testDoneMap(sample);
      var part = RecordExport.partitionTestGroups(allTests, sess.testGroups);
      var groups = sess.testGroups.length ? sess.testGroups : [[]];
      var dim = RecordExport.modeByKey(sess.modeKey).dim;
      var specCount = sample.groups[0] && sample.groups[0].rows ? sample.groups[0].rows.length : 0;

      var html = '<div class="export-board" data-annotate="export-board">';
      groups.forEach(function (names, gi) {
        var groupFiles = filesForGroup(sample.id, gi);
        var st = cardStatus(groupFiles);
        var anyReady = groupFiles.some(function (f) { return f.status === 'ready'; });
        var checked = anyReady && groupFiles.every(function (f) { return f.status !== 'ready' || f.checked; });
        var fileName = groupFiles[0] ? groupFiles[0].fileName : '点亮试验项后生成文件名';
        html += '<div class="export-file-bar' + (anyReady ? ' is-ready' : '') + '" data-sample="' + sample.id +
          '" data-group="' + gi + '"' + (gi === 0 ? ' data-annotate="export-file-card"' : '') + '>';
        html += '<div class="export-file-bar-main">';
        html += '<div class="export-file-bar-head">';
        html += '<input type="checkbox" class="export-card-check" data-sample="' + sample.id + '" data-group="' + gi + '"' +
          (anyReady && checked ? ' checked' : '') + (anyReady ? '' : ' disabled') + ' />';
        html += '<span class="export-card-kicker">文件 ' + (gi + 1) +
          (dim === 'specimen' && names.length ? ' · 每试样 1 份' : '') + '</span>';
        html += '<span class="export-card-name">' + fileName + '</span>';
        html += '<div class="export-bar-status"' + (gi === 0 ? ' data-annotate="export-status"' : '') + '>';
        html += '<span class="export-status ' + st.status + '">' + st.label + '</span>';
        if (st.detail && st.status !== 'ready') {
          html += '<span class="export-status-detail">' + st.detail + '</span>';
        }
        html += '</div>';
        if (groups.length > 1) {
          html += '<button type="button" class="export-card-remove" data-action="remove-card" data-sample="' + sample.id +
            '" data-group="' + gi + '" title="删除此文件，已点亮项变回未选中"><i class="fa fa-times"></i></button>';
        }
        html += '</div>';
        html += '<div class="export-file-bar-tags"' + (gi === 0 ? ' data-annotate="export-tests"' : '') + '>';
        allTests.forEach(function (name) {
          var selected = names.indexOf(name) >= 0;
          html += renderPickTag(sample.id, name, !!doneMap[name], selected, gi);
        });
        if (!allTests.length) html += '<div class="export-card-empty">没有可点亮的试验项</div>';
        html += '</div></div>';
        html += '<div class="export-file-bar-side">';
        html += '<button type="button" class="export-op-btn export-bar-dl" data-action="export-group" data-sample="' +
          sample.id + '" data-group="' + gi + '" title="' + (anyReady ? '导出本文件' : '请先点亮试验项') + '"' +
          (anyReady ? '' : ' disabled') + '><i class="fa fa-cloud-download"></i></button>';
        if (dim === 'specimen' && names.length) {
          html += '<div class="export-card-meta">' + specCount + ' 份</div>';
        }
        html += '</div></div>';
      });
      html += '<button type="button" class="export-add-bar" data-action="add-card" data-sample="' + sample.id +
        '" data-annotate="export-add-card"><i class="fa fa-plus"></i>添加文件</button>';
      if (part.unassigned.length) {
        html += '<div class="export-unassigned-hint">尚有 ' + part.unassigned.length +
          ' 项未点亮，本次不会导出这些试验项。</div>';
      }
      html += '</div>';
      return html;
    }

      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();

    function syncExportSummary() {
      var warn = document.getElementById('exportSummaryWarn');
      if (!exportPreviewFiles.length) {
        warn.classList.remove('show');
        warn.textContent = '';
        return;
      }
      var blocked = exportPreviewFiles.filter(function (f) { return f.status !== 'ready'; });
      var sessUnassigned = 0;
      pageData.samples.forEach(function (sample) {
        var sess = exportSession[sample.id];
        if (!sess || !RecordExport.isMultiMode(sess.modeKey)) return;
        var allTests = sample.groups.map(function (g) { return g.title; });
        sessUnassigned += RecordExport.partitionTestGroups(allTests, sess.testGroups).unassigned.length;
      });
      if (!blocked.length && !sessUnassigned) {
        warn.classList.remove('show');
        warn.textContent = '';
        return;
      }
      var parts = [];
      if (blocked.length) {
        parts.push('共 ' + blocked.length + ' 个文件暂不可导出：' +
          blocked.map(function (f) { return f.fileName + '（' + exportStatusLabel(f.status) + '）'; }).join('；'));
      }
      warn.textContent = parts.join(' ');
      if (parts.length) warn.classList.add('show');
      else warn.classList.remove('show');
    }

    function toggleTestOnBar(sampleId, groupIndex, testName) {
      var sess = exportSession[sampleId];
      if (!sess) return;
      while (sess.testGroups.length <= groupIndex) sess.testGroups.push([]);
      var g = sess.testGroups[groupIndex];
      if (g.indexOf(testName) >= 0) {
        sess.testGroups[groupIndex] = g.filter(function (t) { return t !== testName; });
      } else {
        sess.testGroups[groupIndex].push(testName);
      }
      markSessionDirty(sampleId);
      renderExportPreview();
    }

    function onExportModeChange(sampleId, modeKey) {
      var sample = sampleById(sampleId);
      var sess = exportSession[sampleId];
      if (!sample || !sess) return;
      var allTests = sample.groups.map(function (g) { return g.title; });
      var fromKey = sess.modeKey;
      sess.modeKey = modeKey;
      if (RecordExport.isMultiMode(modeKey)) {
        if (!RecordExport.isMultiMode(fromKey)) {
          sess.testGroups = [[]];
        } else {
          sess.testGroups = RecordExport.defaultMultiGroups(fromKey, allTests, sess.testGroups);
        }
      }
      markSessionDirty(sampleId);
      renderExportPreview();
    }

    function saveSampleDefault(sampleId) {
      var sample = sampleById(sampleId);
      var sess = exportSession[sampleId];
      if (!sample || !sess) return;
      var label = RecordExport.sampleModelLabel(sample);
      DEMO_RECORD_RULES = RecordExport.saveModelDefault(label, sess.modeKey, sess.testGroups);
      sess.dirty = false;
      renderExportPreview();
      alert('已保存为「' + label + '」的默认切分规则。\n下次打开导出抽屉将按此分组预填。\n不会改动其它型号或分类规则。');
    }

    function onExportRowCheck(idx, checked) {
      if (!exportPreviewFiles[idx] || exportPreviewFiles[idx].status !== 'ready') return;
      exportPreviewFiles[idx].checked = checked;
      var readyFiles = exportPreviewFiles.filter(function (f) { return f.status === 'ready'; });
      document.getElementById('exportCheckAll').checked = readyFiles.length > 0 && readyFiles.every(function (f) { return f.checked; });
    }

    function toggleExportCheckAll(checked) {
      exportPreviewFiles.forEach(function (file, i) {
        if (file.status !== 'ready') return;
        file.checked = checked;
        var el = document.querySelector('.export-row-check[data-idx="' + i + '"]');
        if (el && !el.disabled) el.checked = checked;
      });
      document.querySelectorAll('.export-card-check').forEach(function (el) {
        if (!el.disabled) el.checked = checked;
      });
    }

    function toggleGroupCheck(sampleId, groupIndex, checked) {
      filesForGroup(sampleId, groupIndex).forEach(function (file) {
        if (file.status !== 'ready') return;
        file.checked = checked;
      });
      var readyFiles = exportPreviewFiles.filter(function (f) { return f.status === 'ready'; });
      document.getElementById('exportCheckAll').checked = readyFiles.length > 0 && readyFiles.every(function (f) { return f.checked; });
    }

    function normalizeRecordTestName(name) {
      var s = String(name || '').replace(/试验$/g, '');
      if (s.indexOf('外观') >= 0) return '外观尺寸';
      return s;
    }

    function previewToRecordPayload(file) {
      var tests = (file.tests || []).map(function (t) { return normalizeRecordTestName(t.name); });
      var specIds = file.specimenId
        ? [file.specimenId]
        : (window.OriginalRecordVersion ? OriginalRecordVersion.load().liveSpecimenIds.slice() : []);
      return {
        specimenIds: specIds,
        testNames: tests,
        modeKey: file.modeKey || 'model-each',
        fileName: file.fileName
      };
    }

    function simulateRecordInvalidate() {
      if (!window.OriginalRecordVersion) return;
      var n = OriginalRecordVersion.invalidateByCoverage({
        specimenIds: [OriginalRecordVersion.SPEC_A],
        testNames: ['交流耐压'],
        reason: OriginalRecordVersion.formatChangeNote('retest')
      });
      var go = confirm((n ? ('已立刻将 ' + n + ' 份原始记录单标为已失效。') : '没有仍有效且覆盖该范围的记录单。') +
        '\n\n是否打开原始记录页查看？');
      if (go) location.href = 'test-record.html';
    }

    function exportPreviewRow(idx) {
      var file = exportPreviewFiles[idx];
      if (!file || file.status !== 'ready') return;
      var tests = file.tests.map(function (t) { return t.name; }).join('、');
      if (window.OriginalRecordVersion) OriginalRecordVersion.exportFile(previewToRecordPayload(file));
      alert('导出记录单（原型演示）\n文件：' + file.fileName +
        '\n生成模式：' + RecordExport.modeLabel(file.modeKey) +
        '\n包含试验项：' + tests);
    }

    function exportGroupFiles(sampleId, groupIndex) {
      var files = filesForGroup(sampleId, groupIndex).filter(function (f) { return f.status === 'ready'; });
      if (!files.length) {
        alert('该文件暂不可导出，请先点亮试验项，并完成试验、配置模版后再试');
        return;
      }
      if (window.OriginalRecordVersion) {
        files.forEach(function (f) { OriginalRecordVersion.exportFile(previewToRecordPayload(f)); });
      }
      alert('导出记录单（原型演示）\n共 ' + files.length + ' 个文件：\n' +
        files.map(function (f) { return f.fileName; }).join('\n'));
    }

    function batchExportRecords() {
      var selected = exportPreviewFiles.filter(function (f) {
        return f.status === 'ready' && f.checked;
      });
      if (!selected.length) {
        var anyReady = exportPreviewFiles.some(function (f) { return f.status === 'ready'; });
        alert(anyReady ? '请至少勾选一条可导出的文件' : '当前没有可导出的文件，请先点亮试验项');
        return;
      }
      if (window.OriginalRecordVersion) {
        selected.forEach(function (f) { OriginalRecordVersion.exportFile(previewToRecordPayload(f)); });
      }
      alert('批量导出（原型演示）\n共 ' + selected.length + ' 个文件：\n' +
        selected.map(function (f) { return f.fileName; }).join('\n'));
    }

    function openExportDrawer() {
      DEMO_RECORD_RULES = RecordExport.loadRules();
      exportSession = {};
      renderExportPreview();
      document.getElementById('exportDrawerMask').classList.add('open');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeExportDrawer() {
      document.getElementById('exportDrawerMask').classList.remove('open');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function bindExportBoardEvents() {
      if (exportBoardBound) return;
      exportBoardBound = true;
      var root = document.getElementById('exportPreviewGroups');

      root.addEventListener('change', function (e) {
        var t = e.target;
        if (t.classList.contains('export-mode-select')) {
          onExportModeChange(t.getAttribute('data-sample'), t.value);
          return;
        }
        if (t.classList.contains('export-row-check')) {
          onExportRowCheck(Number(t.getAttribute('data-idx')), t.checked);
          return;
        }
        if (t.classList.contains('export-card-check')) {
          toggleGroupCheck(t.getAttribute('data-sample'), Number(t.getAttribute('data-group')), t.checked);
        }
      });

      root.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (btn) {
          var action = btn.getAttribute('data-action');
          var sampleId = btn.getAttribute('data-sample');
          var group = Number(btn.getAttribute('data-group'));
          if (action === 'save-default') saveSampleDefault(sampleId);
          if (action === 'add-card') {
            exportSession[sampleId].testGroups.push([]);
            markSessionDirty(sampleId);
            renderExportPreview();
          }
          if (action === 'remove-card') {
            exportSession[sampleId].testGroups.splice(group, 1);
            if (!exportSession[sampleId].testGroups.length) exportSession[sampleId].testGroups = [[]];
            markSessionDirty(sampleId);
            renderExportPreview();
          }
          if (action === 'export-group') exportGroupFiles(sampleId, group);
          if (action === 'toggle-test') {
            toggleTestOnBar(sampleId, group, btn.getAttribute('data-test'));
          }
          return;
        }
        var op = e.target.closest('.export-op-btn[data-idx]');
        if (op && !op.disabled) exportPreviewRow(Number(op.getAttribute('data-idx')));
      });
    }

    document.getElementById('exportDrawerMask').addEventListener('click', function (e) {
      if (e.target === this) closeExportDrawer();
    });
