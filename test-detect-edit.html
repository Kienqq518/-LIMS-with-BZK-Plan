<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试验检测编辑 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }

    .sample-tab {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .sample-tab:hover { border-color: #93c5fd; color: #2563eb; }
    .sample-tab.active {
      border-color: #2563eb;
      color: #2563eb;
      background: #eff6ff;
      font-weight: 500;
    }

    /* 层级：样品大类 → 试验项分组 → 数据表 */
    .test-group {
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      overflow: hidden;
    }
    .test-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(90deg, #f1f5f9 0%, #f8fafc 100%);
      border-bottom: 1px solid #e2e8f0;
      border-left: 4px solid #2563eb;
    }
    .test-group-header .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .test-group-header .group-title .sample-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 3px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .test-group-header .group-title .divider {
      color: #94a3b8;
      font-weight: 400;
    }
    .test-group-header .group-meta {
      flex-shrink: 0;
      font-size: 12px;
      color: #64748b;
    }
    .test-group-body { padding: 0; }

    .detect-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detect-table th, .detect-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
    }
    .detect-table th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 500;
    }
    .detect-table tbody tr:nth-child(even) { background: #fafbfc; }
    .detect-table tbody tr:hover { background: #f1f5f9; }

    .status-done {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #15803d;
      font-weight: 500;
    }
    .status-done::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }
    .status-doing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #2563eb;
      font-weight: 500;
    }
    .status-doing::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
    }
    .concl-pass { color: #15803d; font-weight: 500; }
    .concl-fail { color: #dc2626; font-weight: 500; }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      background: #fff;
    }
    .pager button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #64748b;
    }
    .pager button:hover:not(:disabled) { background: #f8fafc; color: #2563eb; border-color: #93c5fd; }
    .pager button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .pager button:disabled { color: #cbd5e1; cursor: not-allowed; }
    .pager select {
      height: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 0 6px;
      background: #fff;
      color: #64748b;
    }

    .op-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      color: #2563eb;
    }
    .op-btn:hover { background: #eff6ff; }

    .panel-hidden { display: none !important; }

    /* 记录单导出详情抽屉 */
    .drawer-mask {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      background: rgba(0, 0, 0, .35);
    }
    .drawer-mask.open { display: block; }
    .export-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 61;
      width: 920px;
      max-width: 100%;
      height: 100%;
      background: #fff;
      box-shadow: -4px 0 24px rgba(15, 23, 42, .12);
      transform: translateX(100%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer-mask.open .export-drawer { transform: translateX(0); }
    .export-drawer-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding: 12px 20px;
    }
    .export-drawer-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      color: #64748b;
      font-size: 16px;
    }
    .export-drawer-close:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .export-drawer-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid #f1f5f9;
      padding: 12px 20px;
      background: #fff;
    }
    .export-drawer-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .export-collapse {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .export-collapse-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .export-collapse-head .chev {
      color: #64748b;
      font-size: 12px;
      transition: transform .2s;
    }
    .export-collapse.collapsed .export-collapse-head { border-bottom: none; }
    .export-collapse.collapsed .export-collapse-head .chev { transform: rotate(-90deg); }
    .export-collapse.collapsed .export-collapse-body { display: none; }
    .export-collapse-body { padding: 12px 14px 14px; }

    .export-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .export-table th,
    .export-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      vertical-align: middle;
      text-align: left;
    }
    .export-table th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 500;
      white-space: nowrap;
      text-align: center;
    }
    .export-table td { color: #334155; }
    .export-table .col-check { width: 40px; text-align: center; }
    .export-table .col-specimen { width: 140px; font-size: 11px; word-break: break-all; }
    .export-table .col-status { width: 120px; }
    .export-table .col-filename { min-width: 180px; font-size: 11px; word-break: break-all; }
    .export-table .col-op { width: 56px; text-align: center; }
    .export-test-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .export-test-tag {
      display: inline-block;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.4;
    }
    .export-test-tag.done {
      background: #dcfce7;
      color: #15803d;
    }
    .export-test-tag.pending {
      background: #f1f5f9;
      color: #94a3b8;
    }
    .export-status {
      font-size: 11px;
      line-height: 1.4;
    }
    .export-status.ready { color: #15803d; }
    .export-status.incomplete { color: #c2410c; }
    .export-status.missing_template { color: #b91c1c; }
    .export-status-detail {
      display: block;
      margin-top: 2px;
      color: #64748b;
      font-size: 10px;
    }
    .export-mode-group { margin-bottom: 16px; }
    .export-mode-group .export-collapse-head {
      justify-content: flex-start;
    }
    .export-mode-count {
      margin-left: auto;
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
    }
    .export-sample-block {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #fff;
    }
    .export-sample-block:last-child { margin-bottom: 0; }
    .export-sample-head {
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    .export-sample-block .export-table { border: none; }
    .export-sample-block .export-table th,
    .export-sample-block .export-table td { border-left: none; border-right: none; }
    .export-sample-block .export-table tr:last-child td { border-bottom: none; }
    .export-select-all {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: auto;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }
    .export-select-all input { accent-color: #2563eb; }
    .export-drawer-footer {
      gap: 12px;
    }
    .export-warn {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
      display: none;
    }
    .export-warn.show { display: block; }
    .export-op-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      color: #2563eb;
    }
    .export-op-btn:hover { background: #eff6ff; }
    .export-op-btn:disabled {
      color: #cbd5e1;
      cursor: not-allowed;
      background: transparent;
    }

    /* 产品检测通知书附件弹窗 */
    .task-doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    .task-doc-table th,
    .task-doc-table td {
      border: 1px solid #334155;
      padding: 8px 10px;
      text-align: center;
      vertical-align: middle;
      word-break: break-all;
      color: #1e293b;
    }
    .task-doc-table th {
      background: #f8fafc;
      font-weight: 500;
      color: #475569;
    }
    .task-doc-table .lbl {
      background: #f8fafc;
      color: #475569;
      white-space: nowrap;
      font-weight: 500;
    }
    .task-doc-table .text-left { text-align: left; }
    .task-doc-table .items-cell {
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
    }
    .tag-done {
      display: inline-block;
      border-radius: 3px;
      background: #dcfce7;
      color: #15803d;
      font-size: 12px;
      padding: 2px 8px;
      font-weight: 500;
    }
    .tag-normal {
      display: inline-block;
      border-radius: 3px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      padding: 2px 8px;
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="test-detect.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="test-detect.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">试验检测</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      试验检测编辑
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <!-- 提示条 -->
    <div class="mb-3 flex items-start gap-2 rounded border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-800">
      <i class="fa fa-info-circle mt-0.5 flex-shrink-0"></i>
      <span>您好！完成所有试验项的检测并导出原始记录单后，该样品才能顺利流转到下一个环节。</span>
    </div>

    <!-- 样品页签 + 操作 -->
    <div class="mb-3 rounded bg-white px-4 py-3 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2" id="sampleTabs"></div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="openExportDrawer()" class="rounded border border-blue-600 px-3 py-1.5 text-sm text-blue-600 hover:bg-blue-50" data-annotate="export-manage">
            <i class="fa fa-download"></i> 导出管理
          </button>
          <button type="button" onclick="openTaskSheetModal()" class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700" data-annotate="task-sheet">
            <i class="fa fa-file-text-o"></i> 检测任务单
          </button>
        </div>
      </div>
      <p class="mt-3 text-sm text-slate-600">
        <span class="font-medium text-slate-700">注：</span>
        将鼠标悬浮在 <i class="fa fa-question-circle text-orange-500" title="不合格原因"></i> 图标上，可查看不合格原因；
        将鼠标悬浮在 <i class="fa fa-info-circle text-blue-500" title="退回原因"></i> 图标上，可查看退回原因
      </p>
      <div class="mt-2 text-xs text-slate-400">
        委托编号：<span id="entrustCode" class="text-slate-600">—</span>
        <span class="mx-2 text-slate-300">|</span>
        客户单位：<span id="customerName" class="text-slate-600">—</span>
      </div>
    </div>

    <!-- 各样品对应的试验项面板 -->
    <div id="panels"></div>
  </div>

  <!-- 行编辑弹窗（原型） -->
  <div id="rowEditModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[560px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 class="text-base font-medium text-slate-800" id="rowEditTitle">编辑检测数据</h3>
        <button onclick="closeRowEdit()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="space-y-3 px-5 py-4 text-sm" id="rowEditBody"></div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-3">
        <button onclick="closeRowEdit()" class="rounded border border-slate-300 px-4 py-1.5 text-sm">取消</button>
        <button onclick="alert('保存成功（原型演示）');closeRowEdit()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">保存</button>
      </div>
    </div>
  </div>

  <!-- 检测任务单 · 产品检测通知书附件 -->
  <div id="taskSheetModal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[92vh] w-[980px] max-w-full flex-col rounded-lg bg-white shadow-xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 class="text-base font-medium text-slate-800">产品检测通知书</h3>
        <button type="button" onclick="closeTaskSheetModal()" class="export-drawer-close" title="关闭" aria-label="关闭">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-5">
        <div class="border border-slate-700 bg-white p-4">
          <h4 class="mb-4 text-center text-lg font-semibold tracking-widest text-slate-800">产品检测通知书</h4>
          <table class="task-doc-table" id="taskSheetTable">
            <colgroup>
              <col style="width:5%" />
              <col style="width:12%" />
              <col style="width:8%" />
              <col style="width:6%" />
              <col style="width:26%" />
              <col style="width:12%" />
              <col style="width:10%" />
              <col style="width:10%" />
              <col style="width:11%" />
            </colgroup>
            <thead></thead>
            <tbody id="taskSheetBody"></tbody>
          </table>
        </div>
      </div>
      <div class="flex items-center justify-center gap-3 border-t border-slate-100 px-5 py-4">
        <button type="button" onclick="printTaskSheet()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white hover:bg-blue-700">
          打印此页
        </button>
        <button type="button" disabled class="cursor-not-allowed rounded bg-slate-200 px-5 py-1.5 text-sm text-slate-400" title="已接受（当前状态不可操作）">
          已接受
        </button>
      </div>
    </div>
  </div>

  <!-- 记录单导出详情抽屉 -->
  <div id="exportDrawerMask" class="drawer-mask">
    <div class="export-drawer" onclick="event.stopPropagation()">
      <div class="export-drawer-header">
        <h3 class="text-base font-medium text-slate-800">记录单导出详情</h3>
        <button type="button" onclick="closeExportDrawer()" class="export-drawer-close" title="关闭" aria-label="关闭">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="export-drawer-body" id="exportDrawerBody">
        <div id="exportPreviewGroups"></div>
        <div class="export-warn" id="exportSummaryWarn"></div>
      </div>
      <div class="export-drawer-footer">
        <label class="export-select-all">
          <input type="checkbox" id="exportCheckAll" onchange="toggleExportCheckAll(this.checked)" />
          全选可导出项
        </label>
        <button type="button" onclick="batchExportRecords()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white hover:bg-blue-700">
          批量导出
        </button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/record-export.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var entrustCode = params.get('code') || 'SC2026/0052';
    var customer = params.get('customer') || '杭州数蚕智能科技有限公司';

    document.getElementById('entrustCode').textContent = entrustCode;
    document.getElementById('customerName').textContent = customer;

    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function specimenIds(prefix, count) {
      var list = [];
      for (var i = 1; i <= count; i++) list.push(prefix + '-' + pad(i));
      return list;
    }

    var pageData = {
      samples: [
        {
          id: 'rod',
          name: '绝缘操作杆',
          model: '10kV',
          category: '安全工器具',
          templateKey: 'rod',
          groups: [
            {
              key: 'ac',
              title: '交流耐压试验',
              columns: ['试样编号', '试验设备', '标称值/kV', '试验值/kV', '时间/min', '状态描述', '结论', '室温/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIds(entrustCode + '0101', 10).map(function (id, i) {
                return [id, '设备', '45', String(10 + (i % 3)), '1', '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },
            {
              key: 'appear',
              title: '外观及尺寸',
              columns: ['试样编号', '试验设备', '外观', '有效绝缘长度/m', '备注', '状态', '操作'],
              rows: specimenIds(entrustCode + '0102', 10).map(function (id) {
                return [id, '设备', '无缺陷', '1.2', '', '已完成'];
              })
            },
            {
              key: 'dyn',
              title: '抗弯动负荷试验',
              columns: ['试样编号', '试验设备', '试样长度/m', '标称值/N', '试验值/N', '状态描述', '结论', '温度/℃', '气压/hPa', '湿度/%RH', '备注', '状态', '操作'],
              rows: specimenIds(entrustCode + '0103', 10).map(function (id, i) {
                return [id, '设备', '1.5', '300', String(295 + i), '无异常', '合格', '23', '1013', '55', '', '已完成'];
              })
            },

    var activeSample = pageData.samples[0].id;

    function statusHtml(text) {
      if (text === '已完成') return '<span class="status-done">已完成</span>';
      if (text === '检测中') return '<span class="status-doing">检测中</span>';
      return text || '—';
    }

    function conclHtml(text) {
      if (text === '合格') return '<span class="concl-pass">合格</span>';
      if (text === '不合格') {
        return '<span class="concl-fail">不合格</span> <i class="fa fa-question-circle text-orange-500 cursor-help" title="不合格原因：变形超限"></i>';
      }
      return text || '';
    }

    function cellHtml(col, value, sampleName, groupTitle) {
      if (col === '试验设备') {
        return '<button onclick="alert(\'选择设备（原型演示）\')" class="rounded border border-blue-200 bg-blue-50 px-2 py-0.5 text-blue-600 hover:bg-blue-100">' + (value || '设备') + '</button>';
      }
      if (col === '结论') return conclHtml(value);
      if (col === '状态') return statusHtml(value);
      if (col === '操作') {
        return '<button class="op-btn" title="编辑" onclick="openRowEdit(\'' + sampleName + '\',\'' + groupTitle + '\')"><i class="fa fa-pencil"></i></button>' +
          '<button class="op-btn" title="复制" onclick="alert(\'复制行（原型演示）\')"><i class="fa fa-files-o"></i></button>';
      }
      return value === '' || value == null ? '' : value;
    }

    function pagerHtml(total) {
      return '<div class="pager">' +
        '<button disabled><i class="fa fa-angle-left"></i></button>' +
        '<button class="active">1</button>' +
        (total > 10 ? '<button>2</button><button>3</button><span>…</span><button>10</button>' : '') +
        '<button' + (total > 10 ? '' : ' disabled') + '><i class="fa fa-angle-right"></i></button>' +
        '<select><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select>' +
        '</div>';
    }

    function renderTabs() {
      document.getElementById('sampleTabs').innerHTML = pageData.samples.map(function (s) {
        return '<button type="button" class="sample-tab' + (s.id === activeSample ? ' active' : '') + '" data-id="' + s.id + '" onclick="switchSample(\'' + s.id + '\')">' + s.name + '</button>';
      }).join('');
    }

    function renderPanels() {
      var html = '';
      pageData.samples.forEach(function (sample) {
        html += '<div class="space-y-0' + (sample.id === activeSample ? '' : ' panel-hidden') + '" id="panel-' + sample.id + '">';
        sample.groups.forEach(function (g) {
          var doneCount = g.rows.filter(function (r) {
            var idx = g.columns.indexOf('状态');
            return idx >= 0 && r[idx] === '已完成';
          }).length;
          html += '<section class="test-group">';
          html += '<div class="test-group-header">';
          html += '<div class="group-title">';
          html += '<span class="sample-tag">' + sample.name + '</span>';
          html += '<span class="divider">/</span>';
          html += '<span>' + g.title + '</span>';
          html += '</div>';
          html += '<div class="group-meta">已完成 ' + doneCount + ' / ' + g.rows.length + '</div>';
          html += '</div>';
          html += '<div class="test-group-body overflow-x-auto">';
          html += '<table class="detect-table min-w-full"><thead><tr>';
          g.columns.forEach(function (c) { html += '<th>' + c + '</th>'; });
          html += '</tr></thead><tbody>';
          g.rows.forEach(function (row) {
            html += '<tr>';
            g.columns.forEach(function (col, ci) {
              var val = ci < row.length ? row[ci] : '';
              html += '<td>' + cellHtml(col, val, sample.name, g.title) + '</td>';
            });
            html += '</tr>';
          });
          html += '</tbody></table>';
          html += pagerHtml(g.rows.length);
          html += '</div></section>';
        });
        html += '</div>';
      });
      document.getElementById('panels').innerHTML = html;
    }

    function switchSample(id) {
      activeSample = id;
      renderTabs();
      pageData.samples.forEach(function (s) {
        var el = document.getElementById('panel-' + s.id);
        if (!el) return;
        if (s.id === id) el.classList.remove('panel-hidden');
        else el.classList.add('panel-hidden');
      });
    }

    function openRowEdit(sampleName, groupTitle) {
      document.getElementById('rowEditTitle').textContent = '编辑 · ' + sampleName + ' / ' + groupTitle;
      document.getElementById('rowEditBody').innerHTML =
        '<div class="flex items-center gap-3"><label class="w-24 text-right text-slate-500">试样编号</label><input class="flex-1 rounded border border-slate-300 px-3 py-1.5" value="' + entrustCode + '0101-01" readonly /></div>' +
        '<div class="flex items-center gap-3"><label class="w-24 text-right text-slate-500">试验值</label><input class="flex-1 rounded border border-slate-300 px-3 py-1.5" value="10" /></div>' +
        '<div class="flex items-center gap-3"><label class="w-24 text-right text-slate-500">状态描述</label><input class="flex-1 rounded border border-slate-300 px-3 py-1.5" value="无异常" /></div>' +
        '<div class="flex items-center gap-3"><label class="w-24 text-right text-slate-500">结论</label><select class="flex-1 rounded border border-slate-300 px-3 py-1.5"><option>合格</option><option>不合格</option></select></div>' +
        '<div class="flex items-center gap-3"><label class="w-24 text-right text-slate-500">备注</label><input class="flex-1 rounded border border-slate-300 px-3 py-1.5" placeholder="请输入备注" /></div>';
      var m = document.getElementById('rowEditModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeRowEdit() {
      var m = document.getElementById('rowEditModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    document.getElementById('rowEditModal').addEventListener('click', function (e) {
      if (e.target === this) closeRowEdit();
    });

    /* ===== 检测任务单 · 产品检测通知书 ===== */
    function sampleModelOf(sample) {
      return sample.model || (sample.name === '绝缘操作杆' ? '10kV' : sample.name === '绝缘硬梯' ? '折叠式' : '通用型');
    }

    function renderTaskSheet() {
      var rowsHtml = '';
      rowsHtml += '<tr>' +
        '<td class="lbl">委托编号</td><td colspan="2">' + entrustCode + '</td>' +
        '<td class="lbl">客户单位</td><td colspan="5" class="text-left">' + customer + '</td>' +
        '</tr>';
      rowsHtml += '<tr>' +
        '<th>编号</th><th>样品名称</th><th>型号</th><th>数量</th><th>检测项目</th>' +
        '<th>生产厂/制造商</th><th>试验状态</th><th>是否加急</th><th>备注信息</th>' +
        '</tr>';

      pageData.samples.forEach(function (sample, i) {
        var qty = sample.groups.length ? sample.groups[0].rows.length : 0;
        var items = sample.groups.map(function (g) { return g.title; }).join('|');
        var allDone = sample.groups.every(function (g) {
          var idx = g.columns.indexOf('状态');
          return g.rows.every(function (r) { return idx >= 0 && r[idx] === '已完成'; });
        });
        rowsHtml += '<tr>';
        rowsHtml += '<td>' + (i + 1) + '</td>';
        rowsHtml += '<td>' + sample.name + '</td>';
        rowsHtml += '<td>' + sampleModelOf(sample) + '</td>';
        rowsHtml += '<td>' + qty + '</td>';
        rowsHtml += '<td class="items-cell">' + items + '</td>';
        rowsHtml += '<td>/</td>';
        rowsHtml += '<td><span class="tag-done">' + (allDone ? '已完成' : '检测中') + '</span></td>';
        rowsHtml += '<td><span class="tag-normal">不加急</span></td>';
        rowsHtml += '<td></td>';
        rowsHtml += '</tr>';
      });

      rowsHtml += '<tr>' +
        '<td class="lbl">编制人</td><td colspan="2">admin</td>' +
        '<td class="lbl">委托受理日期</td><td colspan="2" class="text-left">2026-04-14</td>' +
        '<td class="lbl">完成期限</td><td colspan="2" class="text-left"></td>' +
        '</tr>';

      document.getElementById('taskSheetBody').innerHTML = rowsHtml;
    }

    function openTaskSheetModal() {
      renderTaskSheet();
      var m = document.getElementById('taskSheetModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeTaskSheetModal() {
      var m = document.getElementById('taskSheetModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function printTaskSheet() {
      alert('打印产品检测通知书（原型演示）\n委托编号：' + entrustCode);
    }

    document.getElementById('taskSheetModal').addEventListener('click', function (e) {
      if (e.target === this) closeTaskSheetModal();
    });

    /* ===== 记录单导出详情抽屉 ===== */
    var DEMO_RECORD_RULES = [
      { id: 1, bindType: 'category', bindTarget: '安全工器具', modeKey: 'model-all' },
      { id: 2, bindType: 'category', bindTarget: '电网物资', modeKey: 'model-each' },
      { id: 3, bindType: 'model', bindTarget: '绝缘横担 - 通用型', modeKey: 'specimen-each' }
    ];

    var RECORD_TEMPLATE_INDEX = {
      rod: { '抗弯静负荷试验': false },
      crossarm: { '交流耐压试验': false }
    };

    var exportPreviewFiles = [];

    function exportStatusLabel(status) {
      if (status === 'ready') return '就绪';
      if (status === 'incomplete') return '试验未完成';
      if (status === 'missing_template') return '缺模版';
      return status;
    }

    function renderExportTestTags(tests) {
      return '<div class="export-test-tags">' + tests.map(function (t) {
        var cls = t.done ? 'done' : 'pending';
        var suffix = t.done ? '' : '（未完成）';
        return '<span class="export-test-tag ' + cls + '">' + t.name + suffix + '</span>';
      }).join('') + '</div>';
    }

    function renderExportFileRow(file, idx, showSpecimen) {
      var ready = file.status === 'ready';
      var html = '<tr data-idx="' + idx + '">';
      html += '<td class="col-check"><input type="checkbox" class="export-row-check" data-idx="' + idx + '"' +
        (ready && file.checked ? ' checked' : '') + (ready ? '' : ' disabled') +
        ' onchange="onExportRowCheck(' + idx + ', this.checked)" /></td>';
      html += '<td class="col-filename">' + file.fileName + '</td>';
      if (showSpecimen) {
        html += '<td class="col-specimen">' + (file.specimenId || '—') + '</td>';
      }
      html += '<td>' + renderExportTestTags(file.tests) + '</td>';
      html += '<td class="col-status"><span class="export-status ' + file.status + '">' +
        exportStatusLabel(file.status) + '</span>' +
        (file.status !== 'ready' ? '<span class="export-status-detail">' + file.statusDetail + '</span>' : '') +
        '</td>';
      html += '<td class="col-op"><button type="button" class="export-op-btn" title="导出"' +
        (ready ? '' : ' disabled') +
        ' onclick="exportPreviewRow(' + idx + ')"><i class="fa fa-cloud-download"></i></button></td>';
      html += '</tr>';
      return html;
    }

    function groupExportFiles(files) {
      var modeOrder = RecordExport.RECORD_MODES.map(function (m) { return m.key; });
      var byMode = {};
      files.forEach(function (file, idx) {
        file._idx = idx;
        if (!byMode[file.modeKey]) byMode[file.modeKey] = {};
        var sampleKey = file.sampleId || file.sampleLabel;
        if (!byMode[file.modeKey][sampleKey]) {
          byMode[file.modeKey][sampleKey] = { sampleLabel: file.sampleLabel, files: [] };
        }
        byMode[file.modeKey][sampleKey].files.push(file);
      });
      return modeOrder.filter(function (k) { return byMode[k]; }).map(function (modeKey) {
        var sampleMap = byMode[modeKey];
        var samples = Object.keys(sampleMap).map(function (k) { return sampleMap[k]; });
        var totalFiles = samples.reduce(function (n, s) { return n + s.files.length; }, 0);
        return {
          modeKey: modeKey,
          modeLabel: RecordExport.modeLabel(modeKey),
          dim: RecordExport.modeByKey(modeKey).dim,
          samples: samples,
          totalFiles: totalFiles
        };
      });
    }

    function renderExportPreview() {
      exportPreviewFiles = RecordExport.buildRecordFilePreview(
        entrustCode,
        pageData.samples,
        DEMO_RECORD_RULES,
        RECORD_TEMPLATE_INDEX
      );

      var groups = groupExportFiles(exportPreviewFiles);
      var html = '';

      if (!groups.length) {
        html = '<div class="py-10 text-center text-slate-400">暂无可预览的导出文件</div>';
      } else {
        groups.forEach(function (group) {
          var modeId = 'exportMode-' + group.modeKey;
          var showSpecimen = group.dim === 'specimen';
          html += '<div class="export-mode-group export-collapse" id="' + modeId + '">';
          html += '<div class="export-collapse-head" onclick="toggleExportCollapse(\'' + modeId + '\')">';
          html += '<i class="fa fa-chevron-down chev"></i>';
          html += '<span>' + group.modeLabel + '</span>';
          html += '<span class="export-mode-count">' + group.samples.length + ' 个样品 · ' + group.totalFiles + ' 个文件</span>';
          html += '</div>';
          html += '<div class="export-collapse-body">';

          group.samples.forEach(function (sampleBlock) {
            html += '<div class="export-sample-block">';
            html += '<div class="export-sample-head">' + sampleBlock.sampleLabel + '</div>';
            html += '<div class="overflow-x-auto"><table class="export-table min-w-full"><thead><tr>';
            html += '<th class="col-check"></th>';
            html += '<th class="col-filename">文件名（预览）</th>';
            if (showSpecimen) html += '<th class="col-specimen">试样编号</th>';
            html += '<th>包含试验项</th><th class="col-status">状态</th><th class="col-op">操作</th>';
            html += '</tr></thead><tbody>';
            sampleBlock.files.forEach(function (file) {
              html += renderExportFileRow(file, file._idx, showSpecimen);
            });
            html += '</tbody></table></div></div>';
          });

          html += '</div></div>';
        });
      }

      document.getElementById('exportPreviewGroups').innerHTML = html;

      var readyFiles = exportPreviewFiles.filter(function (f) { return f.status === 'ready'; });
      var checkAll = document.getElementById('exportCheckAll');
      checkAll.checked = readyFiles.length > 0 && readyFiles.every(function (f) { return f.checked; });
      checkAll.disabled = !readyFiles.length;

      syncExportSummary();
    }

    function toggleExportCollapse(id) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('collapsed');
    }

    function syncExportSummary() {
      var warn = document.getElementById('exportSummaryWarn');
      if (!exportPreviewFiles.length) {
        warn.classList.remove('show');
        warn.textContent = '';
        return;
      }
      var blocked = exportPreviewFiles.filter(function (f) { return f.status !== 'ready'; });
      if (!blocked.length) {
        warn.classList.remove('show');
        warn.textContent = '';
        return;
      }
      warn.textContent = '共 ' + blocked.length + ' 个文件暂不可导出：' +
        blocked.map(function (f) { return f.fileName + '（' + exportStatusLabel(f.status) + '）'; }).join('；');
      warn.classList.add('show');
    }

    function onExportRowCheck(idx, checked) {
      if (!exportPreviewFiles[idx] || exportPreviewFiles[idx].status !== 'ready') return;
      exportPreviewFiles[idx].checked = checked;
      var readyFiles = exportPreviewFiles.filter(function (f) { return f.status === 'ready'; });
      document.getElementById('exportCheckAll').checked = readyFiles.length > 0 && readyFiles.every(function (f) { return f.checked; });
    }

    function toggleExportCheckAll(checked) {
      exportPreviewFiles.forEach(function (file, i) {
        if (file.status !== 'ready') return;
        file.checked = checked;
        var el = document.querySelector('.export-row-check[data-idx="' + i + '"]');
        if (el && !el.disabled) el.checked = checked;
      });
    }

    function exportPreviewRow(idx) {
      var file = exportPreviewFiles[idx];
      if (!file || file.status !== 'ready') return;
      var tests = file.tests.map(function (t) { return t.name; }).join('、');
      alert('导出记录单（原型演示）\n文件：' + file.fileName +
        '\n生成模式：' + RecordExport.modeLabel(file.modeKey) +
        '\n包含试验项：' + tests);
    }

    function batchExportRecords() {
      var selected = exportPreviewFiles.filter(function (f) {
        return f.status === 'ready' && f.checked;
      });
      if (!selected.length) {
        var anyReady = exportPreviewFiles.some(function (f) { return f.status === 'ready'; });
        alert(anyReady ? '请至少勾选一条可导出的文件' : '当前没有可导出的文件，请完成试验或配置模版后再试');
        return;
      }
      alert('批量导出（原型演示）\n共 ' + selected.length + ' 个文件：\n' +
        selected.map(function (f) { return f.fileName; }).join('\n'));
    }

    function openExportDrawer() {
      renderExportPreview();
      document.getElementById('exportDrawerMask').classList.add('open');
    }

    function closeExportDrawer() {
      document.getElementById('exportDrawerMask').classList.remove('open');
    }

    document.getElementById('exportDrawerMask').addEventListener('click', function (e) {
      if (e.target === this) closeExportDrawer();
    });

    renderTabs();
    renderPanels();
  </script>
