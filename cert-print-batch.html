<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批量合格证打印 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .cert-sheet { width: 420px; min-height: 220px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(15,23,42,.06); margin-bottom: 16px; }
    .cert-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; border-bottom: 1px solid #f1f5f9; }
    .cert-body { display: flex; padding: 12px 16px 16px; gap: 12px; }
    .cert-fields { flex: 1; font-size: 13px; line-height: 1.85; color: #334155; }
    .cert-fields dt { display: inline; color: #64748b; }
    .cert-fields dd { display: inline; margin: 0; }
    @media print {
      .no-print { display: none !important; }
      .cert-preview-area { background: #fff !important; padding: 0 !important; width: 100% !important; }
      .cert-sheet { box-shadow: none; border: none; page-break-after: always; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700 h-screen flex flex-col overflow-hidden" data-col-config="off" data-cat-col="off">

  <div class="no-print flex h-full">
    <!-- 左侧预览 -->
    <div class="cert-preview-area flex w-[400px] flex-shrink-0 flex-col border-r border-slate-200 bg-slate-50">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 bg-white px-4 py-2.5">
        <a id="backLink" href="label-print.html" class="text-sm text-blue-600 hover:underline"><i class="fa fa-arrow-left"></i> 返回</a>
        <div class="flex flex-wrap items-center gap-2">
          <div data-annotate="shortlink-base" class="flex items-center gap-1.5 rounded border border-slate-200 bg-slate-50 px-2 py-1">
            <label for="shortlinkBaseMode" class="whitespace-nowrap text-xs text-slate-500">短链 Base</label>
            <select id="shortlinkBaseMode" class="rounded border border-slate-300 bg-white px-1.5 py-0.5 text-xs text-slate-700 outline-none focus:border-blue-500" onchange="onShortlinkBaseChange()">
              <option value="public">对外（公网）</option>
              <option value="internal">对内（内网）</option>
            </select>
          </div>
          <button onclick="clearPreview()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">清空待打印区域</button>
          <button onclick="window.print()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">打印</button>
        </div>
      </div>
      <p id="shortlinkBaseHint" class="no-print border-b border-slate-100 bg-white px-4 py-1 text-[11px] text-slate-400 truncate"></p>
      <div id="previewContainer" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- 右侧列表 -->
    <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
      <div class="border-b border-slate-200 bg-white px-4 py-3">
        <div class="flex flex-nowrap items-center gap-3">
          <div class="flex min-w-0 flex-1 items-center gap-2">
            <label class="shrink-0 text-sm text-slate-600">样品编号</label>
            <input id="s_no" type="text" placeholder="请输入样品编号" class="w-full min-w-0 max-w-[160px] rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <div class="flex min-w-0 flex-1 items-center gap-2">
            <label class="shrink-0 text-sm text-slate-600">样品名称</label>
            <input id="s_name" type="text" placeholder="请输入样品名称" class="w-full min-w-0 max-w-[160px] rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <div class="ml-auto flex shrink-0 items-center gap-2">
            <button onclick="filterSamples()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">查询</button>
            <button onclick="resetFilter()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
          </div>
        </div>
      </div>
      <div class="flex-1 overflow-auto p-4">
        <table class="w-full border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-2 py-2 font-medium w-10"><input type="checkbox" id="sampleCheckAll" onchange="toggleSampleAll(this.checked)" checked /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[52px]">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[150px]">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[104px]" data-annotate="unified-samples">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[92px]">规格</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[92px]">型号规格</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[100px]">检验日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[100px]">再检日期</th>
              <th id="thInspector" class="border border-slate-200 px-3 py-2 font-medium">检测员</th>
              <th id="thRecorder" class="border border-slate-200 px-3 py-2 font-medium hidden">记录员</th>
            </tr>
          </thead>
          <tbody id="sampleBody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-200 bg-white px-4 py-2 text-sm text-slate-500">
        <span id="sampleTotal">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button id="page1" class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button id="page2" class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10条/页</option></select>
      </div>
    </div>
  </div>

  <script src="js/short-link-qr.js"></script>
  <script src="js/personnel-store.js"></script>
  <script src="js/inspector-select.js"></script>
  <script src="js/flow-stages.js"></script>
  <script src="js/entrust-mock.js"></script>
  <script src="js/receive-store.js"></script>
  <script src="js/receive-history-mock.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script src="js/label-cert-samples.js"></script>
  <script src="js/label-cert-render.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    LabelCertRender.ensureStyles();
    var SHORTLINK_BASE_KEY = 'lims.shortlink.baseMode';
    var params = new URLSearchParams(location.search);
    var MAX_INSPECTORS = LabelCertConfig.getInspectorMax();
    var MAX_RECORDERS = LabelCertConfig.getRecorderMax();
    var entrustCodes = (params.get('codes') || 'SC2026/0073,SC2026/0072').split(',').filter(Boolean);
    var sampleNos = (params.get('nos') || '').split(',').filter(Boolean);
    var inspParam = params.get('inspectors');
    var defaultInspectors = PersonnelStore.pickRosterNames(
      inspParam === null ? [] : inspParam.split(',').filter(Boolean),
      MAX_INSPECTORS
    );
    var defaultRecorders = (params.get('recorders') || '').split(',').filter(Boolean).slice(0, MAX_RECORDERS);
    if (params.get('from') === 'qualified') document.getElementById('backLink').href = 'cert-qualified-print.html';

    function syncShortlinkBaseHint() {
      var mode = ShortLinkQR.getBaseMode();
      var hint = document.getElementById('shortlinkBaseHint');
      var sel = document.getElementById('shortlinkBaseMode');
      if (sel) sel.value = mode;
      if (hint) {
        hint.textContent = (mode === 'internal' ? '对内打印 · QR 写入 ' : '对外发放 · QR 写入 ') + ShortLinkQR.getBase() + '{code}（code 内外共用）';
      }
    }

    function onShortlinkBaseChange() {
      var mode = document.getElementById('shortlinkBaseMode').value;
      ShortLinkQR.setBaseMode(mode);
      try { sessionStorage.setItem(SHORTLINK_BASE_KEY, mode); } catch (e) {}
      syncShortlinkBaseHint();
      renderPreview();
      if (window.PrototypeAnnotation) PrototypeAnnotation.refresh();
    }

    (function initShortlinkBase() {
      var saved = '';
      try { saved = sessionStorage.getItem(SHORTLINK_BASE_KEY) || ''; } catch (e) {}
      ShortLinkQR.setBaseMode(saved === 'internal' ? 'internal' : 'public');
      syncShortlinkBaseHint();
    })();

    var SAMPLE_BY_NO = {
      'SC2026/00790101': { sampleNo: 'SC2026/00790101', name: '绝缘操作杆', model: '10kV', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', masterId: 'rod', cat: 'aqgqj' },
      'SC2026/00790201': { sampleNo: 'SC2026/00790201', name: '验电器', model: '35kV', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', masterId: 'electroscope', cat: 'aqgqj' },
      'SC2026/00730101': { sampleNo: 'SC2026/00730101', name: '安全带', model: '', inspectDate: '2026-06-10', reinspectDate: '2027-06-09', masterId: 'belt976', cat: 'aqgqj' },
      'SC2026/00720501': { sampleNo: 'SC2026/00720501', name: '安全绳', model: '', inspectDate: '2026-06-09', reinspectDate: '2027-06-08', masterId: 'rope1476', cat: 'aqgqj' },
      'SC2026/00710101': { sampleNo: 'SC2026/00710101', name: '绝缘操作杆', model: '20kV', inspectDate: '2026-06-08', reinspectDate: '2027-06-07', masterId: 'rod', cat: 'aqgqj' },
      'SC2026/00700101': { sampleNo: 'SC2026/00700101', name: '安全帽', model: '', inspectDate: '2026-06-07', reinspectDate: '2027-06-06', masterId: 'helmet', cat: 'aqgqj' }
    };

    var SAMPLE_CATALOG = {
      // 0079：个性化不粘胶纸 + 默认左文右码（验电器未绑个性化）
      'SC2026/0079': [SAMPLE_BY_NO['SC2026/00790101'], SAMPLE_BY_NO['SC2026/00790201']],
      'SC2026/0073': [SAMPLE_BY_NO['SC2026/00730101']],
      'SC2026/0072': [{ sampleNo: 'SC2026/00730201', name: '验电器', model: '10kV', inspectDate: '2026-06-10', reinspectDate: '2027-06-09', masterId: 'electroscope', cat: 'aqgqj' }],
      'SC2026/0071': [SAMPLE_BY_NO['SC2026/00710101']],
      'SC2026/0070': [SAMPLE_BY_NO['SC2026/00700101']],
      'SC2026/0074': [{ sampleNo: 'SC2026/00740101', name: '绝缘毯', model: '', inspectDate: '2026-06-11', reinspectDate: '2027-06-10', masterId: 'blanket', cat: 'aqgqj' }]
    };

    var EXTRA = [
      { sampleNo: 'SC2026/00730501', name: '验电器', model: '10kV', inspectDate: '2026-06-08', reinspectDate: '2027-06-07', masterId: 'electroscope', cat: 'aqgqj' },
      { sampleNo: 'SC2026/00730901', name: '安全带', model: '', inspectDate: '2026-06-06', reinspectDate: '2027-06-05', masterId: 'belt976', cat: 'aqgqj' }
    ];

    var allSamples = [];
    function pushSample(s) {
      allSamples.push({
        sampleNo: s.sampleNo, name: s.name, spec: s.spec || '', model: s.model || '',
        inspectDate: s.inspectDate, reinspectDate: s.reinspectDate,
        inspectors: defaultInspectors.slice(),
        recorders: defaultRecorders.slice(),
        masterId: s.masterId || LabelCertConfig.masterIdFromName(s.name),
        cat: s.cat || 'aqgqj', _checked: true
      });
    }

    function rolesForItem(item) {
      var tpl = LabelCertConfig.resolveTemplate(item.cat || 'aqgqj', 'certificate', item.masterId || null);
      return LabelCertConfig.personnelRolesNeeded((tpl && tpl.elements) || []);
    }

    function pageRolesUnion(list) {
      var needI = false, needR = false;
      (list || []).forEach(function (s) {
        var r = rolesForItem(s);
        if (r.needInspectors) needI = true;
        if (r.needRecorders) needR = true;
      });
      return { needInspectors: needI, needRecorders: needR };
    }

    /* 样品清单统一取 js/entrust-mock.js（与「样品标签」「合格证单张」同一份），
     * 被删除的样品不进打印清单；共享数据缺失时才退回本页写死的样品表 */
    var unified = window.LabelCertSamples
      ? (sampleNos.length ? LabelCertSamples.byNos(sampleNos) : LabelCertSamples.ofCodes(entrustCodes))
      : null;
    if (unified && unified.length) {
      unified.forEach(pushSample);
    } else if (sampleNos.length) {
      sampleNos.forEach(function (no) {
        var s = SAMPLE_BY_NO[no.trim()];
        if (s) pushSample(s);
        else pushSample({ sampleNo: no.trim(), name: '绝缘操作杆', model: '', inspectDate: '2026-07-01', reinspectDate: '2027-07-01', masterId: 'rod', cat: 'aqgqj' });
      });
    } else {
      entrustCodes.forEach(function (code) {
        var list = SAMPLE_CATALOG[code.trim()];
        if (list) list.forEach(pushSample);
      });
      if (!allSamples.length) EXTRA.forEach(pushSample);
    }

    var samples = allSamples.slice();
    var currentPage = 1;
    var pageSize = 10;
    var INSPECTOR_OPTIONS = PersonnelStore.rosterNames();
    var RECORDER_OPTIONS = ['admin', 'cs222', 'cs3', '张三', '李四'];

    function buildCertHtml(item, idx) {
      var tpl = LabelCertConfig.resolveTemplate(item.cat || 'aqgqj', 'certificate', item.masterId);
      if (!tpl) return '<div class="mb-3 rounded border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-700">未配置模版：' + item.sampleNo + '</div>';
      tpl = LabelCertConfig.clone(tpl);
      var html = LabelCertRender.renderSheet(tpl, item, { suffix: '-b' + idx });
      if (idx === 0) html = html.replace('class="lc-qr"', 'class="lc-qr" data-annotate="qr-area"');
      return '<div class="mb-4">' + html + '</div>';
    }

    function renderPreview() {
      var container = document.getElementById('previewContainer');
      var selected = samples.filter(function (s) { return s._checked; });
      if (!selected.length) {
        container.innerHTML = '<p class="text-center text-sm text-slate-400 py-12">暂无待打印合格证</p>';
        return;
      }
      container.innerHTML = selected.map(function (item, i) { return buildCertHtml(item, i); }).join('');
      LabelCertRender.mountQrs(container);
    }

    function inspectorCell(item, globalIdx) {
      return InspectorSelect.renderHTML({
        inspectors: item.inspectors,
        options: INSPECTOR_OPTIONS,
        mode: 'cell',
        idx: globalIdx,
        prefix: 'insp',
        maxCount: MAX_INSPECTORS
      });
    }

    function recorderCell(item, globalIdx) {
      return InspectorSelect.renderHTML({
        inspectors: item.recorders || [],
        options: RECORDER_OPTIONS,
        mode: 'cell',
        idx: globalIdx,
        prefix: 'rec',
        maxCount: MAX_RECORDERS
      });
    }

    function getPageData() {
      var start = (currentPage - 1) * pageSize;
      return { slice: samples.slice(start, start + pageSize), start: start };
    }

    function renderSampleTable() {
      var pg = getPageData();
      var union = pageRolesUnion(samples);
      document.getElementById('thInspector').classList.toggle('hidden', !union.needInspectors);
      document.getElementById('thRecorder').classList.toggle('hidden', !union.needRecorders);
      document.getElementById('sampleBody').innerHTML = pg.slice.map(function (item, i) {
        var gIdx = pg.start + i;
        var roles = rolesForItem(item);
        var inspTd = union.needInspectors
          ? '<td class="border border-slate-200 px-3 py-2 min-w-[140px]"' + (gIdx === 0 ? ' data-annotate-inspector="1"' : '') + '>' +
              (roles.needInspectors ? inspectorCell(item, gIdx) : '<span class="text-xs text-slate-300">—</span>') +
            '</td>'
          : '';
        var recTd = union.needRecorders
          ? '<td class="border border-slate-200 px-3 py-2 min-w-[140px]">' +
              (roles.needRecorders ? recorderCell(item, gIdx) : '<span class="text-xs text-slate-300">—</span>') +
            '</td>'
          : '';
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2"><input type="checkbox" class="sample-check" ' + (item._checked ? 'checked' : '') + ' onchange="onSampleCheck(' + gIdx + ', this.checked)" /></td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (gIdx + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.sampleNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (item.spec || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (item.model || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.inspectDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.reinspectDate + '</td>' +
          inspTd + recTd + '</tr>';
      }).join('');
      document.getElementById('sampleTotal').textContent = '共 ' + samples.length + ' 条';
      renderPreview();
    }

    function onSampleCheck(idx, checked) {
      samples[idx]._checked = checked;
      renderPreview();
    }

    function toggleSampleAll(checked) {
      samples.forEach(function (s) { s._checked = checked; });
      renderSampleTable();
    }

    function onPersonnelAdd(idx, name, prefix) {
      if (idx == null || !samples[idx] || !name) return;
      if (prefix === 'rec') {
        if (!samples[idx].recorders) samples[idx].recorders = [];
        if (samples[idx].recorders.indexOf(name) !== -1) return;
        if (samples[idx].recorders.length >= MAX_RECORDERS) {
          alert('最多只能选择 ' + MAX_RECORDERS + ' 名记录员');
          return;
        }
        samples[idx].recorders.push(name);
      } else {
        if (samples[idx].inspectors.indexOf(name) !== -1) return;
        if (samples[idx].inspectors.length >= MAX_INSPECTORS) {
          alert('最多只能选择 ' + MAX_INSPECTORS + ' 名检测员');
          return;
        }
        samples[idx].inspectors.push(name);
      }
      renderSampleTable();
    }

    function onPersonnelRemove(idx, name, prefix) {
      if (idx == null || !samples[idx]) return;
      if (prefix === 'rec') {
        samples[idx].recorders = (samples[idx].recorders || []).filter(function (n) { return n !== name; });
      } else {
        samples[idx].inspectors = samples[idx].inspectors.filter(function (n) { return n !== name; });
      }
      renderSampleTable();
    }

    InspectorSelect.bind(document.getElementById('sampleBody'), {
      onAdd: onPersonnelAdd,
      onRemove: onPersonnelRemove
    });

    function filterSamples() {
      var no = document.getElementById('s_no').value.trim();
      var name = document.getElementById('s_name').value.trim();
      samples = allSamples.filter(function (s) {
        if (no && s.sampleNo.indexOf(no) === -1) return false;
        if (name && s.name.indexOf(name) === -1) return false;
        return true;
      });
      currentPage = 1;
      renderSampleTable();
    }

    function resetFilter() {
      document.getElementById('s_no').value = '';
      document.getElementById('s_name').value = '';
      samples = allSamples.slice();
      currentPage = 1;
      renderSampleTable();
    }

    function clearPreview() {
      samples.forEach(function (s) { s._checked = false; });
      renderSampleTable();
    }

    document.getElementById('page1').addEventListener('click', function () { currentPage = 1; renderSampleTable(); });
    document.getElementById('page2').addEventListener('click', function () { currentPage = 2; renderSampleTable(); });

    renderSampleTable();

    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'unified-samples',
          selector: '[data-annotate="unified-samples"]',
          position: 'top-right',
          title: '样品标签与合格证共用同一份样品清单',
          wide: true,
          content: '<strong>需求逻辑：</strong>同一张委托，点「样品标签」和点「合格证」必须看到同一批样品。' +
            '以前样品标签预览、合格证单张、合格证批量、合格打印四个页面各写了一份样品表，' +
            'SC2026/0073 一边显示安全带、一边显示验电器，而委托详情里其实是绝缘操作杆。<br>' +
            '<strong>展示规则：</strong>委托下有哪些样品一律取 <code>js/entrust-mock.js</code>' +
            '（与委托详情 / 样品收样 / 变更记录同源），样品编号 = 委托号 + 两位组号 + 试样号（如 SC2026/00730101）；' +
            '被删除的样品（变更删除、退回登记后删除）不进打印清单，但它占用的组号不回收——' +
            'SC2026/0029 的 03 号位留给被删的绝缘硬梯，变更新增的验电器排在 00290401；' +
            '收样日期与检测日期取委托收样日期，复检日期 = 检测日期 + 1 年 - 1 天；' +
            '检测状态按流程阶段推导（发样前未检测 / 检测环节在检 / 报告编制及之后已检测）。<br>' +
            '<strong>交互逻辑：</strong>标签上的二维码扫码后（<code>label-scan.html</code>）按样品编号回查同一份数据，' +
            '打印出来的样品与扫码看到的完全一致；判定不合格按委托号配置（演示单 SC2026/0074），' +
            '不合格与报告签发之前的委托照旧不出现合格证入口。',
          tag: '标签与合格证'
        },
        {
          id: 'batch-flow',
          selector: '#previewContainer',
          position: 'top-left',
          title: '批量打印预览',
