<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合格证短链 · 公网访问示例 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-lg p-4 pt-8">
    <div class="rounded-lg bg-white shadow-lg overflow-hidden">
      <div class="bg-blue-600 px-6 py-4 text-center text-white">
        <i class="fa fa-link text-2xl mb-2"></i>
        <h1 class="text-lg font-semibold">合格证短链 · 公网访问示例</h1>
        <p class="text-xs text-blue-100 mt-1">lims-with-bzk-plan.vercel.app · 扫码 / 点击即可验真</p>
      </div>
      <div class="px-6 py-5 space-y-4 text-sm">
        <p class="text-slate-600 leading-relaxed">
          本页为原型公网部署示例。短链格式为
          <code class="rounded bg-slate-100 px-1.5 py-0.5 text-xs">https://lims-with-bzk-plan.vercel.app/l/{code}</code>，
          访问后跳转至验真 H5。
        </p>
        <div class="rounded-lg border border-slate-200 divide-y divide-slate-100">
          <a class="flex items-center justify-between px-4 py-3 hover:bg-slate-50" href="/l/Ab3K9">
            <span><span class="font-mono text-blue-600">Ab3K9</span> · 有效</span>
            <i class="fa fa-external-link text-slate-400"></i>
          </a>
          <a class="flex items-center justify-between px-4 py-3 hover:bg-slate-50" href="/l/Ex1p1">
            <span><span class="font-mono text-blue-600">Ex1p1</span> · 过期</span>
            <i class="fa fa-external-link text-slate-400"></i>
          </a>
          <a class="flex items-center justify-between px-4 py-3 hover:bg-slate-50" href="/l/Rv0k1">
            <span><span class="font-mono text-blue-600">Rv0k1</span> · 回退作废</span>
            <i class="fa fa-external-link text-slate-400"></i>
          </a>
          <a class="flex items-center justify-between px-4 py-3 hover:bg-slate-50" href="/l/XXXXX">
            <span><span class="font-mono text-blue-600">XXXXX</span> · 不存在</span>
            <i class="fa fa-external-link text-slate-400"></i>
          </a>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          示例短链：
          <a class="text-blue-600 underline" href="https://lims-with-bzk-plan.vercel.app/l/Ab3K9">https://lims-with-bzk-plan.vercel.app/l/Ab3K9</a>
        </p>
      </div>
    </div>
  </div>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
