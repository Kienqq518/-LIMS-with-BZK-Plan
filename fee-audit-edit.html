<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>费用审核编辑 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    .fee-table { width:100%; border-collapse:collapse; font-size:13px; }
    .fee-table th,.fee-table td { border:1px solid #cbd5e1; padding:8px 10px; text-align:center; vertical-align:middle; }
    .fee-table th { background:#f1f5f9; color:#64748b; font-weight:500; }
    .fee-table .sub-head { background:#f8fafc; font-size:12px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700 pb-20">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="fee-audit.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="entrust-confirm.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">委托确认</a>
    <a href="fee-audit.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">费用审核</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">费用审核编辑<i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i></span>
  </div>
  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm overflow-x-auto">
      <h2 class="mb-4 text-center text-base font-semibold text-slate-800">费用审核</h2>
      <table class="fee-table min-w-[900px] mb-4">
        <tr><td class="bg-slate-50 text-left">委托编号</td><td class="text-left">SC2026/0059</td><td class="bg-slate-50 text-left">客户单位</td><td colspan="5" class="text-left">杭州数蚕智能科技有限公司</td></tr>
      </table>
      <table class="fee-table min-w-[900px]">
        <thead>
          <tr><th rowspan="2">编号</th><th rowspan="2">样品名称</th><th rowspan="2">型号</th><th rowspan="2">样品数量</th><th colspan="4">检测信息</th></tr>
          <tr class="sub-head"><th>名称</th><th>试样数量</th><th>收费(元)</th><th>备注</th></tr>
        </thead>
        <tbody>
          <tr><td rowspan="4">1</td><td rowspan="4">绝缘操作杆</td><td rowspan="4"></td><td rowspan="4">1</td><td>弯曲静载荷试验</td><td>1</td><td>40</td><td></td></tr>
          <tr><td>弯曲动载荷试验</td><td>1</td><td>40</td><td></td></tr>
          <tr><td>外观及尺寸</td><td>1</td><td>40</td><td></td></tr>
          <tr><td>交流耐压试验</td><td>1</td><td>40</td><td></td></tr>
          <tr><td rowspan="4">2</td><td rowspan="4">验电器</td><td rowspan="4"></td><td rowspan="4">1</td><td>启动电压试验</td><td>1</td><td>1</td><td></td></tr>
          <tr><td>工频耐压试验</td><td>1</td><td>1</td><td></td></tr>
          <tr><td>交流耐压试验</td><td>1</td><td>1</td><td></td></tr>
          <tr><td>外观及尺寸</td><td>1</td><td>0</td><td></td></tr>
        </tbody>
        <tfoot>
          <tr class="bg-slate-50 text-left"><td colspan="2">样品检测总价</td><td colspan="2">163</td><td colspan="2">实际费用</td><td colspan="2">160</td></tr>
          <tr class="bg-slate-50 text-left"><td colspan="2">折扣率</td><td colspan="2">98.16%</td><td colspan="2">委托受理日期</td><td colspan="2">2026-06-01</td></tr>
          <tr class="bg-slate-50 text-left"><td colspan="2">编制人</td><td colspan="6">admin</td></tr>
        </tfoot>
      </table>
    </div>
  </div>
  <div class="fixed bottom-0 left-0 right-0 z-30 flex items-center justify-center gap-3 border-t border-slate-200 bg-white px-6 py-3 shadow-lg">
    <button class="rounded border border-slate-300 px-8 py-2 text-sm text-slate-600 hover:bg-slate-50">审核不通过</button>
    <button class="rounded bg-blue-600 px-8 py-2 text-sm text-white hover:bg-blue-700">审核通过</button>
  </div>
  <script src="js/tab-bar.js"></script>
</body>
</html>
