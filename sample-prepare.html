<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品制备 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .modal-form-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
    .modal-form-item label { flex-shrink: 0; width: 72px; padding-top: 7px; text-align: right; font-size: 13px; color: #64748b; }
    .modal-form-item label .req { color: #ef4444; }
    .modal-form-item input, .modal-form-item select, .modal-form-item textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; }
    .modal-form-item input:focus, .modal-form-item select:focus, .modal-form-item textarea:focus { border-color: #3b82f6; }
    .modal-form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 14px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="sample-receive.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">样品收样</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      样品制备
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="mb-3 rounded border border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-800" data-annotate="prepare-hint">
      <i class="fa fa-info-circle"></i> 仅展示样品数据基本信息「是否制样=是」的样品；「否」则跳过本环节，不生成流转单制备行。
    </div>

    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:justify-end">
          <button class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1200px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">是否制备</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">任务进度</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span>共 3 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
      </div>
    </div>
  </div>

  <!-- 制样弹窗 -->
  <div id="prepareModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[90vh] w-[720px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 id="prepareModalTitle" class="text-base font-medium text-slate-800">SC2026/0167-制样</h3>
        <button onclick="closePrepareModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <!-- 样品明细表 -->
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left text-sm">
            <thead>
              <tr class="bg-slate-50 text-slate-600">
                <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
                <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
                <th class="border border-slate-200 px-3 py-2 font-medium">型号规格</th>
                <th class="border border-slate-200 px-3 py-2 font-medium">数量</th>
                <th class="border border-slate-200 px-3 py-2 font-medium">是否制样</th>
              </tr>
            </thead>
            <tbody id="modalSampleBody"></tbody>
          </table>
        </div>

        <!-- 制样表单 -->
        <div class="mt-5">
          <div class="modal-form-row2">
            <div class="modal-form-item">
              <label><span class="req">*</span> 制备员</label>
              <select id="p_operator" onchange="updatePreparePreview()"><option value="">请选择制备员</option></select>
            </div>
            <div class="modal-form-item">
              <label><span class="req">*</span> 制备日期</label>
              <div class="relative flex-1">
                <input id="p_date" type="text" placeholder="请选择制备日期" oninput="updatePreparePreview()" />
                <i class="fa fa-calendar-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              </div>
            </div>
          </div>
          <div class="modal-form-item">
            <label>备注</label>
            <textarea id="p_remark" rows="3" placeholder="请输入备注"></textarea>
          </div>
        </div>

        <div class="rounded border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-800" data-annotate="prepare-writeback">
          <div class="mb-1 font-medium"><i class="fa fa-magic"></i> 将自动回填「检测任务及流转单」制备节点：</div>
          <ul class="ml-5 list-disc space-y-0.5 text-xs leading-relaxed">
            <li>检测流程 = <span id="pv_flow" class="font-medium">—</span></li>
            <li>样品交接人签名/日期 = <span id="pv_sign" class="font-medium">制备员电子签名 / —</span></li>
            <li>样品数量 = <span id="pv_qty" class="font-medium">—</span>（取上表数量汇总）</li>
          </ul>
        </div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closePrepareModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="confirmPrepare()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700" data-annotate="prepare-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/entrust-mock.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/current-user.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var CURRENT_USER = window.LimsCurrentUser || { name: 'admin', dept: '样品库' };
    var OPERATORS = [
      { name: '张三', dept: '样品库' },
      { name: 'admin', dept: '样品库' },
      { name: '王样品', dept: '样品库' },
      { name: '潘哲宁', dept: '样品库' }
    ];

    var listData = [
      {
        code: 'SC2026/0167', contract: 'SC2026/0167', customer: '杭州数蚕智能科技有限公司', sample: '电缆导管', needPrepare: '是', progress: '样品制备', editor: 'admin',
        samples: [
          { name: '8.7/10kV·3芯', category: '8.7/10kV·3芯', qty: 2, needPrepare: '是' },
          { name: '实壁类塑料电缆导管_直管', category: '实壁类塑料电缆导管_直管', qty: 1, needPrepare: '是' }
        ]
      },
      {
        code: 'SC2026/0037', contract: 'SC2026/0037', customer: '杭州数蚕智能科技有限公司', sample: '绝缘操作杆', needPrepare: '是', progress: '样品制备', editor: 'admin',
        samples: [{ name: '绝缘操作杆', category: '/', qty: 2, needPrepare: '是' }]
      },
      {
        code: 'SC2026/0042', contract: '/', customer: '东集西造有限公司', sample: '安全带', needPrepare: '是', progress: '样品制备', editor: 'admin',
        samples: [{ name: '安全带', category: '/', qty: 1, needPrepare: '是' }]
      }
    ];

    // 公共字段（委托单位 / 样品 / 日期 / 编制人 / 业务员 / 任务类型…）统一取自 js/entrust-mock.js，
    // 保证「列表看到的」与「点进详情页看到的」是同一份数据
    EntrustMock.enrich(listData, { samples: null });

    var currentIndex = -1;

    function sumQty(samples) {
      return samples.reduce(function (n, s) { return n + (+s.qty || 0); }, 0);
    }

    function renderTable() {
      document.getElementById('tableBody').innerHTML = listData.map(function (item, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="entrust-detail.html?code=' + encodeURIComponent(item.code) + '" class="text-blue-600 hover:underline">' + item.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">' + item.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><span class="rounded bg-green-100 px-2 py-0.5 text-xs text-green-700">' + item.needPrepare + '</span></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.progress + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.editor + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' +
            '<button onclick="openPrepareModal(' + i + ')" class="text-blue-600 hover:underline" data-annotate="prepare-btn"><i class="fa fa-edit"></i> 编辑</button>' +
          '</td></tr>';
      }).join('');
    }

    function showModal(id) { var m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
    function hideModal(id) { var m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

    function openPrepareModal(index) {
      currentIndex = index;
      var item = listData[index];
      document.getElementById('prepareModalTitle').textContent = item.code + '-制样';
      document.getElementById('modalSampleBody').innerHTML = item.samples.map(function (s, i) {
        return '<tr><td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + s.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + s.category + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + s.qty + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + s.needPrepare + '</td></tr>';
      }).join('');
      document.getElementById('p_operator').innerHTML = '<option value="">请选择制备员</option>' +
        OPERATORS.map(function (o) {
          return '<option value="' + o.name + '"' + (o.name === CURRENT_USER.name ? ' selected' : '') + '>' + o.name + '（' + o.dept + '）</option>';
        }).join('');
      document.getElementById('p_date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('p_remark').value = '';
      updatePreparePreview();
      showModal('prepareModal');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closePrepareModal() { hideModal('prepareModal'); }

    function updatePreparePreview() {
      var name = document.getElementById('p_operator').value;
      var o = OPERATORS.find(function (x) { return x.name === name; });
      var item = listData[currentIndex];
      var totalQty = item ? sumQty(item.samples) : 0;
      document.getElementById('pv_flow').textContent = o ? (o.dept + ' 样品制备') : '—';
      document.getElementById('pv_sign').textContent = o ? ('制备员电子签名 / ' + (document.getElementById('p_date').value || '—')) : '—';
      document.getElementById('pv_qty').textContent = item ? String(totalQty) : '—';
    }

    function confirmPrepare() {
      var name = document.getElementById('p_operator').value;
      var date = document.getElementById('p_date').value.trim();
      if (!name) { alert('请选择制备员'); return; }
      if (!date) { alert('请选择制备日期'); return; }
      var o = OPERATORS.find(function (x) { return x.name === name; });
      var qty = sumQty(listData[currentIndex].samples);
      alert('制样记录已保存。\n检测任务及流转单已追加「' + o.dept + ' 样品制备」节点，样品数量=' + qty + '（原型演示）。');
      closePrepareModal();
    }

    document.getElementById('prepareModal').addEventListener('click', function (e) { if (e.target === this) closePrepareModal(); });
    renderTable();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({
        annotations: [
          { id: 'prepare-hint', selector: '[data-annotate="prepare-hint"]', position: 'bottom-left', title: '是否制样', wide: true, content: '<strong>需求逻辑：</strong>制样是可选环节：只有需要制备试样的样品才走本环节，避免所有委托都被卡一次。<br>' +
            '<strong>展示规则：</strong>以「样品数据 › 基本信息」的「是否制样」为准；选「是」则在试样分发前进入本环节，选「否」跳过且流转单不生成制备行。<br>' +
            '<strong>交互逻辑：</strong>本页只处理需要制样的样品；是否制样的开关改动在样品数据页维护。', tag: '流转单' },
          { id: 'prepare-btn', selector: '[data-annotate="prepare-btn"]', position: 'top-right', title: '制样入口', content: '<strong>需求逻辑：</strong>制样信息（制备员、制备日期）在制样完成时录入，事后补记不可追溯。<br>' +
            '<strong>展示规则：</strong>行内「编辑」按钮打开制样弹窗。<br>' +
            '<strong>交互逻辑：</strong>填写制备员、制备日期等信息后点「确定」，触发流转单制备节点回填。', tag: '流转单' },
          { id: 'prepare-writeback', selector: '[data-annotate="prepare-writeback"]', position: 'top-right', title: '制备节点回填', wide: true, content: '<strong>需求逻辑：</strong>制备节点要在流转单留痕，且数量口径要与样品表一致。<br>' +
            '<strong>展示规则：</strong>检测流程 = 制备员部门 +「样品制备」；签名 / 日期 = 制备员电子签名 + 制备日期；样品数量 = 弹窗上方样品表「数量」列汇总（无需单独录入制备数量）。<br>' +
            '<strong>交互逻辑：</strong>回填时机 = 制样弹窗点击「确定」时；重复确定按次各生成一行。', tag: '流转单' },
          { id: 'prepare-confirm', selector: '[data-annotate="prepare-confirm"]', position: 'top-left', title: '确定制样', content: '<strong>需求逻辑：</strong>制样完成是交接点，需要二次确认避免误报完成。<br>' +
            '<strong>展示规则：</strong>弹窗底部「确定」按钮。<br>' +
            '<strong>交互逻辑：</strong>点击后写入制样记录并回填流转单，行状态变为已制备；「取消」不落数据。', tag: '流转单' }
        ]
      });
    }
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
