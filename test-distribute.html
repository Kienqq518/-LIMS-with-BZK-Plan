<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试样分发 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      试样分发
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">合同编号</label>
          <input type="text" placeholder="请输入合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-4 xl:justify-end">
          <button class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1400px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">任务进度</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500"><span>共 10 条</span></div>
    </div>
  </div>

  <!-- 分发弹窗 -->
  <div id="distributeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[520px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 id="distributeModalTitle" class="text-base font-medium text-slate-800">试样分发</h3>
        <button onclick="closeDistributeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5 space-y-4 text-sm">
        <div class="flex items-center gap-2">
          <label class="w-24 text-right text-slate-600"><span class="text-red-500">*</span> 检测员</label>
          <select id="d_tester" class="flex-1 rounded border border-slate-300 px-3 py-1.5 outline-none focus:border-blue-500">
            <option value="">请选择检测员</option>
            <option>潘哲宁（电气试验室）</option>
            <option>李四（力学试验室）</option>
            <option>王五（材料检测室）</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-24 text-right text-slate-600">试样名称</label>
          <input id="d_sample" type="text" readonly class="flex-1 rounded border border-slate-200 bg-slate-50 px-3 py-1.5" />
        </div>
        <div class="rounded border border-slate-200 bg-slate-50 px-4 py-3 text-xs text-slate-600 leading-relaxed" data-annotate="distribute-note">
          本页「分发」仅将试样指派给检测员。流转单<strong>接收试样</strong>行的回填时机在<strong>试验检测</strong>页，检测员点击「接收」时触发（见试验检测页批注）。
        </div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closeDistributeModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="confirmDistribute()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700" data-annotate="distribute-btn">确认分发</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var listData = [
      { code: 'SC2026/0087', contract: '/', sample: '安全带', customer: '杭州数蚕智能科技有限公司', acceptDate: '2026-07-14', progress: '试样分发', editor: 'admin', salesman: '梁倩' },
      { code: 'SC2026/0085', contract: '/', sample: '绝缘操作杆', customer: '杭州数蚕智能科技有限公司', acceptDate: '2026-07-12', progress: '试样分发', editor: 'admin', salesman: '梁倩' },
      { code: 'SC2026/0083', contract: '测试2', sample: '吊钩（环）t', customer: '杭州数蚕智能科技有限公司', acceptDate: '2026-07-10', progress: '试样分发', editor: 'admin', salesman: '梁倩' },
      { code: 'SC2026/0081', contract: '/', sample: '绝缘操作杆', customer: '东集西造有限公司', acceptDate: '2026-07-08', progress: '试样分发', editor: 'admin', salesman: '业务员A' },
      { code: 'SC2026/0079', contract: '/', sample: '安全帽', customer: '宇宙设想有限公司', acceptDate: '2026-07-06', progress: '试样分发', editor: 'admin', salesman: '梁倩' }
    ];

    var currentIndex = -1;

    function renderTable() {
      document.getElementById('tableBody').innerHTML = listData.map(function (item, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="entrust-detail.html" class="text-blue-600 hover:underline">' + item.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">' + item.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.acceptDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.progress + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.editor + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.salesman + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' +
            '<button onclick="openDistributeModal(' + i + ')" class="text-blue-600 hover:underline" data-annotate="distribute-action"><i class="fa fa-share"></i> 分发</button>' +
            '<button onclick="alert(\'退回（原型演示）\')" class="ml-3 text-blue-600 hover:underline"><i class="fa fa-reply"></i> 退回</button>' +
          '</td></tr>';
      }).join('');
    }

    function showModal(id) { var m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
    function hideModal(id) { var m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

    function openDistributeModal(index) {
      currentIndex = index;
      document.getElementById('distributeModalTitle').textContent = listData[index].code + '-试样分发';
      document.getElementById('d_sample').value = listData[index].sample;
      document.getElementById('d_tester').value = '';
      showModal('distributeModal');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeDistributeModal() { hideModal('distributeModal'); }

    function confirmDistribute() {
      if (!document.getElementById('d_tester').value) { alert('请选择检测员'); return; }
      alert('试样已分发给检测员，状态变为「待接收」。检测员在试验检测页点击「接收」后回填流转单（原型演示）。');
      closeDistributeModal();
    }

    document.getElementById('distributeModal').addEventListener('click', function (e) { if (e.target === this) closeDistributeModal(); });
    renderTable();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({
        annotations: [
          { id: 'distribute-action', selector: '[data-annotate="distribute-action"]', position: 'top-right', title: '试样分发', wide: true, content: '流程节点：<strong>试样分发</strong>。本操作将试样指派给检测员，任务进入「待接收」状态。', tag: '流转单' },
          { id: 'distribute-note', selector: '[data-annotate="distribute-note"]', position: 'top-left', title: '回填时机说明', wide: true, content: '流转单「接收试样」行<strong>不在本页回填</strong>，而在<strong>试验检测</strong>页检测员点击「接收」时回填：<br>检测流程 = 检测员部门 +「接收试样」<br>签名/日期 = 检测员电子签名 + 接收日期<br>多检测员接收同一样品下不同试样时，各回填一行。', tag: '流转单' },
          { id: 'distribute-btn', selector: '[data-annotate="distribute-btn"]', position: 'bottom-right', title: '确认分发', content: '分发成功后，检测员在试验检测列表可见「待接收」任务。', tag: '流转单' }
        ]
      });
    }
  </script>
</body>
</html>
