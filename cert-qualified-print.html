<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合格打印 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #dcfce7; color: #15803d; }
    .del-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px;
      background: #fdeeee; color: #cf1322; font-size: 11px; line-height: 16px; }
    tr.row-deleted, tr.row-deleted:hover { background: #fbfcfe; color: #b6bcc7; }
    tr.row-deleted td { border-color: #f1f3f7; }

  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      合格打印
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_name" type="text" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品编号</label>
          <input id="f_no" type="text" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_entrust" type="text" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">合同编号</label>
          <input id="f_contract" type="text" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托单位</label>
          <input id="f_client" type="text" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-3 xl:justify-end">
          <button onclick="doSearch()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i> 查询</button>
          <button onclick="doReset()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="mb-3 flex items-center justify-between">
        <p class="text-xs text-slate-400">仅展示判定合格且处于报告签发及后续流程的样品；不合格禁止打印。</p>
        <button onclick="batchPrint()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">批量打印合格证</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1100px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 w-10"><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)" /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="void-cert">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="unified-samples">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委送样时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-3 text-sm text-slate-500" id="totalText">共 0 条</div>
    </div>
  </div>

  <div id="inspectorModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-[480px] max-w-full rounded-lg bg-white shadow-xl" data-annotate="qc-person">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium">选择人员</h3>
        <button onclick="closeInspectorModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="px-6 py-5">
        <div id="inspectorRow" class="flex items-start gap-3">
          <label class="w-[72px] flex-shrink-0 text-right text-sm text-slate-600">检测员</label>
          <div id="modalInspectorBox" class="flex-1"></div>
        </div>
        <div id="recorderRow" class="mt-2 flex items-start gap-3 hidden">
          <label class="w-[72px] flex-shrink-0 text-right text-sm text-slate-600">记录员</label>
          <div id="modalRecorderBox" class="flex-1"></div>
        </div>
        <p id="personnelTip" class="mt-2 pl-[84px] text-xs text-slate-400"></p>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closeInspectorModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm">取消</button>
        <button onclick="confirmInspector()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'unified-samples',
          selector: '[data-annotate="unified-samples"]',
          position: 'top-right',
          title: '样品标签与合格证共用同一份样品清单',
          wide: true,
          content: '<strong>需求逻辑：</strong>同一张委托，点「样品标签」和点「合格证」必须看到同一批样品。' +
            '以前样品标签预览、合格证单张、合格证批量、合格打印四个页面各写了一份样品表，' +
            'SC2026/0073 一边显示安全带、一边显示验电器，而委托详情里其实是绝缘操作杆。<br>' +
            '<strong>展示规则：</strong>委托下有哪些样品一律取 <code>js/entrust-mock.js</code>' +
            '（与委托详情 / 样品收样 / 变更记录同源），样品编号 = 委托号 + 两位组号 + 试样号（如 SC2026/00730101）；' +
            '「型号规格」字段（合格证与样品标签两个字段池同名）取值 = 「型号/分类」+「规格」，两段之间一个空格；规格段把该型号下的多个规格取值与各自单位用空格拼接，如 <code>YJV 185 mm² 8.7/10 kV</code>；样品没配规格参数时退回委托登记的规格文本（如 <code>300</code>、<code>10kV 二级</code>）。' +
            '被删除的样品（变更删除、退回登记后删除）不进打印清单，但它占用的组号不回收——' +
            'SC2026/0029 的 03 号位留给被删的绝缘硬梯，变更新增的验电器排在 00290401；' +
            '收样日期与检测日期取委托收样日期，复检日期 = 检测日期 + 1 年 - 1 天；' +
            '检测状态按流程阶段推导（发样前未检测 / 检测环节在检 / 报告编制及之后已检测）。<br>' +
            '<strong>交互逻辑：</strong>标签上的二维码扫码后（<code>label-scan.html</code>）按样品编号回查同一份数据，' +
            '打印出来的样品与扫码看到的完全一致；判定不合格按委托号配置（演示单 SC2026/0074），' +
            '不合格与报告签发之前的委托照旧不出现合格证入口。',
          tag: '标签与合格证'
        },
        {
          id: 'qc-void-cert',
          selector: '[data-annotate="void-cert"]',
          position: 'top-right',
          title: '已删除样品不进合格打印',
          wide: true,
          content: '<strong>需求逻辑：</strong>样品收样之后被删掉有两种来源：① 委托确认退回委托登记，把这件样品删了；② 变更申请删除样品。' +
            '删掉的样品实物要走退样还给委托方，已不属于这张委托，合格证打印再列出它就会给不在库的样品出证。<br>' +
            '<strong>展示规则：</strong>本页只列<strong>在委托内的正常样品</strong>：判定合格且委托处于报告签发及后续流程的才出现，' +
            '已删除的样品不列、也不标"作废"；不合格的样品本来就禁止打证，同样不出现。<br>' +
            '<strong>交互逻辑：</strong>清单里没有的记录无法勾选，批量打印只覆盖正常样品；' +
            '若某委托的正常样品全部不合格或已全部删除，标签打印页该委托的「合格证」入口不展示。' +
            '样品编号不回收，客户补送走新增样品重新发号。演示数据在 js/receive-history-mock.js › DELETED_SAMPLES。',
          tag: '合格证打印'
        },
        {
          id: 'qc-person',
          selector: '[data-annotate="qc-person"]',
          position: 'bottom-right',
          title: '选择人员（检测员 / 记录员）',
          wide: true,
          content: '<strong>需求逻辑：</strong>合格证与标签上要落检测员、记录员的名字，且必须是在职人员台账里的人，不能手输；不同打印场景需要的角色不同（有的只需检测员，有的检测员+记录员）。<br>' +
          '<strong>展示规则：</strong>两行多选：检测员、记录员；候选来自人员台账（PersonnelStore），已选中的以勾选态显示；不需要记录员时该行整行隐藏，下方灰字提示当前需要哪些角色。<br>' +
          '<strong>交互逻辑：</strong>点「确定」按角色校验：需要检测员而未选 → 提示「请至少选择 1 名检测员」；需要记录员而未选 → 提示「请至少选择 1 名记录员」；校验不通过弹窗不关闭。确认后所选人员写入选中行的合格证/标签预览，并按人员分别记忆（localStorage），下次进入自动回填。',
          tag: '合格证打印'
        },
      ]
    });
  </script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/flow-stages.js"></script>
  <script src="js/entrust-mock.js"></script>
  <script src="js/receive-store.js"></script>
  <script src="js/receive-history-mock.js"></script>
  <script src="js/label-cert-samples.js"></script>
  <script src="js/personnel-store.js"></script>
  <script src="js/inspector-select.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script>
    var MAX_INSPECTORS = LabelCertConfig.getInspectorMax();
    var MAX_RECORDERS = LabelCertConfig.getRecorderMax();
    var INSPECTOR_OPTIONS = PersonnelStore.rosterNames();
    var RECORDER_OPTIONS = ['admin', 'cs222', 'cs3', '张三', '李四'];
    var STORAGE_INSPECTORS = 'lims_label_print_last_inspectors';
    var STORAGE_RECORDERS = 'lims_label_print_last_recorders';
    var STORAGE_INIT = 'lims_label_print_inspector_inited';
    var modalInspectors = PersonnelStore.pickRosterNames([], MAX_INSPECTORS);
    var modalRecorders = [];
    var modalRoles = { needInspectors: true, needRecorders: false };
    var pendingNos = [];

    /* 一行 = 一个样品。委托下有哪些样品统一取 js/entrust-mock.js，
     * 与「标签打印」列表、点「样品标签」进来的预览页、委托详情同源；
     * 被删除的样品（变更删除 / 退回登记后删除）不进本页，编号也不回收。 */
    var CERT_CODES = ['SC2026/0079', 'SC2026/0073', 'SC2026/0072', 'SC2026/0071',
                      'SC2026/0070', 'SC2026/0069', 'SC2026/0074'];
    var unifiedRows = window.LabelCertSamples ? LabelCertSamples.ofCodes(CERT_CODES) : [];
    var legacyRows = [
      { sampleName: '绝缘操作杆', sampleNo: 'SC2026/00790101', entrust: 'SC2026/0079', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-07-09', requireDate: '2026-07-30', status: '报告发放', judgment: '合格', cat: 'aqgqj', masterId: 'rod', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', model: '10kV' },
      { sampleName: '安全带', sampleNo: 'SC2026/00730101', entrust: 'SC2026/0073', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-10', requireDate: '2026-07-23', status: '任务完成', judgment: '合格', cat: 'aqgqj', masterId: 'belt976', inspectDate: '2026-06-10', reinspectDate: '2027-06-09', model: '' },
      { sampleName: '安全绳', sampleNo: 'SC2026/00720501', entrust: 'SC2026/0072', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-09', requireDate: '2026-07-22', status: '收费审批', judgment: '合格', cat: 'aqgqj', masterId: 'rope1476', inspectDate: '2026-06-09', reinspectDate: '2027-06-08', model: '' },
      { sampleName: '绝缘操作杆', sampleNo: 'SC2026/00710101', entrust: 'SC2026/0071', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-08', requireDate: '2026-07-21', status: '报告签发', judgment: '合格', cat: 'aqgqj', masterId: 'rod', inspectDate: '2026-06-08', reinspectDate: '2027-06-07', model: '20kV' },
      { sampleName: '安全帽', sampleNo: 'SC2026/00700101', entrust: 'SC2026/0070', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-07', requireDate: '2026-07-20', status: '任务归档', judgment: '合格', cat: 'aqgqj', masterId: 'helmet', inspectDate: '2026-06-07', reinspectDate: '2027-06-06', model: '' },
      // 不合格 / 未签发 —— 不应出现在列表
      { sampleName: '绝缘软梯', sampleNo: 'SC2026/00690101', entrust: 'SC2026/0069', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-06', requireDate: '2026-07-19', status: '报告编制', judgment: '合格', cat: 'aqgqj', masterId: 'ladder' },
      { sampleName: '卸扣', sampleNo: 'SC2026/00740101', entrust: 'SC2026/0074', contract: '/', client: '杭州数蚕智能科技有限公司', sendDate: '2026-06-11', requireDate: '2026-07-24', status: '任务完成', judgment: '不合格', cat: 'aqgqj', masterId: 'shackle' }
    ];
    var allRows = unifiedRows.length ? unifiedRows : legacyRows;

    function eligible(row) {
      return FlowStages.canShowCert(row);
    }

    var filtered = allRows.filter(eligible);

    function rolesForSamples(sampleMetas) {
      var needI = false, needR = false;
      var list = sampleMetas && sampleMetas.length
        ? sampleMetas
        : [{ cat: 'aqgqj', masterId: null }];
      list.forEach(function (s) {
        var tpl = LabelCertConfig.resolveTemplate(s.cat || 'aqgqj', 'certificate', s.masterId || null);
        var r = LabelCertConfig.personnelRolesNeeded((tpl && tpl.elements) || []);
        if (r.needInspectors) needI = true;
        if (r.needRecorders) needR = true;
      });
      return { needInspectors: needI, needRecorders: needR };
    }

    function metasForNos(nos) {
      return (nos || []).map(function (no) {
        var row = null;
        for (var i = 0; i < allRows.length; i++) {
          if (allRows[i].sampleNo === no) { row = allRows[i]; break; }
        }
        return row
          ? { cat: row.cat || 'aqgqj', masterId: row.masterId || null }
          : { cat: 'aqgqj', masterId: null };
      });
    }

    function readStoredInspectors() {
      try {
        var raw = localStorage.getItem(STORAGE_INSPECTORS);
        if (raw == null) return null;
        var list = JSON.parse(raw);
        return Array.isArray(list) ? list.slice(0, MAX_INSPECTORS) : [];
      } catch (e) {
        return null;
      }
    }

    function getLastInspectors() {
      var stored = readStoredInspectors();
      return PersonnelStore.pickRosterNames(stored || [], MAX_INSPECTORS);
    }

    function getLastRecorders() {
      try {
        var raw = localStorage.getItem(STORAGE_RECORDERS);
        if (raw == null) return [];
        var list = JSON.parse(raw);
        return Array.isArray(list) ? list.slice(0, MAX_RECORDERS) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLastPersonnel(inspectors, recorders, roles) {
      roles = roles || {};
      if (roles.needInspectors) {
        localStorage.setItem(STORAGE_INSPECTORS, JSON.stringify((inspectors || []).slice(0, MAX_INSPECTORS)));
      }
      if (roles.needRecorders) {
        localStorage.setItem(STORAGE_RECORDERS, JSON.stringify((recorders || []).slice(0, MAX_RECORDERS)));
      }
      localStorage.setItem(STORAGE_INIT, '1');
    }

    function hasSelectedBefore() {
      return localStorage.getItem(STORAGE_INIT) === '1';
    }

    function canSkipModal(roles) {
      if (!hasSelectedBefore()) return false;
      if (roles.needInspectors) {
        var insp = PersonnelStore.pickRosterNames(readStoredInspectors() || [], MAX_INSPECTORS);
        if (!insp.length) return false;
      }
      if (roles.needRecorders) {
        var rec = getLastRecorders();
        if (!rec.length) return false;
      }
      return true;
    }

    function updatePersonnelTip() {
      var parts = [];
      if (modalRoles.needInspectors) parts.push('最多选择 ' + MAX_INSPECTORS + ' 名检测员');
      if (modalRoles.needRecorders) parts.push('最多选择 ' + MAX_RECORDERS + ' 名记录员');
      document.getElementById('personnelTip').textContent = parts.join('；');
    }

    function renderModalPersonnel() {
      document.getElementById('inspectorRow').classList.toggle('hidden', !modalRoles.needInspectors);
      document.getElementById('recorderRow').classList.toggle('hidden', !modalRoles.needRecorders);
      if (modalRoles.needInspectors) {
        document.getElementById('modalInspectorBox').innerHTML = InspectorSelect.renderHTML({
          inspectors: modalInspectors, options: INSPECTOR_OPTIONS, mode: 'modal', idx: '',
          prefix: 'modalInsp', maxCount: MAX_INSPECTORS, addLabel: '添加检测员'
        });
      } else {
        document.getElementById('modalInspectorBox').innerHTML = '';
      }
      if (modalRoles.needRecorders) {
        document.getElementById('modalRecorderBox').innerHTML = InspectorSelect.renderHTML({
          inspectors: modalRecorders, options: RECORDER_OPTIONS, mode: 'modal', idx: '',
          prefix: 'modalRec', maxCount: MAX_RECORDERS, addLabel: '添加记录员'
        });
      } else {
        document.getElementById('modalRecorderBox').innerHTML = '';
      }
      updatePersonnelTip();
    }

    InspectorSelect.bind(document.getElementById('modalInspectorBox'), {
      onAdd: function (_, name) {
        if (modalInspectors.length >= MAX_INSPECTORS) { alert('最多只能选择 ' + MAX_INSPECTORS + ' 名检测员'); return; }
        if (modalInspectors.indexOf(name) === -1) modalInspectors.push(name);
        renderModalPersonnel();
      },
      onRemove: function (_, name) {
        modalInspectors = modalInspectors.filter(function (n) { return n !== name; });
        renderModalPersonnel();
      }
    });
    InspectorSelect.bind(document.getElementById('modalRecorderBox'), {
      onAdd: function (_, name) {
        if (modalRecorders.length >= MAX_RECORDERS) { alert('最多只能选择 ' + MAX_RECORDERS + ' 名记录员'); return; }
        if (modalRecorders.indexOf(name) === -1) modalRecorders.push(name);
        renderModalPersonnel();
      },
      onRemove: function (_, name) {
        modalRecorders = modalRecorders.filter(function (n) { return n !== name; });
        renderModalPersonnel();
      }
    });

    function renderTable() {
      document.getElementById('tableBody').innerHTML = filtered.map(function (r, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2"><input type="checkbox" class="row-check" data-no="' + r.sampleNo + '" /></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + r.sampleName + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + r.sampleNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + r.entrust + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + r.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + r.client + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + r.sendDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + r.requireDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' +
            '<a href="#" class="text-green-600 hover:underline" onclick="printOne(event,\'' + r.sampleNo + '\')"><i class="fa fa-print"></i> 打印合格证</a>' +
          '</td></tr>';
      }).join('') || '<tr><td colspan="9" class="border border-slate-200 px-3 py-10 text-center text-slate-400">暂无已合格可打印样品</td></tr>';
      document.getElementById('totalText').textContent = '共 ' + filtered.length + ' 条';
      document.getElementById('checkAll').checked = false;
    }

    function doSearch() {
      var name = document.getElementById('f_name').value.trim();
      var no = document.getElementById('f_no').value.trim();
      var entrust = document.getElementById('f_entrust').value.trim();
      var contract = document.getElementById('f_contract').value.trim();
      var client = document.getElementById('f_client').value.trim();
      filtered = allRows.filter(eligible).filter(function (r) {
        if (name && r.sampleName.indexOf(name) === -1) return false;
        if (no && r.sampleNo.indexOf(no) === -1) return false;
        if (entrust && r.entrust.indexOf(entrust) === -1) return false;
        if (contract && r.contract.indexOf(contract) === -1) return false;
        if (client && r.client.indexOf(client) === -1) return false;
        return true;
      });
      renderTable();
    }

    function doReset() {
      ['f_name','f_no','f_entrust','f_contract','f_client'].forEach(function (id) { document.getElementById(id).value = ''; });
      filtered = allRows.filter(eligible);
      renderTable();
    }

    function toggleAll(checked) {
      // 已作废的行不参与全选
      document.querySelectorAll('.row-check:not([disabled])').forEach(function (el) { el.checked = checked; });
    }

    function getSelectedNos() {
      return Array.prototype.map.call(document.querySelectorAll('.row-check:checked'), function (el) {
        return el.getAttribute('data-no');
      });
    }

    function openInspectorFor(nos) {
      pendingNos = nos;
      if (!pendingNos.length) { alert('请先勾选样品'); return; }
      var roles = rolesForSamples(metasForNos(pendingNos));
      if (!roles.needInspectors && !roles.needRecorders) {
        goPrint([], []);
        return;
      }
      if (canSkipModal(roles)) {
        goPrint(
          roles.needInspectors ? getLastInspectors() : [],
          roles.needRecorders ? getLastRecorders() : []
        );
        return;
      }
      modalRoles = roles;
      modalInspectors = roles.needInspectors ? getLastInspectors().slice() : [];
      modalRecorders = roles.needRecorders ? getLastRecorders().slice() : [];
      renderModalPersonnel();
      document.getElementById('inspectorModal').classList.remove('hidden');
      document.getElementById('inspectorModal').classList.add('flex');
    }

    function closeInspectorModal() {
      document.getElementById('inspectorModal').classList.add('hidden');
      document.getElementById('inspectorModal').classList.remove('flex');
    }

    function confirmInspector() {
      if (modalRoles.needInspectors && !modalInspectors.length) { alert('请至少选择 1 名检测员'); return; }
      if (modalRoles.needRecorders && !modalRecorders.length) { alert('请至少选择 1 名记录员'); return; }
      var inspectors = modalRoles.needInspectors ? modalInspectors.slice() : [];
      var recorders = modalRoles.needRecorders ? modalRecorders.slice() : [];
      saveLastPersonnel(inspectors, recorders, modalRoles);
      closeInspectorModal();
      goPrint(inspectors, recorders);
    }

    function goPrint(inspectors, recorders) {
      var q = 'nos=' + encodeURIComponent(pendingNos.join(',')) +
        '&inspectors=' + encodeURIComponent((inspectors || []).join(',')) +
        '&recorders=' + encodeURIComponent((recorders || []).join(',')) +
        '&from=qualified';
      location.href = 'cert-print-batch.html?' + q;
    }

    function printOne(e, no) {
      e.preventDefault();
      openInspectorFor([no]);
    }

    function batchPrint() {
      openInspectorFor(getSelectedNos());
    }

    renderModalPersonnel();
    renderTable();
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
