<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>透明检测报告 · 溯源核验</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-xl p-4 pt-6">
    <!-- 顶部 -->
    <div class="overflow-hidden rounded-xl bg-white shadow-lg">
      <div id="topBar" class="bg-blue-600 px-6 py-5 text-center text-white">
        <i class="fa fa-qrcode text-2xl mb-1"></i>
        <h1 class="text-lg font-semibold">透明检测报告 · 溯源核验</h1>
        <p id="topLevel" class="mt-1 text-xs text-blue-100">扫码核验本报告透明度等级、试验全过程及数据流转防篡改信息</p>
      </div>

      <div class="px-5 py-5">
        <!-- 状态横幅 -->
        <div id="statusBanner" class="mb-4 flex items-start gap-2 rounded-lg px-4 py-3 text-sm"></div>

        <!-- 报告概要 -->
        <div id="metaBox" class="mb-4 hidden rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm"></div>

        <!-- 八维度 -->
        <div id="dims" class="space-y-3"></div>

        <!-- 底部说明 -->
        <div id="footer" class="mt-5 hidden rounded-lg border border-slate-200 bg-slate-50 p-4 text-xs leading-relaxed text-slate-500"></div>
        <p class="mt-4 text-center text-[11px] text-slate-400">微信 / 支付宝 / 手机相机扫描报告首页二维码均可打开本页 · 公开内容与等级严格匹配</p>
      </div>
    </div>
  </div>

  <script src="js/short-link-qr.js"></script>
  <script src="js/report-trace.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      var res = ReportTrace.getVerify(code);
      var banner = document.getElementById('statusBanner');
      var metaBox = document.getElementById('metaBox');
      var dims = document.getElementById('dims');
      var footer = document.getElementById('footer');
      var topLevel = document.getElementById('topLevel');

      /** 未找到 / 空码 */
      if (!res.ok) {
        document.getElementById('topBar').className = 'bg-slate-600 px-6 py-5 text-center text-white';
        banner.className = 'mb-4 flex items-start gap-2 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600';
        banner.innerHTML = '<i class="fa fa-times-circle mt-0.5"></i><div><p class="font-medium">无法核验</p><p class="mt-0.5 text-xs">' + res.message + '</p><p class="mt-1 text-[11px] text-slate-400">演示码：三级 R3a2K · 四级 R4b7M · 二级预览 R2c9X · 已召回 R3rev · 已换版 R3old</p></div>';
        return;
      }

      var entry = res.entry, view = res.view;
      topLevel.textContent = '本报告透明度等级：' + view.levelName;

      /** 状态横幅：valid / revoked / superseded */
      if (entry.status === 'revoked') {
        document.getElementById('topBar').className = 'bg-slate-600 px-6 py-5 text-center text-white';
        banner.className = 'mb-4 flex items-start gap-2 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700';
        banner.innerHTML = '<i class="fa fa-ban mt-0.5"></i><div><p class="font-medium">本报告已召回 / 作废</p><p class="mt-0.5 text-xs">' + (entry.revokeReason || '') + '</p><p class="mt-1 text-[11px] text-slate-400">按标准要求报告永久可查，以下为历史留档内容。</p></div>';
      } else if (entry.status === 'superseded') {
        document.getElementById('topBar').className = 'bg-amber-500 px-6 py-5 text-center text-white';
        banner.className = 'mb-4 flex items-start gap-2 rounded-lg bg-amber-50 px-4 py-3 text-sm text-amber-700';
        banner.innerHTML = '<i class="fa fa-history mt-0.5"></i><div><p class="font-medium">本报告已被新版替代</p>' +
          '<p class="mt-0.5 text-xs">最新版本：<a class="underline" href="report-verify.html?code=' + entry.supersededBy + '">' + entry.supersededBy + '</a></p></div>';
      } else {
        banner.className = 'mb-4 flex items-start gap-2 rounded-lg bg-green-50 px-4 py-3 text-sm text-green-700';
        banner.innerHTML = '<i class="fa fa-check-circle mt-0.5"></i><div><p class="font-medium">核验通过 · ' + view.levelName + '</p>' +
          (entry.preview ? '<p class="mt-0.5 text-xs text-amber-600">（二级为能力预留等级，页面为示意：部分维度显示"暂未采集/待接入"）</p>' : '<p class="mt-0.5 text-xs">扫码内容与报告等级严格匹配</p>') + '</div>';
      }

      /** 报告概要 */
      var m = view.meta || {};
      metaBox.classList.remove('hidden');
      metaBox.innerHTML =
        rowLine('报告编号', view.reportNo) +
        rowLine('试验项', view.testItemNo) +
        rowLine('样品名称', m.sampleName) +
        rowLine('规格型号', m.spec) +
        rowLine('委托单位', m.clientName) +
        rowLine('检测机构', m.org) +
        rowLine('检测结论', '<span class="font-medium text-green-600">' + (m.conclusion || '-') + '</span>') +
        rowLine('归档时间', view.frozenAt);

      function rowLine(k, v) {
        if (v === undefined || v === null || v === '') v = '—';
        return '<div class="flex border-b border-slate-100 py-1.5 last:border-0"><span class="w-24 flex-shrink-0 text-slate-500">' + k + '</span><span class="flex-1 text-slate-800">' + v + '</span></div>';
      }

      /** 状态徽标 */
      function badge(type, text) {
        var map = {
          ok: 'bg-green-100 text-green-700',
          partial: 'bg-amber-100 text-amber-700',
          none: 'bg-slate-200 text-slate-500',
          na: 'bg-slate-100 text-slate-400'
        };
        return '<span class="rounded-full px-2 py-0.5 text-[11px] ' + (map[type] || map.none) + '">' + text + '</span>';
      }

      /** 温湿度连续曲线（内联 SVG） */
      function curveSvg(points) {
        var W = 460, H = 120, pad = 24;
        var temps = points.map(function (p) { return p.temp; });
        var hums = points.map(function (p) { return p.humidity; });
        var tMin = Math.min.apply(null, temps) - 1, tMax = Math.max.apply(null, temps) + 1;
        var hMin = Math.min.apply(null, hums) - 3, hMax = Math.max.apply(null, hums) + 3;
        function mapX(i) { return pad + (W - 2 * pad) * i / (points.length - 1); }
        function mapY(v, lo, hi) { return H - pad - (H - 2 * pad) * (v - lo) / (hi - lo); }
        function poly(vals, lo, hi) {
          return vals.map(function (v, i) { return mapX(i) + ',' + mapY(v, lo, hi).toFixed(1); }).join(' ');
        }
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="w-full">' +
          '<polyline fill="none" stroke="#ef4444" stroke-width="2" points="' + poly(temps, tMin, tMax) + '"/>' +
          '<polyline fill="none" stroke="#3b82f6" stroke-width="2" points="' + poly(hums, hMin, hMax) + '"/>' +
          '</svg>' +
          '<div class="mt-1 flex gap-4 text-[11px] text-slate-500"><span><i class="fa fa-circle text-red-500"></i> 温度(℃)</span><span><i class="fa fa-circle text-blue-500"></i> 湿度(%RH)</span><span class="text-slate-400">数采回传 · 连续采集</span></div>';
      }

      /** 照片墙（原型占位） */
      function photosBlock(items) {
        return '<div class="grid grid-cols-3 gap-2">' + items.map(function (p) {
          return '<div class="flex aspect-[4/3] flex-col items-center justify-center rounded border border-slate-200 bg-slate-50 text-slate-400">' +
            '<i class="fa fa-camera text-lg"></i><span class="mt-1 text-[10px]">' + p.node + '</span><span class="text-[9px] text-slate-300">' + (p.takenAt || '') + '</span></div>';
        }).join('') + '</div>';
      }

      /** 视频块 */
      function videoBlock(media) {
        if (media.type === 'video-pending') {
          return '<div class="flex items-center gap-3 rounded border border-dashed border-slate-300 bg-slate-50 p-3 text-slate-400">' +
            '<i class="fa fa-video-camera text-xl"></i><span class="text-xs">视频节点待接入（硬件即将就绪）</span></div>';
        }
        return '<div class="space-y-2">' + media.items.map(function (v) {
          return '<div class="flex items-center gap-3 rounded border border-slate-200 bg-slate-50 p-3">' +
            '<i class="fa fa-play-circle text-2xl text-blue-500"></i>' +
            '<div class="text-xs"><p class="text-slate-700">节点 ' + v.nodeId + ' · 试验时段回看</p>' +
            '<p class="text-slate-400">' + v.startTime + ' ~ ' + v.endTime + '（凭时间锚回源）</p></div></div>';
        }).join('') + '</div>';
      }

      /** 渲染八维度 */
      dims.innerHTML = view.sections.map(function (sc) {
        var body = '';
        if (sc.statusType === 'na') {
          body = '<p class="text-xs text-slate-400">该等级不公开此维度。</p>';
        } else {
          if (sc.rows && sc.rows.length) {
            body += '<div class="space-y-1">' + sc.rows.map(function (r) {
              return '<div class="flex text-xs"><span class="w-24 flex-shrink-0 text-slate-500">' + r[0] + '</span><span class="flex-1 text-slate-800">' + r[1] + '</span></div>';
            }).join('') + '</div>';
          }
          if (sc.media) {
            if (sc.media.type === 'curve') body += '<div class="mt-2 rounded bg-white p-2">' + curveSvg(sc.media.points) + '</div>';
            else if (sc.media.type === 'photos') body += '<div class="mt-2">' + photosBlock(sc.media.items) + '</div>';
            else if (sc.media.type === 'video' || sc.media.type === 'video-pending') body += '<div class="mt-2">' + videoBlock(sc.media) + '</div>';
          }
          if (sc.note) body += '<p class="mt-2 text-[11px] text-slate-400">' + sc.note + '</p>';
          if (!body) body = '<p class="text-xs text-slate-400">—</p>';
        }
        return '<div class="rounded-lg border border-slate-200 p-3">' +
          '<div class="mb-1.5 flex items-center justify-between"><span class="text-sm font-medium text-slate-700">' + sc.label + '</span>' + badge(sc.statusType, sc.statusText) + '</div>' +
          body + '</div>';
      }).join('');

      /** 底部：等级说明 + 防篡改 */
      footer.classList.remove('hidden');
      footer.innerHTML =
        '<p class="mb-1 font-medium text-slate-600">关于透明度等级</p>' +
        '<p class="mb-1">报告等级等同于出具该报告的实验室透明度等级与数据防篡改能力等级。四级由高到低：一级全要素 / 二级可视化 / 三级可追溯 / 四级可公示。</p>' +
        '<p class="mb-1"><span class="text-slate-600">数据防篡改：</span>报告签发时对八维度快照做哈希 + 可信时间戳固化（TSA）；一级叠加区块链存证。（原型演示占位）</p>' +
        '<p class="text-slate-400">依据《Q/YM 006—2026 检测报告透明度等级评价规范》。溯源码：' + ReportTrace.reportShortUrl(res.code) + '</p>';
    })();
  </script>
</body>
</html>
