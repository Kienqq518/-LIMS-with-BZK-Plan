<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原始记录单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .sheet { background: #fff; }
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sheet-table th, .sheet-table td { border: 1px solid #94a3b8; padding: 7px 8px; text-align: center; }
    .sheet-table th { background: #f1f5f9; color: #475569; font-weight: 500; }
    .meta-grid { display: grid; grid-template-columns: 88px 1fr; gap: 6px 8px; font-size: 12px; }
    .meta-grid .k { color: #64748b; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-xl p-4 pt-6">
    <div class="overflow-hidden rounded-xl bg-white shadow-lg">
      <div class="bg-blue-600 px-5 py-4 text-white">
        <a id="backLink" href="report-verify.html" class="mb-2 inline-flex items-center gap-1 text-xs text-blue-100 hover:text-white">
          <i class="fa fa-angle-left"></i> 返回溯源页
        </a>
        <h1 class="text-lg font-semibold">原始记录单</h1>
        <p id="topSub" class="mt-1 text-xs text-blue-100">公开只读 · 与本报告原始数据摘要对应</p>
      </div>
      <div id="body" class="px-5 py-5"></div>
    </div>
  </div>

  <script src="js/report-trace.js"></script>
  <script src="js/report-trace-l1.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      if (code) document.getElementById('backLink').href = 'report-verify.html?code=' + encodeURIComponent(code);

      var res = code ? ReportTrace.getVerify(code) : { ok: false };
      var reportNo = (res.ok && res.entry) ? res.entry.reportNo : params.get('report');
      var sheet = ReportTrace.getRecordSheet(reportNo);
      var body = document.getElementById('body');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      if (!sheet) {
        body.innerHTML = '<p class="text-sm text-slate-500">未找到对应原始记录单。</p>';
        return;
      }

      document.title = sheet.title + ' · 原始记录单';
      document.getElementById('topSub').textContent = sheet.reportNo + '　·　' + sheet.testName;

      var thead = sheet.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('');
      var tbody = sheet.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
      }).join('');

      body.innerHTML =
        '<div class="sheet rounded-lg border border-slate-200 p-4">' +
          '<p class="text-center text-xs tracking-widest text-slate-500">' + esc(sheet.org) + '</p>' +
          '<h2 class="mt-1 text-center text-base font-semibold text-slate-900">' + esc(sheet.title) + '</h2>' +
          '<p class="mt-0.5 text-center text-xs text-slate-400">' + esc(sheet.testName) + '</p>' +
          '<div class="meta-grid mt-4 border-t border-slate-100 pt-3">' +
            '<span class="k">报告编号</span><span>' + esc(sheet.reportNo) + '</span>' +
            '<span class="k">样品名称</span><span>' + esc(sheet.sampleName) + '　' + esc(sheet.spec) + '</span>' +
            '<span class="k">样品编号</span><span>' + esc(sheet.sampleNo) + '</span>' +
            '<span class="k">委托单位</span><span>' + esc(sheet.clientName) + '</span>' +
            '<span class="k">执行标准</span><span>' + esc(sheet.stdCode) + '　' + esc(sheet.stdName) + '</span>' +
            '<span class="k">检测设备</span><span>' + esc(sheet.equipment) + '</span>' +
            '<span class="k">环境条件</span><span>' + esc(sheet.env) + '</span>' +
            '<span class="k">检测员</span><span>' + esc(sheet.inspector) + '</span>' +
            '<span class="k">试验日期</span><span>' + esc((sheet.frozenAt || '').slice(0, 10)) + '</span>' +
          '</div>' +
          '<div class="mt-4 overflow-x-auto">' +
            '<table class="sheet-table min-w-[420px]"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table>' +
          '</div>' +
          '<p class="mt-3 text-xs text-slate-500">数据摘要：' + esc(sheet.summary) + '</p>' +
          '<div class="mt-4 grid grid-cols-2 gap-3 text-xs text-slate-500">' +
            '<p>检测员签名：' + esc(sheet.inspector) + '</p>' +
            '<p class="text-right">记录日期：' + esc((sheet.frozenAt || '').slice(0, 10)) + '</p>' +
          '</div>' +
        '</div>' +
        '<p class="mt-3 text-center text-[11px] text-slate-400">公开页只读展示签发时冻结的原始记录，不可编辑。</p>';
    })();
  </script>

  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=7" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
