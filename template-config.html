<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模板配置 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .main-tab, .sub-tab { border-bottom: 2px solid transparent; color: #64748b; padding: 10px 18px; cursor: pointer; white-space: nowrap; font-size: 14px; }
    .main-tab.active, .sub-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 500; }
    .tpl-layout { display: flex; gap: 0; min-height: calc(100vh - 130px); }
    .tpl-tree { width: 220px; flex-shrink: 0; border-right: 1px solid #e2e8f0; background: #fff; }
    .tpl-tree-head { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    .tpl-tree-head input { width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; }
    .tpl-tree-body { padding: 8px 0; max-height: calc(100vh - 200px); overflow-y: auto; font-size: 13px; }
    .tree-node { padding: 6px 12px 6px 16px; cursor: pointer; color: #475569; display: flex; align-items: center; gap: 4px; }
    .tree-node:hover { background: #f1f5f9; }
    .tree-node.active { background: #eff6ff; color: #2563eb; }
    .tree-node.child { padding-left: 28px; }
    .tree-node.grandchild { padding-left: 40px; font-size: 12px; }
    .tree-node.leaf { padding-left: 52px; color: #64748b; }
    .tree-node .count { color: #94a3b8; font-size: 12px; }
    .badge-enabled { display: inline-block; background: #dcfce7; color: #15803d; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
    .badge-none { color: #94a3b8; font-size: 12px; }
    .tpl-main { flex: 1; min-width: 0; background: #fff; }
    .tpl-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
    .tpl-toolbar label { font-size: 13px; color: #64748b; white-space: nowrap; }
    .tpl-toolbar input, .tpl-toolbar select { border: 1px solid #dcdfe6; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; min-width: 120px; }
    .tpl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tpl-table th, .tpl-table td { border: 1px solid #e5e7eb; padding: 9px 10px; text-align: left; vertical-align: top; }
    .tpl-table th { background: #f8fafc; color: #64748b; font-weight: 500; }
    .tpl-table tr:hover td { background: #fafafa; }
    .tpl-table .link { color: #2563eb; cursor: pointer; }
    .tpl-table .link:hover { text-decoration: underline; }
    .tag-chip { display: inline-block; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 6px; margin: 2px 4px 2px 0; font-size: 12px; }
    .modal-mask { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); padding: 16px; }
    .modal-mask.open { display: flex; }
    .modal-box { width: 560px; max-width: 100%; max-height: 90vh; overflow-y: auto; background: #fff; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,.15); }
    .modal-box.lg { width: 900px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #f1f5f9; font-size: 15px; font-weight: 500; }
    .modal-body { padding: 20px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid #f1f5f9; }
    .form-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
    .form-row > label { width: 130px; flex-shrink: 0; text-align: right; font-size: 13px; color: #64748b; padding-top: 8px; }
    .form-row > label .req { color: #ef4444; }
    .form-row .ctrl { flex: 1; min-width: 0; }
    .form-row input[type=text], .form-row select, .form-row textarea { width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 7px 10px; font-size: 13px; outline: none; }
    .radio-group { display: flex; gap: 20px; padding-top: 6px; font-size: 13px; }
    .upload-zone { border: 1px dashed #cbd5e1; border-radius: 6px; padding: 28px; text-align: center; color: #64748b; background: #f8fafc; cursor: pointer; }
    .upload-zone i { font-size: 28px; color: #94a3b8; margin-bottom: 8px; }
    .info-bar { margin: 12px 16px; padding: 10px 14px; border-radius: 4px; background: #fffbeb; border: 1px solid #fde68a; font-size: 12px; color: #92400e; line-height: 1.6; }
    .po-mask { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; background: #eef2f7; }
    .po-mask.open { display: flex; }
    .po-titlebar { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; background: linear-gradient(180deg, #4a90d9 0%, #357abd 100%); color: #fff; font-size: 13px; flex-shrink: 0; }
    .po-titlebar .po-save { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 3px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); cursor: pointer; font-size: 12px; }
    .po-titlebar .po-save:hover { background: rgba(255,255,255,.25); }
    .po-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 10px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; font-size: 12px; flex-shrink: 0; }
    .po-toolbar .tb-group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 8px; border-right: 1px solid #d1d5db; }
    .po-toolbar .tb-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: #374151; cursor: default; }
    .po-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .po-editor { flex: 1; min-width: 0; overflow: auto; background: #c8c8c8; padding: 24px; }
    .po-paper { width: 794px; min-height: 1123px; margin: 0 auto; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); padding: 48px 56px; font-family: SimSun, "Songti SC", serif; font-size: 12px; color: #111; line-height: 1.5; }
    .po-paper .ph { color: #2563eb; background: #eff6ff; padding: 0 2px; border-radius: 2px; font-family: Consolas, monospace; font-size: 11px; white-space: nowrap; }
    .po-paper table.doc-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .po-paper table.doc-tbl td, .po-paper table.doc-tbl th { border: 1px solid #000; padding: 4px 6px; vertical-align: middle; text-align: center; word-break: break-all; }
    .po-paper table.doc-tbl .label { font-weight: normal; }
    .po-paper .doc-title { text-align: center; font-size: 22px; font-weight: bold; letter-spacing: 8px; margin: 24px 0 8px; font-family: SimHei, "Heiti SC", sans-serif; }
    .po-paper .doc-subtitle { text-align: center; font-size: 14px; margin-bottom: 20px; }
    .po-paper .doc-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
    .po-sidebar { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-left: 1px solid #d1d5db; }
    .po-field-tabs { display: flex; overflow-x: auto; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .po-field-tab { padding: 10px 14px; font-size: 13px; color: #64748b; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; flex-shrink: 0; }
    .po-field-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 500; }
    .po-field-search { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
    .po-field-search input { width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 6px 10px 6px 28px; font-size: 13px; outline: none; }
    .po-field-search .wrap { position: relative; }
    .po-field-search .wrap i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 12px; }
    .po-field-body { flex: 1; overflow-y: auto; padding: 8px 0; font-size: 13px; }
    .po-field-group { border-bottom: 1px solid #f1f5f9; }
    .po-field-group-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px; cursor: pointer; color: #334155; font-weight: 500; }
    .po-field-group-head:hover { background: #f8fafc; }
    .po-field-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 6px 28px; color: #475569; }
    .po-field-item:hover { background: #f8fafc; }
    .po-field-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .po-field-item .acts { display: flex; gap: 4px; flex-shrink: 0; }
    .po-field-item .acts button { padding: 2px 8px; font-size: 11px; border-radius: 3px; border: 1px solid; cursor: pointer; }
    .po-field-item .acts .add { color: #2563eb; border-color: #93c5fd; background: #eff6ff; }
    .po-field-item .acts .del { color: #ef4444; border-color: #fca5a5; background: #fef2f2; }
    .po-field-item .acts .loc { color: #64748b; border-color: #cbd5e1; background: #f8fafc; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      模板配置
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <!-- 一级 Tab -->
  <div class="flex border-b border-slate-200 bg-white px-4" id="mainTabBar">
    <div class="main-tab active" data-tab="report">报告</div>
    <div class="main-tab" data-tab="record">记录单</div>
  </div>

  <!-- 报告 · 二级 Tab -->
  <div id="reportSubBar" class="flex border-b border-slate-200 bg-white px-4 text-sm">
    <div class="sub-tab active" data-sub="body">正文模板</div>
    <div class="sub-tab" data-sub="public">公共头尾模板</div>
  </div>
  <div id="recordSubBar" class="hidden flex border-b border-slate-200 bg-white px-4 text-sm">
    <div class="sub-tab active" data-sub="record-single">关联单试验项</div>
  </div>

  <div class="tpl-layout">
    <!-- 左侧树 -->
    <aside class="tpl-tree" id="treePanel">
      <div class="tpl-tree-head">
        <input type="text" id="treeSearch" placeholder="请输入关键字搜索" oninput="filterTree()" />
      </div>
      <div class="tpl-tree-body" id="treeBody"></div>
    </aside>

    <!-- 右侧主区 -->
    <div class="tpl-main">
      <div class="tpl-toolbar" id="toolbar"></div>
      <div class="overflow-x-auto px-4 pb-4">
        <table class="tpl-table min-w-[900px]" id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-end gap-2 px-4 pb-4 text-sm text-slate-500">
        <span id="pageTotal">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <select class="rounded border border-slate-200 px-2 py-1 text-sm"><option>10 条/页</option></select>
      </div>
      <div class="info-bar hidden" id="infoBar"></div>
    </div>
  </div>

  <!-- 记录单 · 修改文件名 -->
  <div id="renameModal" class="modal-mask">
    <div class="modal-box" style="width:420px">
      <div class="modal-head"><span>修改文件名</span><button onclick="closeModal('renameModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <div class="form-row" style="margin-bottom:0"><label>文件名</label><div class="ctrl flex items-center gap-1"><input type="text" id="renameInput" /><span class="text-sm text-slate-500">.docx</span></div></div>
      </div>
      <div class="modal-foot"><button onclick="closeModal('renameModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="saveRename()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- 记录单 · 配置多模板（一次仅启用一个） -->
  <div id="configModal" class="modal-mask">
    <div class="modal-box lg">
      <div class="modal-head"><span>配置模板</span><button onclick="closeModal('configModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <p class="mb-3 text-sm text-slate-500">同一试验项可上传多个模板版本，<strong class="text-slate-700">同时只能启用一个</strong>；导出时系统取启用模板。</p>
        <table class="tpl-table">
          <thead><tr><th style="width:50px">启用</th><th>模板文件</th><th>上传时间</th><th style="width:100px">操作</th></tr></thead>
          <tbody id="configTableBody"></tbody>
        </table>
        <div class="mt-3 flex gap-2">
          <button onclick="alert('上传新模板（原型演示）')" class="rounded border border-slate-300 px-4 py-1.5 text-sm"><i class="fa fa-upload"></i> 上传</button>
          <button onclick="openRecordCopyPicker()" class="rounded border border-slate-300 px-4 py-1.5 text-sm"><i class="fa fa-copy"></i> 复制其他项</button>
        </div>
      </div>
      <div class="modal-foot"><button onclick="closeModal('configModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="saveConfig()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- 记录单 · 单试验项复制模板 -->
  <div id="recordCopyModal" class="modal-mask">
    <div class="modal-box lg">
      <div class="modal-head"><span>单试验项复制模版</span><button onclick="closeModal('recordCopyModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <div class="tpl-toolbar" style="padding:0 0 12px;border:none">
          <label>样品</label><input type="text" placeholder="请输入" />
          <label>样品分类</label><input type="text" placeholder="请输入" />
          <label>试验项</label><input type="text" placeholder="请输入" />
          <label>文件名</label><input type="text" placeholder="请输入" />
          <button class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white">查询</button>
        </div>
        <table class="tpl-table">
          <thead><tr><th style="width:40px"></th><th>序号</th><th>模板文件</th><th>样品分类</th><th>样品名称【型号】</th><th>试验项</th><th>操作</th></tr></thead>
          <tbody id="recordCopyTableBody"></tbody>
        </table>
      </div>
      <div class="modal-foot"><button onclick="closeModal('recordCopyModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="confirmRecordCopy()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- 正文模板 新增/编辑 -->
  <div id="bodyModal" class="modal-mask">
    <div class="modal-box">
      <div class="modal-head"><span>新增/编辑详情</span><button onclick="closeModal('bodyModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <div class="form-row"><label><span class="req">*</span> 样品名称(型号)</label><div class="ctrl"><select id="m_sample"><option>PVC-C</option><option>MPP</option><option>HDPE</option></select></div></div>
        <div class="form-row"><label><span class="req">*</span> 试验项</label><div class="ctrl"><select id="m_tests" multiple size="4" style="width:100%"><option selected>B-颜色外观</option><option selected>B-尺寸检查</option><option>B-环刚度</option><option>B-压扁试验</option></select><div class="mt-1 text-xs text-slate-400">按住 Ctrl / Cmd 多选</div></div></div>
        <div class="form-row"><label><span class="req">*</span> 模板文件</label><div class="ctrl">
          <div class="radio-group mb-2"><label><input type="radio" name="bodyFileMode" value="upload" checked onchange="toggleBodyFileMode()" /> 上传</label><label><input type="radio" name="bodyFileMode" value="copy" onchange="toggleBodyFileMode()" /> 复制</label></div>
          <div id="bodyUploadZone" class="upload-zone" onclick="alert('上传模板文件（原型演示）')"><i class="fa fa-cloud-upload block"></i><div>上传</div></div>
          <button id="bodyCopyBtn" type="button" class="hidden rounded border border-slate-300 px-4 py-2 text-sm" onclick="openCopyPicker('body')"><i class="fa fa-copy"></i> 复制</button>
        </div></div>
        <div class="form-row"><label>引用公共模版头</label><div class="ctrl flex items-center gap-2"><input type="checkbox" id="m_useHead" checked /><select id="m_head" class="flex-1"><option>电网物资通用模板头</option><option>GQJ安全工器具通用模板头</option></select></div></div>
        <div class="form-row"><label>引用公共模版尾</label><div class="ctrl flex items-center gap-2"><input type="checkbox" id="m_useTail" /><select id="m_tail" class="flex-1" disabled><option>电网物资通用模板尾</option></select></div></div>
      </div>
      <div class="modal-foot"><button onclick="closeModal('bodyModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="saveBodyModal()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- 公共头尾 新增/编辑 -->
  <div id="publicModal" class="modal-mask">
    <div class="modal-box">
      <div class="modal-head"><span>新增/编辑详情</span><button onclick="closeModal('publicModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <div class="form-row"><label>模板内容</label><div class="ctrl"><select id="p_content"><option>模板头</option><option>模板尾</option></select></div></div>
        <div class="form-row"><label></label><div class="ctrl radio-group"><label><input type="radio" name="p_scope" value="category" checked onchange="togglePublicScope()" /> 样品分类</label><label><input type="radio" name="p_scope" value="sample" onchange="togglePublicScope()" /> 样品名称(型号)</label></div></div>
        <div class="form-row" id="p_categoryRow"><label>样品分类</label><div class="ctrl"><select id="p_category" multiple size="3" style="width:100%"><option selected>976</option><option selected>WZ电网物资</option><option>GQJ安全工器具</option></select></div></div>
        <div class="form-row hidden" id="p_sampleRow"><label>样品名称(型号)</label><div class="ctrl"><select id="p_sample" multiple size="3" style="width:100%"><option>PVC-C</option><option>MPP</option></select></div></div>
        <div class="form-row"><label>模板文件</label><div class="ctrl">
          <div class="radio-group mb-2"><label><input type="radio" name="pubFileMode" value="upload" checked onchange="togglePublicFileMode()" /> 上传</label><label><input type="radio" name="pubFileMode" value="copy" onchange="togglePublicFileMode()" /> 复制</label></div>
          <div id="publicUploadZone" class="upload-zone" onclick="alert('上传模板文件（原型演示）')"><i class="fa fa-cloud-upload block"></i><div>上传</div></div>
          <button id="publicCopyBtn" type="button" class="hidden rounded border border-slate-300 px-4 py-2 text-sm" onclick="openCopyPicker('public')"><i class="fa fa-copy"></i> 复制</button>
        </div></div>
      </div>
      <div class="modal-foot"><button onclick="closeModal('publicModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="savePublicModal()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- 复制模板选择 -->
  <div id="copyModal" class="modal-mask">
    <div class="modal-box lg">
      <div class="modal-head"><span id="copyModalTitle">公共模板头尾复制</span><button onclick="closeModal('copyModal')" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button></div>
      <div class="modal-body">
        <div class="tpl-toolbar" style="padding:0 0 12px;border:none">
          <label>模板内容</label><select style="min-width:100px"><option>全部</option><option>模板头</option><option>模板尾</option></select>
          <label>样品分类</label><input type="text" placeholder="请输入" />
          <button class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white">查询</button>
        </div>
        <table class="tpl-table">
          <thead><tr><th style="width:40px"></th><th>序号</th><th>模板文件</th><th>模板内容</th><th>样品分类</th><th>样品名称(型号)</th><th>操作</th></tr></thead>
          <tbody id="copyTableBody"></tbody>
        </table>
      </div>
      <div class="modal-foot"><button onclick="closeModal('copyModal')" class="rounded border border-slate-300 px-5 py-1.5 text-sm">取消</button><button onclick="confirmCopy()" class="rounded bg-blue-600 px-5 py-1.5 text-sm text-white">确定</button></div>
    </div>
  </div>

  <!-- PageOffice 模板配置（原型 Mock） -->
  <div id="pageOfficeModal" class="po-mask">
    <div class="po-titlebar">
      <div class="flex items-center gap-3">

    function renderTreeNodes(nodes, kw, depth, showGroup) {
      var html = '';
      (nodes || []).forEach(function (n) {
        var match = !kw || showGroup || n.label.toLowerCase().includes(kw);
        if (n.children && n.children.length) {
          var inner = renderTreeNodes(n.children, kw, depth + 1, match || showGroup);
          if (!inner && kw && !match) return;
          var cls = depth === 0 ? '' : (depth === 1 ? ' child' : ' grandchild');
          html += '<div class="tree-node' + cls + '"><i class="fa fa-folder-o text-slate-400"></i>' + n.label + '</div>' + inner;
        } else {
          if (kw && !match && !showGroup) return;
          var active = state.treeId === n.id ? ' active' : '';
          var leafCls = n.leaf ? ' leaf' : (depth >= 2 ? ' grandchild' : ' child');
          var count = n.count ? '<span class="count">(' + n.count + ')</span>' : '';
          var annotate = n.leaf ? ' data-annotate="record-tree-count"' : '';
          html += '<div class="tree-node' + leafCls + active + '"' + annotate + ' data-id="' + n.id + '" onclick="selectTree(\'' + n.id + '\')">' + n.label + count + '</div>';
        }
      });
      return html;
    }

    function renderTree() {
      var kw = (document.getElementById('treeSearch').value || '').trim().toLowerCase();
      var html = '';
      if (state.main === 'record') {
        RECORD_TREE.forEach(function (g) {
          var showGroup = !kw || g.label.toLowerCase().includes(kw);
          html += renderTreeNodes([g], kw, 0, showGroup);
        });
      } else {
        TREE.forEach(function (g) {
          var showGroup = !kw || g.label.toLowerCase().includes(kw);
          var childHtml = (g.children || []).map(function (c) {
            if (kw && !showGroup && !c.label.toLowerCase().includes(kw)) return '';
            var active = state.treeId === c.id ? ' active' : '';
            var count = c.count ? '<span class="count">(' + c.count + ')</span>' : '';
            return '<div class="tree-node child' + active + '" data-id="' + c.id + '" onclick="selectTree(\'' + c.id + '\')">' + c.label + count + '</div>';
          }).join('');
          if (!childHtml && kw && !showGroup) return;
          html += '<div class="tree-node" data-annotate="tree-count"><i class="fa fa-folder-o text-slate-400"></i>' + g.label + '</div>' + childHtml;
        });
      }
      document.getElementById('treeBody').innerHTML = html;
    }

    function filterTree() { renderTree(); }

    function selectTree(id) {
      state.treeId = id;
      renderTree();
      renderView();
    }

    function renderToolbar() {
      var el = document.getElementById('toolbar');
      if (state.main === 'report' && state.sub === 'body') {
        el.innerHTML = '<label>样品</label><input id="f_sample" placeholder="请输入" />' +
          '<label>样品分类</label><input id="f_category" placeholder="请输入" />' +
          '<label>试验项</label><input id="f_test" placeholder="请输入" />' +
          '<label>文件名</label><input id="f_file" placeholder="请输入" />' +
          '<button onclick="renderView()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white"><i class="fa fa-search"></i> 查询</button>' +
          '<button onclick="resetFilters()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600">重置</button>' +
          '<button onclick="alert(\'下载（原型演示）\')" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600"><i class="fa fa-download"></i> 下载</button>' +
          '<button onclick="openBodyModal()" class="ml-auto rounded bg-blue-600 px-4 py-1.5 text-sm text-white" data-annotate="btn-add"><i class="fa fa-plus"></i> 新增</button>';
      } else if (state.main === 'report' && state.sub === 'public') {
        el.innerHTML = '<label>模板内容</label><select id="f_content"><option value="">全部</option><option>模板头</option><option>模板尾</option></select>' +
          '<label>样品分类</label><input id="f_category" placeholder="请输入" />' +
          '<label>样品名称</label><input id="f_sample" placeholder="请输入" />' +
          '<label>文件名</label><input id="f_file" placeholder="请输入" />' +
          '<button onclick="renderView()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">查询</button>' +
          '<button onclick="resetFilters()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600">重置</button>' +
          '<button onclick="alert(\'下载（原型演示）\')" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600">下载</button>' +
          '<button onclick="openPublicModal()" class="ml-auto rounded bg-blue-600 px-4 py-1.5 text-sm text-white"><i class="fa fa-plus"></i> 新增</button>';
      } else if (state.main === 'record') {
        el.innerHTML = '<label>是否配置模板</label><select id="f_configured"><option value="">全部</option><option value="yes">是</option><option value="no">否</option></select>' +
          '<label>样品</label><input id="f_sample" placeholder="请输入" />' +
          '<label>样品分类</label><input id="f_category" placeholder="请输入" />' +
          '<label>试验项</label><input id="f_test" placeholder="请输入" />' +
          '<label>文件名</label><input id="f_file" placeholder="请输入" />' +
          '<button onclick="renderView()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white"><i class="fa fa-search"></i> 查询</button>' +
          '<button onclick="resetFilters(true)" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600">重置</button>' +
          '<button onclick="alert(\'下载（原型演示）\')" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600"><i class="fa fa-download"></i> 下载</button>';
      }
    }

    function getFilteredRows() {
      var rows;
      if (state.main === 'record') rows = RECORD_DATA.filter(function (r) { return r.tree === state.treeId; });
      else if (state.sub === 'public') rows = PUBLIC_DATA.slice();
      else rows = BODY_DATA.filter(function (r) { return r.tree === state.treeId; });

      var sample = document.getElementById('f_sample');
      var category = document.getElementById('f_category');
      var test = document.getElementById('f_test');
      var file = document.getElementById('f_file');
      var content = document.getElementById('f_content');
      var configured = document.getElementById('f_configured');
      if (sample && sample.value.trim()) rows = rows.filter(function (r) { return (r.sample || '').includes(sample.value.trim()); });
      if (category && category.value.trim()) rows = rows.filter(function (r) { return (r.category || '').includes(category.value.trim()); });
      if (test && test.value.trim()) rows = rows.filter(function (r) {
        var t = r.test || (r.tests || []).join(',');
        return t.includes(test.value.trim());
      });
      if (file && file.value.trim()) rows = rows.filter(function (r) { return (r.file || '').includes(file.value.trim()); });
      if (content && content.value) rows = rows.filter(function (r) { return r.content === content.value; });
      if (configured && configured.value === 'yes') rows = rows.filter(function (r) { return r.configured; });
      if (configured && configured.value === 'no') rows = rows.filter(function (r) { return !r.configured; });
      return rows;
    }

    function recordOps(r) {
      if (r.configured && r.file) {
        return '<button onclick="openRename(' + r.id + ')" class="text-blue-600 hover:underline">修改文件名</button> ' +
          '<button onclick="openPageOffice(\'record\',' + r.id + ')" class="ml-1 text-blue-600 hover:underline" data-annotate="po-config">配置</button> ' +
          '<button onclick="openConfig(' + r.id + ')" class="ml-1 text-blue-600 hover:underline" data-annotate="record-config">版本</button> ' +
          '<button onclick="alert(\'预览（原型演示）\')" class="ml-1 text-blue-600 hover:underline">预览</button> ' +
          '<button onclick="clearRecord(' + r.id + ')" class="ml-1 text-red-500 hover:underline" data-annotate="record-clear">清除</button>';
      }
      return '<button onclick="alert(\'上传模板（原型演示）\')" class="text-blue-600 hover:underline" data-annotate="record-upload">上传</button> ' +
        '<button onclick="openRecordCopyForRow(' + r.id + ')" class="ml-1 text-blue-600 hover:underline" data-annotate="record-copy">复制</button>';
    }

    function renderTable() {
      var head = document.getElementById('tableHead');
      var body = document.getElementById('tableBody');
      var rows = getFilteredRows();
      var ops = function (type, row) {
        var cfgFn = type === 'record' ? 'openPageOffice(\'record\',' + row.id + ')' : 'openPageOffice(\'' + type + '\')';
        return '<button onclick="alert(\'编辑（原型演示）\')" class="text-blue-600 hover:underline" data-annotate="row-edit">编辑</button> ' +
          '<button onclick="' + cfgFn + '" class="ml-1 text-blue-600 hover:underline" data-annotate="po-config">配置</button> ' +
          '<button onclick="alert(\'预览（原型演示）\')" class="ml-1 text-blue-600 hover:underline">预览</button> ' +
          '<button onclick="alert(\'删除（原型演示）\')" class="ml-1 text-red-500 hover:underline" data-annotate="row-delete">删除</button>' +
          (type === 'public' ? ' <button onclick="alert(\'上传（原型演示）\')" class="ml-1 text-blue-600 hover:underline">上传</button> <button onclick="openCopyPicker(\'public\')" class="ml-1 text-blue-600 hover:underline">复制</button>' : '');
      };

      if (state.main === 'report' && state.sub === 'body') {
        head.innerHTML = '<tr><th>序号</th><th>样品</th><th>样品分类</th><th>试验项</th><th>模板文件</th><th>引用公共模版头</th><th>引用公共模版尾</th><th style="min-width:200px">操作</th></tr>';
        body.innerHTML = rows.map(function (r, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + r.sample + '</td><td>' + r.category + '</td><td>' +
            r.tests.map(function (t) { return '<span class="tag-chip">' + t + '</span>'; }).join('') + '</td>' +
            '<td><span class="link">' + r.file + '</span></td><td><span class="link">' + r.head + '</span></td><td><span class="link">' + r.tail + '</span></td>' +
            '<td class="whitespace-nowrap">' + ops('body', r) + '</td></tr>';
        }).join('');
      } else if (state.main === 'report' && state.sub === 'public') {
        head.innerHTML = '<tr><th>序号</th><th>模板内容</th><th>样品分类</th><th>模板文件</th><th style="min-width:240px">操作</th></tr>';
        body.innerHTML = rows.map(function (r, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + r.content + '</td><td>' + (r.category !== '—' ? r.category : r.sample) + '</td>' +
            '<td><span class="link">' + r.file + '</span></td><td class="whitespace-nowrap">' + ops('public', r) + '</td></tr>';
        }).join('');
      } else if (state.main === 'record') {
        head.innerHTML = '<tr><th style="width:36px"><input type="checkbox" /></th><th>序号</th><th>样品名称【型号】</th><th>样品分类</th><th>试验项</th><th>模板文件</th><th style="min-width:220px">操作</th></tr>';
        body.innerHTML = rows.map(function (r, i) {
          var fileCell = r.file
            ? '<span class="link">' + r.file + '</span>' + (r.templates && r.templates.length > 1 ? '<span class="badge-enabled">启用中</span>' : '')
            : '<span class="badge-none">未配置</span>';
          return '<tr><td><input type="checkbox" /></td><td>' + (i + 1) + '</td><td>' + r.sample + '</td><td>' + r.category + '</td><td>' + r.test + '</td>' +
            '<td>' + fileCell + '</td><td class="whitespace-nowrap">' + recordOps(r) + '</td></tr>';
        }).join('');
      }
      document.getElementById('pageTotal').textContent = '共 ' + rows.length + ' 条';
    }

    function renderInfoBar() {
      var bar = document.getElementById('infoBar');
      if (state.main === 'report' && state.sub === 'body') {
        bar.classList.remove('hidden');
        bar.innerHTML = '<i class="fa fa-info-circle"></i> 目前单样品型号可支持存储多版报告，每版支持不同的试验项组合；关联关系需要创建，需要选择是否关联模板头/尾。';
      } else if (state.main === 'report' && state.sub === 'public') {
        bar.classList.remove('hidden');
        bar.innerHTML = '<i class="fa fa-info-circle"></i> 模板内容单选「样品分类」或「样品名称(型号)」；二者均支持多选。模板文件非必填，可上传新模板或复制已有模板。';
      } else if (state.main === 'record') {
        bar.classList.remove('hidden');
        bar.setAttribute('data-annotate', 'record-export-logic');
        bar.innerHTML = '<i class="fa fa-info-circle"></i> <strong>关联单试验项：</strong>每个样品/型号下的每个试验项单独绑定模板；同一试验项可存多个模板版本，<strong>同时仅启用一个</strong>。' +
          '导出时若需多个试验项合并为一个文件，系统自动拉取检测员所做试验项对应的<strong>启用模板</strong>拼接导出，无需单独配置「多试验项」。';
      } else {
        bar.classList.add('hidden');
        bar.removeAttribute('data-annotate');
      }
    }

    function renderView() {
      renderToolbar();
      renderTable();
      renderInfoBar();
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function resetFilters() {
      ['f_sample', 'f_category', 'f_test', 'f_file'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      var c = document.getElementById('f_content');
      if (c) c.value = '';
      var cfg = document.getElementById('f_configured');
      if (cfg) cfg.value = '';
      renderTable();
    }

    function switchMain(tab) {
      state.main = tab;
      state.sub = tab === 'record' ? 'record-single' : 'body';
      if (tab === 'record') state.treeId = 'pvc-c';
      document.querySelectorAll('#mainTabBar .main-tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
      document.getElementById('reportSubBar').classList.toggle('hidden', tab !== 'report');
      document.getElementById('recordSubBar').classList.toggle('hidden', tab !== 'record');
      document.getElementById('treePanel').classList.toggle('hidden', tab === 'report' && state.sub === 'public');
      renderTree();
      renderView();
    }

    function switchSub(sub) {
      state.sub = sub;
      var bar = state.main === 'report' ? '#reportSubBar' : '#recordSubBar';
      document.querySelectorAll(bar + ' .sub-tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-sub') === sub); });
      document.getElementById('treePanel').classList.toggle('hidden', state.main === 'report' && sub === 'public');
      renderView();
    }

    document.getElementById('mainTabBar').addEventListener('click', function (e) {
      var t = e.target.closest('.main-tab');
      if (t) switchMain(t.getAttribute('data-tab'));
    });
    document.getElementById('reportSubBar').addEventListener('click', function (e) {
      var t = e.target.closest('.sub-tab');
      if (t) switchSub(t.getAttribute('data-sub'));
    });

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function openBodyModal() { openModal('bodyModal'); }
    function openPublicModal() { openModal('publicModal'); }
    function saveBodyModal() { closeModal('bodyModal'); alert('正文模板已保存（原型演示）'); }
    function savePublicModal() { closeModal('publicModal'); alert('公共头尾模板已保存（原型演示）'); }

    function toggleBodyFileMode() {
      var copy = document.querySelector('input[name=bodyFileMode]:checked').value === 'copy';
      document.getElementById('bodyUploadZone').classList.toggle('hidden', copy);
      document.getElementById('bodyCopyBtn').classList.toggle('hidden', !copy);
    }
    function togglePublicFileMode() {
      var copy = document.querySelector('input[name=pubFileMode]:checked').value === 'copy';
      document.getElementById('publicUploadZone').classList.toggle('hidden', copy);
      document.getElementById('publicCopyBtn').classList.toggle('hidden', !copy);
    }
    function togglePublicScope() {
      var cat = document.querySelector('input[name=p_scope]:checked').value === 'category';
      document.getElementById('p_categoryRow').classList.toggle('hidden', !cat);
      document.getElementById('p_sampleRow').classList.toggle('hidden', cat);
    }

    document.getElementById('m_useTail').addEventListener('change', function () {
      document.getElementById('m_tail').disabled = !this.checked;
    });

    function openCopyPicker(from) {
      document.getElementById('copyModalTitle').textContent = from === 'body' ? '模板文件复制' : '公共模板头尾复制';
      document.getElementById('copyTableBody').innerHTML = PUBLIC_DATA.map(function (r, i) {
        return '<tr><td><input type="radio" name="copyPick" value="' + r.id + '"' + (i === 0 ? ' checked' : '') + ' /></td><td>' + (i + 1) + '</td><td>' + r.file + '</td><td>' + r.content + '</td><td>' + r.category + '</td><td>' + r.sample + '</td><td><button class="text-blue-600">预览</button></td></tr>';
      }).join('');
      openModal('copyModal');
    }
    function findRecord(id) {
      return RECORD_DATA.find(function (r) { return r.id === id; });
    }

    function openRename(id) {
      var row = findRecord(id);
      if (!row || !row.file) return;
      state.recordRowId = id;
      document.getElementById('renameInput').value = row.file.replace(/\.docx?$/i, '');
      openModal('renameModal');
    }
    function saveRename() {
      var row = findRecord(state.recordRowId);
      if (row) {
        var name = document.getElementById('renameInput').value.trim();
        if (name) row.file = name + '.docx';
      }
      closeModal('renameModal');
      renderTable();
    }

    function openConfig(id) {
      state.configRowId = id;
      renderConfigTable();
      openModal('configModal');
    }
    function renderConfigTable() {
      var row = findRecord(state.configRowId);
      if (!row) return;
      document.getElementById('configTableBody').innerHTML = (row.templates || []).map(function (t, i) {
        return '<tr><td class="text-center"><input type="radio" name="enabledTpl" ' + (t.enabled ? 'checked' : '') + ' onchange="setEnabledTpl(' + i + ')" /></td>' +
          '<td><span class="link">' + t.name + '</span></td><td>' + t.time + '</td>' +
          '<td><button onclick="alert(\'预览\')" class="text-blue-600 hover:underline">预览</button> ' +
          '<button onclick="removeTpl(' + i + ')" class="ml-1 text-red-500 hover:underline">删除</button></td></tr>';
      }).join('') || '<tr><td colspan="4" class="py-6 text-center text-slate-400">暂无模板，请上传或复制</td></tr>';
    }
    function setEnabledTpl(index) {
      var row = findRecord(state.configRowId);
      if (!row) return;
      row.templates.forEach(function (t, i) { t.enabled = i === index; });
      var enabled = row.templates[index];
      row.file = enabled ? enabled.name : null;
      row.configured = !!enabled;
    }
    function removeTpl(index) {
      var row = findRecord(state.configRowId);
      if (!row || !confirm('确定删除该模板版本？')) return;
      row.templates.splice(index, 1);
      if (!row.templates.length) { row.file = null; row.configured = false; }
      else if (!row.templates.some(function (t) { return t.enabled; })) {
        row.templates[0].enabled = true;
        row.file = row.templates[0].name;
      }
      renderConfigTable();
    }
    function saveConfig() {
      closeModal('configModal');
      renderTable();
      alert('模板配置已保存（原型演示）');
    }

    function clearRecord(id) {
      if (!confirm('清除将移除模板文件关联，试验项数据行保留。确定清除？')) return;
      var row = findRecord(id);
      if (row) { row.file = null; row.configured = false; row.templates = []; }
      renderTable();
    }

    function openRecordCopyPicker() { openRecordCopyForRow(state.configRowId); }
    function openRecordCopyForRow(id) {
      state.recordRowId = id;
      var sources = RECORD_DATA.filter(function (r) { return r.configured && r.id !== id; });
      document.getElementById('recordCopyTableBody').innerHTML = sources.map(function (r, i) {
        return '<tr><td><input type="radio" name="recordCopyPick" value="' + r.id + '"' + (i === 0 ? ' checked' : '') + ' /></td><td>' + (i + 1) + '</td>' +
          '<td>' + r.file + '</td><td>' + r.category + '</td><td>' + r.sample + '</td><td>' + r.test + '</td>' +
          '<td><button class="text-blue-600">预览</button></td></tr>';
      }).join('');
      openModal('recordCopyModal');
    }
    function confirmRecordCopy() {
      var pick = document.querySelector('input[name=recordCopyPick]:checked');
      var target = findRecord(state.recordRowId);
      var source = pick ? findRecord(parseInt(pick.value, 10)) : null;
      if (target && source) {
        var copyName = '复制_' + source.file;
        target.templates.push({ name: copyName, time: '2026-07-14 08:00', enabled: !target.templates.length });
        if (!target.templates.some(function (t) { return t.enabled; })) target.templates[target.templates.length - 1].enabled = true;
        var enabledTpl = target.templates.find(function (t) { return t.enabled; });
        target.file = enabledTpl ? enabledTpl.name : copyName;
        target.configured = true;
      }
      closeModal('recordCopyModal');
      if (state.configRowId) renderConfigTable();
      renderTable();
      alert('已复制模板（原型演示）');
    }

    function confirmCopy() { closeModal('copyModal'); alert('已复制选中模板（原型演示）'); }

    function ph(key) {
      return '<span class="ph">{{' + key + '}}</span>';
    }

        { title: '框架合同', open: false, fields: ['框架合同编号', '框架合同名称', '关联框架合同'] }

        { title: '签发信息', open: false, fields: ['编制人', '审核人', '批准人', '签发人签名'] }
      ]},
      { id: 'device', label: '设备信息', groups: [
        { title: '检测设备', open: true, fields: ['设备名称', '设备编号', '设备型号', '检定有效期', '测量范围'] }
      ]},
      { id: 'sample', label: '样品信息', groups: [
        { title: '当前样品信息', open: true, fields: ['样品名称', '规格型号', '生产单位', '样品编号', '送样日期', '样品数量'] },
        { title: '基本信息', open: true, fields: ['样品外观', '样品状态', '样品标识', '收样日期'] }
      ]},
      { id: 'result', label: '试验结果集', groups: [

        { title: '样品列表 sampleList', open: true, fields: ['samNumber', 'wgjc[0].wg', 'wgjc[1].wg', 'gpnysy[0].syz', 'gpnysy[0].xldlsy', 'gpnysy[0].ztms', 'gpnysy[1].syz', 'gpnysy[1].xldlsy', 'gpnysy[1].ztms', 'jl'] }
      ]}
    ];

    function renderRecordDocument() {
      return '<table class="doc-tbl">' +
        '<tr>' +
        '<td class="label" style="width:11%">试样名称</td><td colspan="2">' + ph('summaryInfo.sumSampleName') + '</td>' +
        '<td class="label" style="width:11%">规格型号</td><td colspan="2">' + ph('summaryInfo.sumModel') + '</td>' +
        '<td class="label" rowspan="6" style="width:7%;writing-mode:vertical-rl;letter-spacing:4px">合格证编号</td>' +
        '</tr>' +
        '<tr><td class="label" colspan="2">要 · 求</td><td colspan="4" style="text-align:left">' + ph('standardRequest') + '</td></tr>' +
        '<tr><td colspan="6" style="text-align:left;font-size:11px;color:#64748b;padding:3px 6px">' + ph('#sampleList') + ' … ' + ph('/sampleList') + '</td></tr>' +
        '<tr>' +
        '<td>试样编号</td><td>—</td><td>外观</td><td>试验电压<br>(kV·60s)</td><td>泄漏电流<br>(mA)</td><td>状态描述</td>' +
        '</tr>' +
        '<tr>' +
        '<td rowspan="2">' + ph('samNumber') + '</td><td rowspan="2">—</td>' +
        '<td>' + ph('wgjc[0].wg') + '</td><td>' + ph('gpnysy[0].syz') + '</td><td>' + ph('gpnysy[0].xldlsy') + '</td><td>' + ph('gpnysy[0].ztms') + '</td>' +
        '</tr>' +
        '<tr>' +
        '<td>' + ph('wgjc[1].wg') + '</td><td>' + ph('gpnysy[1].syz') + '</td><td>' + ph('gpnysy[1].xldlsy') + '</td><td>' + ph('gpnysy[1].ztms') + '</td>' +
        '</tr>' +
        '<tr>' +
        '<td colspan="2" style="text-align:left">结论：' + ph('jl') + '</td>' +
        '<td colspan="4" style="text-align:left">编号：' + ph('samNumber') + '</td>' +
        '</tr>' +
        '<tr><td class="label" colspan="2">备 · 注</td><td colspan="5" style="text-align:left">检测有效期至 ' + ph('summaryInfo.nextTime') + '</td></tr>' +
        '</table>';
    }

    function renderReportDocument() {
      return '<div class="doc-meta"><span>报告编号 (No.)：' + ph('reportNumber') + '</span><span>第 1 页 共 4 页</span></div>' +
        '<div class="doc-title">检 测 报 告</div>' +
        '<div class="doc-subtitle">Test Report</div>' +
        '<div style="text-align:center;margin-bottom:16px">编号 (No.)：' + ph('reportNumber') + '</div>' +
        '<table class="doc-tbl">' +
        '<tr><td class="label" style="width:22%">委托单位<br><span style="font-size:10px">Consignor</span></td><td style="text-align:left">' + ph('ordConsigner') + '</td></tr>' +
        '<tr><td class="label">工程名称<br><span style="font-size:10px">Project name</span></td><td style="text-align:left">—</td></tr>' +
        '<tr><td class="label">试样名称<br><span style="font-size:10px">Sample name</span></td><td style="text-align:left">' + ph('samSampleName') + '</td></tr>' +
        '<tr><td class="label">规格型号<br><span style="font-size:10px">Type</span></td><td style="text-align:left">' + ph('samModel') + '</td></tr>' +
        '<tr><td class="label">生产单位<br><span style="font-size:10px">Production unit</span></td><td style="text-align:left">' + ph('samProducer') + '</td></tr>' +
        '<tr><td class="label">检测类别<br><span style="font-size:10px">Test category</span></td><td style="text-align:left">' + ph('ordQuality') + '</td></tr>' +
        '<tr><td class="label">检测项目<br><span style="font-size:10px">Test items</span></td><td style="text-align:left">' + ph('resName') + '</td></tr>' +
        '</table>';
    }

    function renderPoDocument(type) {
      document.getElementById('poDocument').innerHTML = type === 'record' ? renderRecordDocument() : renderReportDocument();
    }

    function renderPoFieldTabs() {
      document.getElementById('poFieldTabs').innerHTML = PO_FIELD_TABS.map(function (t) {
        return '<div class="po-field-tab' + (t.id === state.poTab ? ' active' : '') + '" onclick="switchPoTab(\'' + t.id + '\')">' + t.label + '</div>';
      }).join('');
    }

    function renderPoFields() {
      var kw = (document.getElementById('poFieldSearch').value || '').trim().toLowerCase();
      var tab = PO_FIELD_TABS.find(function (t) { return t.id === state.poTab; }) || PO_FIELD_TABS[0];
      var html = '';
      (tab.groups || []).forEach(function (g, gi) {
        var fields = (g.fields || []).filter(function (f) { return !kw || f.toLowerCase().includes(kw); });
        if (!fields.length && kw) return;
        html += '<div class="po-field-group"><div class="po-field-group-head" onclick="togglePoGroup(' + gi + ')">' +
          '<i class="fa fa-caret-' + (g.open !== false ? 'down' : 'right') + ' text-slate-400"></i>' + g.title + '</div>';
        if (g.open !== false) {
          fields.forEach(function (f) {
            html += '<div class="po-field-item"><span class="name" title="' + f + '">' + f + '</span>' +
              '<span class="acts"><button class="add" onclick="alert(\'添加字段 ' + f + '（原型演示）\')">添加</button>' +
              '<button class="del" onclick="alert(\'删除字段（原型演示）\')">删除</button>' +
              '<button class="loc" onclick="alert(\'定位字段（原型演示）\')">定位</button></span></div>';
          });
        }
        html += '</div>';
      });
      document.getElementById('poFieldBody').innerHTML = html || '<div class="py-8 text-center text-slate-400 text-sm">无匹配字段</div>';
    }

    function switchPoTab(id) {
      state.poTab = id;
      renderPoFieldTabs();
      renderPoFields();
    }

    function togglePoGroup(index) {
      var tab = PO_FIELD_TABS.find(function (t) { return t.id === state.poTab; });
      if (tab && tab.groups[index]) {
        tab.groups[index].open = tab.groups[index].open === false;
        renderPoFields();
      }
    }

    function filterPoFields() { renderPoFields(); }

    function openPageOffice(type, rowId) {
      state.poType = type;
      state.poTab = type === 'record' ? 'result' : 'report';
      var fileName = '模板.docx';
      if (type === 'record' && rowId) {
        var row = findRecord(rowId);
        if (row && row.file) fileName = row.file;
      } else if (type === 'body') {
        fileName = 'PVC-C报告模板V1.doc';
      } else if (type === 'public') {
        fileName = '电网物资通用模板头.doc';
      }
      document.getElementById('poFileName').textContent = fileName;
      document.getElementById('poFieldSearch').value = '';
      renderPoDocument(type);
      renderPoFieldTabs();
      renderPoFields();
      document.getElementById('pageOfficeModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePageOffice() {
      document.getElementById('pageOfficeModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function savePageOffice() {
      closePageOffice();
      alert('模板已保存（PageOffice 原型演示）');
    }

    renderTree();
    renderView();

        { id: 'record-tree-count', selector: '[data-annotate="record-tree-count"]', position: 'top-right', title: '单试验项配置进度', content: '括号内为（已配置模板的试验项数 / 试验项总数），如 4/7 表示 7 个试验项中已有 4 个绑定了模板。', tag: '记录单' },
        { id: 'btn-add', selector: '[data-annotate="btn-add"]', position: 'top-left', title: '新增模板', content: '打开新增/编辑弹窗，配置样品、试验项、模板文件及公共头尾引用。', tag: '报告模板' },
        { id: 'row-edit', selector: '[data-annotate="row-edit"]', position: 'top-right', title: '编辑', wide: true, content: '可编辑样品名称、关联试验项、更新模板文件、关联头尾等信息。', tag: '操作说明' },
        { id: 'row-delete', selector: '[data-annotate="row-delete"]', position: 'top-right', title: '删除', content: '删除该条模板配置记录。', tag: '操作说明' },
        { id: 'record-config', selector: '[data-annotate="record-config"]', position: 'top-right', title: '版本管理', wide: true, content: '同一试验项可存多个模板版本，通过单选启用其中一个；导出时使用启用模板。点击「配置」进入 PageOffice 编辑当前启用模板。', tag: '记录单' },
        { id: 'po-config', selector: '[data-annotate="po-config"]', position: 'top-right', title: 'PageOffice 配置', wide: true, content: '点击「配置」调用 PageOffice 插件打开编辑窗口：左侧为 Word 模板预览区，右侧为配置字段面板（检测中心信息、合同信息、报告信息、设备信息、样品信息、试验结果集）。记录单与报告模板左侧内容不同。', tag: '模板配置' },
        { id: 'record-clear', selector: '[data-annotate="record-clear"]', position: 'top-right', title: '清除', content: '仅清除模板文件关联，不删除试验项数据行。', tag: '记录单' },
        { id: 'record-upload', selector: '[data-annotate="record-upload"]', position: 'top-right', title: '上传', content: '未配置模板的试验项可上传模板文件。', tag: '记录单' },
        { id: 'record-copy', selector: '[data-annotate="record-copy"]', position: 'top-right', title: '复制', content: '从其他样品/试验项复制已有模板，避免重复上传。', tag: '记录单' },
        { id: 'record-export-logic', selector: '#infoBar', position: 'top-left', title: '导出拼接逻辑', wide: true, content: '无需配置「多试验项」。用户导出时，系统自动按检测员实际做的试验项，拉取各试验项启用模板并拼接为一个文件。', tag: '产品逻辑' }
      ]
    });
  </script>
