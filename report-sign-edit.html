<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告签发工作台 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88);
      --line: rgba(20,60,154,.12); --ink: #1e2a44;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(20,60,154,.28); border-radius: 6px; }
    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08), inset 0 1px 0 rgba(255,255,255,.6); border-radius: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }
    .wb-shell { display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; }
    .wb-left { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .wb-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .wb-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
    .wb-feedback { flex-shrink: 0; margin-top: 12px; }
    .glass-sm { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6); box-shadow: 0 4px 16px rgba(20,60,154,.06); border-radius: 12px; }
    .brand-grad { background: linear-gradient(120deg, var(--brand) 0%, var(--brand-2) 70%, var(--brand-3) 120%); }
    .info-tab.active { color: var(--brand); border-color: var(--brand); font-weight: 600; }
    .eq-card { border: 1px solid rgba(20,60,154,.12); border-radius: 10px; background: linear-gradient(180deg,#fff,#f8fafc); padding: 10px 12px; }
    .eq-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px 12px; }
    .eq-grid .eq-k { color: #94a3b8; font-size: 11px; }
    .eq-grid .eq-v { color: #1e293b; font-weight: 600; }
    .raw-card { border: 1px solid rgba(20,60,154,.12); border-radius: 10px; background: #fff; }
    .phase-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .phase-tab { border: 1px solid var(--line); background: #fff; color: #475569; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
    .phase-tab.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .phase-tab .ph-conc { margin-left: 6px; font-size: 10px; opacity: .9; }
    .fg-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .fg-table th, .fg-table td { border: 1px solid #e2e8f0; padding: 4px 6px; white-space: nowrap; }
    .fg-table th.g-nom { background: #eff6ff; color: #1d4ed8; }
    .fg-table th.g-mea { background: #f0fdf4; color: #047857; }
    .fg-table th.g-calc { background: #fff7ed; color: #c2410c; }
    .fg-table td.conc-ok { color: #047857; font-weight: 600; vertical-align: middle; text-align: center; }
    .roster-row { border: 1px solid rgba(20,60,154,.08); border-radius: 10px; background: #fff; }
    .roster-row:hover { background: #f8fafc; border-color: rgba(20,60,154,.18); }
    .roster-row.active { background: linear-gradient(90deg, rgba(20,60,154,.10), rgba(20,60,154,0)); box-shadow: inset 3px 0 0 var(--brand); }
    .preview-frame { width: 100%; height: 100%; min-height: 420px; border: 0; border-radius: 8px; background: #fff; }
    .audit-tl { list-style: none; margin: 0; padding: 0; }
    .audit-tl-item { display: grid; grid-template-columns: 18px minmax(0,1fr); column-gap: 12px; }
    .audit-rail { position: relative; }
    .audit-rail::after { content: ""; position: absolute; left: 50%; top: 18px; bottom: 0; width: 2px; transform: translateX(-50%); background: var(--rail, #cbd5e1); }
    .audit-tl-item:last-child .audit-rail::after { display: none; }
    .audit-dot { position: relative; z-index: 1; display: block; width: 14px; height: 14px; margin: 3px auto 0; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--dot, #94a3b8); background: var(--dot, #94a3b8); }
    .audit-tl-item.tone-success { --rail:#10b981; --dot:#10b981; }
    .audit-tl-item.tone-warn { --rail:#f59e0b; --dot:#f59e0b; }
    .audit-tl-item.tone-danger { --rail:#ef4444; --dot:#ef4444; }
    .audit-tl-item.tone-pending { --rail:#f59e0b; --dot:#fff; }
    .audit-main { min-width: 0; padding: 0 0 16px; }
    .btn-brand { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 6px 18px rgba(20,60,154,.30); }
    .btn-brand:hover { box-shadow: 0 8px 26px rgba(20,60,154,.42); }
    .btn-brand:disabled { filter: grayscale(.4) opacity(.55); box-shadow: none; cursor: not-allowed; }
    .roster-tabs { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .roster-tab { padding: 3px 10px; font-size: 11px; color: #64748b; }
    .roster-tab.is-on { background: var(--brand); color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="flex h-screen flex-col overflow-hidden">
    <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="report-sign.html">
      <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
      <a href="report-sign.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告签发</a>
      <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
        报告签发工作台
        <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
      </span>
    </div>

    <div id="wb-page" class="flex flex-1 flex-col gap-3 overflow-hidden p-3" style="min-height:0">
      <div class="flex items-center gap-2 rounded-xl border border-white/60 bg-white/55 px-4 py-2 text-sm backdrop-blur" style="color:var(--brand)">
        <i class="fa fa-file-text-o"></i>
        <span>授权签字人查看报告文件、收样与检测信息后签发。退回须填写原因。</span>
      </div>
      <div id="sign-return-strip"></div>

      <section class="glass" data-annotate="sg-overview">
        <button id="ov-toggle" type="button" class="flex w-full items-center justify-between gap-3 px-4 py-2.5 text-left">
          <span class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
            <span class="font-semibold" style="color:var(--brand)"><i class="fa fa-folder-open-o mr-1"></i><span id="ov-code" class="mono"></span></span>
            <span class="text-slate-500" id="ov-customer"></span>
            <span class="text-slate-500" id="ov-sample"></span>
            <span class="text-slate-500">报告 <b class="text-slate-700 mono" id="ov-count"></b> 份</span>
            <span class="text-slate-500">受理 <span id="ov-accept" class="mono"></span></span>
            <span class="text-slate-500">要求完成 <span id="ov-require" class="mono"></span></span>
            <span class="chip bg-blue-50 text-blue-700" id="ov-status"></span>
          </span>
          <span class="flex items-center gap-1 text-xs" style="color:var(--brand)"><span id="ov-toggle-text">展开</span><i id="ov-chevron" class="fa fa-angle-down"></i></span>
        </button>
        <div id="ov-body" class="hidden border-t border-white/50 px-4 pb-3 pt-2">
          <div class="mb-2 flex items-center gap-1 text-sm">
            <button type="button" class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="contract">合同信息</button>
            <button type="button" class="ov-tab rounded-lg px-3 py-1" data-tab="entrust" style="background:rgba(20,60,154,.08);color:var(--brand)">委托信息</button>
            <button type="button" class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="pay">付款信息</button>
            <button type="button" class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="report">报告信息</button>
          </div>
          <div id="ov-panel" class="text-sm text-slate-600"></div>
        </div>
      </section>

      <div class="wb-shell">
        <aside class="wb-left">
          <section class="glass flex flex-col" style="min-height:0;flex:0 0 auto;max-height:58%">
            <div class="flex items-center gap-2 border-b border-white/50 px-3 py-1.5 text-xs font-medium text-slate-500">
              <i class="fa fa-files-o" style="color:var(--brand)"></i>待签发
              <div class="roster-tabs">
                <button type="button" class="roster-tab is-on">待签发 <span id="tab-need-n" class="font-normal opacity-80">0</span></button>
              </div>
            </div>
            <div id="roster-summary" class="px-3 pt-1.5 pb-1 text-xs text-slate-500"></div>
            <div id="roster-list" class="overflow-y-auto px-2 pb-2" style="min-height:0" data-annotate="sg-roster"></div>
          </section>
          <section class="glass flex flex-1 flex-col" style="min-height:0" data-annotate="sg-log">
            <div class="flex items-center gap-2 border-b border-white/50 px-3 py-2 text-xs font-medium text-slate-500"><i class="fa fa-history" style="color:var(--brand)"></i>操作日志 <span id="log-report" class="text-slate-400 mono"></span></div>
            <div id="log-list" class="flex-1 overflow-y-auto px-3 py-3 text-xs" style="min-height:0"></div>
          </section>
        </aside>

        <div class="wb-main" id="wb-main">
          <div class="wb-scroll">
            <section class="glass px-4 py-3" data-annotate="sg-file">
              <div class="min-w-0">
                <div class="text-xs text-slate-400">报告文件</div>
                <div class="mt-0.5 flex min-w-0 items-center gap-2">
                  <a href="#" id="rp-file" class="truncate text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-file-word-o mr-1"></i></a>
                  <span id="rp-version" class="chip brand-grad text-white mono flex-shrink-0">V1.0</span>
                </div>
              </div>
              <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-500">
                <span>编制人 <b class="text-slate-700" id="rp-compiler"></b></span>
                <span>编制时间 <span class="mono" id="rp-compiletime"></span></span>
                <span id="rp-version-prev" class="text-slate-400"></span>
              </div>
            </section>
            <section class="glass flex flex-1 flex-col" style="min-height:0" data-annotate="sg-info">
              <div class="flex items-center gap-1 border-b border-white/50 px-2 pt-2 text-xs whitespace-nowrap">
                <button type="button" class="info-tab active border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="preview">报告预览</button>
                <button type="button" class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="recv">收样信息</button>
                <button type="button" class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="detect">检测信息</button>
              </div>
              <div id="info-body" class="flex-1 overflow-y-auto p-3 text-sm" style="min-height:0"></div>
            </section>
          </div>

          <section class="wb-feedback glass" data-annotate="sg-action">
            <div class="flex items-center gap-2 border-b border-white/50 px-4 py-2 text-sm font-semibold" style="color:var(--brand)">
              <i class="fa fa-gavel"></i>签发处置
              <span id="fb-report" class="text-xs font-normal text-slate-400 mono"></span>
            </div>
            <div class="flex flex-wrap items-end gap-3 px-4 py-3">
              <label class="min-w-[220px] flex-1 text-xs text-slate-500">退回原因
                <input id="fb-reason" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm text-slate-700 outline-none focus:border-blue-500" placeholder="退回报告审核时必填" />
              </label>
              <button type="button" id="btn-back" class="rounded-lg bg-amber-500 px-5 py-2 text-sm text-white hover:bg-amber-600">退回</button>
              <button type="button" id="btn-pass" class="btn-brand rounded-lg px-5 py-2 text-sm">签发通过</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/return-store.js"></script>
  <script src="js/return-ui.js"></script>
  <script src="js/audit-log.js"></script>
  <script src="js/report-flow-store.js"></script>
  <script src="js/report-review-mock.js"></script>
  <script src="js/report-info-panel.js"></script>
  <script src="js/report-sign-workbench.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    ReportSignWorkbench.boot();
    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'sg-overview', selector: '[data-annotate="sg-overview"]', position: 'bottom', title: '任务概览',
          content: '<strong>需求逻辑：</strong>签发前先确认这是哪张委托、客户/样品、几份报告、节点状态，避免签错单。<br><strong>展示规则：</strong>摘要行含委托号、客户、样品、报告份数、受理/要求完成日期、状态；展开后为合同 / 委托 / 付款 / 报告四个 Tab（与审核工作台对齐）。<br><strong>交互逻辑：</strong>点标题行展开/收起；切 Tab 只换概览内容，不换当前报告。', tag: '报告签发' },
        { id: 'sg-roster', selector: '[data-annotate="sg-roster"]', position: 'right', title: '待签发名单',
          content: '<strong>需求逻辑：</strong>授权签字人一次可能签发同一委托下多份报告，左侧名单用来切换当前份。<br><strong>展示规则：</strong>卡片展示报告编号、版本、状态；当前份高亮。<br><strong>交互逻辑：</strong>点击切换中间预览、操作日志与底部签发处置对象。', tag: '报告签发' },
        { id: 'sg-log', selector: '[data-annotate="sg-log"]', position: 'right', title: '操作日志',
          content: '<strong>需求逻辑：</strong>签发前要能看到编制提交、AI 预审、人工审核的留痕。<br><strong>展示规则：</strong>当前报告的流转时间轴。系统自动推进不单独占点，只标出节点之间的去向。<br><strong>交互逻辑：</strong>只读；随左侧名单切换。', tag: '报告签发' },
        { id: 'sg-file', selector: '[data-annotate="sg-file"]', position: 'bottom', title: '报告文件',
          content: '<strong>需求逻辑：</strong>签发看的是编制提交的 Word 报告正文，不在本页做 AI 核对。正式 PDF 只在签发通过后生成，避免未签字版本外流。<br><strong>展示规则：</strong>本页文件名为 .docx，Word 图标；签发通过后进入报告处理，文件名改为 .pdf。<br><strong>交互逻辑：</strong>点击文件名打开预览（原型为 HTML 示意）。预览在下方「报告预览」Tab。', tag: '报告签发' },
        { id: 'sg-info', selector: '[data-annotate="sg-info"]', position: 'top', title: '报告预览 / 收样 / 检测',
          content: '<strong>需求逻辑：</strong>签字人对照报告正文、收样信息、检测数据后再决定通过或退回。<br><strong>展示规则：</strong>三个 Tab：报告预览、收样信息、检测信息。<br><strong>交互逻辑：</strong>切 Tab 不改当前报告；预览为报告 PDF/正文示意。', tag: '报告签发' },
        { id: 'sg-action', selector: '[data-annotate="sg-action"]', position: 'top', title: '签发处置',
          content: '<strong>需求逻辑：</strong>通过进入报告处理；退回必须写原因，打回报告审核。<br><strong>展示规则：</strong>退回原因输入框 + 退回 + 签发通过。<br><strong>交互逻辑：</strong>退回时空原因拦截；签发通过后回到签发名单。', tag: '报告签发' }
      ] });
    }
  </script>
  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=8" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
