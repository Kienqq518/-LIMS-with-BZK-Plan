<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告审核工作台 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88); --glass-strong: rgba(255,255,255,.94);
      --line: rgba(20,60,154,.12); --ink: #1e2a44; --mut: #64748b;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        radial-gradient(800px 600px at 60% 110%, rgba(20,60,154,.03), transparent 62%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(20,60,154,.28); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08), inset 0 1px 0 rgba(255,255,255,.6); border-radius: 16px; }
    .glass-sm { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6); box-shadow: 0 4px 16px rgba(20,60,154,.06); border-radius: 12px; }
    .brand-grad { background: linear-gradient(120deg, var(--brand) 0%, var(--brand-2) 70%, var(--brand-3) 120%); }
    .btn-brand { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 6px 18px rgba(20,60,154,.30); transition: all .2s; }
    .btn-brand:hover { box-shadow: 0 8px 26px rgba(20,60,154,.42); transform: translateY(-1px); }
    .btn-brand:disabled { filter: grayscale(.4) opacity(.6); box-shadow: none; transform: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }

    /* 满铺布局（注解画布里 min-h-screen → 设计高度，可填满 16:9/16:10/4:3） */
    .wb-shell { display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; }
    .wb-left { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .wb-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .wb-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; gap: 12px; padding-bottom: 4px; }
    .wb-center, .wb-right { flex: 1 1 0; min-width: 0; }
    .wb-right { display: flex; flex-direction: column; gap: 12px; }
    .wb-main.is-right-only .wb-center { display: none; }
    .wb-main.is-center-only .wb-right { display: none; }
    /* 人工处置固定底栏：跨中+右等宽，不随内容滚动 */
    .wb-feedback { flex-shrink: 0; margin-top: 12px; }
    @media (max-width: 1180px) {
      .wb-scroll { flex-direction: column; overflow-y: auto; }
      .wb-center, .wb-right { width: 100%; flex: 1 1 auto; }
      .wb-main.is-right-only .wb-center, .wb-main.is-center-only .wb-right { display: none; }
    }

    .roster-row { border: 1px solid transparent; border-radius: 12px; background: rgba(255,255,255,.45); }
    .roster-row:hover { background: rgba(255,255,255,.75); }
    .sum-grid { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 4px 12px; align-items: start; }
    .sum-grid .k { color: #64748b; }
    .sum-grid .v { color: #1e293b; font-weight: 500; }
    .sum-grid .full { display: contents; }
    #info-body { display: flex; flex-direction: column; }
    .round-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .round-tab { flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: #64748b; border-radius: 999px; padding: 3px 10px; font-size: 11px; }
    .round-tab.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .fb-banner { border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
    .fb-banner.idle { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .fb-banner.back { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .fb-banner.need { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .policy-sw { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; color: #475569; }
    .preview-frame { width: 100%; flex: 1 1 auto; min-height: 0; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
    .rule-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; min-width: 56px; }
    .log-who { display: inline-flex; align-items: center; gap: 4px; color: #334155; font-weight: 500; }

    /* 操作日志时间轴（参考报告编制模块 audit-tl 彩色样式） */
    .audit-tl { list-style: none; margin: 0; padding: 0; }
    .audit-tl-item { display: grid; grid-template-columns: 18px minmax(0,1fr); column-gap: 12px; }
    .audit-rail { position: relative; }
    .audit-rail::after { content: ""; position: absolute; left: 50%; top: 18px; bottom: 0; width: 2px; transform: translateX(-50%); background: var(--rail, #cbd5e1); }
    .audit-tl-item:last-child .audit-rail::after { display: none; }
    .audit-dot { position: relative; z-index: 1; display: block; width: 14px; height: 14px; margin: 3px auto 0; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--dot, #94a3b8); background: var(--dot, #94a3b8); box-shadow: 0 0 0 3px rgba(148,163,184,.14); }
    .audit-tl-item.tone-success { --rail:#10b981; --dot:#10b981; }
    .audit-tl-item.tone-warn { --rail:#f59e0b; --dot:#f59e0b; }
    .audit-tl-item.tone-danger { --rail:#ef4444; --dot:#ef4444; }
    .audit-tl-item.tone-pending { --rail:#94a3b8; --dot:#fff; }
    .audit-tl-item.tone-pending .audit-dot { box-shadow: 0 0 0 3px rgba(245,158,11,.18); border-color:#f59e0b; }
    .audit-main { min-width: 0; padding: 0 0 16px; }

    /* 花名册 */
    .roster-row.active { background: linear-gradient(90deg, rgba(20,60,154,.10), rgba(20,60,154,0)); box-shadow: inset 3px 0 0 var(--brand); }
    .state-chip { font-weight: 600; }
    .need-action { animation: pulseA 2.2s ease-in-out infinite; }
    @keyframes pulseA { 0%,100%{ box-shadow: 0 0 0 0 rgba(245,158,11,.5);} 50%{ box-shadow: 0 0 0 5px rgba(245,158,11,0);} }

    /* 规则项：以规则名为主体，按通过与否整条变色 */
    .rule-item { border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; transition: all .18s; }
    .rule-item.r-pass { background: linear-gradient(90deg, rgba(16,185,129,.09), rgba(16,185,129,.02)); border-color: rgba(16,185,129,.30); border-left: 4px solid #10b981; }
    .rule-item.r-warn { background: linear-gradient(90deg, rgba(245,158,11,.12), rgba(245,158,11,.03)); border-color: rgba(245,158,11,.38); border-left: 4px solid #f59e0b; }
    .rule-item.r-sev  { background: linear-gradient(90deg, rgba(239,68,68,.12), rgba(239,68,68,.03)); border-color: rgba(239,68,68,.40); border-left: 4px solid #ef4444; }
    .lvl-region { border-radius: 14px; border: 1px dashed rgba(20,60,154,.18); padding: 10px; background: rgba(255,255,255,.35); }
    .lvl-badge { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color:#fff; border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 600; letter-spacing:.02em; }

    .info-tab.active { color: var(--brand); border-color: var(--brand); font-weight: 600; }
    .prog-rule .st-run { color: var(--brand-2); }
    .prog-rule .st-pass { color: #10b981; }
    .prog-rule .st-fail { color: #ef4444; }
    #ai-progress { background: linear-gradient(120deg, rgba(46,91,214,.08), rgba(91,141,239,.04)); }
  </style>
</head>
<body class="text-slate-700">

  <div class="h-screen flex flex-col overflow-hidden">
  <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="report-review.html">
    <a href="report-review.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告审核</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
      报告审核工作台
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div id="wb-page" class="flex flex-1 flex-col gap-3 overflow-hidden p-3" style="min-height:0">
    <div id="ai-liability" class="flex items-center gap-2 rounded-xl border border-white/60 bg-white/55 px-4 py-2 text-sm backdrop-blur" style="color:var(--brand)">
      <i class="fa fa-shield"></i>
      <span>AI 仅输出预审意见与问题清单，最终核准与签发由授权审核员确认；下方「标注」仅用于 AI 模型持续学习，不对上下游人员展示。</span>
    </div>

    <!-- A 区：委托概览（默认折叠） -->
    <section class="glass" data-annotate="rv-overview">
      <button id="ov-toggle" type="button" class="flex w-full items-center justify-between gap-3 px-4 py-2.5 text-left">
        <span class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
          <span class="font-semibold" style="color:var(--brand)"><i class="fa fa-folder-open-o mr-1"></i><span id="ov-code" class="mono"></span></span>
          <span class="text-slate-500" id="ov-customer"></span>
          <span class="text-slate-500" id="ov-sample"></span>
          <span class="text-slate-500">报告 <b class="text-slate-700 mono" id="ov-count"></b> 份</span>
          <span class="text-slate-500">受理 <span id="ov-accept" class="mono"></span></span>
          <span class="text-slate-500">要求完成 <span id="ov-require" class="mono"></span></span>
          <span class="chip bg-blue-50 text-blue-700" id="ov-status"></span>
        </span>
        <span class="flex items-center gap-1 text-xs" style="color:var(--brand)"><span id="ov-toggle-text">展开</span><i id="ov-chevron" class="fa fa-angle-down"></i></span>
      </button>
      <div id="ov-body" class="hidden border-t border-white/50 px-4 pb-3 pt-2">
        <div class="mb-2 flex items-center gap-1 text-sm">
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="contract">合同信息</button>
          <button class="ov-tab rounded-lg px-3 py-1" data-tab="entrust" style="background:rgba(20,60,154,.08);color:var(--brand)">委托信息</button>
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="pay">付款信息</button>
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="report">报告信息</button>
        </div>
        <div id="ov-panel" class="text-sm text-slate-600"></div>
      </div>
    </section>

    <!-- B 区：审核操作台 -->
    <div class="wb-shell">
      <!-- 左：统观 + 操作日志 -->
      <aside class="wb-left">
        <section class="glass flex flex-col" style="min-height:0;flex:0 0 auto;max-height:52%">
          <div id="roster-summary" class="px-3 pt-3 pb-2 text-xs text-slate-500"></div>
          <div id="roster-list" class="overflow-y-auto px-2 pb-2" style="min-height:0" data-annotate="rv-roster"></div>
        </section>
        <section class="glass flex flex-1 flex-col" style="min-height:0" data-annotate="rv-log">
          <div class="flex items-center gap-2 border-b border-white/50 px-3 py-2 text-xs font-medium text-slate-500"><i class="fa fa-history" style="color:var(--brand)"></i>操作日志 <span id="log-report" class="text-slate-400 mono"></span></div>
          <div id="log-list" class="flex-1 overflow-y-auto px-3 py-3 text-xs" style="min-height:0"></div>
        </section>
      </aside>

      <!-- 中 + 右 + 固定反馈底栏 -->
      <div class="wb-main" id="wb-main">
        <div class="wb-scroll">
          <!-- 中：AI 审核结果 -->
          <section class="wb-center glass flex flex-col" style="min-height:0" data-annotate="rv-ai">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-white/50 px-4 py-2.5">
              <div class="flex items-center gap-2 text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-magic"></i>AI 审核结果
                <span id="ai-report-no" class="text-xs font-normal text-slate-400 mono"></span></div>
              <div class="flex items-center gap-2">
                <span id="ai-round" class="chip bg-slate-100 text-slate-500 mono"></span>
                <button id="btn-rerun" type="button" class="rounded-lg border px-2.5 py-1 text-xs" style="border-color:var(--brand);color:var(--brand)"><i class="fa fa-refresh mr-1"></i>重跑 AI 审核</button>
                <button id="btn-expand-center" type="button" class="rounded-md border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-white/60"><i class="fa fa-expand mr-1"></i><span>展开</span></button>
              </div>
            </div>
            <div id="signoff-banner" class="hidden border-b border-amber-200/60 bg-amber-50/70 px-4 py-2 text-xs text-amber-800"></div>
            <div id="ai-rounds" class="hidden border-b border-white/50 px-4 py-1.5"></div>
            <div class="flex-1 overflow-y-auto px-4 py-3" style="min-height:0">
              <!-- 综合结论置顶 -->
              <div id="ai-summary" class="mb-3 rounded-xl border px-4 py-3 text-xs leading-6" style="border-color:rgba(20,60,154,.2);background:linear-gradient(120deg,rgba(46,91,214,.1),rgba(91,141,239,.04))"></div>
              <!-- 加载进度 -->
              <div id="ai-progress" class="hidden mb-3 rounded-xl border border-blue-100 px-3 py-2">
                <div class="mb-1.5 text-xs" style="color:var(--brand)"><i class="fa fa-spinner fa-spin mr-1"></i>AI 正在逐条执行审核规则…</div>
                <div id="ai-progress-list" class="space-y-1 text-xs"></div>
              </div>
              <div id="ai-diff" class="hidden mb-3 rounded-xl border border-slate-200 bg-white/60 px-3 py-2 text-xs"></div>
              <div id="ai-issues" class="space-y-3"></div>
              <div id="ai-notices"></div>
            </div>
          </section>

          <!-- 右：报告文件 + 预览 + 收样/检测 -->
          <div class="wb-right">
            <section class="glass px-4 py-3" data-annotate="rv-file">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs text-slate-400">报告文件</div>
                  <a href="#" id="rp-file" onclick="openPageOffice(this.textContent);return false;" class="block truncate text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-file-word-o mr-1"></i></a>
                </div>
                <span id="rp-version" class="chip brand-grad text-white mono flex-shrink-0">V1.0</span>
              </div>
              <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-500">
                <span>编制人 <b class="text-slate-700" id="rp-compiler"></b></span>
                <span>编制时间 <span class="mono" id="rp-compiletime"></span></span>
                <span id="rp-version-prev" class="text-slate-400"></span>
              </div>
            </section>
            <section class="glass flex flex-1 flex-col" style="min-height:260px" data-annotate="rv-info">
              <div class="flex items-center gap-1 border-b border-white/50 px-2 pt-2 text-xs whitespace-nowrap">
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500 active" data-panel="preview">报告预览</button>
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="recv">收样信息</button>
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="detect">检测信息</button>
                <button id="btn-expand-right" type="button" class="ml-auto rounded-md border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-white/60"><i class="fa fa-expand mr-1"></i><span>展开</span></button>
              </div>
              <div id="info-body" class="flex-1 overflow-y-auto p-3 text-sm" style="min-height:0"></div>
            </section>
          </div>
        </div>

        <!-- 固定人工处置底栏（跨 中+右，不随滚动） -->
        <section class="wb-feedback glass" data-annotate="rv-manual">
          <div class="flex items-center gap-2 border-b border-white/50 px-4 py-2 text-sm font-semibold" style="color:var(--brand)">
            <i class="fa fa-gavel"></i>人工处置
            <span id="fb-report" class="text-xs font-normal text-slate-400 mono"></span>
            <button id="policy-toggle" type="button" data-auto="1" class="policy-sw ml-auto" title="原型演示：严重项是否自动退回编制">
              <i class="fa fa-toggle-on" style="color:var(--brand)"></i>自动退回：开
            </button>
          </div>
          <div id="fb-status" class="px-4 pt-3"></div>
          <div id="manual-feedback" class="px-4 pb-3 pt-2"></div>
        </section>
      </div>
    </div>
  </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function qp(name) { var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }
    function openPageOffice(name) { alert('PageOffice 插件预览：' + name + '（原型占位）'); }

    var CODE = qp('code') || 'SC2026/0238';
    var entrust = ReportReviewMock.getEntrust(CODE);
    var RT = {};
    var selectedId = null;
    var report0 = null;
    var splitMode = 'split';

    // ---------- 委托概览 ----------
    function row(label, val) { return '<div><span class="text-slate-400">' + label + '：</span><span class="text-slate-700">' + esc(val) + '</span></div>'; }
    function ovPanel(tab) {
      var e = entrust;
      if (tab === 'contract') { var c = e.contractInfo || {}; return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('是否框架合同', c.frame) + row('合同编号', c.contractNo) + row('签约地点', c.signPlace) + row('签约日期', c.signDate) + row('检测中心', c.center) + '</div>'; }
      if (tab === 'pay') { var p = e.payInfo || {}; return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('样品检测总价(元)', p.total) + row('实际费用(元)', p.actual) + row('折扣率(%)', p.discount) + row('付款方式', p.way) + row('付款单位', p.payer) + row('业务备注', p.note) + '</div>'; }
      if (tab === 'report') { var r = e.reportInfo || {}; return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('报告传送方式', r.send) + row('报告资质', r.qualify) + row('结果方式', r.resultMode) + row('报告语言', r.lang) + row('份数', r.copies) + row('报告描述', r.desc) + '</div>'; }
      return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('委托编号', e.code) + row('客户单位', e.customer) + row('样品名称', e.sample) + row('优先等级', e.priority) + row('送样时间', e.sendDate) + row('要求完成', e.requireDate) + row('受理日期', e.acceptDate) + row('编制人', e.compiler) + row('任务状态', e.status) + '</div>';
    }
    function initOverview() {
      $('ov-code').textContent = entrust.code; $('ov-customer').textContent = entrust.customer; $('ov-sample').textContent = entrust.sample;
      $('ov-count').textContent = entrust.reports.length; $('ov-accept').textContent = entrust.acceptDate;
      $('ov-require').textContent = entrust.requireDate || '—'; $('ov-status').textContent = entrust.status;
      $('ov-panel').innerHTML = ovPanel('entrust');
      $('ov-toggle').addEventListener('click', function () {
        var open = $('ov-body').classList.toggle('hidden') === false;

    // ---------- 轮次 ----------
    function roundsOf(r) { return RT[r.id].rounds; }

    function currentResult(r) { return resultAt(r, curIndex(r)); }
    function getSelected() { for (var i = 0; i < entrust.reports.length; i++) if (entrust.reports[i].id === selectedId) return entrust.reports[i]; return null; }

    function badge(c, small) { var m = ReportReviewMock.CONCLUSION_META[c]; return '<span class="chip ' + m.cls + ' ' + (small ? '' : 'text-sm px-3 py-1') + '"><i class="fa ' + m.icon + '"></i>' + c + '</span>'; }

    // 报告「业务状态」（以是否需操作为主视觉）
    function stateMeta(rep) {
      if (rep.disposition) return { label: '已' + rep.disposition.final, cls: 'bg-emerald-100 text-emerald-700', need: false };
      if (rep.state === '自动退回编制') return { label: '已自动退回编制', cls: 'bg-red-100 text-red-700', need: false };
      if (rep.state === '签发退回待复核') return { label: '签发退回 · 待复核', cls: 'bg-amber-100 text-amber-800', need: true };
      return { label: '待处置', cls: 'bg-amber-100 text-amber-800', need: true };
    }

    // ---------- 统观区 ----------
    function renderRoster() {
      var counts = { 待处置: 0, 签发退回: 0, 自动退回: 0, 已处置: 0 };
      var rows = entrust.reports.map(function (rep) {
        var r = currentResult(rep); var sm = stateMeta(rep);
        if (rep.disposition) counts['已处置']++; else if (rep.state === '自动退回编制') counts['自动退回']++;
        else if (rep.state === '签发退回待复核') counts['签发退回']++; else counts['待处置']++;
        var cur = ReportReviewMock.currentRound(rep);

          '<div class="flex items-center justify-between gap-2">' +
            '<span class="text-sm font-semibold text-slate-800 mono">' + esc(rep.reportNo) + '</span>' +
            '<span class="state-chip chip ' + sm.cls + (sm.need ? ' need-action' : '') + '">' + (sm.need ? '<i class="fa fa-bell-o"></i>' : '') + sm.label + '</span>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2 text-xs text-slate-400">' +

      }).join('');

      $('roster-summary').innerHTML = '本委托共 <b class="text-slate-700 mono">' + entrust.reports.length + '</b> 份报告 · 待处置 <b class="text-amber-600 mono">' + counts['待处置'] + '</b> · 签发退回 <b class="text-amber-600 mono">' + counts['签发退回'] + '</b> · 自动退回 <b class="text-red-600 mono">' + counts['自动退回'] + '</b> · 已处置 <b class="text-emerald-600 mono">' + counts['已处置'] + '</b>';
      document.querySelectorAll('.roster-row').forEach(function (b) { b.addEventListener('click', function () { select(b.getAttribute('data-report-id'), true); }); });
    }

    // ---------- 操作日志 ----------
    function renderLog(report) {
      $('log-report').textContent = '· ' + report.reportNo;
      $('log-list').innerHTML = '<ul class="audit-tl">' + (report.log || []).map(function (e) {
        return '<li class="audit-tl-item tone-' + (e.tone || 'default') + '"><div class="audit-rail"><span class="audit-dot"></span></div>' +
          '<div class="audit-main"><div class="flex items-baseline justify-between gap-2"><span class="font-medium text-slate-700">' + esc(e.node) + '</span><span class="text-[11px] text-slate-400 mono">' + esc(e.at) + '</span></div>' +
          '<div class="mt-0.5 log-who"><i class="fa fa-user-o text-slate-400"></i>' + esc(e.by || '系统') + '</div>' +
          '<div class="mt-0.5 text-slate-500">' + esc(e.text) + '</div></div></li>';
      }).join('') + '</ul>';
    }

    // ---------- AI 结果 ----------
    function scopeChip(scope) { var cls = scope === '通用' ? 'bg-slate-100 text-slate-500' : 'bg-violet-100 text-violet-700'; return '<span class="chip ' + cls + '">' + (scope === '通用' ? '<i class="fa fa-cube"></i>通用规则' : '<i class="fa fa-tags"></i>' + esc(scope)) + '</span>'; }
    function sevChip(it) {
      if (it.passed) return '<span class="chip bg-emerald-100 text-emerald-700"><i class="fa fa-check"></i>通过</span>';
      return '<span class="chip bg-red-100 text-red-700"><i class="fa fa-times"></i>不通过</span>';
    }
    function sevHint(it) {
      if (it.passed) return '';
      return it.severity === '严重' ? '<span class="chip bg-red-50 text-red-600">严重</span>' : '<span class="chip bg-amber-50 text-amber-700">一般</span>';
    }
    function labelState(report, ruleId) {
      var map = (RT[report.id] && RT[report.id].labels) || {};
      return map[ruleId] || { label: '正常', note: '', submitted: false };
    }
    // 每条规则差异化证据（读取当前快照）
    function evidenceText(it, snap) {
      var s = snap || {};
      switch (it.rule_id) {
        case 'L1-a-1': return '样品编号「' + s.sample_no + '」按编号规则（字母前缀 + 年号 - 序号）校验：' + (it.passed ? '命名规范，通过。' : '为空或不符合规则。');
        case 'L3-a-1': return '检测标准号「' + s.test_standard + '」年号校验：' + (it.passed ? '带年号且现行有效。' : '缺年号或已废止。');
        case 'L2-b-1': return '委托项 [' + (s.entrust_items || []).join('、') + '] 对照实测项 [' + (s.result_params || []).join('、') + ']：' + (it.passed ? '逐项均有结果。' : '存在未覆盖项。');
        case 'L2-a-1': return '日期链 收样(' + s.receive_date + ') ≤ 检测(' + s.test_date + ') ≤ 报告(' + s.report_date + ')：' + (it.passed ? '先后合理。' : '先后颠倒。');
        case 'L2-c-1': return '设备校准有效期（' + s.device_calib_from + ' ~ ' + s.device_calib_to + '）覆盖检测日期（' + s.test_date + '）：' + (it.passed ? '已覆盖。' : '未覆盖。');
        case 'L3-a-2': return '报告引用标准「' + s.cited_standard + '」 vs 实检标准「' + s.test_standard + '」：' + (it.passed ? '一致。' : '不一致（注意年号差异）。');
        case 'L1-b-1': var g = s.signatures || {}; return '签名位 检测=' + (g.tester || '缺') + ' / 审核=' + (g.reviewer || '缺') + ' / 批准=' + (g.approver || '缺') + '：' + (it.passed ? '齐全。' : '存在缺位。');
        case 'L1-d-1': return '计量单位 [' + (s.units || []).map(function (u) { return u.param + '→' + u.unit; }).join('、') + '] 对照允许单位集合：' + (it.passed ? '均匹配。' : '存在越界单位。');
        case 'PG-CABLE-01': return '导体直流电阻 实测 ' + s.conductor_resistance + ' Ω/km vs 标准限值 ' + s.conductor_resistance_limit + ' Ω/km：' + (it.passed ? '未超限。' : '超过限值。');
        default: return it.message;
      }
    }
    function ruleItemHtml(it, snap, report) {
      var cls = it.passed ? 'r-pass' : (it.severity === '严重' ? 'r-sev' : 'r-warn');
      var lb = labelState(report, it.rule_id);
      var locked = !!lb.submitted;
      var showNote = lb.label === '误报' || lb.label === '漏报';
      return '<div class="rule-item ' + cls + '" data-rule-id="' + it.rule_id + '" data-scope="' + esc(it.scope) + '" data-severity="' + esc(it.severity) + '" data-passed="' + it.passed + '">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="min-w-0"><p class="text-sm font-semibold text-slate-800">' + esc(it.name) + '</p>' +
            '<div class="mt-1 flex flex-wrap items-center gap-1.5">' +
              '<span class="chip bg-slate-100 text-slate-500">' + esc(it.category || '') + '</span>' + scopeChip(it.scope) + sevHint(it) +
            '</div></div>' +
          '<div class="rule-side">' + sevChip(it) +
            '<button type="button" class="toggle-detail text-xs hover:underline" style="color:var(--brand)">展开</button></div>' +
        '</div>' +
        '<div class="item-detail mt-2 hidden rounded-lg bg-white/70 px-3 py-2 text-xs text-slate-600">' +
          '<div><b>证据：</b>' + esc(evidenceText(it, snap)) + '</div>' +
          (!it.passed && it.advice ? '<div class="mt-1"><b>建议：</b>' + esc(it.advice) + '</div>' : '') +
          '<div class="mt-2 flex flex-wrap items-center gap-1 border-t border-slate-100 pt-2">' +
            '<span class="text-slate-500" title="' + ReportReviewMock.LABEL_NOTE + '"><i class="fa fa-tag"></i> 标注</span>' +
            '<select class="item-label rounded border border-slate-300 px-1.5 py-0.5 text-xs" data-rule="' + it.rule_id + '"' + (locked ? ' disabled' : '') + '>' +
              ['正常', '误报', '漏报'].map(function (opt) { return '<option' + (lb.label === opt ? ' selected' : '') + '>' + opt + '</option>'; }).join('') +
            '</select>' +
            '<span class="label-note-wrap flex-1 items-center gap-1" style="display:' + (showNote ? 'inline-flex' : 'none') + '">' +
              '<input class="label-note flex-1 rounded border border-slate-300 px-2 py-0.5 text-xs" placeholder="请输入 误报/漏报 备注（供 AI 学习）" value="' + esc(lb.note) + '"' + (locked ? ' disabled' : '') + ' />' +
              '<button type="button" class="label-note-save rounded px-2 py-0.5 text-xs text-white" style="background:var(--brand)"' + (locked ? ' disabled' : '') + '>' + (locked ? '已提交' : '提交') + '</button>' +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    function levelName(k) { return { L1: '基础形式', L2: '数据逻辑', L3: '合规对齐', L4: '溯源验证' }[k] || k; }
    function groupByLevel(items, snap) {
      var order = ['L1', 'L2', 'L3', 'L4']; var map = {};
      items.forEach(function (it) { var k = it.level || '其他'; (map[k] = map[k] || []).push(it); });
      var keys = order.filter(function (k) { return map[k]; }).concat(Object.keys(map).filter(function (k) { return order.indexOf(k) < 0; }));
      return keys.map(function (k) {
        var hit = map[k].filter(function (i) { return !i.passed; }).length;
        return '<div class="lvl-region"><div class="mb-2 flex items-center gap-2"><span class="lvl-badge">' + k + ' ' + levelName(k) + '</span>' +
          '<span class="text-xs text-slate-400">' + map[k].length + ' 项' + (hit ? ' · <span class="text-amber-600">命中 ' + hit + '</span>' : ' · 全部通过') + '</span></div>' +
          '<div class="space-y-2">' + map[k].map(function (it) { return ruleItemHtml(it, snap, report0); }).join('') + '</div></div>';
      }).join('');
    }
    function diffHtml(diff) {
      if (!diff) return { html: '', text: '' };
      function li(a) { return a.map(function (i) { return i.name + '（' + i.rule_id + '）'; }).join('；') || '无'; }
      var html = '<div class="mb-1 font-medium text-slate-600"><i class="fa fa-exchange mr-1"></i>与上一版差异</div>' +
        '<div class="diff-resolved text-emerald-600"><i class="fa fa-check mr-1"></i>已解决：' + esc(li(diff.resolved)) + '</div>' +
        '<div class="diff-added text-red-600"><i class="fa fa-plus mr-1"></i>新命中：' + esc(li(diff.added)) + '</div>' +
        '<div class="diff-persisted text-amber-600"><i class="fa fa-dot-circle-o mr-1"></i>仍存在：' + esc(li(diff.persisted)) + '</div>';
      var text = (!diff.resolved.length && !diff.added.length && !diff.persisted.length) ? '相较上一版结果一致（无新增 / 解决项）。'
        : '相较上一版：已解决 ' + diff.resolved.length + ' 项、新命中 ' + diff.added.length + ' 项、仍存在 ' + diff.persisted.length + ' 项。';
      return { html: html, text: text };
    }
    function summaryAdvice(r) {
      return r.conclusion === '通过' ? '可执行「审核通过」。'
        : (r.conclusion === '需复核' ? '请逐项核对一般问题后，决定「人工通过」或「退回报告编制」。'
        : '命中严重项，建议「退回报告编制」补齐后重新提交。');
    }
    function summaryHtml(report, r, diffText) {
      var cat = (roundsOf(report)[curIndex(report)].snapshot || {}).category_name || '未配置品类';
      return '<span data-conclusion="' + r.conclusion + '" id="ai-conclusion"></span>' +
        '<div class="mb-2 flex items-center gap-2 font-semibold" style="color:var(--brand)"><i class="fa fa-lightbulb-o"></i>AI 综合结论 ' + badge(r.conclusion, true) + '</div>' +
        '<div class="sum-grid text-xs leading-6">' +
          '<span class="k">品类</span><span class="v">' + esc(cat) + '</span>' +
          '<span class="k">校验</span><span class="v">' + r.summary.total + ' 项（通用 ' + r.summary.universal + ' + 品类专属 ' + r.summary.category + '）</span>' +
          '<span class="k">命中</span><span class="v">严重 ' + r.severe.length + ' · 一般 ' + r.review.length + '</span>' +
          '<span class="k">结论</span><span class="v">' + esc(r.conclusion) + '</span>' +
          (diffText ? '<div class="full"><span class="k">对比</span><span class="v">' + esc(diffText) + '</span></div>' : '') +
          '<div class="full"><span class="k">建议</span><span class="v">' + esc(summaryAdvice(r)) + '</span></div>' +
          '<div class="full"><span class="k">口径</span><span class="v text-slate-500 font-normal">严重项 → 不通过；仅一般项 → 需复核；全部通过 → 通过</span></div>' +
        '</div>';
    }
    function renderRoundTabs(report) {
      var box = $('ai-rounds');
      var rounds = roundsOf(report); var cur = curIndex(report);
      if (rounds.length < 2) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      var tabs = [];
      for (var i = rounds.length - 1; i >= 0; i--) {
        tabs.push('<button type="button" class="round-tab' + (i === cur ? ' is-on' : '') + '" data-round="' + i + '">第 ' + (i + 1) + ' 轮 · ' + esc(rounds[i].revision) + '</button>');
      }
      box.classList.remove('hidden');
      box.innerHTML = '<div class="round-tabs">' + tabs.join('') + '</div>';
      box.querySelectorAll('.round-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          RT[report.id].roundIndex = parseInt(btn.getAttribute('data-round'), 10);
          var rep = getSelected();
          renderAi(rep); renderFeedback(rep); renderInfo(rep); renderRoster();
        });
      });
    }

    function renderAi(report) {
      report0 = report;
      var idx = curIndex(report); var r = resultAt(report, idx); var cur = roundsOf(report)[idx]; var snap = cur.snapshot;
      $('ai-report-no').textContent = '· ' + report.reportNo;
      $('ai-round').textContent = '第 ' + (idx + 1) + ' 轮 · ' + cur.revision + ' · ' + cur.trigger;

      if (report.signOff && report.signOff.returned) {
        $('signoff-banner').classList.remove('hidden');
        $('signoff-banner').innerHTML = '<i class="fa fa-undo mr-1"></i>本报告由报告签发退回（' + esc(report.signOff.by) + ' · ' + esc(report.signOff.at) + '）。退回意见：' + esc(report.signOff.opinion) + '<br>已退回至报告审核，<b>未自动重跑 AI</b>；下方为上次 AI 结果与人工标注，如需可点「重跑 AI 审核」。';
      } else { $('signoff-banner').classList.add('hidden'); }

      var diff = idx > 0 ? ReportReviewMock.diffRounds(resultAt(report, idx - 1), r) : null;
      var d = diffHtml(diff);
      $('ai-summary').innerHTML = summaryHtml(report, r, d.text);
      if (d.html) { $('ai-diff').classList.remove('hidden'); $('ai-diff').innerHTML = d.html; } else { $('ai-diff').classList.add('hidden'); }

      document.querySelectorAll('#ai-issues .toggle-detail').forEach(function (btn) {
        btn.addEventListener('click', function () { var dd = btn.closest('.rule-item').querySelector('.item-detail'); dd.classList.toggle('hidden'); btn.textContent = dd.classList.contains('hidden') ? '展开' : '收起'; });
      });

        });
      });
      document.querySelectorAll('#ai-issues .label-note-save').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          var wrap = b.closest('.label-note-wrap');
          var ipt = wrap.querySelector('.label-note');
          var sel = b.closest('.item-detail').querySelector('.item-label');
          if (!ipt.value.trim()) { alert('请填写备注'); return; }
          if (!RT[report.id].labels) RT[report.id].labels = {};
          RT[report.id].labels[sel.getAttribute('data-rule')] = { label: sel.value, note: ipt.value.trim(), submitted: true };
          sel.disabled = true; ipt.disabled = true; b.disabled = true; b.textContent = '已提交';
        });
      });
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function playProgress(report) {
      var r = currentResult(report); var list = r.items;
      $('ai-progress').classList.remove('hidden'); $('ai-issues').classList.add('opacity-40');
      $('ai-progress-list').innerHTML = list.map(function (it) { return '<div class="prog-rule flex items-center justify-between"><span class="text-slate-600">' + esc(it.name) + '</span><span class="st st-run">检查中…</span></div>'; }).join('');
      var nodes = Array.prototype.slice.call($('ai-progress-list').querySelectorAll('.prog-rule')); var i = 0;

      })();
    }

    // ---------- 人工反馈 ----------
    function reasonBox() {
      return '<div class="return-reason-wrap mt-3 hidden">' +
        '<div class="mb-1 flex items-center justify-between"><label class="text-xs text-slate-500"><span class="text-red-500">*</span> 退回原因</label>' +
        '<button type="button" id="btn-oneclick-reason" class="text-xs hover:underline" style="color:var(--brand)"><i class="fa fa-magic mr-1"></i>一键填入 AI 审核结论</button></div>' +
        '<textarea id="return-reason" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500" rows="2" placeholder="可点右上「一键填入 AI 审核结论」后再编辑"></textarea></div>';

    function bindCommon(report, triggerVal, alwaysReason) {

      });

    function syncPolicyToggle() {

    function bindPolicy() {

    function setFbStatus(kind, html) {

    }

    function renderFeedback(report) {
      var box = $('manual-feedback'); var r = currentResult(report);
      $('fb-report').textContent = '· ' + report.reportNo;
      syncPolicyToggle();

      if (report.disposition) {
        setFbStatus('idle', '<i class="fa fa-check-circle mr-1"></i>已进入报告审核，无需操作');
        box.innerHTML = '<div class="text-xs text-slate-500">已处置：' + esc(report.disposition.final) + '（' + esc(report.disposition.by) + ' · ' + esc(report.disposition.at) + '） · ' + esc(report.disposition.note) + '</div>';
        return;
      }
      if (r.conclusion === '不通过' && ReportReviewMock.getPolicy().autoReturnOnSevere && !(report.signOff && report.signOff.returned)) {
        setFbStatus('back', '<i class="fa fa-undo mr-1"></i>已退回报告编制，无需操作');
        box.innerHTML = '<div class="text-xs text-slate-500">命中严重项，已按行业包策略自动退回。<a href="report-list.html" class="underline" style="color:var(--brand)">前往报告编制</a> · 演示人工覆盖请把右上「自动退回」切为「关」。</div>';
        return;
      }
      setFbStatus('need', '<i class="fa fa-bell mr-1"></i>需要执行人工审核');
      if (report.signOff && report.signOff.returned) {
        box.innerHTML = (report.lastDisposition ? '<div class="mb-2 rounded-lg bg-white/60 px-3 py-1.5 text-xs text-slate-500"><i class="fa fa-bookmark-o mr-1"></i>上次人工处置：' + esc(report.lastDisposition.final) + '（' + esc(report.lastDisposition.by) + '）· ' + esc(report.lastDisposition.note) + '</div>' : '') +
          '<p class="mb-1 text-xs text-slate-500">签发退回复核：请结合退回意见与（可选）重跑结果处置。</p>' +
          '<div class="flex flex-wrap gap-x-6 gap-y-1 text-sm"><label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>审核通过 —— 重新提交报告签发</span></label>' +
          '<label class="flex items-start gap-2"><input type="radio" name="choice" value="return" class="mt-1"/><span>退回报告编制 —— 需填写退回原因</span></label></div>' + reasonBox() +
          '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec btn-brand rounded-lg px-4 py-1.5 text-sm">执行</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';
        bindCommon(report, 'return'); box.querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { returnVal: 'return', passFinal: '通过', returnFinal: '退回报告编制' }); });
        return;
      }
      if (r.conclusion === '不通过') {
        box.innerHTML =
          '<div class="flex flex-wrap gap-x-6 gap-y-1 text-sm"><label class="flex items-start gap-2"><input type="radio" name="choice" value="return" class="mt-1"/><span>同意 AI —— 退回报告编制</span></label>' +
          '<label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>人工覆盖 —— 仍判定通过（覆盖严重项）</span></label></div>' + reasonBox() +
          '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec btn-brand rounded-lg px-4 py-1.5 text-sm">执行</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';
        bindCommon(report, 'return', true); box.querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { returnVal: 'return', passFinal: '人工覆盖通过', returnFinal: '退回报告编制', reasonRequiredAlways: true }); });
        return;
      }
      if (r.conclusion === '需复核') {
        box.innerHTML = '<div class="flex flex-wrap gap-x-6 gap-y-1 text-sm"><label class="flex items-start gap-2"><input type="radio" name="choice" value="return" class="mt-1"/><span>同意 AI —— 退回报告编制</span></label>' +
          '<label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>不同意 AI —— 直接人工审核通过</span></label></div>' + reasonBox() +
          '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec btn-brand rounded-lg px-4 py-1.5 text-sm">执行</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';
        bindCommon(report, 'return'); box.querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { returnVal: 'return', passFinal: '通过', returnFinal: '退回报告编制' }); });
        return;
      }
      box.innerHTML = '<div class="flex flex-wrap gap-x-6 gap-y-1 text-sm"><label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>同意 AI 审核结果 —— 执行<b>通过</b></span></label>' +
        '<label class="flex items-start gap-2"><input type="radio" name="choice" value="passDis" class="mt-1"/><span>不同意 AI —— 仍由人工执行<b>通过</b></span></label></div>' +
        '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec rounded-lg px-4 py-1.5 text-sm text-white" style="background:linear-gradient(120deg,#059669,#10b981)">执行通过</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';
      box.querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { passFinal: '通过' }); });
    }

    function collectLabels() { return Array.prototype.map.call(document.querySelectorAll('.item-label'), function (sel) { var note = sel.closest('.item-detail') ? (sel.closest('.item-detail').querySelector('.label-note') || {}).value : ''; return { rule_id: sel.getAttribute('data-rule'), label: sel.value, note: note || '' }; }); }
    function execChoice(report, cfg) {
      var choice = document.querySelector('#manual-feedback input[name="choice"]:checked');
      if (!choice && cfg.passFinal && !cfg.returnVal) choice = { value: 'pass' };
      if (!choice) { alert('请先选择处置方式'); return; }
      var isReturn = choice.value === (cfg.returnVal || 'return'); var reason = '';
      if (isReturn || cfg.reasonRequiredAlways) { var ta = $('return-reason'); reason = ta ? ta.value.trim() : ''; if (!reason) { alert('请填写原因'); return; } }
      var r = currentResult(report); var final = isReturn ? (cfg.returnFinal || '退回报告编制') : (cfg.passFinal || '通过'); var labels = collectLabels();
      AiReviewStore.saveFeedback({ report_id: report.id, entrust_code: CODE, ai_conclusion: r.conclusion, final_conclusion: final, agree_ai: isReturn ? true : (choice.value === 'pass' && r.conclusion !== '通过' ? false : true), return_reason: reason, item_labels: labels, at: new Date().toISOString() });
      AiReviewStore.appendCase({ case_id: 'case-rv-' + report.id + '-' + Date.now(), report_id: report.id, entrust_code: CODE, ai_conclusion: r.conclusion, final_conclusion: final, item_labels: labels, created_at: new Date().toISOString() });
      var btn = $('manual-feedback').querySelector('.btn-exec'); if (btn) btn.disabled = true;
      $('manual-feedback').querySelectorAll('input,select,textarea').forEach(function (el) { el.disabled = true; });
      var done = $('manual-feedback').querySelector('.exec-done'); if (done) done.classList.remove('hidden');
      alert('已执行：' + final + (reason ? '\n原因：' + reason : ''));
    }

    // ---------- 右侧信息 ----------
    function infoPanel(report, panel) {
      var info = report.info || {};
      if (panel === 'recv') {
        var rc = info.receive || { times: [] };
        return rc.times.map(function (t) {
          return '<div class="glass-sm mb-3 p-3">' +
            '<div class="mb-2 flex items-center justify-between"><span class="font-semibold text-slate-700">第 ' + t.no + ' 次收样</span><span class="chip bg-emerald-100 text-emerald-700">' + esc(t.status) + '</span></div>' +
            '<div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-500"><div>本次收样 <span class="mono text-slate-700">' + esc(t.date) + '</span></div><div>收样人 <b class="text-slate-700">' + esc(t.receiver) + '</b></div><div>送样人 <b class="text-slate-700">' + esc(t.sender) + '</b></div><div>送样方式 ' + esc(t.sendWay) + '</div><div>送样人电话 <span class="mono">' + esc(t.senderPhone) + '</span></div></div>' +
            '<div class="mt-1 text-xs text-slate-500">备注：' + esc(t.note) + '</div>' +
            t.samples.map(function (sp) {
              return '<div class="mt-2 rounded-lg border border-slate-100 bg-white/60 p-2">' +
                '<div class="flex items-center justify-between"><span class="font-medium text-slate-700 mono">' + esc(sp.sampleNo) + '</span><span class="chip bg-blue-50 text-blue-700">' + esc(sp.qty) + '</span></div>' +
                '<div class="mt-1 grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs text-slate-500"><div>产品标记 <b class="text-slate-700">' + esc(sp.productMark) + '</b></div><div>型号/分类 ' + esc(sp.model) + '</div><div>检测类别 ' + esc(sp.category) + '</div><div>生产厂 ' + esc(sp.factory) + '</div>' +
                  sp.specs.map(function (s) { return '<div>' + esc(s.k) + ' <b class="text-slate-700">' + esc(s.v) + '</b></div>'; }).join('') + '</div></div>';
            }).join('') +
            '<div class="mt-2 flex gap-2">' + t.images.map(function (im) { return '<div class="flex h-16 w-20 flex-col items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50 text-[10px] text-slate-400"><i class="fa fa-image mb-0.5"></i>' + esc(im.label) + '</div>'; }).join('') + '</div>' +
          '</div>';
        }).join('') || '<div class="text-slate-400">无收样信息</div>';
      }
      if (panel === 'detect') {
        var d = info.detect || { samples: [] };
        return d.samples.map(function (sp) {
          return '<div class="glass-sm mb-3 p-3">' +
            '<div class="mb-2 flex items-center justify-between"><span class="font-semibold text-slate-700 mono">' + esc(sp.sampleNo) + '</span><span class="chip bg-blue-50 text-blue-700">' + esc(sp.qty) + '</span></div>' +
            '<div class="mb-2 grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs text-slate-500"><div>产品标记 <b class="text-slate-700">' + esc(sp.productMark) + '</b></div><div>型号/分类 ' + esc(sp.model) + '</div><div>检测类别 ' + esc(sp.category) + '</div><div>生产厂 ' + esc(sp.factory) + '</div></div>' +
            '<div class="text-xs font-medium text-slate-500 mb-1">试验项</div>' +
            sp.items.map(function (it) {
              var rc = it.result === '合格' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700';
              return '<div class="mb-1.5 rounded-lg border border-slate-100 bg-white/70">' +
                '<button type="button" class="detect-item flex w-full items-center justify-between gap-2 px-2.5 py-1.5 text-left">' +
                  '<span class="min-w-0"><span class="text-sm text-slate-700">' + esc(it.name) + '</span><span class="ml-2 text-[11px] text-slate-400 mono">' + esc(it.std) + '</span></span>' +
                  '<span class="flex flex-shrink-0 items-center gap-1"><span class="chip bg-slate-100 text-slate-500">' + esc(it.review) + '</span><span class="chip ' + rc + '">' + esc(it.result) + '</span><i class="fa fa-angle-down text-slate-400"></i></span>' +
                '</button>' +
                '<div class="detect-body hidden border-t border-slate-100 px-2.5 py-2 text-xs text-slate-500">' +
                  '<div class="grid grid-cols-2 gap-x-4 gap-y-0.5"><div>检测方法 ' + esc(it.method) + '</div><div>检测人 ' + esc(it.tester) + '</div><div>检测日期 <span class="mono">' + esc(it.date) + '</span></div><div>设备 ' + esc(it.device) + '</div><div class="col-span-2">校准有效期 <span class="mono">' + esc(it.calib) + '</span></div></div>' +
                  '<div class="mt-2"><span class="text-slate-400">标准文件' + (it.standards.length > 1 ? '（关联 ' + it.standards.length + ' 个）' : '') + '：</span>' + it.standards.map(function (s) { return '<a href="#" onclick="openPageOffice(\'' + esc(s.no) + '\');return false;" class="ml-1 underline" style="color:var(--brand)">' + esc(s.no) + '</a>'; }).join('') + '</div>' +
                  '<div class="mt-1"><span class="text-slate-400">作业指导书：</span>' + it.sops.map(function (s) { return '<a href="#" onclick="openPageOffice(\'' + esc(s.name) + '\');return false;" class="ml-1 underline" style="color:var(--brand)"><i class="fa fa-file-text-o mr-0.5"></i>' + esc(s.no) + '</a>'; }).join('') + '</div>' +
                  '<div class="mt-1"><span class="text-slate-400">原始记录单：</span>' + it.raws.map(function (s) { return '<a href="#" onclick="openPageOffice(\'' + esc(s.name) + '\');return false;" class="ml-1 underline" style="color:var(--brand)"><i class="fa fa-file-word-o mr-0.5"></i>' + esc(s.name) + '</a>'; }).join('') + '</div>' +
                '</div></div>';
            }).join('') + '</div>';
        }).join('') || '<div class="text-slate-400">无检测信息</div>';
      }
      // 报告预览：嵌入透明检测系统报告
      var code = info.traceCode || 'R3a2K';
      return '<div class="flex h-full min-h-0 flex-col"><iframe src="transparent-demo/report-preview.html?code=' + encodeURIComponent(code) + '&embed=1" class="preview-frame" title="报告预览"></iframe></div>';
    }
    function renderInfo(report) {
      var idx = curIndex(report); var cur = roundsOf(report)[idx];
      $('rp-file').innerHTML = '<i class="fa fa-file-word-o mr-1"></i>' + esc(report.file.word);
      $('rp-version').textContent = cur.revision;
      $('rp-compiler').textContent = report.compiler || entrust.compiler || 'admin';
      $('rp-compiletime').textContent = (report.file && report.file.at) || '';
      $('rp-version-prev').textContent = idx > 0 ? ('上一版 ' + roundsOf(report)[idx - 1].revision) : '首版';
      var active = document.querySelector('.info-tab.active'); var panel = active ? active.getAttribute('data-panel') : 'preview';
      $('info-body').innerHTML = infoPanel(report, panel);
      bindDetectToggles();
    }
    function bindDetectToggles() {
      document.querySelectorAll('.detect-item').forEach(function (b) { b.addEventListener('click', function () { var body = b.nextElementSibling; body.classList.toggle('hidden'); var ic = b.querySelector('.fa-angle-down,.fa-angle-up'); if (ic) ic.className = 'fa ' + (body.classList.contains('hidden') ? 'fa-angle-down' : 'fa-angle-up') + ' text-slate-400'; }); });
    }
    function setSplit(mode) {
      splitMode = mode;
      var m = $('wb-main');
      m.classList.remove('is-center-only', 'is-right-only');
      if (mode === 'center') m.classList.add('is-center-only');
      if (mode === 'right') m.classList.add('is-right-only');
      function setBtn(id, on) {
        var b = $(id); if (!b) return;
        b.querySelector('span').textContent = on ? '还原' : '展开';
        b.querySelector('i').className = 'fa ' + (on ? 'fa-compress' : 'fa-expand') + ' mr-1';
      }
      setBtn('btn-expand-center', mode === 'center');
      setBtn('btn-expand-right', mode === 'right');
    }
    function initInfoTabs() {
      document.querySelectorAll('.info-tab').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.info-tab').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); $('info-body').innerHTML = infoPanel(getSelected(), b.getAttribute('data-panel')); bindDetectToggles();
        });
      });
      $('btn-expand-right').addEventListener('click', function () { setSplit(splitMode === 'right' ? 'split' : 'right'); });
      $('btn-expand-center').addEventListener('click', function () { setSplit(splitMode === 'center' ? 'split' : 'center'); });
    }

    // ---------- 选择 / 重跑 ----------
    function select(id, animate) {
      selectedId = id; var report = getSelected();
      renderRoster(); renderLog(report); renderAi(report); renderFeedback(report); renderInfo(report);
      if (animate) playProgress(report);
    }
    function initRerun() {
      $('btn-rerun').addEventListener('click', function () {
        var report = getSelected(); var rt = RT[report.id]; var last = rt.rounds[rt.rounds.length - 1];
        var nextRev = last.revision.replace(/V(\d+)\.(\d+)/, function (_, a, b) { return 'V' + a + '.' + (parseInt(b, 10) + 1); });
        rt.rounds.push({ revision: nextRev, trigger: report.signOff && report.signOff.returned ? '签发退回后重跑' : '手动重跑', at: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-'), snapshot: last.snapshot });
        rt.roundIndex = rt.rounds.length - 1;
        renderAi(report); renderFeedback(report); renderInfo(report); renderLog(report); renderRoster(); playProgress(report);
      });
    }

    function boot() {
      if (!entrust) { document.getElementById('wb-page').innerHTML = '<div class="glass p-6 text-slate-500">未找到委托 ' + esc(CODE) + '</div>'; return; }
      entrust.reports.forEach(function (rep) { RT[rep.id] = { rounds: rep.rounds.slice(), roundIndex: rep.rounds.length - 1, labels: {} }; });
      initOverview(); initInfoTabs(); initRerun(); bindPolicy(); syncPolicyToggle();
      select(entrust.reports[0].id, true);

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({ annotations: [
          { id: 'rv-overview', selector: '[data-annotate="rv-overview"]', position: 'bottom', title: '委托概览（默认折叠）', content: '<strong>需求逻辑：</strong>审核以委托为单位，顶部一小块承载整条委托信息，默认收起。<br><strong>展示规则：</strong>收起时一行摘要；展开后「合同/委托/付款/报告信息」四小 tab。', tag: '报告审核' },
          { id: 'rv-roster', selector: '[data-annotate="rv-roster"]', position: 'right', title: '报告统观区（以是否需操作为主视觉）', content: '<strong>需求逻辑：</strong>审核人需一眼看出哪些报告需操作。<br><strong>展示规则：</strong>每行上方=业务状态（待处置/签发退回/自动退回/已处置，需操作的带脉冲提醒），下方=版本 + AI 结论；不展示试样编号。', tag: '报告审核' },
          { id: 'rv-log', selector: '[data-annotate="rv-log"]', position: 'right', title: '操作日志', content: '<strong>需求逻辑：</strong>审核前看清流转留痕，尤其签发退回。<br><strong>展示规则：</strong>彩色时间轴；节点、人员、内容分开展示。01 展示至「等待报告签发」。', tag: '报告审核' },
          { id: 'rv-ai', selector: '[data-annotate="rv-ai"]', position: 'left', title: 'AI 审核结果', content: '<strong>展示规则：</strong>综合结论按品类/校验/命中/建议/口径分栏；规则通过/不通过在条右侧，展开在其下；通过项不展示建议。多轮时用胶囊切换，最新一轮在最左。<br><strong>交互逻辑：</strong>标注误报/漏报需填备注，提交后不可再改。', tag: '报告审核' },
          { id: 'rv-manual', selector: '[data-annotate="rv-manual"]', position: 'top', title: '人工处置（固定底栏）', content: '<strong>需求逻辑：</strong>人工处置是必操作区，固定于底部、跨中右等宽、不随滚动。<br><strong>展示规则：</strong>标题色与 AI 审核结果一致；自动退回开关在标题行。01 已进入审核无需操作；03 自动退回无需操作；02/04 突出需要执行人工审核。', tag: '报告审核' },
          { id: 'rv-file', selector: '[data-annotate="rv-file"]', position: 'left', title: '报告文件', content: '<strong>展示规则：</strong>报告文件名（点击 PageOffice 预览）+ 版本号 + 编制人 + 编制时间。PDF 于报告签发后生成，故此处不展示 PDF。', tag: '报告审核' },
          { id: 'rv-info', selector: '[data-annotate="rv-info"]', position: 'left', title: '报告预览 / 收样 / 检测', content: '<strong>展示规则：</strong>默认「报告预览」嵌入透明检测系统报告并适配预览区；「收样信息」以单次收样为单位；「检测信息」以样品为单位列试验项。<br><strong>交互逻辑：</strong>中栏与右栏初始 1:1；各自「展开」隐藏另一侧，「还原」回到 1:1。', tag: '报告审核' },
        ] });
      }
    }
    boot();
  </script>
  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=8" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
