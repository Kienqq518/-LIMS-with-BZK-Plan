<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告审核工作台 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .wb-grid { display: grid; grid-template-columns: 300px minmax(0,1fr) 400px; gap: 12px; }
    @media (max-width: 1280px) { .wb-grid { grid-template-columns: 260px minmax(0,1fr); } .wb-right { grid-column: 1 / -1; } }
    .roster-row.active { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; }
    .tl-item { position: relative; padding-left: 18px; }
    .tl-item::before { content: ''; position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 9999px; background: #94a3b8; }
    .tl-item.tone-success::before { background: #10b981; }
    .tl-item.tone-warn::before { background: #f59e0b; }
    .tl-item.tone-danger::before { background: #ef4444; }
    .tl-item:not(:last-child)::after { content: ''; position: absolute; left: 7.5px; top: 12px; bottom: -6px; width: 1px; background: #e2e8f0; }
    .info-tab.active { color: #2563eb; border-color: #2563eb; }
    .prog-rule .st-run { color: #2563eb; }
    .prog-rule .st-pass { color: #10b981; }
    .prog-rule .st-fail { color: #ef4444; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="report-review.html">
    <a href="report-review.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告审核</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告审核工作台
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-3 space-y-3">
    <div id="ai-liability" class="flex items-center gap-2 rounded border border-blue-200 bg-blue-50 px-4 py-2 text-sm text-blue-900">
      <i class="fa fa-info-circle"></i>
      <span>AI 仅输出预审意见与问题清单，最终核准与签发由授权审核员确认；下方「标注」仅用于 AI 模型持续学习，不对上下游人员展示。</span>
    </div>

    <!-- A 区：委托概览（默认折叠） -->
    <section class="rounded bg-white shadow-sm" data-annotate="rv-overview">
      <button id="ov-toggle" type="button" class="flex w-full items-center justify-between gap-3 px-4 py-2.5 text-left">
        <span class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
          <span class="font-semibold text-slate-800"><i class="fa fa-folder-open-o mr-1 text-blue-500"></i><span id="ov-code"></span></span>
          <span class="text-slate-500" id="ov-customer"></span>
          <span class="text-slate-500" id="ov-sample"></span>
          <span class="text-slate-500">报告 <b id="ov-count" class="text-slate-700"></b> 份</span>
          <span class="text-slate-500">受理 <span id="ov-accept"></span></span>
          <span class="rounded bg-slate-100 px-2 py-0.5 text-xs text-slate-600" id="ov-status"></span>
        </span>
        <span class="flex items-center gap-1 text-xs text-blue-600"><span id="ov-toggle-text">展开</span><i id="ov-chevron" class="fa fa-angle-down"></i></span>
      </button>
      <div id="ov-body" class="hidden border-t border-slate-100 px-4 pb-3 pt-2">
        <div class="mb-2 flex items-center gap-1 text-sm">
          <button class="ov-tab rounded px-3 py-1 text-slate-500" data-tab="contract">合同信息</button>
          <button class="ov-tab rounded bg-blue-50 px-3 py-1 text-blue-600" data-tab="entrust">委托信息</button>
          <button class="ov-tab rounded px-3 py-1 text-slate-500" data-tab="pay">付款信息</button>
          <button class="ov-tab rounded px-3 py-1 text-slate-500" data-tab="report">报告信息</button>
        </div>
        <div id="ov-panel" class="text-sm text-slate-600"></div>
      </div>
    </section>

    <!-- B 区：审核操作台 -->
    <div class="wb-grid">
      <!-- 左：统观区 + 操作日志 -->
      <div class="space-y-3">
        <section class="rounded bg-white shadow-sm" data-annotate="rv-roster">
          <div class="border-b border-slate-100 px-3 py-2 text-xs font-medium text-slate-500"><i class="fa fa-list-ul mr-1"></i>报告统观区</div>
          <div id="roster-summary" class="px-3 py-2 text-xs text-slate-500"></div>
          <div id="roster-list"></div>
        </section>
        <section class="rounded bg-white shadow-sm" data-annotate="rv-log">
          <div class="border-b border-slate-100 px-3 py-2 text-xs font-medium text-slate-500"><i class="fa fa-history mr-1"></i>操作日志 <span id="log-report" class="text-slate-400"></span></div>
          <div id="log-list" class="max-h-72 overflow-y-auto px-3 py-3 text-xs"></div>
        </section>
      </div>

      <!-- 中：AI 审核结果 + 人工反馈 -->
      <div class="space-y-3">
        <section class="rounded bg-white shadow-sm" data-annotate="rv-ai">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-4 py-2.5">
            <div class="flex items-center gap-2 text-sm font-medium text-slate-600"><i class="fa fa-robot text-blue-500"></i>AI 审核结果
              <span id="ai-report-no" class="text-xs font-normal text-slate-400"></span></div>
            <div class="flex items-center gap-2">
              <span id="ai-round" class="text-xs text-slate-400"></span>
              <button id="btn-rerun" type="button" class="rounded border border-blue-300 px-2.5 py-1 text-xs text-blue-600 hover:bg-blue-50"><i class="fa fa-refresh mr-1"></i>重跑 AI 审核</button>
            </div>
          </div>
          <div id="signoff-banner" class="hidden border-b border-amber-100 bg-amber-50 px-4 py-2 text-xs text-amber-800"></div>
          <div class="px-4 py-3">
            <div id="ai-conclusion-wrap" class="mb-3 flex items-center gap-2"></div>
            <!-- 加载进度（跑 AI 时逐条规则） -->
            <div id="ai-progress" class="hidden rounded border border-blue-100 bg-blue-50/40 px-3 py-2">
              <div class="mb-1.5 text-xs text-blue-700"><i class="fa fa-spinner fa-spin mr-1"></i>AI 正在逐条执行审核规则…</div>
              <div id="ai-progress-list" class="space-y-1 text-xs"></div>
            </div>
            <div id="ai-result">
              <div id="ai-diff" class="hidden mb-3 rounded border border-slate-200 bg-slate-50 px-3 py-2 text-xs"></div>
              <div id="ai-issues" class="space-y-3"></div>
              <div id="ai-notices"></div>
              <div id="ai-summary" class="mt-3 rounded border border-indigo-100 bg-indigo-50/60 px-3 py-2.5 text-xs text-indigo-900"></div>
            </div>
          </div>
        </section>

        <section class="rounded bg-white shadow-sm" data-annotate="rv-manual">
          <div class="border-b border-slate-100 px-4 py-2.5 text-sm font-medium text-slate-600"><i class="fa fa-user-check mr-1 text-emerald-500"></i>人工反馈 / 处置</div>
          <div id="manual-feedback" class="px-4 py-3"></div>
        </section>
      </div>

      <!-- 右：报告相关信息 -->
      <div class="wb-right space-y-3">
        <section class="rounded bg-white shadow-sm" data-annotate="rv-version">
          <div class="px-4 py-3">
            <div class="text-xs text-slate-400">报告版本号</div>
            <div id="rp-version" class="text-2xl font-bold text-slate-800">—</div>
            <div id="rp-version-prev" class="text-xs text-slate-400"></div>
            <div id="rp-trace" class="mt-2 border-t border-slate-100 pt-2 text-[11px] leading-5 text-slate-400"></div>
          </div>
        </section>
        <section class="rounded bg-white shadow-sm" data-annotate="rv-info">
          <div class="flex items-center gap-1 overflow-x-auto border-b border-slate-100 px-2 pt-2 text-xs whitespace-nowrap">
            <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500 active" data-panel="file">报告文件</button>
            <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="recv">收样信息</button>
            <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="detect">检测信息</button>
            <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="raw">原始记录单</button>
            <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="std">标准 / 作业指导书</button>
          </div>
          <div id="info-body" class="px-4 py-3 text-sm"></div>
        </section>
      </div>
    </div>

    <!-- 底部：原型演示策略开关 -->
    <section class="rounded border border-dashed border-slate-300 bg-white px-4 py-2.5 text-xs text-slate-500" data-annotate="rv-policy">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span><i class="fa fa-flask mr-1 text-slate-400"></i>原型演示开关 · 行业包策略 <code class="rounded bg-slate-100 px-1">pack.policy.auto_return_on_severe</code>：
          严重项命中时是否自动退回报告编制。</span>
        <button id="policy-toggle" type="button" data-auto="1" class="rounded border border-slate-300 px-3 py-1 text-slate-600 hover:bg-slate-50"></button>
      </div>
      <div id="policy-hint" class="mt-1 text-[11px] text-slate-400"></div>
    </section>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function qp(name) { var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }

    var CODE = qp('code') || 'SC2026/0238';
    var entrust = ReportReviewMock.getEntrust(CODE);
    var RT = {};        // reportId -> { rounds:[], roundIndex }
    var selectedId = null;

    // ---------- 委托概览 ----------
    function row(label, val) { return '<div><span class="text-slate-400">' + label + '：</span><span class="text-slate-700">' + esc(val) + '</span></div>'; }
    function ovPanel(tab) {
      var e = entrust;
      if (tab === 'contract') { var c = e.contractInfo || {};
        return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('是否框架合同', c.frame) + row('合同编号', c.contractNo) + row('签约地点', c.signPlace) + row('签约日期', c.signDate) + row('检测中心', c.center) + '</div>'; }
      if (tab === 'pay') { var p = e.payInfo || {};
        return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('样品检测总价(元)', p.total) + row('实际费用(元)', p.actual) + row('折扣率(%)', p.discount) + row('付款方式', p.way) + row('付款单位', p.payer) + row('业务备注', p.note) + '</div>'; }
      if (tab === 'report') { var r = e.reportInfo || {};
        return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('报告传送方式', r.send) + row('报告资质', r.qualify) + row('结果方式', r.resultMode) + row('报告语言', r.lang) + row('份数', r.copies) + row('报告描述', r.desc) + '</div>'; }
      return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('委托编号', e.code) + row('客户单位', e.customer) + row('样品名称', e.sample) + row('优先等级', e.priority) + row('送样时间', e.sendDate) + row('要求完成', e.requireDate) + row('受理日期', e.acceptDate) + row('编制人', e.compiler) + row('任务状态', e.status) + '</div>';
    }
    function initOverview() {
      $('ov-code').textContent = entrust.code; $('ov-customer').textContent = entrust.customer;
      $('ov-sample').textContent = entrust.sample; $('ov-count').textContent = entrust.reports.length;
      $('ov-accept').textContent = entrust.acceptDate; $('ov-status').textContent = entrust.status;
      $('ov-panel').innerHTML = ovPanel('entrust');
      $('ov-toggle').addEventListener('click', function () {
        var body = $('ov-body'); var open = body.classList.toggle('hidden') === false;
        $('ov-toggle-text').textContent = open ? '收起' : '展开';
        $('ov-chevron').className = 'fa fa-angle-' + (open ? 'up' : 'down');
      });
      document.querySelectorAll('.ov-tab').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.ov-tab').forEach(function (x) { x.className = 'ov-tab rounded px-3 py-1 text-slate-500'; });
          b.className = 'ov-tab rounded bg-blue-50 px-3 py-1 text-blue-600';
          $('ov-panel').innerHTML = ovPanel(b.getAttribute('data-tab'));
        });
      });
    }

    // ---------- 轮次与结论 ----------
    function roundsOf(report) { return RT[report.id].rounds; }
    function curIndex(report) { return RT[report.id].roundIndex; }
    function resultAt(report, idx) { return ReportReviewMock.evalRound(report, roundsOf(report)[idx]); }
    function currentResult(report) { return resultAt(report, curIndex(report)); }

    function rosterResultLabel(report) {
      if (report.disposition) return '<span class="text-emerald-600">已' + esc(report.disposition.final) + '</span>';
      if (report.state === '自动退回编制') return '<span class="text-red-600">自动退回编制</span>';
      if (report.state === '签发退回待复核') return '<span class="text-amber-600">待复核</span>';
      return '<span class="text-slate-400">待处置</span>';
    }
    function badge(conclusion, small) {
      var m = ReportReviewMock.CONCLUSION_META[conclusion];
      return '<span class="inline-flex items-center gap-1 rounded-full ' + (small ? 'px-2 py-0.5 text-xs' : 'px-3 py-1 text-sm') + ' font-medium ' + m.cls + '"><i class="fa ' + m.icon + '"></i>' + conclusion + '</span>';
    }

    // ---------- 统观区 ----------
    function renderRoster() {
      var counts = { 待处置: 0, 需复核: 0, 自动退回编制: 0, 签发退回待复核: 0, 通过: 0 };
      var rows = entrust.reports.map(function (rep) {
        var r = currentResult(rep);
        if (rep.disposition) counts['通过']++;
        else if (rep.state === '自动退回编制') counts['自动退回编制']++;
        else if (rep.state === '签发退回待复核') counts['签发退回待复核']++;
        else if (r.conclusion === '需复核') counts['需复核']++;
        else counts['待处置']++;
        var cur = ReportReviewMock.currentRound(rep);
        return '<button type="button" class="roster-row ' + (rep.id === selectedId ? 'active' : '') + ' flex w-full flex-col gap-1 border-b border-slate-50 px-3 py-2 text-left hover:bg-slate-50" data-report-id="' + rep.id + '" data-conclusion="' + r.conclusion + '" data-state="' + esc(rep.state) + '">' +
          '<div class="flex items-center justify-between gap-2"><span class="text-sm font-medium text-slate-700">' + esc(rep.reportNo) + '</span>' + badge(r.conclusion, true) + '</div>' +
          '<div class="flex items-center justify-between gap-2 text-xs text-slate-400"><span>版本 <b class="text-slate-600">' + esc(cur.revision) + '</b> · 试样 ' + esc(rep.sampleNos.join('、')) + '</span>' + rosterResultLabel(rep) + '</div>' +
        '</button>';
      }).join('');
      $('roster-list').innerHTML = rows;
      $('roster-summary').innerHTML = '共 <b class="text-slate-700">' + entrust.reports.length + '</b> 份：' +
        '待处置 ' + counts['待处置'] + ' · 需复核 ' + counts['需复核'] + ' · 已通过 ' + counts['通过'] +
        ' · 自动退回 ' + counts['自动退回编制'] + ' · 签发退回 ' + counts['签发退回待复核'];
      document.querySelectorAll('.roster-row').forEach(function (b) {
        b.addEventListener('click', function () { select(b.getAttribute('data-report-id'), true); });
      });
    }

    // ---------- 操作日志 ----------
    function renderLog(report) {
      $('log-report').textContent = '· ' + report.reportNo;
      $('log-list').innerHTML = (report.log || []).map(function (e) {
        return '<div class="tl-item tone-' + (e.tone || 'default') + ' pb-3">' +
          '<div class="text-slate-700">' + esc(e.node) + '</div>' +
          '<div class="text-slate-500">' + esc(e.text) + '</div>' +
          '<div class="text-[11px] text-slate-400">' + esc(e.at) + '</div></div>';
      }).join('');
    }

    // ---------- AI 结果 ----------
    function scopeBadge(scope) {
      var cls = scope === '通用' ? 'bg-slate-100 text-slate-500' : 'bg-violet-100 text-violet-700';
      return '<span class="rounded px-1.5 py-0.5 text-[11px] ' + cls + '">' + esc(scope) + '</span>';
    }
    function sevCls(s) { return s === '严重' ? 'text-red-600' : (s === '一般' ? 'text-amber-600' : 'text-emerald-600'); }
    function evidenceText(it) {
      var ev = it.evidence || {};
      if (!ev || !Object.keys(ev).length) return '已按规则口径逐项校验，结论见上。';
      if (ev.skipped) return '校验口径：收样 ≤ 检测 ≤ 报告；本报告' + ev.skipped + '，已跳过。';
      if (ev.receive_date) return '校验口径：收样(' + ev.receive_date + ') ≤ 检测(' + ev.test_date + ') ≤ 报告(' + ev.report_date + ')，实际不满足。';
      if (ev.value != null) return '命中依据：实测 ' + ev.value + (ev.unit || '') + ' 超过限值 ' + ev.limit + (ev.unit || '') + '。';
      return '命中依据：' + esc(JSON.stringify(ev));
    }
    function ruleItemHtml(it, open, withLabel) {
      return '<div class="rule-item rounded border border-slate-200 px-3 py-2" data-rule-id="' + it.rule_id + '" data-scope="' + esc(it.scope) + '" data-severity="' + esc(it.severity) + '" data-passed="' + it.passed + '">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="min-w-0"><div class="flex flex-wrap items-center gap-1.5">' +
            '<span class="font-medium text-slate-700">' + it.rule_id + '</span>' +
            '<span class="text-[11px] text-slate-400">' + esc(it.level || '') + ' · ' + esc(it.category || '') + '</span>' +
            scopeBadge(it.scope) +
            '<span class="text-xs ' + sevCls(it.severity) + '">' + (it.passed ? '通过' : it.severity) + '</span></div>' +
            '<p class="mt-0.5 text-xs text-slate-500">' + esc(it.name) + (it.passed ? '' : ' — ' + esc(it.message)) + '</p></div>' +
          '<div class="flex flex-shrink-0 items-center gap-3">' +
            '<button type="button" class="toggle-detail text-xs text-blue-600 hover:underline">' + (open ? '收起' : '展开') + '</button>' +
            (withLabel ? '<label class="flex items-center gap-1 text-xs text-slate-500" title="' + ReportReviewMock.LABEL_NOTE + '"><i class="fa fa-lock text-slate-400"></i>标注<select class="item-label ml-1 rounded border border-slate-300 px-1.5 py-0.5 text-xs" data-rule="' + it.rule_id + '"><option>正常</option><option>误报</option><option>漏报</option></select></label>' : '') +
          '</div></div>' +
        '<div class="item-detail mt-2 ' + (open ? '' : 'hidden') + ' rounded bg-slate-50 px-3 py-2 text-xs text-slate-500">' +
          '<div><b>证据：</b>' + esc(evidenceText(it)) + '</div>' +
          (it.advice ? '<div class="mt-1"><b>建议：</b>' + esc(it.advice) + '</div>' : '') + '</div>' +
      '</div>';
    }
    function groupByLevel(items) {
      var order = ['L1', 'L2', 'L3', 'L4']; var map = {};
      items.forEach(function (it) { var k = it.level || '其他'; (map[k] = map[k] || []).push(it); });
      var keys = order.filter(function (k) { return map[k]; }).concat(Object.keys(map).filter(function (k) { return order.indexOf(k) < 0; }));
      var levelName = { L1: '基础形式', L2: '数据逻辑', L3: '合规对齐', L4: '溯源验证' };
      return keys.map(function (k) {
        return '<div><div class="mb-1 text-xs font-medium text-slate-500">' + k + ' ' + (levelName[k] || '') + '</div><div class="space-y-2">' +
          map[k].map(function (it) { return ruleItemHtml(it, !it.passed && it.severity !== '通过', !report0IsNot(it)); }).join('') + '</div></div>';
      }).join('');
    }
    function report0IsNot() { return false; } // 保留标注开关

    function diffHtml(diff) {
      if (!diff) return { html: '', text: '' };
      function li(arr) { return arr.map(function (i) { return i.rule_id + ' ' + i.name; }).join('；') || '无'; }

    function summaryText(report, r, diffText) {

        r.summary.total + ' 项规则（通用 ' + r.summary.universal + ' + 品类专属 ' + r.summary.category + '），命中严重 ' + sev + ' 项 / 一般 ' + gen + ' 项。结论：' + r.conclusion + '。' +
        (diffText ? diffText : '') + '建议：' + advice;

    var report0; // 当前选中报告对象（便于分组函数引用）
    function renderAi(report) {
      report0 = report;
      var idx = curIndex(report);
      var r = resultAt(report, idx);
      var cur = roundsOf(report)[idx];
      $('ai-report-no').textContent = '· ' + report.reportNo;
      $('ai-round').textContent = '第 ' + (idx + 1) + ' 轮 · ' + cur.revision + ' · ' + cur.trigger;
      $('ai-conclusion-wrap').innerHTML = badge(r.conclusion) + '<span id="ai-conclusion" data-conclusion="' + r.conclusion + '" class="text-xs text-slate-400">' + cur.revision + ' @ ' + esc(cur.at) + '</span>';

      // 签发退回提示
      if (report.signOff && report.signOff.returned) {
        $('signoff-banner').classList.remove('hidden');
        $('signoff-banner').innerHTML = '<i class="fa fa-undo mr-1"></i>本报告由报告签发退回（' + esc(report.signOff.by) + ' · ' + esc(report.signOff.at) + '）。退回意见：' + esc(report.signOff.opinion) +
          '<br>已退回至报告审核，<b>未自动重跑 AI</b>；下方展示的是上次 AI 结果与人工标注，如需可点「重跑 AI 审核」。';
      } else { $('signoff-banner').classList.add('hidden'); }

      if (d.html) { $('ai-diff').classList.remove('hidden'); $('ai-diff').innerHTML = d.html; } else { $('ai-diff').classList.add('hidden'); }

      // 分组问题清单
      $('ai-issues').innerHTML = groupByLevel(r.items);
      $('ai-notices').innerHTML = (r.notices || []).length ? '<div class="mt-2 text-xs text-amber-700">' + r.notices.map(function (n) { return '<div><i class="fa fa-info-circle mr-1"></i>' + n.code + '：' + esc(n.message) + '</div>'; }).join('') + '</div>' : '';
      $('ai-summary').textContent = summaryText(report, r, d.text);

      document.querySelectorAll('.toggle-detail').forEach(function (btn) {
        btn.addEventListener('click', function () { var dd = btn.closest('.rule-item').querySelector('.item-detail'); dd.classList.toggle('hidden'); btn.textContent = dd.classList.contains('hidden') ? '展开' : '收起'; });
      });

    // 跑 AI 的逐条规则进度动画（cosmetic；结果已在 DOM 中）
    function playProgress(report, done) {
      var r = currentResult(report);
      var list = r.items;
      $('ai-progress').classList.remove('hidden');
      $('ai-result').classList.add('opacity-40');
      $('ai-progress-list').innerHTML = list.map(function (it) {
        return '<div class="prog-rule flex items-center justify-between" data-rid="' + it.rule_id + '"><span>' + it.rule_id + ' ' + esc(it.name) + '</span><span class="st st-run">检查中…</span></div>';
      }).join('');
      var nodes = Array.prototype.slice.call($('ai-progress-list').querySelectorAll('.prog-rule'));
      var i = 0;
      (function step() {
        if (i >= nodes.length) {
          setTimeout(function () { $('ai-progress').classList.add('hidden'); $('ai-result').classList.remove('opacity-40'); if (done) done(); }, 180);
          return;
        }
        var it = list[i]; var st = nodes[i].querySelector('.st');
        st.textContent = it.passed ? '✓ 通过' : ('✗ ' + it.severity);
        st.className = 'st ' + (it.passed ? 'st-pass' : 'st-fail');
        i++; setTimeout(step, 70);
      })();
    }

            '<div class="space-y-1 text-sm">' +

              '<label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>人工覆盖 —— 仍判定通过（覆盖严重项，需填理由）</span></label></div>' +

          $('manual-feedback').querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { returnVal: 'return', passFinal: '人工覆盖通过', returnFinal: '退回报告编制', reasonRequiredAlways: true }); });

            '<label class="flex items-start gap-2"><input type="radio" name="choice" value="return" class="mt-1"/><span>同意 AI —— 退回报告编制（逐条标注确认判断正确）</span></label>' +
            '<label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>不同意 AI —— 直接人工审核通过（对误报项标注）</span></label></div>' +
          reasonBox(report) +
          '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">执行</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';

          '<label class="flex items-start gap-2"><input type="radio" name="choice" value="pass" class="mt-1"/><span>同意 AI 审核结果 —— 执行<b>通过</b></span></label>' +
          '<label class="flex items-start gap-2"><input type="radio" name="choice" value="passDis" class="mt-1"/><span>不同意 AI —— 仍由人工执行<b>通过</b>（对存疑项标注供学习）</span></label></div>' +
        '<div class="mt-3 flex items-center gap-3"><button type="button" class="btn-exec rounded bg-emerald-600 px-4 py-1.5 text-sm text-white hover:bg-emerald-700">执行通过</button><span class="exec-done hidden text-sm text-emerald-600"><i class="fa fa-check"></i> 已执行</span></div>';
      $('manual-feedback').querySelector('.btn-exec').addEventListener('click', function () { execChoice(report, { passFinal: '通过' }); });

    function collectLabels() {
      return Array.prototype.map.call(document.querySelectorAll('.item-label'), function (sel) { return { rule_id: sel.getAttribute('data-rule'), label: sel.value }; });
    }
    function execChoice(report, cfg) {
      var choice = document.querySelector('input[name="choice"]:checked');
      if (!choice && cfg.passFinal && !cfg.returnVal) choice = { value: 'pass' };
      if (!choice) { alert('请先选择处置方式'); return; }
      var isReturn = choice.value === (cfg.returnVal || 'return');
      var reason = '';
      if (isReturn || cfg.reasonRequiredAlways) {
        var ta = $('return-reason'); reason = ta ? ta.value.trim() : '';
        if ((isReturn || (cfg.reasonRequiredAlways && !isReturn)) && !reason) { alert('请填写原因'); return; }
      }
      var r = currentResult(report);
      var final = isReturn ? (cfg.returnFinal || '退回报告编制') : (cfg.passFinal || '通过');
      var labels = collectLabels();
      AiReviewStore.saveFeedback({ report_id: report.id, entrust_code: CODE, ai_conclusion: r.conclusion, final_conclusion: final, agree_ai: isReturn ? true : (choice.value === 'pass' && r.conclusion !== '通过' ? false : true), return_reason: reason, item_labels: labels, at: new Date().toISOString() });

      alert('已执行：' + final + (reason ? '\n原因：' + reason : ''));

    // ---------- 选择 / 重跑 / 策略 ----------
    function getSelected() { for (var i = 0; i < entrust.reports.length; i++) if (entrust.reports[i].id === selectedId) return entrust.reports[i]; return null; }
    function select(id, animate) {

        rt.rounds.push({ revision: nextRev, trigger: report.signOff && report.signOff.returned ? '签发退回后重跑' : '手动重跑', at: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-'), snapshot: last.snapshot });
        rt.roundIndex = rt.rounds.length - 1;

    function renderPolicy() {

    function initPolicy() {

        ReportReviewMock.setAutoReturn(!ReportReviewMock.getPolicy().autoReturnOnSevere);
        renderPolicy(); var rep = getSelected(); if (rep) { renderFeedback(rep); renderRoster(); }
      });
    }

    // ---------- 启动 ----------
    function boot() {
      if (!entrust) { document.querySelector('.p-3').innerHTML = '<div class="rounded bg-white p-6 text-slate-500">未找到委托 ' + esc(CODE) + '</div>'; return; }
      entrust.reports.forEach(function (rep) { RT[rep.id] = { rounds: rep.rounds.slice(), roundIndex: rep.rounds.length - 1 }; });
      initOverview(); initInfoTabs(); initRerun(); initPolicy();
      select(entrust.reports[0].id, true);

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({ annotations: [
          { id: 'rv-overview', selector: '[data-annotate="rv-overview"]', position: 'bottom', title: '委托概览（默认折叠）', content: '<strong>需求逻辑：</strong>审核以委托为单位，顶部用一小块承载整条委托信息，默认收起不抢占审核操作台空间。<br><strong>展示规则：</strong>收起时一行摘要；展开后分「合同/委托/付款/报告信息」四个小 tab。<br><strong>交互逻辑：</strong>点击标题栏展开/收起；tab 切换只读信息块。', tag: '报告审核' },
          { id: 'rv-roster', selector: '[data-annotate="rv-roster"]', position: 'right', title: '报告统观区', content: '<strong>需求逻辑：</strong>审核人需一眼看到本委托有几份报告、各自 AI 结论与处置结果。<br><strong>展示规则：</strong>每行=报告编号+版本号+试样+AI结论徽章+人工处置结果。<br><strong>交互逻辑：</strong>点击某行联动中栏 AI 结果、右栏信息、下方操作日志。', tag: '报告审核' },
          { id: 'rv-log', selector: '[data-annotate="rv-log"]', position: 'right', title: '操作日志', content: '<strong>需求逻辑：</strong>审核前要能看到该报告的流转留痕，尤其是「签发退回」过。<br><strong>展示规则：</strong>时间轴按节点列出（报告生成/编制/AI审核/审核/签发/签发退回），退回节点红色高亮。<br><strong>交互逻辑：</strong>随选中报告切换。', tag: '报告审核' },
          { id: 'rv-ai', selector: '[data-annotate="rv-ai"]', position: 'left', title: 'AI 审核结果', content: '<strong>需求逻辑：</strong>展示选中报告的 AI 预审结论与问题清单；支持编制退回重审、签发退回重跑的多轮结果与差异。<br><strong>展示规则：</strong>跑 AI 时逐条列规则进度；问题按 L1–L4 分组，每条标通用/品类专属+证据+建议；末尾 AI 综合结论；多轮显示与上一版差异。<br><strong>交互逻辑：</strong>「重跑 AI 审核」追加一轮；签发退回报告默认不自动重跑。', tag: '报告审核' },
          { id: 'rv-manual', selector: '[data-annotate="rv-manual"]', position: 'left', title: '人工反馈 / 处置', content: '<strong>需求逻辑：</strong>人工对 AI 结论裁决并留痕；退回须写明原因（可一键填入 AI 结论再编辑）。<br><strong>展示规则：</strong>通过→同意/不同意执行通过；需复核→同意退回/人工通过；签发退回→退回/通过；不通过默认自动退回（策略开关可切为人工覆盖）。<br><strong>交互逻辑：</strong>执行写入 feedback + cases（含逐条标注）。', tag: '报告审核' },
          { id: 'rv-version', selector: '[data-annotate="rv-version"]', position: 'left', title: '报告版本号（重点）', content: '<strong>需求逻辑：</strong>版本号必须显眼——退回重审会产生 V1.1/V1.2 等多版，审核人要清楚当前审的是哪版。<br><strong>展示规则：</strong>大字显示当前版本，下方标上一版与审核依据（规则集/包版本/快照哈希）。<br><strong>交互逻辑：</strong>随轮次切换。', tag: '报告审核' },
          { id: 'rv-info', selector: '[data-annotate="rv-info"]', position: 'left', title: '报告相关信息', content: '<strong>需求逻辑：</strong>审核判读要能就地看到报告文件、收样、检测、原始记录单、标准/作业指导书（一个试验项可关联多个标准）。<br><strong>展示规则：</strong>tab 切换；报告文件区含被 AI 自动退回的不通过报告文件。<br><strong>交互逻辑：</strong>随选中报告切换。', tag: '报告审核' },
          { id: 'rv-policy', selector: '[data-annotate="rv-policy"]', position: 'top', title: '原型演示 · 策略开关', content: '<strong>需求逻辑：</strong>不通过是否自动退回由行业包 policy 决定；为演示「人工覆盖」原型，提供一个切换。<br><strong>展示规则：</strong>开=不通过自动退回、无覆盖入口；关=不通过出现人工覆盖入口。<br><strong>交互逻辑：</strong>点击切换并即时刷新人工反馈区。', tag: '报告审核' },
        ] });
      }
    }
    boot();
  </script>
