<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告审核工作台 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <script src="js/report-flow-store.js"></script>
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88); --glass-strong: rgba(255,255,255,.94);
      --line: rgba(20,60,154,.12); --ink: #1e2a44; --mut: #64748b;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        radial-gradient(800px 600px at 60% 110%, rgba(20,60,154,.03), transparent 62%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(20,60,154,.28); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08), inset 0 1px 0 rgba(255,255,255,.6); border-radius: 16px; }
    .glass-sm { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6); box-shadow: 0 4px 16px rgba(20,60,154,.06); border-radius: 12px; }
    .brand-grad { background: linear-gradient(120deg, var(--brand) 0%, var(--brand-2) 70%, var(--brand-3) 120%); }
    .btn-brand { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 6px 18px rgba(20,60,154,.30); transition: all .2s; }
    .btn-brand:hover { box-shadow: 0 8px 26px rgba(20,60,154,.42); transform: translateY(-1px); }
    .btn-brand:disabled { filter: grayscale(.4) opacity(.6); box-shadow: none; transform: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }

    /* 满铺布局（注解画布里 min-h-screen → 设计高度，可填满 16:9/16:10/4:3） */
    .wb-shell { display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; }
    .wb-left { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .wb-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .wb-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; gap: 12px; padding-bottom: 4px; }
    .wb-center, .wb-right { flex: 1 1 0; min-width: 0; }
    .wb-right { display: flex; flex-direction: column; gap: 12px; }
    .wb-main.is-right-only .wb-center { display: none; }
    .wb-main.is-center-only .wb-right { display: none; }
    /* 人工处置固定底栏：跨中+右等宽，不随内容滚动 */
    .wb-feedback { flex-shrink: 0; margin-top: 12px; }
    @media (max-width: 1180px) {
      .wb-scroll { flex-direction: column; overflow-y: auto; }
      .wb-center, .wb-right { width: 100%; flex: 1 1 auto; }
      .wb-main.is-right-only .wb-center, .wb-main.is-center-only .wb-right { display: none; }
    }

    .roster-row { border: 1px solid rgba(20,60,154,.08); border-radius: 10px; background: #fff; }
    .roster-row:hover { background: #f8fafc; border-color: rgba(20,60,154,.18); }
    /* 上：业务状态=实心圆角胶囊；下：AI 结论=描边矩形，AI 写进标签 */
    .state-chip { font-weight: 600; border-radius: 999px; }
    .ai-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 5px; border: 1px solid; background: #fff;
      padding: 1px 7px 1px 5px; font-size: 11px; font-weight: 600; line-height: 1.6;
    }
    .ai-chip .ai-mark {
      font-size: 9px; font-weight: 800; letter-spacing: .04em;
      padding: 0 4px; border-radius: 3px; color: #fff; line-height: 1.5;
    }
    .ai-chip.ai-pass { color: #047857; border-color: #6ee7b7; }
    .ai-chip.ai-pass .ai-mark { background: #059669; }
    .ai-chip.ai-warn { color: #b45309; border-color: #fcd34d; }
    .ai-chip.ai-warn .ai-mark { background: #d97706; }
    .ai-chip.ai-fail { color: #b91c1c; border-color: #fca5a5; }
    .ai-chip.ai-fail .ai-mark { background: #dc2626; }
    .ai-chip.ai-run { color: #1d4ed8; border-color: #93c5fd; }
    .ai-chip.ai-run .ai-mark { background: #2563eb; }
    #ai-summary { position: relative; overflow: visible; }
    .sum-stamp {
      position: absolute; top: 10px; right: 10px;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 20px; font-weight: 800; letter-spacing: .16em;
      border: 2.5px solid currentColor; border-radius: 8px;
      padding: 6px 12px; transform: rotate(-10deg);
      pointer-events: none; line-height: 1; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(15,23,42,.08);
    }
    .sum-stamp.pass { color: #059669; background: rgba(236,253,245,.92); }
    .sum-stamp.warn { color: #d97706; background: rgba(255,251,235,.94); }
    .sum-stamp.fail { color: #dc2626; background: rgba(254,242,242,.94); }
    .sum-body { color: #334155; font-size: 12px; line-height: 1.8; padding-right: 96px; }
    .sum-tip { position: relative; display: inline-flex; align-items: center; color: #94a3b8; cursor: help; }
    .sum-tip:hover, .sum-tip:focus { color: var(--brand); }
    .sum-tip-pop {
      display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 8;
      width: 280px; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 400;
      line-height: 1.7; color: #334155; background: #fff; border: 1px solid #e2e8f0;
      box-shadow: 0 10px 24px rgba(15,23,42,.12); white-space: normal;
    }
    .sum-tip:hover .sum-tip-pop, .sum-tip:focus .sum-tip-pop, .sum-tip:focus-within .sum-tip-pop { display: block; }
    .roster-tabs { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .roster-tab { padding: 3px 10px; font-size: 11px; color: #64748b; }
    .roster-tab.is-on { background: var(--brand); color: #fff; font-weight: 600; }
    .roster-filter { cursor: pointer; border: 1px solid transparent; }
    .roster-filter.is-on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); font-weight: 600; }
    #btn-rerun:disabled { opacity: .45; color: #94a3b8 !important; border-color: #cbd5e1 !important; cursor: not-allowed; background: #f8fafc; }
    .eq-card { border: 1px solid rgba(20,60,154,.12); border-radius: 10px; background: linear-gradient(180deg,#fff,#f8fafc); padding: 10px 12px; }
    .eq-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px 12px; }
    .eq-grid .eq-k { color: #94a3b8; font-size: 11px; }
    .eq-grid .eq-v { color: #1e293b; font-weight: 600; }
    .raw-card { border: 1px solid rgba(20,60,154,.12); border-radius: 10px; background: #fff; }
    .phase-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .phase-tab { border: 1px solid var(--line); background: #fff; color: #475569; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
    .phase-tab.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .phase-tab .ph-conc { margin-left: 6px; font-size: 10px; opacity: .9; }
    .fg-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .fg-table th, .fg-table td { border: 1px solid #e2e8f0; padding: 4px 6px; white-space: nowrap; }
    .fg-table th.g-nom { background: #eff6ff; color: #1d4ed8; }
    .fg-table th.g-mea { background: #f0fdf4; color: #047857; }
    .fg-table th.g-calc { background: #fff7ed; color: #c2410c; }
    .fg-table td.conc-ok { color: #047857; font-weight: 600; vertical-align: middle; text-align: center; }
    #info-body { display: flex; flex-direction: column; }
    .round-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .round-tab { flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: #64748b; border-radius: 999px; padding: 3px 10px; font-size: 11px; }
    .round-tab.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .fb-chip { font-weight: 600; }
    .fb-chip.idle, .action-chip.idle { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .fb-chip.back, .action-chip.back { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .fb-chip.need, .action-chip.need { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .fb-chip.run, .action-chip.run { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .action-chip { font-weight: 600; white-space: nowrap; }
    .policy-sw { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; color: #475569; }
    .preview-frame { width: 100%; height: 100%; flex: 1 1 auto; min-height: 0; border: 0; border-radius: 8px; background: #fff; }
    #info-body:has(.preview-frame) { overflow: hidden; }
    .rule-item { padding: 5px 10px; }
    .rule-head { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 28px; }
    .rule-cat { flex: 0 0 4.75rem; text-align: left; }
    .rule-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.35; }
    .rule-end { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
    .rule-chevron { color: #94a3b8; font-size: 12px; width: 14px; text-align: center; }
    .log-who { display: inline-flex; align-items: center; gap: 4px; color: #334155; font-weight: 500; }

    .wb-left .audit-legend { display: flex; flex-wrap: wrap; gap: 8px 10px; font-size: 12px; color: #94a3b8; }
    .wb-left .audit-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .wb-left .lg-k { color: #64748b; font-weight: 600; }
    .wb-left .lg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 999px; border: 2px solid #3b82f6; box-sizing: border-box; }
    .wb-left .lg-line { display: inline-block; width: 14px; height: 2px; border-radius: 999px; background: #3b82f6; }
    .wb-left .lg-pass { border-color: #3b82f6; background: #3b82f6; }
    .wb-left .lg-reject { border-color: #ef4444; background: #ef4444; }
    .wb-left .lg-pending { border-color: #f59e0b; background: #fff; }

    /* 花名册 */
    .roster-row.active { background: linear-gradient(90deg, rgba(20,60,154,.10), rgba(20,60,154,0)); box-shadow: inset 3px 0 0 var(--brand); }
    .need-action { animation: pulseA 2.2s ease-in-out infinite; }
    @keyframes pulseA { 0%,100%{ box-shadow: 0 0 0 0 rgba(245,158,11,.5);} 50%{ box-shadow: 0 0 0 5px rgba(245,158,11,0);} }

    /* 规则项：以规则名为主体，按通过与否整条变色 */
    .rule-item { border-radius: 12px; border: 1px solid var(--line); transition: all .18s; }
    .rule-item.r-pass { background: linear-gradient(90deg, rgba(16,185,129,.09), rgba(16,185,129,.02)); border-color: rgba(16,185,129,.30); border-left: 4px solid #10b981; }
    .rule-item.r-warn { background: linear-gradient(90deg, rgba(245,158,11,.12), rgba(245,158,11,.03)); border-color: rgba(245,158,11,.38); border-left: 4px solid #f59e0b; }
    .rule-item.r-sev  { background: linear-gradient(90deg, rgba(239,68,68,.12), rgba(239,68,68,.03)); border-color: rgba(239,68,68,.40); border-left: 4px solid #ef4444; }
    .lvl-region { border-radius: 14px; border: 1px dashed rgba(20,60,154,.18); padding: 10px; background: rgba(255,255,255,.35); }
    .lvl-badge { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color:#fff; border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 600; letter-spacing:.02em; }

    .info-tab.active { color: var(--brand); border-color: var(--brand); font-weight: 600; }
    .prog-rule .st-run { color: var(--brand-2); }
    .prog-rule .st-pass { color: #10b981; }
    .prog-rule .st-fail { color: #ef4444; }
    #ai-progress { background: linear-gradient(120deg, rgba(46,91,214,.08), rgba(91,141,239,.04)); }
  </style>
</head>
<body class="text-slate-700">

  <div class="h-screen flex flex-col overflow-hidden">
  <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="report-review.html">
    <a href="report-review.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告审核</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
      报告审核工作台
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div id="wb-page" class="flex flex-1 flex-col gap-3 overflow-hidden p-3" style="min-height:0">
    <div id="ai-liability" class="flex items-center gap-2 rounded-xl border border-white/60 bg-white/55 px-4 py-2 text-sm backdrop-blur" style="color:var(--brand)">
      <i class="fa fa-shield"></i>
      <span>AI 仅输出预审意见与问题清单，最终核准与签发由授权审核员确认；下方「标注」仅用于 AI 模型持续学习，不对上下游人员展示。</span>
    </div>

    <!-- A 区：委托概览（默认折叠） -->
    <section class="glass" data-annotate="rv-overview">
      <button id="ov-toggle" type="button" class="flex w-full items-center justify-between gap-3 px-4 py-2.5 text-left">
        <span class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
          <span class="font-semibold" style="color:var(--brand)"><i class="fa fa-folder-open-o mr-1"></i><span id="ov-code" class="mono"></span></span>
          <span class="text-slate-500" id="ov-customer"></span>
          <span class="text-slate-500" id="ov-sample"></span>
          <span class="text-slate-500">报告 <b class="text-slate-700 mono" id="ov-count"></b> 份</span>
          <span class="text-slate-500">受理 <span id="ov-accept" class="mono"></span></span>
          <span class="text-slate-500">要求完成 <span id="ov-require" class="mono"></span></span>
          <span class="chip bg-blue-50 text-blue-700" id="ov-status"></span>
        </span>
        <span class="flex items-center gap-1 text-xs" style="color:var(--brand)"><span id="ov-toggle-text">展开</span><i id="ov-chevron" class="fa fa-angle-down"></i></span>
      </button>
      <div id="ov-body" class="hidden border-t border-white/50 px-4 pb-3 pt-2">
        <div class="mb-2 flex items-center gap-1 text-sm">
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="contract">合同信息</button>
          <button class="ov-tab rounded-lg px-3 py-1" data-tab="entrust" style="background:rgba(20,60,154,.08);color:var(--brand)">委托信息</button>
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="pay">付款信息</button>
          <button class="ov-tab rounded-lg px-3 py-1 text-slate-500" data-tab="report">报告信息</button>
        </div>
        <div id="ov-panel" class="text-sm text-slate-600"></div>
      </div>
    </section>

    <!-- B 区：审核操作台 -->
    <div class="wb-shell">
      <!-- 左：统观 + 操作日志 -->
      <aside class="wb-left">
        <section class="glass flex flex-col" style="min-height:0;flex:0 0 auto;max-height:58%">
          <div class="flex items-center gap-2 border-b border-white/50 px-3 py-1.5 text-xs font-medium text-slate-500">
            <i class="fa fa-files-o" style="color:var(--brand)"></i>报告列表
            <div id="roster-tabs" class="roster-tabs">
              <button type="button" class="roster-tab is-on" data-tab="need">待审核 <span id="tab-need-n" class="font-normal opacity-80"></span></button>
              <button type="button" class="roster-tab" data-tab="left">其他流程 <span id="tab-left-n" class="font-normal opacity-80"></span></button>
            </div>
          </div>
          <div id="roster-summary" class="px-3 pt-1.5 pb-1 text-xs text-slate-500"></div>
          <div id="roster-list" class="overflow-y-auto px-2 pb-2" style="min-height:0" data-annotate="rv-roster"></div>
        </section>
        <section class="glass flex flex-1 flex-col" style="min-height:0" data-annotate="rv-log">
          <div class="border-b border-white/50 px-3 py-2">
            <div class="flex items-center justify-between gap-2">
              <h4 class="min-w-0 text-sm font-medium text-slate-700">操作日志 <span id="log-report" class="font-normal text-slate-400"></span></h4>
              <button type="button" id="wbLogOrderBtn" class="shrink-0 text-xs text-blue-600 hover:underline">时间倒序</button>
            </div>
            <span class="audit-legend mt-1.5">
              <span><i class="lg-dot lg-pass"></i>通过</span>
              <span><i class="lg-dot lg-reject"></i>拒绝</span>
              <span><i class="lg-dot lg-pending"></i>当前</span>
              <span><i class="lg-line lg-pass"></i>推进</span>
              <span><i class="lg-line lg-reject"></i>回退</span>
            </span>
          </div>
          <div id="log-list" class="flex-1 overflow-y-auto px-3 py-3" style="min-height:0"></div>
        </section>
      </aside>

      <!-- 中 + 右 + 固定反馈底栏 -->
      <div class="wb-main" id="wb-main">
        <div class="wb-scroll">
          <!-- 中：AI 审核结果 -->
          <section class="wb-center glass flex flex-col" style="min-height:0" data-annotate="rv-ai">
            <div class="border-b border-white/50 px-4 py-2">
              <div class="flex items-center gap-2">
                <div class="flex min-w-0 items-center gap-2 text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-magic"></i>AI 审核结果
                  <span id="ai-report-no" class="text-xs font-normal text-slate-400 mono"></span></div>
                <button id="btn-rerun" type="button" class="ml-auto rounded-lg border px-2.5 py-1 text-xs" style="border-color:var(--brand);color:var(--brand)"><i class="fa fa-refresh mr-1"></i>重跑 AI 审核</button>
                <button id="btn-expand-center" type="button" class="rounded-md border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-white/60"><i class="fa fa-expand mr-1"></i><span data-split-label>展开</span></button>
              </div>
              <div class="mt-1.5 flex items-center">
                <span id="ai-round" class="chip action-chip bg-slate-100 text-slate-500"></span>
              </div>
            </div>
            <div id="signoff-banner" class="hidden border-b border-amber-200/60 bg-amber-50/70 px-4 py-2 text-xs text-amber-800"></div>
            <div class="flex-1 overflow-y-auto px-4 py-3" style="min-height:0">
              <!-- 综合结论置顶 -->
              <div id="ai-summary" class="mb-3 rounded-xl border px-4 py-3" style="border-color:rgba(20,60,154,.2);background:linear-gradient(120deg,rgba(46,91,214,.1),rgba(91,141,239,.04))"></div>
              <!-- 加载进度 -->
              <div id="ai-progress" class="hidden mb-3 rounded-xl border border-blue-100 px-3 py-2">
                <div class="mb-1.5 text-xs" style="color:var(--brand)"><i class="fa fa-spinner fa-spin mr-1"></i>AI 正在逐条执行审核规则…</div>
                <div id="ai-progress-list" class="space-y-1 text-xs"></div>
              </div>
              <div id="ai-rounds" class="hidden mb-2"></div>
              <div id="ai-diff" class="hidden mb-3 rounded-xl border border-slate-200 bg-white/60 px-3 py-2 text-xs"></div>
              <div id="ai-issues" class="space-y-3"></div>
              <div id="ai-notices"></div>
            </div>
          </section>

          <!-- 右：报告文件 + 预览 + 收样/检测 -->
          <div class="wb-right">
            <section class="glass px-4 py-3" data-annotate="rv-file">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs text-slate-400">报告文件</div>
                  <div class="mt-0.5 flex min-w-0 items-center gap-2">
                    <a href="#" id="rp-file" onclick="openPageOffice(this.textContent);return false;" class="truncate text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-file-word-o mr-1"></i></a>
                    <span id="rp-version" class="chip brand-grad text-white mono flex-shrink-0">V1.0</span>
                  </div>
                </div>
                <button id="btn-expand-right" type="button" class="flex-shrink-0 rounded-md border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-white/60"><i class="fa fa-expand mr-1"></i><span data-split-label>展开</span></button>
              </div>
              <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-500">
                <span>编制人 <b class="text-slate-700" id="rp-compiler"></b></span>
                <span>编制时间 <span class="mono" id="rp-compiletime"></span></span>
                <span id="rp-version-prev" class="text-slate-400"></span>
              </div>
            </section>
            <section class="glass flex flex-1 flex-col" style="min-height:260px" data-annotate="rv-info">
              <div class="flex items-center gap-1 border-b border-white/50 px-2 pt-2 text-xs whitespace-nowrap">
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500 active" data-panel="preview">报告预览</button>
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="recv">收样信息</button>
                <button class="info-tab border-b-2 border-transparent px-2.5 py-1.5 text-slate-500" data-panel="detect">检测信息</button>
              </div>
              <div id="info-body" class="flex-1 overflow-y-auto p-3 text-sm" style="min-height:0"></div>
            </section>
          </div>
        </div>

        <!-- 固定人工处置底栏（跨 中+右，不随滚动） -->
        <section class="wb-feedback glass" data-annotate="rv-manual">
          <div class="flex items-center gap-2 border-b border-white/50 px-4 py-2 text-sm font-semibold" style="color:var(--brand)">
            <i class="fa fa-gavel"></i>人工处置
            <span id="fb-report" class="text-xs font-normal text-slate-400 mono"></span>
            <span id="fb-action" class="chip fb-chip hidden"></span>
            <button id="policy-toggle" type="button" data-annotate="rv-policy" data-auto="1" class="policy-sw ml-auto" title="严重项命中后是否自动退回编制">
              <i class="fa fa-toggle-on" style="color:var(--brand)"></i>自动退回：开
            </button>
          </div>
          <div id="manual-feedback" class="px-4 py-2"></div>
        </section>
      </div>
    </div>
  </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/return-store.js"></script>
  <script src="js/return-ui.js"></script>
  <script src="js/audit-log.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function qp(name) { var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }
    function openPageOffice(name) { alert('PageOffice 插件预览：' + name + '（原型占位）'); }

    var CODE = qp('code') || 'SC2026/0238';
    var entrust = ReportReviewMock.getEntrust(CODE);
    var RT = {};
    var selectedId = null;
    var report0 = null;
    var splitMode = 'split';
    var rosterTab = 'need';
    var rosterFilter = {};

    // ---------- 委托概览 ----------
    function row(label, val) { return '<div><span class="text-slate-400">' + label + '：</span><span class="text-slate-700">' + esc(val) + '</span></div>'; }
    function ovFileIcon(type) { return type === 'word' ? 'fa-file-word-o' : 'fa-file-pdf-o'; }
    function ovAttach(title, files, extraHead) {
      extraHead = extraHead || '';
      return '<div class="mt-3 border-t border-white/50 pt-2" data-ov-attach="' + esc(title) + '">' +
        '<div class="mb-1.5 text-xs font-medium text-slate-500"><i class="fa fa-paperclip mr-1"></i>' + esc(title) + '</div>' +
        '<div class="overflow-x-auto"><table class="w-full min-w-[480px] border-collapse text-left text-xs">' +
        '<thead><tr class="text-slate-400">' +
        '<th class="w-10 py-1 font-medium">序号</th><th class="py-1 font-medium">' + esc(title) + '</th>' + extraHead +
        '<th class="py-1 font-medium">生成时间</th><th class="w-14 py-1 font-medium">操作</th></tr></thead><tbody>' +
        files.map(function (f, i) {
          return '<tr class="text-slate-600">' +
            '<td class="py-1">' + (i + 1) + '</td>' +
            '<td class="py-1"><a href="#" class="ov-file hover:underline" style="color:var(--brand)" data-file="' + esc(f.name) + '"><i class="fa ' + ovFileIcon(f.type) + ' mr-1"></i>' + esc(f.name) + '</a></td>' +
            (f.amount != null ? '<td class="py-1">' + esc(f.amount) + '</td>' : '') +
            '<td class="py-1 mono">' + esc(f.at) + '</td>' +
            '<td class="py-1"><button type="button" class="ov-file text-blue-600 hover:underline" data-file="' + esc(f.name) + '">查看</button></td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }
    function ovPanel(tab) {
      var e = entrust;
      var html;
      if (tab === 'contract') {
        var c = e.contractInfo || {};
        var cNo = (c.contractNo && c.contractNo !== '/') ? c.contractNo : e.code.replace('/', '-');
        html = '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('是否框架合同', c.frame) + row('合同编号', c.contractNo) + row('签约地点', c.signPlace) + row('签约日期', c.signDate) + row('检测中心', c.center) + '</div>';
        html += ovAttach('合同附件', [{ name: cNo + '-合同.pdf', type: 'pdf', at: (c.signDate || e.acceptDate || '') + ' 10:00' }]);
        return html;
      }
      if (tab === 'pay') {
        var p = e.payInfo || {};
        html = '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('样品检测总价(元)', p.total) + row('实际费用(元)', p.actual) + row('折扣率(%)', p.discount) + row('付款方式', p.way) + row('付款单位', p.payer) + row('业务备注', p.note) + '</div>';
        html += ovAttach('收费通知单', [{ name: e.code + '-收费通知单.pdf', type: 'pdf', at: (e.acceptDate || '') + ' 09:20', amount: p.actual }], '<th class="py-1 font-medium">金额(元)</th>');
        return html;
      }
      if (tab === 'report') {
        var r = e.reportInfo || {};
        return '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('报告传送方式', r.send) + row('报告资质', r.qualify) + row('结果方式', r.resultMode) + row('报告语言', r.lang) + row('份数', r.copies) + row('报告描述', r.desc) + '</div>';
      }
      html = '<div class="grid grid-cols-2 gap-x-6 gap-y-1.5 md:grid-cols-3">' + row('委托编号', e.code) + row('客户单位', e.customer) + row('样品名称', e.sample) + row('优先等级', e.priority) + row('送样时间', e.sendDate) + row('要求完成', e.requireDate) + row('受理日期', e.acceptDate) + row('编制人', e.compiler) + row('任务状态', e.status) + '</div>';
      html += ovAttach('检测委托书', [
        { name: e.code + '-检测委托书.docx', type: 'word', at: (e.acceptDate || '') + ' 09:12' },
        { name: e.code + '-检测委托书.pdf', type: 'pdf', at: (e.acceptDate || '') + ' 09:12' }
      ]);
      return html;
    }
    function initOverview() {
      $('ov-code').textContent = entrust.code; $('ov-customer').textContent = entrust.customer; $('ov-sample').textContent = entrust.sample;
      $('ov-count').textContent = entrust.reports.length; $('ov-accept').textContent = entrust.acceptDate;
      $('ov-require').textContent = entrust.requireDate || '—'; $('ov-status').textContent = entrust.status;
      $('ov-panel').innerHTML = ovPanel('entrust');
      $('ov-toggle').addEventListener('click', function () {
        var open = $('ov-body').classList.toggle('hidden') === false;
        $('ov-toggle-text').textContent = open ? '收起' : '展开';
        $('ov-chevron').className = 'fa fa-angle-' + (open ? 'up' : 'down');
      });
      document.querySelectorAll('.ov-tab').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.ov-tab').forEach(function (x) { x.className = 'ov-tab rounded-lg px-3 py-1 text-slate-500'; x.removeAttribute('style'); });
          b.className = 'ov-tab rounded-lg px-3 py-1'; b.setAttribute('style', 'background:rgba(20,60,154,.08);color:var(--brand)');
          $('ov-panel').innerHTML = ovPanel(b.getAttribute('data-tab'));
        });
      });
      $('ov-panel').addEventListener('click', function (ev) {
        var a = ev.target.closest('.ov-file');
        if (!a) return;
        ev.preventDefault();
        openPageOffice(a.getAttribute('data-file'));
      });
    }

    // ---------- 轮次 ----------
    function roundsOf(r) { return RT[r.id].rounds; }
    function curIndex(r) { return RT[r.id].roundIndex; }
    function resultAt(r, i) { return ReportReviewMock.evalRound(r, roundsOf(r)[i]); }
    function emptyResult(conclusion) {
      return { conclusion: conclusion, items: [], passed: [], failed: [], severe: [], review: [], notices: [], summary: { total: 0, universal: 0, category: 0, failed: 0 } };
    }
    function currentResult(r) {
      if (r.aiRun === 'running') return emptyResult('审核中');
      if (r.aiRun === 'error') return emptyResult('异常');
      return resultAt(r, curIndex(r));
    }
    function getSelected() { for (var i = 0; i < entrust.reports.length; i++) if (entrust.reports[i].id === selectedId) return entrust.reports[i]; return null; }

    function badge(c, small) { var m = ReportReviewMock.CONCLUSION_META[c]; return '<span class="chip ' + m.cls + ' ' + (small ? '' : 'text-sm px-3 py-1') + '"><i class="fa ' + m.icon + '"></i>' + c + '</span>'; }
    function aiTone(c) { return c === '通过' ? 'pass' : (c === '需复核' ? 'warn' : (c === '审核中' ? 'run' : (c === '异常' ? 'fail' : 'fail'))); }
    function aiChip(c) {
      return '<span class="ai-chip ai-' + aiTone(c) + '"><span class="ai-mark">AI</span>' + esc(c) + '</span>';
    }
    var KALIBER = '判定口径：命中任一严重项 → 不通过；仅命中一般项 → 需复核；全部规则通过 → 通过。严重度由规则台账预设，人工可覆盖。';

    // 报告「业务状态」（以是否需操作为主视觉）
    function stateMeta(rep) {
      if (rep.aiRun === 'running') return { label: 'AI 审核中', cls: 'bg-blue-100 text-blue-700', need: false };
      if (rep.aiRun === 'error') return { label: 'AI 审核异常', cls: 'bg-red-100 text-red-700', need: true };
      if (rep.disposition) return { label: '已' + rep.disposition.final, cls: 'bg-emerald-100 text-emerald-700', need: false };
      if (rep.state === '自动退回编制' && ReportReviewMock.getPolicy().autoReturnOnSevere) return { label: '已自动退回编制', cls: 'bg-red-100 text-red-700', need: false };
      if (rep.state === '签发退回待复核') return { label: '签发退回 · 待复核', cls: 'bg-amber-100 text-amber-800', need: true };
      return { label: '待处置', cls: 'bg-amber-100 text-amber-800', need: true };
    }

    function needsHuman(rep) { return ReportReviewMock.needsHuman(rep); }
    function reportBucket(rep) {
      if (rep.aiRun === 'running') return '审核中';
      if (rep.aiRun === 'error') return '异常';
      if (rep.disposition) return '已处置';
      if (rep.state === '自动退回编制' && ReportReviewMock.getPolicy().autoReturnOnSevere) return '自动退回';
      if (rep.state === '签发退回待复核') return '签发退回';
      return '待处置';
    }
    function rosterCard(rep) {
      var r = currentResult(rep); var sm = stateMeta(rep);
      var cur = ReportReviewMock.currentRound(rep);
      return '<button type="button" class="roster-row ' + (rep.id === selectedId ? 'active' : '') + ' mb-1 flex w-full flex-col gap-1 px-2.5 py-1.5 text-left" data-report-id="' + rep.id + '" data-conclusion="' + r.conclusion + '" data-state="' + esc(rep.state) + '" data-need="' + (needsHuman(rep) ? '1' : '0') + '" data-bucket="' + reportBucket(rep) + '">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<span class="text-sm font-semibold text-slate-800 mono">' + esc(rep.reportNo) + '</span>' +
          '<span class="state-chip chip ' + sm.cls + (sm.need ? ' need-action' : '') + '">' + (sm.need ? '<i class="fa fa-bell-o"></i>' : '') + sm.label + '</span>' +
        '</div>' +
        '<div class="flex items-center justify-between gap-2 text-xs text-slate-400">' +
          '<span class="mono">版本 ' + esc(cur.revision) + '</span>' +
          aiChip(r.conclusion) +
        '</div>' +
      '</button>';
    }
    // ---------- 统观区 ----------
    function renderRoster() {
      var counts = { 待处置: 0, 签发退回: 0, 自动退回: 0, 已处置: 0, 审核中: 0, 异常: 0 };
      var need = []; var left = [];
      entrust.reports.forEach(function (rep) {
        counts[reportBucket(rep)]++;
        (needsHuman(rep) ? need : left).push(rep);
      });
      var pool = rosterTab === 'left' ? left : need;
      var keys = Object.keys(rosterFilter);
      var shown = keys.length ? pool.filter(function (rep) { return rosterFilter[reportBucket(rep)]; }) : pool;
      function emptyHint(t) { return '<div class="px-2 py-3 text-center text-xs text-slate-400">' + t + '</div>'; }
      $('roster-list').innerHTML = shown.length ? shown.map(rosterCard).join('') : emptyHint(keys.length ? '没有符合筛选的报告' : (rosterTab === 'left' ? '暂无其他流程报告' : '暂无待审核报告'));
      var nNeed = $('tab-need-n'); var nLeft = $('tab-left-n');
      if (nNeed) nNeed.textContent = String(need.length);
      if (nLeft) nLeft.textContent = String(left.length);
      document.querySelectorAll('#roster-tabs .roster-tab').forEach(function (b) {
        b.classList.toggle('is-on', b.getAttribute('data-tab') === rosterTab);
      });
      var chipMeta = rosterTab === 'left'
        ? [['自动退回', 'bg-red-50 text-red-700'], ['已处置', 'bg-emerald-50 text-emerald-700']]
        : [['待处置', 'bg-amber-50 text-amber-700'], ['签发退回', 'bg-amber-50 text-amber-800'], ['审核中', 'bg-blue-50 text-blue-700'], ['异常', 'bg-red-50 text-red-700']];
      $('roster-summary').innerHTML = '<div class="flex flex-wrap gap-1">' + chipMeta.map(function (c) {
        var on = rosterFilter[c[0]] ? ' is-on' : '';
        return '<button type="button" class="roster-filter chip ' + c[1] + on + '" data-filter="' + c[0] + '">' + c[0] + ' ' + counts[c[0]] + '</button>';
      }).join('') + '</div>';
      document.querySelectorAll('.roster-row').forEach(function (b) { b.addEventListener('click', function () { select(b.getAttribute('data-report-id'), true); }); });
    }
    function bindRosterChrome() {
      $('roster-tabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-tab]'); if (!b) return;
        var tab = b.getAttribute('data-tab');
        if (tab === rosterTab) return;
        rosterTab = tab;
        rosterFilter = {};
        renderRoster();
      });
      $('roster-summary').addEventListener('click', function (e) {
        var b = e.target.closest('[data-filter]'); if (!b) return;
        var k = b.getAttribute('data-filter');
        if (rosterFilter[k]) { delete rosterFilter[k]; renderRoster(); return; }
        rosterFilter[k] = true;
        renderRoster();
      });
    }

    // ---------- 操作日志（与报告记录抽屉同一套：默认倒序，可切换） ----------
    var logOrder = 'desc';
    function renderLog(report) {
      $('log-report').textContent = '· ' + report.reportNo;
      var btn = $('wbLogOrderBtn');
      if (btn) btn.textContent = logOrder === 'desc' ? '时间倒序' : '时间正序';
      var logs = window.AuditLog
        ? AuditLog.present(report.log || [], logOrder, AuditLog.currentNodeForReview(report))
        : (report.log || []);
      $('log-list').innerHTML = logs.length
        ? '<ol class="audit-tl">' + logs.map(function (e) { return AuditLog.itemHtml(e); }).join('') + '</ol>'
        : '<p class="py-6 text-center text-sm text-slate-400">暂无操作日志</p>';
    }

    // ---------- AI 结果 ----------
    function scopeChip(scope) { var cls = scope === '通用' ? 'bg-slate-100 text-slate-500' : 'bg-violet-100 text-violet-700'; return '<span class="chip ' + cls + '">' + (scope === '通用' ? '<i class="fa fa-cube"></i>通用规则' : '<i class="fa fa-tags"></i>' + esc(scope)) + '</span>'; }
    function sevChip(it) {
      if (it.passed) return '<span class="chip bg-emerald-100 text-emerald-700"><i class="fa fa-check"></i>通过</span>';
      return '<span class="chip bg-red-100 text-red-700"><i class="fa fa-times"></i>不通过</span>';
    }
    function sevHint(it) {
      if (it.passed) return '';
      return it.severity === '严重' ? '<span class="chip bg-red-50 text-red-600">严重</span>' : '<span class="chip bg-amber-50 text-amber-700">一般</span>';
    }
    function labelState(report, ruleId) {
      var map = (RT[report.id] && RT[report.id].labels) || {};
      return map[ruleId] || { label: '正常', note: '', submitted: false };
    }
    // 每条规则差异化证据（读取当前快照）
    function evidenceText(it, snap) {
      var s = snap || {};
      switch (it.rule_id) {
        case 'L1-a-1': return '样品编号「' + s.sample_no + '」按编号规则（字母前缀 + 年号 - 序号）校验：' + (it.passed ? '命名规范，通过。' : '为空或不符合规则。');
        case 'L3-a-1': return '检测标准号「' + s.test_standard + '」年号校验：' + (it.passed ? '带年号且现行有效。' : '缺年号或已废止。');
        case 'L2-b-1': return '委托项 [' + (s.entrust_items || []).join('、') + '] 对照实测项 [' + (s.result_params || []).join('、') + ']：' + (it.passed ? '逐项均有结果。' : '存在未覆盖项。');
        case 'L2-a-1': return '日期链 收样(' + s.receive_date + ') ≤ 检测(' + s.test_date + ') ≤ 报告(' + s.report_date + ')：' + (it.passed ? '先后合理。' : '先后颠倒。');
        case 'L2-c-1': return '设备校准有效期（' + s.device_calib_from + ' ~ ' + s.device_calib_to + '）覆盖检测日期（' + s.test_date + '）：' + (it.passed ? '已覆盖。' : '未覆盖。');
        case 'L3-a-2': return '报告引用标准「' + s.cited_standard + '」 vs 实检标准「' + s.test_standard + '」：' + (it.passed ? '一致。' : '不一致（注意年号差异）。');
        case 'L1-b-1': var g = s.signatures || {}; return '签名位 检测=' + (g.tester || '缺') + ' / 审核=' + (g.reviewer || '缺') + ' / 批准=' + (g.approver || '缺') + '：' + (it.passed ? '齐全。' : '存在缺位。');
        case 'L1-d-1': return '计量单位 [' + (s.units || []).map(function (u) { return u.param + '→' + u.unit; }).join('、') + '] 对照允许单位集合：' + (it.passed ? '均匹配。' : '存在越界单位。');
        case 'PG-CABLE-01': return '导体直流电阻 实测 ' + s.conductor_resistance + ' Ω/km vs 标准限值 ' + s.conductor_resistance_limit + ' Ω/km：' + (it.passed ? '未超限。' : '超过限值。');
        default: return it.message;
      }
    }
    function ruleItemHtml(it, snap, report) {
      var cls = it.passed ? 'r-pass' : (it.severity === '严重' ? 'r-sev' : 'r-warn');
      var lb = labelState(report, it.rule_id);
      var showNote = lb.label === '误报' || lb.label === '漏报';
      return '<div class="rule-item ' + cls + '" data-rule-id="' + it.rule_id + '" data-scope="' + esc(it.scope) + '" data-severity="' + esc(it.severity) + '" data-passed="' + it.passed + '">' +
        '<div class="rule-head">' +
          '<span class="rule-cat"><span class="chip bg-slate-100 text-slate-500">' + esc(it.category || '') + '</span></span>' +
          '<span class="rule-name">' + esc(it.name) + '</span>' +
          scopeChip(it.scope) + sevHint(it) +
          '<span class="rule-end">' + sevChip(it) + '<i class="fa fa-angle-down rule-chevron"></i></span>' +
        '</div>' +
        '<div class="item-detail mt-1.5 hidden rounded-lg bg-white/70 px-3 py-2 text-xs text-slate-600">' +
          '<div><b>证据：</b>' + esc(evidenceText(it, snap)) + '</div>' +
          (!it.passed && it.advice ? '<div class="mt-1"><b>建议：</b>' + esc(it.advice) + '</div>' : '') +
          '<div class="mt-2 flex flex-wrap items-center gap-1 border-t border-slate-100 pt-2">' +
            '<span class="text-slate-500" title="' + ReportReviewMock.LABEL_NOTE + '"><i class="fa fa-tag"></i> 标注</span>' +
            '<select class="item-label rounded border border-slate-300 px-1.5 py-0.5 text-xs" data-rule="' + it.rule_id + '">' +
              ['正常', '误报', '漏报'].map(function (opt) { return '<option' + (lb.label === opt ? ' selected' : '') + '>' + opt + '</option>'; }).join('') +
            '</select>' +

    }
    function boot() {
      if (!entrust) { document.getElementById('wb-page').innerHTML = '<div class="glass p-6 text-slate-500">未找到委托 ' + esc(CODE) + '</div>'; return; }
      entrust.reports.forEach(function (rep) { RT[rep.id] = { rounds: rep.rounds.slice(), roundIndex: rep.rounds.length - 1, labels: {} }; });
      initOverview(); initInfoTabs(); initRerun(); bindPolicy(); bindRosterChrome(); syncPolicyToggle();
      $('wbLogOrderBtn').addEventListener('click', function () {
        logOrder = logOrder === 'desc' ? 'asc' : 'desc';
        renderLog(getSelected());
      });
      var firstNeed = entrust.reports.filter(needsHuman)[0] || entrust.reports[0];
      select(firstNeed.id, true);

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({ annotations: [
          { id: 'rv-overview', selector: '[data-annotate="rv-overview"]', position: 'bottom', title: '委托概览（默认折叠）', content: '<strong>需求逻辑：</strong>审核以委托为单位，顶部一小块承载整条委托信息，默认收起。<br><strong>展示规则：</strong>收起时一行摘要；展开后「合同/委托/付款/报告信息」四小 tab。合同信息下挂合同附件，委托信息下挂检测委托书，付款信息下挂收费通知单，均可查看。', tag: '报告审核' },
          { id: 'rv-roster', selector: '[data-annotate="rv-roster"]', position: 'right', title: '待审核 / 其他流程', content: '<strong>需求逻辑：</strong>工作台展示该委托下全部报告，但操作与否必须一眼分开。<br><strong>展示规则：</strong>「待审核」下方标签仅 待处置 / 签发退回 / 审核中 / 异常；「其他流程」仅 自动退回 / 已处置。其他流程报告的「重跑 AI 审核」置灰。点选标签即筛选，再点取消。进入工作台默认待审核 Tab，并选中该组第一份。', tag: '报告审核' },
          { id: 'rv-log', selector: '[data-annotate="rv-log"]', position: 'right', title: '操作日志', content: '<strong>需求逻辑：</strong>审核前看清流转留痕，尤其签发退回。<br><strong>展示规则：</strong>与报告记录里的操作日志同一套：点分通过 / 拒绝 / 当前，线分推进 / 回退。默认时间倒序，可切正序。系统自动推进不单独占点。', tag: '报告审核' },
          { id: 'rv-ai', selector: '[data-annotate="rv-ai"]', position: 'left', title: 'AI 审核结果', content: '<strong>展示规则：</strong>第一行右上角固定「展开/还原」；处置状态芯片放第二行。规则分类标签左对齐。标注提交与处置执行拆开：误报/漏报备注单独提交，再次编辑后按钮变为「再次提交」。', tag: '报告审核' },
          { id: 'rv-manual', selector: '[data-annotate="rv-manual"]', position: 'top', title: '人工处置（固定底栏）', content: '<strong>需求逻辑：</strong>人工处置是必操作区，固定于底部。<br><strong>展示规则：</strong>不同意 AI 只出调优备注，退回原因仅在「同意退回」时出现。自动退回开关仅当本报告 AI 结论为「不通过」时显示。', tag: '报告审核' },
          { id: 'rv-policy', selector: '[data-annotate="rv-policy"]', position: 'top', title: '自动退回开关', content: '<strong>需求逻辑：</strong>系统级配置，以<strong>重跑当时</strong>是否开启为准。关后人工覆盖往下走，后续节点驳回不会自动重跑。<br><strong>展示规则：</strong>仅 AI 不通过的报告显示此开关。', tag: '报告审核' },
          { id: 'rv-file', selector: '[data-annotate="rv-file"]', position: 'left', title: '报告文件', content: '<strong>展示规则：</strong>文件名旁紧跟版本号；右上角「展开」隐藏审核区。PDF 于报告签发后生成，故此处不展示 PDF。', tag: '报告审核' },
          { id: 'rv-info', selector: '[data-annotate="rv-info"]', position: 'left', title: '报告预览 / 收样 / 检测', content: '<strong>展示规则：</strong>试验项名称右侧用标签展示检测员与检测时间；设备单独成卡；原始记录单独立一行，记录人员/时间在右上角。原始记录按标称值 / 测量值 / 计算值分区，有相别时用胶囊切换，每相一份结论。', tag: '报告审核' },
        ] });
      }
    }
    boot();
  </script>
  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=8" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>

</body>
