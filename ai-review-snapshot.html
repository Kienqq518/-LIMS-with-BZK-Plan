<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI审核快照 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <script src="js/audit-log.js"></script>
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88); --line: rgba(20,60,154,.12); --ink: #1e2a44;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08); border-radius: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }
    .ai-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; border: 1px solid; background: #fff; padding: 1px 7px 1px 5px; font-size: 11px; font-weight: 600; }
    .ai-chip .ai-mark { font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 3px; color: #fff; }
    .ai-pass { color: #047857; border-color: #6ee7b7; } .ai-pass .ai-mark { background: #059669; }
    .ai-warn { color: #b45309; border-color: #fcd34d; } .ai-warn .ai-mark { background: #d97706; }
    .ai-fail { color: #b91c1c; border-color: #fca5a5; } .ai-fail .ai-mark { background: #dc2626; }
    .ai-run { color: #1d4ed8; border-color: #93c5fd; } .ai-run .ai-mark { background: #2563eb; }
    #ai-summary { position: relative; overflow: visible; }
    .sum-stamp {
      position: absolute; top: 10px; right: 10px;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 20px; font-weight: 800; letter-spacing: .16em;
      border: 2.5px solid currentColor; border-radius: 8px;
      padding: 6px 12px; transform: rotate(-10deg);
      pointer-events: none; line-height: 1; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(15,23,42,.08);
    }
    .sum-stamp.pass { color: #059669; background: rgba(236,253,245,.92); }
    .sum-stamp.warn { color: #d97706; background: rgba(255,251,235,.94); }
    .sum-stamp.fail { color: #dc2626; background: rgba(254,242,242,.94); }
    .sum-stamp.run { color: #2563eb; background: rgba(239,246,255,.94); }
    .sum-body { color: #334155; font-size: 12px; line-height: 1.8; padding-right: 96px; }
    .round-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .round-tab { flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: #64748b; border-radius: 999px; padding: 3px 10px; font-size: 11px; }
    .round-tab.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .rule-item { padding: 5px 10px; border-radius: 12px; border: 1px solid var(--line); }
    .rule-item.r-pass { background: linear-gradient(90deg, rgba(16,185,129,.09), rgba(16,185,129,.02)); border-color: rgba(16,185,129,.30); border-left: 4px solid #10b981; }
    .rule-item.r-warn { background: linear-gradient(90deg, rgba(245,158,11,.12), rgba(245,158,11,.03)); border-color: rgba(245,158,11,.38); border-left: 4px solid #f59e0b; }
    .rule-item.r-sev  { background: linear-gradient(90deg, rgba(239,68,68,.12), rgba(239,68,68,.03)); border-color: rgba(239,68,68,.40); border-left: 4px solid #ef4444; }
    .rule-item.r-pend { background: #fff; border-left: 4px solid #93c5fd; }
    .rule-head { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 28px; }
    .rule-cat { flex: 0 0 4.75rem; text-align: left; }
    .rule-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.35; }
    .rule-end { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
    .rule-chevron { color: #94a3b8; font-size: 12px; width: 14px; text-align: center; }
    .lvl-region { border-radius: 14px; border: 1px dashed rgba(20,60,154,.18); padding: 10px; background: rgba(255,255,255,.35); }
    .lvl-badge { background: linear-gradient(120deg, var(--brand), var(--brand-2)); color:#fff; border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 12px; }
    .kv .k { color: #64748b; }
    .kv .v { color: #1e293b; font-weight: 600; word-break: break-all; }
    .audit-tl { list-style: none; margin: 0; padding: 0; }
    .audit-tl-item { display: grid; grid-template-columns: 18px minmax(0,1fr); column-gap: 12px; }
    .audit-rail { position: relative; }
    .audit-rail::after { content: ""; position: absolute; left: 50%; top: 18px; bottom: 0; width: 2px; transform: translateX(-50%); background: var(--rail, #cbd5e1); }
    .audit-tl-item:last-child .audit-rail::after { display: none; }
    .audit-dot { position: relative; z-index: 1; display: block; width: 14px; height: 14px; margin: 3px auto 0; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--dot, #94a3b8); background: var(--dot, #94a3b8); }
    .audit-tl-item.tone-success { --rail:#10b981; --dot:#10b981; }
    .audit-tl-item.tone-warn { --rail:#f59e0b; --dot:#f59e0b; }
    .audit-tl-item.tone-danger { --rail:#ef4444; --dot:#ef4444; }
    .audit-tl-item.tone-pending { --rail:#94a3b8; --dot:#fff; }
    .audit-tl-item.tone-pending .audit-dot { border-color:#f59e0b; }
    .audit-main { min-width: 0; padding: 0 0 14px; }
    .prog-step { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
    .prog-dot { width: 10px; height: 10px; border-radius: 99px; background: #cbd5e1; }
    .prog-step.done .prog-dot { background: #10b981; }
    .prog-step.run .prog-dot { background: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.16); }
    .queue-board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .queue-board .cell { border-radius: 10px; background: #f8fafc; padding: 10px 12px; }
    .queue-board .n { font-size: 20px; font-weight: 700; color: var(--brand); }
    .snap-grid {
      display: grid; gap: 12px; align-items: stretch;
      grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1.15fr) minmax(280px, 1fr);
    }
    .snap-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
    .info-tab { border-bottom: 2px solid transparent; }
    .info-tab.active { border-bottom-color: var(--brand); color: var(--brand); font-weight: 600; }
    .preview-frame { width: 100%; height: 100%; min-height: 360px; border: 0; border-radius: 8px; background: #fff; }
    .lb-chip { font-size: 10px; }
    @media (max-width: 1180px) { .snap-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="text-slate-700">
  <div class="flex h-screen flex-col overflow-hidden">
    <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="ai-review-workbench.html">
      <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
      <a href="ai-review-workbench.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">AI报告审核面板</a>
      <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
        AI审核快照
        <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
      </span>
    </div>

    <div id="page" class="flex-1 overflow-y-auto p-3"></div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }
    var QP = new URLSearchParams(location.search);
    var ROW = ReportReviewMock.findPanelRow(QP.get('id'));
    var roundIndex = null;
    var paInited = false;
    var KALIBER = '严重项 → 不通过；仅一般项 → 需复核；全通过 → 通过。排队 / 执行中不出三态。';

    function tone(c) { return c === '通过' ? 'pass' : (c === '需复核' ? 'warn' : (c === '审核中' || c === '排队' ? 'run' : 'fail')); }
    function aiChip(c) { return '<span class="ai-chip ai-' + tone(c) + '"><span class="ai-mark">AI</span>' + esc(c) + '</span>'; }
    function taskChip(t) {
      var cls = t === '成功' ? 'bg-emerald-50 text-emerald-700' : (t === '审核中' ? 'bg-blue-50 text-blue-700' : (t === '排队' ? 'bg-indigo-50 text-indigo-700' : 'bg-red-50 text-red-700'));
      return '<span class="chip ' + cls + '">任务 ' + esc(t) + '</span>';
    }
    function humanChip(h) {
      var cls = /同意|覆盖/.test(h) ? 'bg-slate-100 text-slate-600' : (/自动退回/.test(h) ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800');
      return '<span class="chip ' + cls + '">' + esc(h) + '</span>';
    }
    function waitText(sec) {
      sec = Number(sec) || 0;
      if (sec < 60) return sec + ' 秒';
      return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    }
    function roundsOf(row) {
      if (row.report && row.report.rounds && row.report.rounds.length) return row.report.rounds;
      return [{ revision: row.revision, trigger: row.trigger || '进入报告审核', at: row.at, snapshot: row.snapshot }];
    }
    function evidenceText(it, snap) {
      var s = snap || {};
      switch (it.rule_id) {
        case 'L1-a-1': return '样品编号「' + s.sample_no + '」按编号规则校验：' + (it.passed ? '命名规范，通过。' : '为空或不符合规则。');
        case 'L3-a-1': return '检测标准号「' + s.test_standard + '」年号校验：' + (it.passed ? '带年号且现行有效。' : '缺年号或已废止。');
        case 'L2-b-1': return '委托项 [' + (s.entrust_items || []).join('、') + '] 对照实测项 [' + (s.result_params || []).join('、') + ']：' + (it.passed ? '逐项均有结果。' : '存在未覆盖项。');
        case 'L2-a-1': return '日期链 收样(' + s.receive_date + ') ≤ 检测(' + s.test_date + ') ≤ 报告(' + s.report_date + ')：' + (it.passed ? '先后合理。' : '先后颠倒。');
        case 'L2-c-1': return '设备校准有效期（' + s.device_calib_from + ' ~ ' + s.device_calib_to + '）覆盖检测日期（' + s.test_date + '）：' + (it.passed ? '已覆盖。' : '未覆盖。');
        case 'L3-a-2': return '报告引用标准「' + s.cited_standard + '」 vs 实检标准「' + s.test_standard + '」：' + (it.passed ? '一致。' : '不一致（注意年号差异）。');
        case 'L1-b-1': var g = s.signatures || {}; return '签名位 检测=' + (g.tester || '缺') + ' / 审核=' + (g.reviewer || '缺') + ' / 批准=' + (g.approver || '缺') + '：' + (it.passed ? '齐全。' : '存在缺位。');
        case 'L1-d-1': return '计量单位 [' + (s.units || []).map(function (u) { return u.param + '→' + u.unit; }).join('、') + '] 对照允许单位集合：' + (it.passed ? '均匹配。' : '存在越界单位。');
        case 'PG-CABLE-01': return '导体直流电阻 实测 ' + s.conductor_resistance + ' Ω/km vs 标准限值 ' + s.conductor_resistance_limit + ' Ω/km：' + (it.passed ? '未超限。' : '超过限值。');
        default: return it.message;
      }
    }
    function summaryAdvice(r) {
      return r.conclusion === '通过' ? '可执行「审核通过」，进入报告签发。'
        : (r.conclusion === '需复核' ? '请逐项核对一般问题，再决定人工通过或退回编制。'
        : '建议退回报告编制，按命中的严重项补齐后再提交。');
    }
    function summaryNarrative(r, diffText) {
      var sev = r.severe.length, gen = r.review.length;
      var hit = (sev === 0 && gen === 0)
        ? '本次未命中严重项，也未命中一般项。'
        : (sev > 0 && gen > 0)
          ? ('本次命中严重项 ' + sev + ' 项、一般项 ' + gen + ' 项。')
          : (sev > 0 ? ('本次命中严重项 ' + sev + ' 项，未命中一般项。') : ('本次未命中严重项，命中一般项 ' + gen + ' 项。'));
      var judge = r.conclusion === '通过'
        ? '综合判定为通过。' + summaryAdvice(r)
        : (r.conclusion === '需复核' ? '综合判定为需复核。' + summaryAdvice(r) : '综合判定为不通过。' + summaryAdvice(r));
      var rules = '本报告共校验 ' + r.summary.total + ' 项审核规则（通用 ' + r.summary.universal + ' 项 + 品类专属 ' + r.summary.category + ' 项）。';
      return rules + hit + judge + (diffText ? diffText : '');
    }
    function labelOf(row, ruleId) {
      return (row.labels && row.labels[ruleId]) || { label: '', note: '' };
    }
    function labelChip(lb) {
      if (!lb || !lb.label) return '<span class="chip lb-chip bg-slate-50 text-slate-400">未标注</span>';
      var cls = lb.label === '误报' ? 'bg-amber-50 text-amber-700' : (lb.label === '漏报' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700');
      return '<span class="chip lb-chip ' + cls + '">标注 ' + esc(lb.label) + '</span>';
    }
    function ruleItemHtml(it, snap, row, pending) {
      var cls = pending ? 'r-pend' : (it.passed ? 'r-pass' : (it.severity === '严重' ? 'r-sev' : 'r-warn'));
      var lb = labelOf(row, it.rule_id);
      var open = !pending && !it.passed;
      return '<div class="rule-item ' + cls + '">' +
        '<div class="rule-head">' +
          '<span class="rule-cat"><span class="chip bg-slate-100 text-slate-500">' + esc(it.category || it.level || '') + '</span></span>' +
          '<span class="rule-name">' + esc(it.name) + '</span>' +
          '<span class="chip bg-slate-50 text-slate-500">' + esc(it.scope || '通用') + '</span>' +
          (it.passed || pending ? '' : (it.severity === '严重' ? '<span class="chip bg-red-50 text-red-600">严重</span>' : '<span class="chip bg-amber-50 text-amber-700">一般</span>')) +
          labelChip(lb) +
          '<span class="rule-end">' + (pending ? '<span class="chip bg-blue-50 text-blue-700">待执行</span>' : '<span class="chip ' + (it.passed ? 'bg-emerald-50 text-emerald-700' : 'bg-white text-slate-600') + '">' + (it.passed ? '通过' : '命中') + '</span>') +
          '<i class="fa ' + (open ? 'fa-angle-up' : 'fa-angle-down') + ' rule-chevron"></i></span></div>' +
        '<div class="item-detail mt-1.5 ' + (open ? '' : 'hidden') + ' rounded-lg bg-white/70 px-3 py-2 text-xs text-slate-600">' +
          '<div><b>证据：</b>' + esc(pending ? '排队 / 执行中，结论尚未写入。' : evidenceText(it, snap)) + '</div>' +
          (!pending && !it.passed && it.advice ? '<div class="mt-1"><b>建议：</b>' + esc(it.advice) + '</div>' : '') +
          '<div class="mt-1 flex flex-wrap items-center gap-1"><b>人工标注：</b>' + labelChip(lb) +
            (lb && lb.note ? '<span class="text-slate-500">' + esc(lb.note) + '</span>' : (lb && lb.label ? '' : '<span class="text-slate-400">当时未填写标注。</span>')) + '</div>' +
          '<div class="mt-1 text-[11px] text-slate-400">规则 ' + esc(it.rule_id) + ' · 快照只读，不能改标注、不能重跑。标注仅用于模型学习，不对上下游展示。</div>' +
        '</div></div>';
    }
    function levelName(k) { return { L1: '基础形式', L2: '数据逻辑', L3: '合规对齐', L4: '溯源验证' }[k] || k; }
    function groupByLevel(items, snap, row, pending) {
      var order = ['L1', 'L2', 'L3', 'L4']; var map = {};
      items.forEach(function (it) { var k = it.level || '其他'; (map[k] = map[k] || []).push(it); });
      var keys = order.filter(function (k) { return map[k]; }).concat(Object.keys(map).filter(function (k) { return order.indexOf(k) < 0; }));
      return keys.map(function (k) {
        var hit = map[k].filter(function (i) { return !i.passed; }).length;
        var sub = pending ? '待执行 ' + map[k].length + ' 项' : (map[k].length + ' 项' + (hit ? ' · 命中 ' + hit : ' · 全部通过'));
        return '<div class="lvl-region"><div class="mb-2 flex items-center gap-2"><span class="lvl-badge">' + k + ' ' + levelName(k) + '</span>' +
          '<span class="text-xs text-slate-400">' + sub + '</span></div>' +
          '<div class="space-y-1">' + map[k].map(function (it) { return ruleItemHtml(it, snap, row, pending); }).join('') + '</div></div>';
      }).join('');
    }
    function bindRuleToggles(root) {
      root.querySelectorAll('.rule-head').forEach(function (head) {
        head.addEventListener('click', function () {
          var item = head.closest('.rule-item');
          var dd = item.querySelector('.item-detail');
          var open = dd.classList.toggle('hidden') === false;
          var ch = item.querySelector('.rule-chevron');
          if (ch) ch.className = 'fa ' + (open ? 'fa-angle-up' : 'fa-angle-down') + ' rule-chevron';
        });
      });
    }
    function logHtml(log, row) {
      if (!log || !log.length) return '<div class="text-xs text-slate-400">暂无操作日志</div>';
      var current = '';
      if (window.AuditLog) {
        current = (row && row.report) ? AuditLog.currentNodeForReview(row.report) : (row && row.bizNode) || '';
      }
      var rows = window.AuditLog ? AuditLog.present(log, 'asc', current) : log;
      return '<ol class="audit-tl">' + rows.map(function (ev) {
        return window.AuditLog ? AuditLog.itemHtml(ev) : '';
      }).join('') + '</ol>';
    }
    function humanResultHtml(row) {
      var d = row.disposition || row.lastDisposition || (row.report && (row.report.disposition || row.report.lastDisposition));
      if (row.deleted) {
        return '<div class="text-sm text-slate-700">当时人工：' + esc(row.human || '—') +
          (row.deletedReason ? '<div class="mt-1 text-xs text-slate-500">' + esc(row.deletedReason) + '</div>' : '') + '</div>';
      }
      if (!d && row.human === '待处置') return '<div class="text-sm text-slate-500">尚未人工处置。</div>';
      if (!d && /自动退回/.test(row.human || '')) return '<div class="text-sm text-slate-700">按策略自动退回报告编制，无人工覆盖。</div>';
      if (!d) {
        return '<div class="kv"><div class="k">人工状态</div><div class="v">' + esc(row.human || '—') + '</div></div>';
      }
      return '<div class="kv">' +
        '<div class="k">处置结论</div><div class="v">' + esc(d.final || row.human || '—') + '</div>' +
        '<div class="k">是否同意 AI</div><div class="v">' + (d.agreeAi ? '同意' : '覆盖 / 不同意') + '</div>' +
        '<div class="k">处置人</div><div class="v">' + esc(d.by || '—') + '</div>' +
        '<div class="k">处置时间</div><div class="v">' + esc(d.at || '—') + '</div>' +
        '<div class="k">备注</div><div class="v">' + esc(d.note || '—') + '</div></div>';
    }
    function infoPanelHtml(row, panel) {
      var info = row.info || (row.report && row.report.info) || {};
      if (panel === 'recv') {
        var times = (info.receive && info.receive.times) || [];
        if (!times.length) return '<div class="text-slate-400">无收样信息</div>';
        return times.map(function (t) {
          return '<div class="mb-3 rounded-xl border border-slate-100 bg-white/70 p-3 text-xs">' +
            '<div class="font-semibold text-slate-700">第 ' + t.no + ' 次收样 · ' + esc(t.date) + '</div>' +
            '<div class="mt-1 text-slate-500">收样人 ' + esc(t.receiver) + ' · 送样人 ' + esc(t.sender) + ' · ' + esc(t.sendWay) + '</div>' +
            '<div class="mt-1 text-slate-500">备注：' + esc(t.note || '—') + '</div></div>';
        }).join('');
      }
      if (panel === 'detect') {
        var samples = (info.detect && info.detect.samples) || [];
        if (!samples.length) return '<div class="text-slate-400">无检测信息</div>';
        return samples.map(function (sp) {
          return '<div class="mb-3 rounded-xl border border-slate-100 bg-white/70 p-3">' +
            '<div class="mono text-sm font-semibold text-slate-700">' + esc(sp.sampleNo) + '</div>' +
            '<div class="mt-1 text-xs text-slate-500">' + esc(sp.productMark) + ' · ' + esc(sp.factory) + '</div>' +
            (sp.items || []).map(function (it) {
              return '<div class="mt-2 flex items-center justify-between text-xs"><span>' + esc(it.name) + '</span><span class="chip ' + (it.result === '合格' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700') + '">' + esc(it.result) + '</span></div>';
            }).join('') + '</div>';
        }).join('');
      }
      var code = info.traceCode || 'R3a2K';
      return '<div class="flex h-full min-h-0 flex-col"><iframe src="transparent-demo/report-preview.html?code=' + encodeURIComponent(code) + '&embed=1" class="preview-frame" title="报告预览"></iframe></div>';
    }
    function diffHtml(diff) {
      if (!diff) return '';
      function li(a) { return a.map(function (i) { return i.name + '（' + i.rule_id + '）'; }).join('；') || '无'; }
      return '<div class="rounded-xl border border-slate-100 bg-white/70 px-3 py-2 text-xs">' +
        '<div class="mb-1 font-medium text-slate-600"><i class="fa fa-exchange mr-1"></i>与上一版差异</div>' +
        '<div class="text-emerald-600">已解决：' + esc(li(diff.resolved)) + '</div>' +
        '<div class="text-red-600">新命中：' + esc(li(diff.added)) + '</div>' +
        '<div class="text-amber-600">仍存在：' + esc(li(diff.persisted)) + '</div></div>';
    }
    function pendingItems() {
      var rules = AiReviewStore.getRules().filter(function (r) { return r.enabled; });
      return rules.map(function (rule) {
        return { rule_id: rule.id, name: rule.name, level: rule.level, category: rule.category || '', severity: rule.severity || '一般', scope: rule.id.indexOf('PG-') === 0 ? '品类专属' : '通用', passed: true, message: '', advice: '' };
      }).concat([{ rule_id: 'PG-CABLE-01', name: '导体直流电阻 ≤ 标准限值', level: 'L3', category: '限值符合', severity: '一般', scope: '品类专属·电力电缆', passed: true, message: '', advice: '' }]);
    }

    function render() {
      if (!ROW) {
        $('page').innerHTML = '<div class="glass p-8 text-center text-slate-500">未找到审核快照。请从 <a class="underline" href="ai-review-workbench.html">AI 报告审核面板</a> 进入。</div>';
        return;
      }
      var row = ROW;
      var pending = row.aiTask === '排队' || row.aiTask === '审核中' || row.conclusion === '审核中';
      var rounds = roundsOf(row);
      if (roundIndex == null || roundIndex < 0 || roundIndex >= rounds.length) roundIndex = rounds.length - 1;
      var cur = rounds[roundIndex];
      var snap = cur.snapshot || row.snapshot;
      var res = (!pending && snap) ? ReportReviewMock.evalSnapshot(snap, !!snap.category_code) : null;
      var prev = (!pending && roundIndex > 0) ? ReportReviewMock.evalSnapshot(rounds[roundIndex - 1].snapshot, !!rounds[roundIndex - 1].snapshot.category_code) : null;
      var diff = (res && prev) ? ReportReviewMock.diffRounds(prev, res) : null;
      var readonly = row.kind === 'archive' || row.deleted;
      var from = QP.get('from');
      var backHref = from === 'archive' ? 'ai-review-archive.html' : 'ai-review-workbench.html';
      var backLabel = from === 'archive' ? '返回归档名单' : '返回审核面板';
      var jump = (row.live && row.entrust && !readonly && !pending)
        ? '<a class="inline-flex rounded-lg px-3 py-1.5 text-xs text-white" style="background:var(--brand)" href="report-review-detail.html?code=' + encodeURIComponent(row.entrust) + '">人工处置</a>'
        : '';
      var banner = '';
      if (row.deleted) {
        banner = '<div id="snap-banner" class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700"><b>已删除报告归档。</b>' + esc(row.deletedReason || '退回编制后删除，重新生成新报告。') + ' 当时 AI 结论与问题清单只读保留，不能重跑、不能改标注。</div>';
      } else if (row.aiTask === '排队') {
        banner = '<div id="snap-banner" class="rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-3 text-sm text-indigo-800">本报告处于 <b>排队序列</b>，引擎尚未领取。快照字段已冻结，规则清单为待执行状态。</div>';
      } else if (row.aiTask === '审核中') {
        banner = '<div id="snap-banner" class="rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-800">引擎正在逐条执行 L1–L3 规则，完成后写入三态结论。期间无需人工操作。</div>';
      } else if (readonly) {
        banner = '<div id="snap-banner" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600">归档只读：不能重跑、不能改标注。学习旁路只在处置当时写一次。</div>';
      }

      var stamp = pending
        ? '<div class="sum-stamp run" aria-hidden="true"><i class="fa fa-spinner"></i>' + (row.aiTask === '排队' ? '排队' : '审核中') + '</div>'
        : '<div class="sum-stamp ' + tone(res.conclusion) + '" aria-hidden="true"><i class="fa ' + (res.conclusion === '通过' ? 'fa-check' : (res.conclusion === '需复核' ? 'fa-exclamation' : 'fa-times')) + '"></i>' + esc(res.conclusion) + '</div>';
      var narrative = pending
        ? (row.aiTask === '排队'
          ? '报告已提交规范快照并进入排队。前方还有任务，引擎领取后将按 L1 基础形式 → L2 数据逻辑 → L3 合规对齐执行，完成后给出通过 / 需复核 / 不通过。'
          : '已提交规范快照，正在逐条执行审核规则。完成后给出三态结论，并写入操作日志。')
        : summaryNarrative(res, '');

      var roundTabs = '';
      if (rounds.length > 1) {
        var tabBtns = [];
        for (var i = rounds.length - 1; i >= 0; i--) {
          tabBtns.push('<button type="button" class="round-tab' + (i === roundIndex ? ' is-on' : '') + '" data-round="' + i + '">第 ' + (i + 1) + ' 轮 · ' + esc(rounds[i].revision) + '</button>');
        }
        roundTabs = '<div class="round-tabs mb-2">' + tabBtns.join('') + '</div>';
      }

      var queueBoard = (row.kind === 'queue')
        ? '<div class="queue-board mb-3">' +
            '<div class="cell"><div class="text-[11px] text-slate-400">排队位</div><div class="n">' + (row.queuePos === 0 ? '执行中' : ('第 ' + row.queuePos + ' 位')) + '</div></div>' +
            '<div class="cell"><div class="text-[11px] text-slate-400">已等待</div><div class="n">' + esc(waitText(row.waitSec)) + '</div></div>' +
            '<div class="cell"><div class="text-[11px] text-slate-400">预计剩余</div><div class="n">' + esc(waitText(row.etaSec)) + '</div></div></div>'
        : '';
      var progress = (row.aiTask === '审核中')
        ? '<div class="mb-3 rounded-xl bg-white/70 px-3 py-2">' +
            '<div class="prog-step done"><span class="prog-dot"></span>L1 基础形式 · 已完成</div>' +
            '<div class="prog-step run"><span class="prog-dot"></span>L2 数据逻辑 · 执行中</div>' +
            '<div class="prog-step"><span class="prog-dot"></span>L3 合规对齐 · 等待</div></div>'
        : '';

      var issues = pending
        ? groupByLevel(pendingItems(), snap, row, true)
        : groupByLevel(res.items, snap, row, false);

      var file = row.file || {};
      var when = row.deleted ? ('删除 ' + (row.deletedAt || '—')) : (row.signedAt ? ('签发 ' + row.signedAt) : (row.archivedAt ? ('归档 ' + row.archivedAt) : '—'));

      $('page').innerHTML =
        '<div class="flex flex-col gap-3">' +
        '<div class="glass flex flex-wrap items-center justify-between gap-2 px-4 py-3" data-annotate="sn-head">' +
          '<div><div class="text-xs text-slate-400">AI 审核快照 · ' + esc(row.kind === 'queue' ? '正在审核中' : (row.kind === 'archive' ? '归档' : '过程中')) + '</div>' +
            '<div class="mt-0.5 flex flex-wrap items-center gap-2 text-lg font-semibold text-slate-800"><span class="mono">' + esc(row.reportNo) + '</span><span class="text-sm font-medium text-slate-500">' + esc(cur.revision) + '</span>' +
            (row.deleted ? '<span class="chip bg-slate-800 text-white">已删除</span>' : '') +
            aiChip(pending ? '审核中' : res.conclusion) + taskChip(row.aiTask) + humanChip(row.human) + '</div>' +
            '<div class="mt-1 text-xs text-slate-500">' + esc(row.entrust) + ' · ' + esc(row.customer) + ' · ' + esc(row.sample) + ' · 行业包 ' + esc(row.pack) + '</div></div>' +
          '<div class="flex flex-wrap items-center gap-2">' +
            '<a class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-600" href="' + backHref + '">' + esc(backLabel) + '</a>' + jump +
          '</div></div>' +
        (banner || '') +
        '<div class="snap-grid">' +
          '<div class="snap-col">' +
            '<section class="glass px-4 py-3" data-annotate="sn-meta">' +
              '<div class="mb-2 text-sm font-semibold" style="color:var(--brand)">身份与任务</div>' +
              '<div class="kv">' +
                '<div class="k">委托编号</div><div class="v mono">' + esc(row.entrust) + '</div>' +
                '<div class="k">样品编号</div><div class="v mono">' + esc((row.sampleNos || []).join('、') || '—') + '</div>' +
                '<div class="k">编制人</div><div class="v">' + esc(row.compiler || '—') + '</div>' +
                '<div class="k">业务节点</div><div class="v">' + esc(row.bizNode) + '</div>' +
                '<div class="k">任务态</div><div class="v">' + esc(row.aiTask) + '</div>' +
                '<div class="k">人工处置</div><div class="v">' + esc(row.human) + '</div>' +
                '<div class="k">触发</div><div class="v">' + esc(cur.trigger || row.trigger || '—') + ' · ' + esc(cur.at || row.at) + '</div>' +
                '<div class="k">耗时</div><div class="v">' + (row.durationSec ? (row.durationSec + ' 秒') : '—') + '</div>' +
                '<div class="k">快照哈希</div><div class="v mono">' + esc(row.snapshotHash || '—') + '</div>' +
                '<div class="k">报告文件</div><div class="v">' + esc(file.word || '—') + '</div>' +
                '<div class="k">归档时间</div><div class="v">' + esc(when) + '</div>' +
              '</div>' +
            '</section>' +
            '<section class="glass flex-1 px-4 py-3" data-annotate="sn-log">' +
              '<div class="mb-2 text-sm font-semibold" style="color:var(--brand)">操作日志</div>' +
              logHtml(row.log || (row.report && row.report.log) || [], row) +
              '<div class="mt-3 text-[11px] text-slate-400">' + (readonly ? '归档只读：不能重跑、不能改标注。' : (pending ? '排队 / 执行中的快照只读。' : '过程中任务请进入报告审核工作台处置。')) + '</div>' +
            '</section>' +
          '</div>' +
          '<div class="snap-col">' +
            '<section class="glass relative px-4 py-3" id="ai-summary" data-annotate="sn-ai">' + stamp +
              '<div class="mb-2 text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-lightbulb-o mr-1"></i>AI 综合结论</div>' +
              queueBoard + progress + roundTabs +
              '<p class="sum-body">' + esc(narrative) + '</p>' +
              (diff ? '<div class="mt-3">' + diffHtml(diff) + '</div>' : '') +
            '</section>' +
            '<section class="glass" data-annotate="sn-rules">' +
              '<div class="border-b border-white/50 px-4 py-2 text-sm font-semibold" style="color:var(--brand)">规则执行清单</div>' +
              '<div id="rule-list" class="space-y-2 p-3">' + issues + '</div>' +
            '</section>' +
            '<section class="glass px-4 py-3" data-annotate="sn-human">' +
              '<div class="mb-2 text-sm font-semibold" style="color:var(--brand)">当时人工处置结果</div>' +
              humanResultHtml(row) +
            '</section>' +
          '</div>' +
          '<div class="snap-col" data-annotate="sn-preview">' +
            '<section class="glass px-4 py-3">' +
              '<div class="flex items-start justify-between gap-2">' +
                '<div class="min-w-0"><div class="text-xs text-slate-400">报告文件</div>' +
                  '<div class="mt-0.5 truncate text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-file-word-o mr-1"></i>' + esc(file.word || row.reportNo) + '</div></div>' +
                '<span class="chip brand-grad bg-blue-700 text-white mono flex-shrink-0">' + esc(cur.revision) + '</span></div>' +
              '<div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-500">' +
                '<span>编制人 <b class="text-slate-700">' + esc(row.compiler || 'admin') + '</b></span>' +
                '<span>编制时间 <span class="mono">' + esc((file && file.at) || cur.at || '—') + '</span></span></div>' +
            '</section>' +
            '<section class="glass flex min-h-0 flex-1 flex-col">' +
              '<div class="flex items-center gap-1 border-b border-white/50 px-2 pt-2 text-xs whitespace-nowrap">' +
                '<button type="button" class="info-tab active px-2.5 py-1.5 text-slate-500" data-panel="preview">报告预览</button>' +
                '<button type="button" class="info-tab px-2.5 py-1.5 text-slate-500" data-panel="recv">收样信息</button>' +
                '<button type="button" class="info-tab px-2.5 py-1.5 text-slate-500" data-panel="detect">检测信息</button></div>' +
              '<div id="info-body" class="flex-1 overflow-auto p-3 text-sm" style="min-height:0">' + infoPanelHtml(row, 'preview') + '</div>' +
            '</section>' +
          '</div>' +
        '</div></div>';

      bindRuleToggles($('rule-list'));
      document.querySelectorAll('.round-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          roundIndex = parseInt(btn.getAttribute('data-round'), 10);
          render();
        });
      });
      document.querySelectorAll('.info-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.info-tab').forEach(function (x) { x.classList.toggle('active', x === btn); });
          $('info-body').innerHTML = infoPanelHtml(row, btn.getAttribute('data-panel'));
        });
      });
      if (!paInited && window.PrototypeAnnotation && PrototypeAnnotation.init) {
        paInited = true;
        PrototypeAnnotation.init({ annotations: [
          { id: 'sn-head', selector: '[data-annotate="sn-head"]', position: 'bottom', title: '独立快照页', content: '从已归档名单点进。可返回归档名单；过程中报告若从其他入口进入，可点「人工处置」进报告审核。', tag: '快照' },
          { id: 'sn-ai', selector: '[data-annotate="sn-ai"]', position: 'bottom', title: '综合结论', content: '中间栏：已出结论显示印章与叙述；规则执行清单含当时人工标注；下方为当时人工处置结果。', tag: '快照' },
          { id: 'sn-rules', selector: '[data-annotate="sn-rules"]', position: 'right', title: '全量规则', content: '按 L1/L2/L3 分组。每条规则保留当时人工标注（正常 / 误报 / 漏报）。', tag: '快照' },
          { id: 'sn-meta', selector: '[data-annotate="sn-meta"]', position: 'right', title: '身份与任务', content: '左侧展示委托 / 样品 / 任务三层状态。', tag: '快照' },
          { id: 'sn-log', selector: '[data-annotate="sn-log"]', position: 'right', title: '操作日志', content: '从生成、编制提交、AI 结论到签发/删除的时间轴。系统在节点之间的自动推进不单独占点，只标出从哪一节点到哪一节点。', tag: '快照' },
          { id: 'sn-preview', selector: '[data-annotate="sn-preview"]', position: 'left', title: '报告预览', content: '对齐报告审核工作台右侧：报告文件 + 预览 / 收样信息 / 检测信息。', tag: '快照' },
        ] });
      }
    }

    render();
  </script>
  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=8" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
