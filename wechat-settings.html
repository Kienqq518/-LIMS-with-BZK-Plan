<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微信设置 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .cfg-panel { padding: 20px 24px 28px; }
    .cfg-section { margin-bottom: 24px; }
    .cfg-section-title { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 600; color: #334155; }
    .cfg-section-title::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: #2563eb; flex-shrink: 0; }
    .cfg-form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 32px; }
    @media (max-width: 900px) { .cfg-form-grid { grid-template-columns: 1fr; } }
    .cfg-form-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cfg-form-item label { flex-shrink: 0; width: 140px; text-align: right; font-size: 13px; color: #64748b; }
    .cfg-form-item input, .cfg-form-item select { flex: 1; min-width: 0; border: 1px solid #dcdfe6; border-radius: 4px; padding: 7px 10px; font-size: 13px; outline: none; color: #334155; background: #fff; }
    .cfg-form-item input:focus, .cfg-form-item select:focus { border-color: #3b82f6; }
    .cfg-form-item.span-full { grid-column: span 2; }
    @media (max-width: 900px) { .cfg-form-item.span-full { grid-column: span 1; } }
    .cfg-save-bar { display: flex; justify-content: center; padding-top: 8px; }
    .cfg-toggle { position: relative; display: inline-flex; align-items: center; width: 44px; height: 22px; cursor: pointer; }
    .cfg-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .cfg-toggle-slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 11px; transition: .2s; }
    .cfg-toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .cfg-toggle input:checked + .cfg-toggle-slider { background: #2563eb; }
    .cfg-toggle input:checked + .cfg-toggle-slider::before { transform: translateX(22px); }
    .cfg-toggle-text { margin-left: 10px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      微信设置
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white shadow-sm">
      <div class="cfg-panel">
        <div class="cfg-section">
          <div class="cfg-section-title">微信公众号信息</div>
          <div class="cfg-form-grid">
            <div class="cfg-form-item"><label>appid</label><input type="text" value="wxa1b2c3d4e5f67890" /></div>
            <div class="cfg-form-item"><label>appsecret</label><input type="text" value="********************************" /></div>
          </div>
        </div>
        <div class="cfg-section">
          <div class="cfg-section-title">微信小程序信息</div>
          <div class="cfg-form-grid">
            <div class="cfg-form-item"><label>appid</label><input type="text" value="wx9876543210abcdef" /></div>
            <div class="cfg-form-item"><label>appsecret</label><input type="text" value="********************************" /></div>
          </div>
        </div>
        <div class="cfg-section">
          <div class="cfg-section-title">微信开放平台信息</div>
          <div class="cfg-form-grid">
            <div class="cfg-form-item"><label>appid</label><input type="text" value="wxopen1234567890ab" /></div>
            <div class="cfg-form-item"><label>appsecret</label><input type="text" value="********************************" /></div>
          </div>
        </div>
        <div class="cfg-section">
          <div class="cfg-section-title">通知设置</div>
          <div class="flex items-center">
            <span class="text-sm text-slate-600" style="width:140px;text-align:right;margin-right:8px">是否发送公众号提醒</span>
            <label class="cfg-toggle"><input type="checkbox" id="wechatNotify" onchange="updateToggleText(this,'wechatNotifyText')" /><span class="cfg-toggle-slider"></span></label>
            <span class="cfg-toggle-text" id="wechatNotifyText">否</span>
          </div>
        </div>
        <div class="cfg-save-bar">
          <button onclick="alert('微信设置已保存（原型演示）')" class="rounded bg-blue-600 px-10 py-2 text-sm text-white hover:bg-blue-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    function updateToggleText(input, textId) {
      var el = document.getElementById(textId);
      if (el) el.textContent = input.checked ? '是' : '否';
    }
  </script>
  <script src="js/message-store.js" defer></script>
  <script src="js/message-center.js" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
