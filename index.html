  <script>
    // 侧边栏交互逻辑（原生 JS）
    (function () {
      const nav = document.getElementById('sidebarNav');
      const pageTitle = document.getElementById('pageTitle');

      // 子菜单展开/折叠：点击带箭头的父级菜单
      nav.querySelectorAll('.menu-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const submenu = btn.nextElementSibling;
          const arrow = btn.querySelector('.menu-arrow');
          submenu.classList.toggle('open');
          arrow.classList.toggle('open');
        });
      });

      // 菜单链接点击：高亮当前项并更新顶部标题（iframe 通过 target 自行加载）
      nav.querySelectorAll('.menu-link').forEach(function (link) {
        link.addEventListener('click', function () {
          nav.querySelectorAll('.menu-link').forEach(function (l) {
            l.classList.remove('bg-slate-700', 'text-white');
            l.removeAttribute('data-active');
          });
          link.classList.add('bg-slate-700', 'text-white');
          link.setAttribute('data-active', 'true');
          // 更新顶部标题为菜单文字
          pageTitle.textContent = link.textContent.trim();
        });
      });

      // 初始化：默认高亮“工作台”
      const active = nav.querySelector('.menu-link[data-active="true"]');
      if (active) active.classList.add('bg-slate-700', 'text-white');
    })();
  </script>
