<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作业指导书阅览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .paper {
      background: #fbfaf6;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .12);
      min-height: 420px;
    }
    .lab-seal {
      width: 72px; height: 72px; border: 2px solid #1d4ed8; border-radius: 50%;
      color: #1d4ed8; font-size:11px; font-weight: 700; letter-spacing: .08em;
      display: flex; align-items: center; justify-content: center; text-align: center;
      transform: rotate(-12deg); line-height: 1.2;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-xl p-4 pt-6">
    <div class="overflow-hidden rounded-xl bg-white shadow-lg">
      <div class="bg-blue-600 px-5 py-4 text-white">
        <a id="backLink" href="report-verify.html" class="mb-2 inline-flex items-center gap-1 text-xs text-blue-100 hover:text-white">
          <i class="fa fa-angle-left"></i> 返回溯源页
        </a>
        <h1 class="text-lg font-semibold">作业指导书阅览</h1>
        <p id="topSub" class="mt-1 text-xs text-blue-100">公开只读 · 与本报告引用作业指导书一致</p>
      </div>
      <div id="body" class="px-5 py-5"></div>
    </div>
  </div>

  <script src="js/report-trace.js"></script>
  <script src="js/report-trace-l1.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var sopKey = params.get('sop') || '';
      var code = params.get('code') || '';
      if (code) document.getElementById('backLink').href = 'report-verify.html?code=' + encodeURIComponent(code);

      var doc = ReportTrace.getSopDoc(sopKey);
      document.title = (doc.code || sopKey) + ' · 作业指导书阅览';
      document.getElementById('topSub').textContent = (doc.code || '') + '　·　' + (doc.status || '受控现行');

      var pageIndex = 0;
      var body = document.getElementById('body');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function coverHtml() {
        return '<div class="paper relative rounded-sm px-6 py-8 text-center">' +
          '<p class="text-[11px] tracking-widest text-slate-400">受控文件　' + esc(doc.dept || '') + '</p>' +
          '<p class="mt-4 text-sm font-semibold tracking-wide text-blue-800">' + esc(doc.code) + '</p>' +
          '<h2 class="mt-6 text-xl font-bold leading-relaxed text-slate-900">' + esc(doc.name) + '</h2>' +
          '<p class="mt-3 text-xs text-slate-500">版本 ' + esc(doc.version) + '</p>' +
          '<p class="mt-8 text-sm tracking-[.3em] text-slate-600">实验室作业指导书</p>' +
          '<div class="mt-8 flex justify-center"><div class="lab-seal">受控<br>现行有效</div></div>' +
          '<p class="mt-8 text-[11px] leading-relaxed text-slate-500">' + esc(doc.org) + '</p>' +
          '<p class="mt-2 text-[11px] text-slate-400">实施 ' + esc(doc.effectiveDate) + '　引用 ' + esc(doc.relatedStd) + '</p>' +
          '</div>';
      }

      function clauseHtml(page) {
        return '<div class="paper rounded-sm px-5 py-6">' +
          '<p class="text-right text-[11px] text-slate-400">' + esc(doc.code) + '　' + esc(doc.version) + '</p>' +
          '<h3 class="mt-4 text-base font-semibold text-slate-900">' + esc(page.title) + '</h3>' +
          '<p class="mt-4 text-sm leading-7 text-slate-700">' + esc(page.body) + '</p>' +
          '<p class="mt-8 text-[11px] text-slate-400">本页为公开阅览摘录，完整受控文件以实验室现行版本为准。</p>' +
          '</div>';
      }

      function render() {
        var pages = doc.pages || [];
        var page = pages[pageIndex] || { title: '封面', body: '' };
        var inner = (pageIndex === 0 || page.title === '封面') ? coverHtml() : clauseHtml(page);
        var nav = '';
        if (pages.length > 1) {
          nav = '<div class="mt-3 flex items-center justify-between text-xs text-slate-500">' +
            '<button type="button" id="prevPage" class="rounded border border-slate-200 px-3 py-1.5 ' + (pageIndex === 0 ? 'text-slate-300' : 'hover:bg-slate-50') + '"' + (pageIndex === 0 ? ' disabled' : '') + '><i class="fa fa-angle-left"></i> 上一页</button>' +
            '<span>' + (pageIndex + 1) + ' / ' + pages.length + '</span>' +
            '<button type="button" id="nextPage" class="rounded border border-slate-200 px-3 py-1.5 ' + (pageIndex >= pages.length - 1 ? 'text-slate-300' : 'hover:bg-slate-50') + '"' + (pageIndex >= pages.length - 1 ? ' disabled' : '') + '>下一页 <i class="fa fa-angle-right"></i></button>' +
            '</div>';
        }
        body.innerHTML =
          '<div class="mb-3 rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs">' +
            '<div class="flex"><span class="w-20 text-slate-500">文件编号</span><span class="flex-1 text-slate-800">' + esc(doc.code) + '</span></div>' +
            '<div class="mt-1 flex"><span class="w-20 text-slate-500">文件名称</span><span class="flex-1 text-slate-800">' + esc(doc.name) + '</span></div>' +
            '<div class="mt-1 flex"><span class="w-20 text-slate-500">状态</span><span class="flex-1 text-green-600">' + esc(doc.status) + '</span></div>' +
          '</div>' + inner + nav;
        var prev = document.getElementById('prevPage');
        var next = document.getElementById('nextPage');
        if (prev) prev.onclick = function () { if (pageIndex > 0) { pageIndex--; render(); } };
        if (next) next.onclick = function () { if (pageIndex < pages.length - 1) { pageIndex++; render(); } };
      }

      if (!sopKey) {
        body.innerHTML = '<p class="text-sm text-slate-500">未指定作业指导书编号。</p>';
        return;
      }
      render();
    })();
  </script>

  <script src="js/message-store.js" defer></script>
  <script src="js/message-center.js" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
