<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>框架合同 - 智慧实验室</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, .4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <!-- ============ 顶部页签 Tab ============ -->
  <div id="pageTabs" class="flex items-center gap-1 border-b border-slate-200 bg-white px-4 pt-2 text-sm" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      框架合同
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <!-- ============ 搜索表单区 ============ -->
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
        <div class="flex items-center gap-2">
          <label class="whitespace-nowrap text-sm text-slate-600">合同编号</label>
          <input type="text" placeholder="请输入"
            class="w-44 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="whitespace-nowrap text-sm text-slate-600">合同名称</label>
          <input type="text" placeholder="请输入"
            class="w-44 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="whitespace-nowrap text-sm text-slate-600">客户名称</label>
          <input type="text" placeholder="请输入"
            class="w-44 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="whitespace-nowrap text-sm text-slate-600">签订时间</label>
          <div class="relative">
            <input type="text" placeholder="开始日期-结束日期"
              class="w-56 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
            <i class="fa fa-calendar-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          </div>
        </div>
        <!-- 查询 / 重置 -->
        <div class="ml-auto flex items-center gap-2">
          <button class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">
            <i class="fa fa-search"></i>查询
          </button>
          <button class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">
            <i class="fa fa-refresh"></i>重置
          </button>
        </div>
      </div>
    </div>

    <!-- ============ 列表区 ============ -->
    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <!-- 操作按钮 -->
      <div class="mb-4">
        <button onclick="openModal('add')"
          class="flex items-center gap-1 rounded bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700">
          <i class="fa fa-plus"></i>框架合同录入
        </button>
      </div>

      <!-- 表格（列较多，横向滚动） -->
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1600px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">地址</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">联系人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">联系方式</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同签订时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同服务年限</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同中标价(元)</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托费用总价(元)</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">关联委托任务</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同文件</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="contractTableBody" class="text-slate-600">
            <!-- 表格行由 JS 使用 Mock 数据渲染 -->
          </tbody>
        </table>
      </div>

      <!-- 分页器 -->
      <div class="mt-4 flex items-center justify-end gap-1 text-sm text-slate-500">
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">3</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">4</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">5</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
      </div>
    </div>
  </div>

  <!-- ============ 新增/编辑弹窗 ============ -->
  <div id="contractModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
    <div class="w-[720px] max-w-[92vw] rounded-lg bg-white shadow-xl" data-annotate="fc-form">
      <!-- 弹窗标题 -->
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 id="modalTitle" class="text-base font-medium text-slate-800">新增框架合同</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>

      <!-- 弹窗表单 -->
      <div class="max-h-[70vh] overflow-y-auto px-6 py-5">
        <div class="grid grid-cols-2 gap-x-6 gap-y-4">
          <!-- 合同编号 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 合同编号</label>
            <div class="relative flex-1">
              <input id="f_code" type="text" placeholder="请输入合同编号"
                class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" />
              <i class="fa fa-file-text-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
          </div>
          <!-- 合同名称 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 合同名称</label>
            <div class="relative flex-1">
              <input id="f_name" type="text" placeholder="请输入合同名称"
                class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" />
              <i class="fa fa-file-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
          </div>
          <!-- 客户名称 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 客户名称</label>
            <select id="f_customer" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-600 outline-none focus:border-blue-500">
              <option value="">请选择客户名称</option>
              <option>鼎誉视智有限公司</option>
              <option>杭州数蚕智能科技有限公司</option>
            </select>
          </div>
          <!-- 联系人 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 联系人</label>
            <select id="f_contact" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-600 outline-none focus:border-blue-500">
              <option value="">请选择联系人</option>
              <option>叶传鸿</option>
              <option>王工</option>
            </select>
          </div>
          <!-- 联系方式 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 联系方式</label>
            <select id="f_phone" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-600 outline-none focus:border-blue-500">
              <option value="">请选择联系方式</option>
              <option>745854</option>
              <option>13800000000</option>
            </select>
          </div>
          <!-- 地址 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 地址</label>
            <div class="relative flex-1">
              <input id="f_address" type="text" placeholder="请输入地址"
                class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" />
              <i class="fa fa-map-marker absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
          </div>
          <!-- 邮政编码 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">邮政编码</label>
            <input id="f_zip" type="text" placeholder="请输入邮政编码"
              class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <!-- 中标价 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600"><span class="text-red-500">*</span> 中标价</label>
            <input id="f_price" type="text" placeholder="请输入中标价"
              class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <!-- 签订时间 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">签订时间</label>
            <div class="relative flex-1">
              <input id="f_signDate" type="text" placeholder="请选择日期"
                class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" />
              <i class="fa fa-calendar-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
          </div>
          <!-- 服务年限 -->
          <div class="flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">服务年限</label>
            <div class="relative flex-1">
              <input id="f_serviceDate" type="text" placeholder="请选择日期"
                class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" />
              <i class="fa fa-calendar-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
          </div>
          <!-- 合同样品（整行） -->
          <div class="col-span-2 flex items-center gap-3">
            <label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">合同样品</label>
            <select id="f_sample" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-600 outline-none focus:border-blue-500">
              <option value="">请选择合同样品</option>
              <option>样品A</option>
              <option>样品B</option>
            </select>
          </div>
          <!-- 备注（整行） -->
          <div class="col-span-2 flex items-start gap-3">
            <label class="mt-1.5 w-20 flex-shrink-0 text-right text-sm text-slate-600">备注</label>
            <textarea id="f_remark" rows="3" placeholder="请输入备注"
              class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500"></textarea>
          </div>
        </div>

        <!-- 上传附件 -->
        <div class="mt-4">
          <button class="flex items-center gap-1 text-sm text-blue-600 hover:text-blue-700">
            <i class="fa fa-paperclip"></i>上传附件
          </button>
        </div>
      </div>

      <!-- 弹窗底部按钮 -->
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closeModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="closeModal()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">确定</button>
      </div>
    </div>
  </div>

  <script>
    // ================= Mock 数据 =================
    // 框架合同列表数据
    const contractData = [
      {
        no: 1, code: 'KJHT2025112001', name: '框架合同名称', customer: '南京远能电力工程有限公司监理分公司',
        address: '南京市经济技术开发区', contact: '张华', phone: '13766664444', signDate: '2025-11-20',
        serviceDate: '2026-01-22', sample: '保护管-电缆保护管', price: '200', total: '1498.86',
        relatedTask: 'SC2025/0003 等7条', file: '数智化实验室基础服务业务管理系统V1.0产品手册和操作说明.docx'
      },
      {
        no: 2, code: 'HT11213253', name: '框架合同名称', customer: '杭州数蚕智能科技有限公司',
        address: 'dddd', contact: '李工', phone: '13900000000', signDate: '2025-07-18',
        serviceDate: '2028-07-17', sample: '', price: '263320', total: '',
        relatedTask: '', file: ''
      }
    ];

    // 渲染表格
    (function renderTable() {
      const tbody = document.getElementById('contractTableBody');
      tbody.innerHTML = contractData.map(function (item, idx) {
        // 合同文件：有文件显示蓝色链接，无则显示占位
        const fileCell = item.file
          ? '<a href="#" class="text-blue-600 hover:underline">' + item.file + '</a>'
          : '<span class="text-slate-300">-</span>';
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.no + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="frame-contract-detail.html" class="text-blue-600 hover:underline">' + item.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.address + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.contact + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.phone + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.signDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.serviceDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (item.sample || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.price + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.total + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.relatedTask + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + fileCell + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' +
            '<button onclick="openModal(\'edit\', ' + idx + ')" class="text-blue-600 hover:underline"><i class="fa fa-pencil"></i> 编辑</button>' +
            '<button class="ml-3 text-red-500 hover:underline"><i class="fa fa-trash-o"></i> 删除</button>' +
          '</td>' +
          '</tr>';
      }).join('');
    })();

    // ================= 弹窗逻辑 =================
    const modal = document.getElementById('contractModal');
    // 表单字段与数据 key 的对应关系
    const fieldMap = {
      f_code: 'code', f_name: 'name', f_customer: 'customer', f_contact: 'contact',
      f_phone: 'phone', f_address: 'address', f_price: 'price',
      f_signDate: 'signDate', f_serviceDate: 'serviceDate', f_sample: 'sample'
    };

    // 打开弹窗：mode 为 add 新增 / edit 编辑；index 为编辑行索引
    function openModal(mode, index) {
      const title = document.getElementById('modalTitle');
      if (mode === 'edit') {
        title.textContent = '修改框架合同';
        const data = contractData[index];
        // 用行数据回填表单
        Object.keys(fieldMap).forEach(function (id) {
          const el = document.getElementById(id);
          if (el) el.value = data[fieldMap[id]] || '';
        });
        document.getElementById('f_zip').value = '';
        document.getElementById('f_remark').value = '';
      } else {
        title.textContent = '新增框架合同';
        // 清空所有表单
        Object.keys(fieldMap).forEach(function (id) {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
        document.getElementById('f_zip').value = '';
        document.getElementById('f_remark').value = '';
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 关闭弹窗
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 点击遮罩层关闭
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });
  </script>
  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'fc-form',
          selector: '[data-annotate="fc-form"]',
          position: 'bottom-right',
          title: '新增框架合同（字段与校验）',
          wide: true,
          content: '<strong>需求逻辑：</strong>框架合同是委托登记的前置数据源——委托侧只能「选合同带出」，不能手填合同信息，所以合同台账里维护的字段必须完整、可复用。<br>' +
          '<strong>展示规则：</strong>两列栅格：合同编号、合同名称、客户名称、联系人、联系方式、地址、邮政编码、中标价、签订时间、服务年限、合同样品、备注；必填项带红星（编号/名称/客户/联系人/联系方式/地址/中标价）；日期项走日期选择器；底部可上传附件。<br>' +
          '<strong>交互逻辑：</strong>「确定」时必填项为空则提示并聚焦该项，合同编号重复时提示编号已存在；校验通过后写入列表并关闭；「取消」或点遮罩关闭且不保存。编辑已有合同时标题与回填值随之变化。',
          tag: '框架合同'
        },
        {
          id: 'fc-sample',
          selector: '#f_sample',
          position: 'bottom-right',
          title: '合同样品（决定委托可登记的样品）',
          wide: true,
          content: '<strong>需求逻辑：</strong>框架合同先约定本次可送检的样品范围，委托登记选到该合同后只能在这些样品里添加，避免超范围检测与结算争议。<br>' +
          '<strong>展示规则：</strong>下拉选择，选项为该合同已约定的样品；未选择时该项为空。<br>' +
          '<strong>交互逻辑：</strong>与委托登记页的「合同信息带出与置灰」联动：委托侧选中本合同后，合同样品随其他合同字段一起带出并只读展示；合同里没维护该项时委托侧显示「合同未维护该信息」。',
          tag: '框架合同'
        },
      ]
    });
  </script>
</body>
</html>
