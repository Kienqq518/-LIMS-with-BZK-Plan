<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>变更审批 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .sort-th { cursor: pointer; user-select: none; white-space: nowrap; }
    .sort-th:hover { color: #2563eb; }
    .sort-th .sort-icon { margin-left: 4px; font-size: 11px; color: #94a3b8; }
    .sort-th.active .sort-icon { color: #2563eb; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="change-apply.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">变更申请</a>
    <a href="change-apply-edit.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">委托变更编辑</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">变更审批<i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i></span>
  </div>
  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">委托编号</label><input type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" /></div>
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">是否关联框架合同</label><select class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500"><option value="">请选择</option><option>是</option><option>否</option></select></div>
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">合同编号</label><input type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" /></div>
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">客户单位</label><input type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" /></div>
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">样品名称</label><input type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" /></div>
        <div class="flex items-center gap-2"><label class="w-28 text-right text-sm text-slate-600">送样时间</label><div class="relative flex-1"><input type="text" placeholder="开始日期 ~ 结束日期" class="w-full rounded border border-slate-300 px-3 py-1.5 pr-8 text-sm outline-none focus:border-blue-500" /><i class="fa fa-calendar-o absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i></div></div>
        <div class="flex items-center gap-2 xl:col-span-2 xl:justify-end"><button class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i> 查询</button><button class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i> 重置</button></div>
      </div>
    </div>
    <div class="mt-4 rounded bg-white p-4 shadow-sm overflow-x-auto">
      <table class="w-full min-w-[1300px] border-collapse text-sm">
        <thead>
          <tr class="bg-slate-100 text-slate-600">
            <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
            <th class="border border-slate-200 px-3 py-2 font-medium sort-th active" data-annotate="apply-time-col" data-sort="applyTime" onclick="toggleSort('applyTime')">变更申请时间<i class="fa fa-sort-desc sort-icon"></i></th>
            <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">送样时间</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
            <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="mt-4 flex justify-end gap-2 text-sm text-slate-500"><span id="totalText">共 0 条</span><button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button><select class="rounded border border-slate-200 px-2 py-1"><option>50条/页</option></select></div>
    </div>
  </div>
  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var DATA = [
      { code: 'SC2026/0055', customer: '东集西造有限公司', sample: '绝缘斗臂车-t', sendDate: '2026-06-01', acceptDate: '2026-06-01', editor: 'admin', salesman: '业务员A', applyTime: '2026-06-10 09:15:00' },
      { code: 'SC2026/0053', customer: '宇宙设想有限公司', sample: '遮蔽罩、安全带', sendDate: '2026-05-28', acceptDate: '2026-05-28', editor: 'admin', salesman: '梁倩', applyTime: '2026-06-12 14:30:00' },
      { code: 'SC2026/0051', customer: '杭州数蚕智能科技有限公司', sample: '绝缘操作杆', sendDate: '2026-05-25', acceptDate: '2026-05-25', editor: '潘哲宁', salesman: '梁倩', applyTime: '2026-06-11 10:20:00' },
      { code: 'SC2026/0049', customer: '灵知益义有限公司', sample: '安全帽', sendDate: '2026-05-20', acceptDate: '2026-05-20', editor: 'admin', salesman: '业务员A', applyTime: '2026-06-09 16:45:00' },
      { code: 'SC2026/0047', customer: '东集西造有限公司', sample: '绝缘杆', sendDate: '2026-05-18', acceptDate: '2026-05-18', editor: 'admin', salesman: '梁倩', applyTime: '2026-06-08 11:00:00' },
      { code: 'SC2026/0045', customer: '宇宙设想有限公司', sample: '10kV旁路作业设备', sendDate: '2026-05-15', acceptDate: '2026-05-15', editor: 'admin', salesman: '业务员A', applyTime: '2026-06-13 08:50:00' },
      { code: 'SC2026/0043', customer: '杭州数蚕智能科技有限公司', sample: '验电器', sendDate: '2026-05-12', acceptDate: '2026-05-12', editor: 'admin', salesman: '梁倩', applyTime: '2026-06-07 15:10:00' }
    ];

    var sortState = { field: 'applyTime', dir: 'desc' };

    function toggleSort(field) {
      if (sortState.field === field) {
        sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc';
      } else {
        sortState.field = field;
        sortState.dir = 'desc';
      }
      renderTable();
    }

    function renderTable() {
      var rows = DATA.slice().sort(function (a, b) {
        var av = a[sortState.field] || '';
        var bv = b[sortState.field] || '';
        if (av === bv) return 0;
        return sortState.dir === 'desc' ? (av < bv ? 1 : -1) : (av > bv ? 1 : -1);
      });

      document.getElementById('tableBody').innerHTML = rows.map(function (d, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' + d.applyTime + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="change-approve-edit.html?code=' + d.code + '" class="text-blue-600 hover:underline">' + d.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">/</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.sendDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.acceptDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.editor + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.salesman + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="change-approve-edit.html?code=' + d.code + '" class="text-blue-600 hover:underline"><i class="fa fa-gavel"></i> 审批</a></td>' +
          '</tr>';
      }).join('');

      document.getElementById('totalText').textContent = '共 ' + rows.length + ' 条';

      document.querySelectorAll('.sort-th').forEach(function (th) {
        var f = th.getAttribute('data-sort');
        var icon = th.querySelector('.sort-icon');
        th.classList.toggle('active', f === sortState.field);
        if (icon && f === sortState.field) {
          icon.className = 'fa sort-icon ' + (sortState.dir === 'desc' ? 'fa-sort-desc' : 'fa-sort-asc');
        } else if (icon) {
          icon.className = 'fa fa-sort sort-icon';
        }
      });

      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    renderTable();

    PrototypeAnnotation.init({
      annotations: [{
        id: 'apply-time-col',
        selector: '[data-annotate="apply-time-col"]',
        position: 'top-right',
        title: '新增：变更申请时间',
        wide: true,
        content: '<strong>需求逻辑：</strong>审批人优先处理最新提交的变更，因此列表要按变更申请时间可排序，默认最新在上。<br>' +
            '<strong>展示规则：</strong>新增「变更申请时间」列，记录变更申请提交的时间；表头可点击排序。<br>' +
            '<strong>交互逻辑：</strong>默认按变更申请时间倒序；点击表头在升 / 降序间切换，与其余列排序互不干扰。',
        tag: '变更审批'
      }]
    });
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
