<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告审核 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告审核
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="f_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">是否关联框架合同</label>
          <select id="f_frame" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-500 outline-none focus:border-blue-500">
            <option value="">请选择是否关联</option>
            <option>是</option><option>否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">合同编号</label>
          <input id="f_contract" type="text" placeholder="请输入框架合同编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input id="f_unit" type="text" placeholder="请输入委托单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="f_sample" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托受理日期</label>
          <div class="flex flex-1 items-center gap-1">
            <input id="f_from" type="text" placeholder="开始日期" class="w-full rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
            <span class="text-slate-400">—</span>
            <input id="f_to" type="text" placeholder="结束日期" class="w-full rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
        </div>
        <div class="flex items-center gap-2 xl:col-span-2 xl:justify-end">
          <button onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1400px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">送样时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托受理日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">先收费</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">优先等级</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">任务状态</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="rv-col-record">报告记录</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="rv-col-ops">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10 条/页</option></select>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    var ROWS = ReportReviewMock.ENTRUSTS.slice();

    function frameText(row) {
      return (row.contract && row.contract !== '/') ? '是' : '否';
    }

    function renderTable(list) {
      var data = list || ROWS;
      document.getElementById('tableBody').innerHTML = data.map(function (row, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="entrust-detail.html?code=' + encodeURIComponent(row.code) + '" class="text-blue-600 hover:underline">' + row.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.sendDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.requireDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.requireDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.acceptDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><span class="rounded border border-green-200 bg-green-50 px-2 py-0.5 text-xs text-green-600">否</span></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.priority + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.status + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.compiler + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="#" class="text-blue-600 hover:underline" onclick="return false;"><i class="fa fa-file-text-o mr-1"></i>报告记录</a></td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap"><a data-annotate="rv-audit-btn" href="report-review-detail.html?code=' + encodeURIComponent(row.code) + '" class="text-blue-600 hover:underline"><i class="fa fa-gavel mr-1"></i>审核</a></td>' +
          '</tr>';
      }).join('');
      document.getElementById('totalText').textContent = '共 ' + data.length + ' 条';
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function doSearch() {
      var code = document.getElementById('f_code').value.trim();
      var contract = document.getElementById('f_contract').value.trim();
      var unit = document.getElementById('f_unit').value.trim();
      var sample = document.getElementById('f_sample').value.trim();
      var frame = document.getElementById('f_frame').value;
      var filtered = ROWS.filter(function (r) {
        if (code && r.code.indexOf(code) < 0) return false;
        if (contract && String(r.contract).indexOf(contract) < 0) return false;
        if (unit && r.customer.indexOf(unit) < 0) return false;
        if (sample && r.sample.indexOf(sample) < 0) return false;
        if (frame && frameText(r) !== frame) return false;
        return true;
      });
      renderTable(filtered);
    }

    function doReset() {
      ['f_code', 'f_contract', 'f_unit', 'f_sample', 'f_from', 'f_to'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('f_frame').value = '';
      renderTable();
    }

    renderTable();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'rv-col-ops', selector: '[data-annotate="rv-col-ops"]', position: 'top-left', title: '操作：审核', content: '<strong>需求逻辑：</strong>报告审核是报告编制完成后的下一环节，审核员在这里逐委托核准报告；本期在此叠加 AI 预审，所以操作由原「编辑」改为「审核」。<br>' +
            '<strong>展示规则：</strong>操作列仅「审核」一个入口。<br>' +
            '<strong>交互逻辑：</strong>点「审核」进入报告审核详情页（按委托打开），页内每份报告下方展示 AI 审查结论与人工处置区。', tag: '报告审核' },
        { id: 'rv-audit-btn', selector: '[data-annotate="rv-audit-btn"]', position: 'left', title: '审核入口', content: '<strong>需求逻辑：</strong>审核以「委托」为单位进入，一张委托下的多份报告一起核。<br>' +
            '<strong>展示规则：</strong>蓝色「审核」链接。<br>' +
            '<strong>交互逻辑：</strong>跳转 report-review-detail.html?code=委托编号。演示委托 SC2026/0238 含三份报告，分别命中 AI 通过 / 需复核 / 不通过三种结论。', tag: '报告审核' },
        { id: 'rv-col-record', selector: '[data-annotate="rv-col-record"]', position: 'top', title: '报告记录', content: '<strong>需求逻辑：</strong>审核前可先看该委托下报告的节点留痕。<br>' +
            '<strong>展示规则：</strong>「报告记录」链接（与报告编制页同源，原型中为占位）。<br>' +
            '<strong>交互逻辑：</strong>点击打开报告记录（本页原型暂作占位，不弹窗）。', tag: '报告审核' },
      ] });
    }
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
