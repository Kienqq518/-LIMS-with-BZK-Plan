<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原始记录 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      原始记录
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>
  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="flex flex-wrap items-end gap-3">
        <label class="flex items-center gap-2 text-sm">委托编号
          <input id="f_code" class="rounded border border-slate-300 px-3 py-1.5 text-sm" placeholder="请输入委托编号" />
        </label>
        <label class="flex items-center gap-2 text-sm">样品名称
          <input id="f_sample" class="rounded border border-slate-300 px-3 py-1.5 text-sm" placeholder="请输入样品名称" />
        </label>
        <button type="button" id="btn-search" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">查询</button>
        <button type="button" id="btn-reset" class="rounded border border-slate-300 px-4 py-1.5 text-sm">重置</button>
      </div>
    </div>
    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <p class="mb-3 text-xs text-slate-400">试验数据只读。点「查看」进入原始记录详情，可导出或按演示路径打标。</p>
      <table class="w-full border-collapse text-left text-sm">
        <thead>
          <tr class="bg-slate-100 text-slate-600">
            <th class="border border-slate-200 px-3 py-2">序号</th>
            <th class="border border-slate-200 px-3 py-2">委托编号</th>
            <th class="border border-slate-200 px-3 py-2">样品名称</th>
            <th class="border border-slate-200 px-3 py-2">原始记录名称</th>
            <th class="border border-slate-200 px-3 py-2">生成时间</th>
            <th class="border border-slate-200 px-3 py-2">当前节点</th>
            <th class="border border-slate-200 px-3 py-2">操作</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/report-flow-store.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }
    function rows() {
      var out = [];
      ReportFlowStore.all().forEach(function (t) {
        (t.records || []).forEach(function (r) {
          out.push({ code: t.code, sample: t.sample, name: r.name, at: r.at, status: t.status });
        });
      });
      out.push({ code: 'SC2026/0073', sample: '绝缘操作杆', name: '绝缘操作杆—交流耐压试验记录', at: '2026-06-10 15:12:00', status: '试验检测' });
      return out;
    }
    function paint(list) {
      document.getElementById('body').innerHTML = list.map(function (r, i) {
        return '<tr class="hover:bg-slate-50"><td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + esc(r.code) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + esc(r.sample) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + esc(r.name) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + esc(r.at) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + esc(r.status) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a class="text-blue-600 hover:underline" href="test-record.html?code=' + encodeURIComponent(r.code) + '">查看</a></td></tr>';
      }).join('');
    }
    var ALL = rows();
    paint(ALL);
    document.getElementById('btn-search').onclick = function () {
      var c = document.getElementById('f_code').value.trim();
      var s = document.getElementById('f_sample').value.trim();
      paint(ALL.filter(function (r) {
        if (c && r.code.indexOf(c) < 0) return false;
        if (s && r.sample.indexOf(s) < 0) return false;
        return true;
      }));
    };
    document.getElementById('btn-reset').onclick = function () {
      document.getElementById('f_code').value = '';
      document.getElementById('f_sample').value = '';
      paint(ALL);
    };
  </script>
  <script src="js/current-user.js?v=3" defer></script>
  <script src="js/user-profile.js?v=8" defer></script>
  <script src="js/message-store.js?v=4" defer></script>
  <script src="js/message-center.js?v=4" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
