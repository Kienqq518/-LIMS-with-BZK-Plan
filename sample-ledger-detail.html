<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品台账详情 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .st { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; }
    .st-wait { background: #eff6ff; color: #2563eb; }
    .st-run { background: #fff7ed; color: #c2410c; }
    .st-ok { background: #dcfce7; color: #15803d; }
    .st-ng { background: #fef2f2; color: #b91c1c; }
    .st-exp { background: #f1f5f9; color: #475569; }
    .st-done { background: #f1f5f9; color: #475569; }
    .st-back { background: #fff7ed; color: #c2410c; }
    .st-keep { background: #ecfeff; color: #0e7490; }
    .overdue-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #fef2f2; color: #b91c1c; font-size: 11px; line-height: 16px; }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table td { border: 1px solid #e5e7eb; padding: 8px 12px; font-size: 13px; vertical-align: top; }
    .info-table .lbl { background: #f8fafc; color: #64748b; white-space: nowrap; width: 130px; }
    .info-table .val { color: #334155; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; vertical-align: top; }
    .data-table th { background: #f8fafc; color: #64748b; font-weight: 500; white-space: nowrap; }
    .data-table tbody tr:hover td { background: #f8fafc; }
    .info-tab { border-bottom: 2px solid transparent; padding: 10px 14px; font-size: 13px; color: #64748b; background: transparent; }
    .info-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
    .info-tab:hover { color: #2563eb; }
    .panel { display: none; }
    .panel.is-on { display: block; }
    .sec-title { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: #334155; }
    .sec-title:first-child { margin-top: 0; }
    .back-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #fff7ed; color: #c2410c; font-size: 11px; line-height: 16px; }
    .xor-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #eff6ff; color: #1d4ed8; font-size: 11px; line-height: 16px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; color: #94a3b8; }
    .step.done { color: #334155; }
    .step.cur { color: #1d4ed8; font-weight: 600; }
    .step i { width: 16px; text-align: center; }
    .row-back td { background: #fff7ed; }
    .row-run td { background: #fffbeb; }
    .row-pending td { color: #94a3b8; }
    .photo-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; height: 64px; border: 1px dashed #cbd5e1; border-radius: 6px; background: #f8fafc; color: #94a3b8; font-size: 10px; }
    .cert-mount { display: inline-block; max-width: 100%; overflow: auto; padding: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="sample-ledger.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="sample-ledger.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">样品台账</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      样品详情
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div id="noPerm" class="hidden p-4">
    <div class="rounded bg-white p-10 text-center shadow-sm">
      <i class="fa fa-lock mb-3 text-3xl text-slate-300"></i>
      <p class="text-sm text-slate-600">当前角色没有「样品台账」页面权限，无法查看样品详情。</p>
      <p id="noPermWho" class="mt-1 text-xs text-slate-400"></p>
    </div>
  </div>

  <div id="mainWrap" class="hidden p-4"></div>

  <script src="js/tab-bar.js"></script>
  <script src="js/web-perms.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-ledger-store.js"></script>
  <script src="js/original-record-version.js"></script>
  <script src="js/original-record-ui.js"></script>
  <script src="js/short-link-qr.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script src="js/label-cert-render.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    (function () {
      if (window.WebPerms && !WebPerms.can('样品台账')) {
        document.getElementById('noPerm').classList.remove('hidden');
        var role = WebPerms.current();
        document.getElementById('noPermWho').textContent = '当前登录角色：' + role.name + '（' + role.desc + '）';
        return;
      }
      var L = window.SampleLedger;
      var no = new URLSearchParams(location.search).get('no') || '';
      var s = L.get(no);
      var wrap = document.getElementById('mainWrap');
      wrap.classList.remove('hidden');

      function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
      }
      function flowClass(st) {
        if (st === '留样' || st === '已完成') return 'st st-ok';
        if (st === '在检') return 'st st-run';
        if (st === '已处置') return 'st st-done';
        if (st === '退回') return 'st st-back';
        if (st === '待检') return 'st st-keep';
        return 'st st-wait';
      }
      function resultClass(st) {
        if (st === '合格') return 'st st-ok';
        if (st === '不合格') return 'st st-ng';
        if (st === '已过期') return 'st st-exp';
        return '';
      }
      if (!s) {
        wrap.innerHTML = '<div class="rounded bg-white p-10 text-center shadow-sm">' +
          '<p class="text-sm text-slate-600">找不到样品 ' + esc(no || '（未传编号）') + '。</p>' +
          '<a href="sample-ledger.html" class="mt-4 inline-block rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">返回样品台账</a></div>';
        return;
      }

      var taskName = L.taskNode(s);
      var flowSt = L.flowStatus(s);
      var resultSt = L.resultLabel(s);
      var overdue = L.signOverdue(s);
      var cat = (window.SampleDataStore && SampleDataStore.catLabelOfNames(s.name)) || '—';
      var xorCopy = s.afterReturn === 'keep' ? '还样后走留样，不出现退样' : (s.afterReturn === 'client' ? '还样后走退样，不出现留样' : '尚未还样，留样 / 退样都不出现');
      var recvNote = L.receiveNote(s);
      var recvTime = L.receiveTime(s);
      var received = !!(s.receivedAt && s.receivedAt !== '—');

      function kv(label, val, annotate) {
        var lbl = annotate
          ? '<td class="lbl" data-annotate="' + annotate + '">' + esc(label) + '</td>'
          : '<td class="lbl">' + esc(label) + '</td>';
        return lbl + '<td class="val">' + val + '</td>';
      }
      function pairTable(rows) {
        var html = '<table class="info-table"><tbody>';
        for (var i = 0; i < rows.length; i += 2) {
          html += '<tr>' + rows[i] + (rows[i + 1] || kv('', '')) + '</tr>';
        }
        return html + '</tbody></table>';
      }
      function testState(t) {
        if (t.result === '不合格') return '<span class="st st-ng">不合格</span>';
        if (t.result === '合格') return '<span class="st st-ok">合格</span>';
        if (t.state === '检测中') return '<span class="st st-run">检测中</span>';
        return '<span class="st st-wait">' + esc(t.state) + '</span>';
      }
      function reportHref() {
        if (!s.reportNo) return '';
        if (s.reportStatus === '审核中') return 'report-review.html';
        return 'report-compile-edit.html?entrust=' + encodeURIComponent(s.code);
      }
      function resultBadge() {
        if (resultSt === '/') return '<span class="text-slate-400">/</span>';
        return '<span class="' + resultClass(resultSt) + '">' + esc(resultSt) + '</span>';
      }
      function photosHtml() {
        var list = s.photos || [];
        if (!list.length) {
          return '<span class="text-slate-400">' + (received ? '未上传' : '尚未收样') + '</span>';
        }
        return '<div class="flex flex-wrap gap-2">' + list.map(function (p) {
          return '<div class="photo-tile"><i class="fa fa-image mb-0.5"></i>' + esc(p) + '</div>';
        }).join('') + '</div>';
      }
      function paintCert() {
        var mount = document.getElementById('certMount');
        if (!mount || !window.LabelCertRender || !window.LabelCertConfig) return;
        var catKey = (window.SampleDataStore && SampleDataStore.catKeyOfName && SampleDataStore.catKeyOfName(s.name)) || 'aqgqj';
        var masterId = LabelCertConfig.masterIdFromName(s.name) || 'rod';
        var tpl = LabelCertConfig.resolveTemplate(catKey, 'certificate', masterId);
        if (!tpl) {
          mount.innerHTML = '<p class="text-sm text-slate-400">未配置合格证模版。</p>';
          return;
        }
        LabelCertRender.ensureStyles();
        var owners = [];
        (s.tests || []).forEach(function (t) {
          if (t.owner && owners.indexOf(t.owner) < 0) owners.push(t.owner);
        });
        var item = {
          sampleNo: s.sampleNo,
          name: s.name,
          spec: s.spec || '',
          model: s.model || '',
          specModel: [s.model || '', s.spec || ''].filter(Boolean).join(' '),
          receiveDate: received ? s.receivedAt : '',
          inspectDate: String(s.resultAt || s.receivedAt || '').slice(0, 10),
          reinspectDate: s.recheckAt || '',
          clientName: s.customer,
          detectStatus: '已检测',
          judgment: '合格',
          status: '报告签发',
          inspectors: owners,
          recorders: [],
          masterId: masterId,
          cat: catKey
        };
        mount.innerHTML = LabelCertRender.renderSheet(LabelCertConfig.clone(tpl), item, { suffix: '-ledger' });
        LabelCertRender.mountQrs(mount);
      }

      var recs = L.recordsOf(s);
      var tabs = [
        { id: 'sample', name: '样品信息' },
        { id: 'detect', name: '检测信息' },
        { id: 'flow', name: '流转台账' },
        { id: 'report', name: '结果报告' }
      ];
      var defaultTab = 'flow';

      wrap.innerHTML =
        '<div class="rounded bg-white shadow-sm">' +
          '<div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-100 px-4 py-3">' +
            '<div>' +
              '<a href="sample-ledger.html" class="text-sm text-blue-600 hover:underline"><i class="fa fa-arrow-left"></i> 返回样品台账</a>' +
              '<div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1">' +
                '<span class="text-base font-semibold text-slate-800">' + esc(s.sampleNo) + '</span>' +
                (overdue.overdue ? '<span class="overdue-tag">' + esc(overdue.text) + '</span>' : '') +
                '<span class="text-sm text-slate-700">' + esc(L.titleName(s)) + '</span>' +
                '<span class="' + flowClass(flowSt) + '">' + esc(flowSt) + '</span>' +
                (resultSt === '/' ? '' : resultBadge()) +
              '</div>' +
              '<p class="mt-1 text-sm text-slate-500">委托编号 <a class="text-blue-600 hover:underline" href="entrust-detail.html?code=' + encodeURIComponent(s.code) + '">' + esc(s.code) + '</a>' +
                '　当前节点 <button type="button" id="toggleSteps" class="text-blue-600 hover:underline" data-annotate="ledger-task">' + esc(taskName) + '</button></p>' +
            '</div>' +
          '</div>' +
          '<div id="taskSteps" class="hidden border-b border-slate-100 px-4 py-3 grid grid-cols-1 gap-x-6 sm:grid-cols-2 lg:grid-cols-3">' +
            L.TASK_STEPS.map(function (name, i) {
              var n = i + 1;
              var cls = n < s.taskStep ? 'step done' : (n === s.taskStep ? 'step cur' : 'step');
              var icon = n < s.taskStep ? 'fa-check-circle text-emerald-500' : (n === s.taskStep ? 'fa-circle text-blue-600' : 'fa-circle-o');
              var tag = n === s.taskStep ? ' <span class="st st-wait">当前</span>' : '';
              return '<div class="' + cls + '"><i class="fa ' + icon + '"></i>' + n + '. ' + esc(name) + tag + '</div>';
            }).join('') +
          '</div>' +
          '<div class="flex items-center gap-0 overflow-x-auto border-b border-slate-200 px-2 text-sm whitespace-nowrap">' +
            tabs.map(function (t) {
              return '<button type="button" class="info-tab' + (t.id === defaultTab ? ' active' : '') + '" data-panel="' + t.id + '">' + t.name + '</button>';
            }).join('') +
          '</div>' +
          '<div class="p-4">' +

            '<div class="panel" id="panel-sample">' +
              '<h3 class="sec-title">样品标识</h3>' +
              pairTable([
                kv('样品编号', esc(s.sampleNo)),
                kv('样品名称', esc(s.name)),
                kv('样品大类', esc(cat)),
                kv('产品标记', esc(s.mark || '—')),
                kv('型号 / 分类', esc(s.model || '—')),
                kv('规格', esc(s.spec || '—')),
                kv('检测类别', esc(s.category)),
                kv('数量', esc(s.qty))
              ]) +
              '<h3 class="sec-title">来源信息</h3>' +
              pairTable([
                kv('委托编号', '<a class="text-blue-600 hover:underline" href="entrust-detail.html?code=' + encodeURIComponent(s.code) + '">' + esc(s.code) + '</a>'),
                kv('委托单位', esc(s.customer)),
                kv('委托日期', esc(s.orderDate)),
                kv('任务类型', esc(s.taskType)),
                kv('要求完成日期', esc(s.due)),
                kv('生产厂家', esc(s.plant || '—')),
                kv('生产厂家地址', esc(s.plantAddr || '—')),
                kv('制造商', esc(s.manufacturer || '—')),
                kv('制造商地址', esc(s.manufacturerAddr || '—')),
                kv('', '')
              ]) +
              '<h3 class="sec-title">接收信息</h3>' +
              pairTable([
                kv('收样时间', esc(recvTime)),
                kv('收样人', esc(s.receiver || '—')),
                kv('收样状态', esc(s.receiveStatus || (received ? '—' : '尚未收样'))),
                kv('送样方式', esc(s.sendWay || (received ? '—' : '尚未收样'))),
                kv('送样人', esc(s.sender || (received ? '—' : '尚未收样'))),
                kv('送样人联系方式', esc(s.senderPhone || (received ? '—' : '尚未收样'))),
                kv('到样情况', esc(recvNote || (received ? '—' : '尚未收样'))),
                kv('样品图片', photosHtml())
              ]) +
            '</div>' +

            '<div class="panel" id="panel-detect">' +
              '<h3 class="sec-title">检测信息</h3>' +
              '<table class="data-table"><thead><tr>' +
                '<th>试验项</th><th>检测依据</th><th>检测员</th><th>状态</th><th>完成时间</th><th>说明</th>' +
              '</tr></thead><tbody>' +
              s.tests.map(function (t) {
                var std = /电缆/.test(s.name) ? 'GB/T 12706.2-2020' : 'DL/T 976-2017';
                return '<tr><td>' + esc(t.name) + '</td><td>' + esc(std) + '</td><td>' + esc(t.owner) + '</td><td>' + testState(t) + '</td>' +
                  '<td>' + esc(t.finishedAt || '—') + '</td><td>' + esc(t.remark || '—') + '</td></tr>';
              }).join('') +
              '</tbody></table>' +
              '<h3 class="sec-title">原始记录单</h3>' +
              '<div class="overflow-x-auto">' +
                '<table class="data-table min-w-[960px]"><thead><tr>' +
                  '<th class="whitespace-nowrap">序号</th>' +
                  '<th>原始记录名称</th>' +
                  '<th>覆盖样品</th>' +
                  '<th>生成模式</th>' +
                  '<th>生成时间</th>' +
                  '<th>状态</th>' +
                  '<th>操作</th>' +
                '</tr></thead><tbody id="orTableBody"></tbody></table>' +
              '</div>' +
            '</div>' +

            '<div class="panel' + (defaultTab === 'flow' ? ' is-on' : '') + '" id="panel-flow" data-annotate="ledger-xor">' +
              '<p class="mb-2 text-sm text-slate-600">当前存放位置 <b class="font-medium text-slate-800">' + esc(s.place || '—') + '</b></p>' +
              '<p class="mb-3 text-xs text-slate-400">' + esc(xorCopy) + '</p>' +
              '<table class="data-table"><thead><tr>' +
                '<th>节点</th><th>状态</th><th>办理人</th><th>地点</th><th>时间</th><th>说明</th>' +
              '</tr></thead><tbody>' +
              (s.ledger || []).map(function (row) {
                var cls = '';
                if (row.state === '未开始') cls = 'row-pending';
                if (row.state === '进行中') cls = 'row-run';
                if (row.direction === 'back') cls = 'row-back';
                var tags = '';
                if (row.direction === 'back') tags += '<span class="back-tag">回退</span>';
                if (row.name === '留样' || row.name === '退样') tags += '<span class="xor-tag">还样后二选一</span>';
                var note = esc(row.note) + (row.specimen ? '（试样 ' + esc(row.specimen) + '）' : '');
                return '<tr class="' + cls + '">' +
                  '<td>' + esc(row.name) + tags + '</td>' +
                  '<td>' + esc(row.state) + '</td>' +
                  '<td>' + esc(row.who) + '</td>' +
                  '<td>' + esc(row.place) + '</td>' +
                  '<td>' + esc(row.time || '—') + '</td>' +
                  '<td>' + note + '</td></tr>';
              }).join('') +
              '</tbody></table>' +
            '</div>' +

            '<div class="panel" id="panel-report">' +
              '<h3 class="sec-title">检测结论</h3>' +
              pairTable([
                kv('检测结果', resultBadge()),
                kv('出具时间', esc(s.resultAt || '—'), 'ledger-result-at'),
                kv('结论说明', esc(L.resultCopy(s))),
                kv('下次再检日期', esc(s.recheckAt || '—'))
              ]) +
              '<h3 class="sec-title">合格证</h3>' +
              (resultSt === '合格'
                ? '<div id="certMount" class="cert-mount"></div>'
                : '<p class="text-sm text-slate-400">该样品未出具合格证。</p>') +
              '<h3 class="sec-title">报告文档</h3>' +
              (s.reportNo
                ? pairTable([
                  kv('报告编号', '<a class="text-blue-600 hover:underline" href="' + reportHref() + '">' + esc(s.reportNo) + '</a>'),
                  kv('报告状态', esc(s.reportStatus || '—')),
                  kv('报告生成时间', esc(s.reportGeneratedAt || '—')),
                  kv('编制人', esc(s.compiler || '—')),
                  kv('编制日期', esc(s.compiledAt || '—')),
                  kv('审核人', esc(s.reviewer || '—')),
                  kv('审核日期', esc(s.reviewedAt || '—')),
                  kv('签发人', esc(s.signer || '—')),
                  kv('签发日期', esc(s.signedAt || '—')),
                  kv('当前节点', esc(taskName))
                ])
                : '<p class="text-sm text-slate-400">该样品尚未生成报告。</p>') +
            '</div>' +

          '</div>' +
        '</div>';

      document.getElementById('toggleSteps').addEventListener('click', function () {
        document.getElementById('taskSteps').classList.toggle('hidden');
      });
      document.querySelectorAll('.info-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.info-tab').forEach(function (x) { x.classList.remove('active'); });
          btn.classList.add('active');
          var id = btn.getAttribute('data-panel');
          document.querySelectorAll('.panel').forEach(function (p) {
            p.classList.toggle('is-on', p.id === 'panel-' + id);
          });
          if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
        });
      });

      if (window.OriginalRecordUI && OriginalRecordUI.paintStatic) {
        OriginalRecordUI.paintStatic('orTableBody', recs);
      }
      paintCert();

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({
          annotations: [
            {
              id: 'ledger-task', selector: '[data-annotate="ledger-task"]', position: 'bottom-left', tag: '样品台账',
              title: '委托任务流程节点',
              content: '<strong>需求逻辑：</strong>页首当前节点是委托任务进度，从委托登记到任务完成。<br>' +
                '<strong>交互逻辑：</strong>点当前节点展开各步：已过打勾，当前标「当前」，未到灰色。只读。'
            },
            {
              id: 'ledger-xor', selector: '[data-annotate="ledger-xor"]', position: 'top-left', wide: true, tag: '样品台账',
              title: '还样后留样或退样二选一',
              content: '<strong>需求逻辑：</strong>样品实物路径在还样之后只能走留样或退样，不能两条都走。<br>' +
                '<strong>展示规则：</strong>流转台账含当前存放位置。还样后<strong>留样或退样二选一</strong>。未还样则两条都不出现。回退行橙色标「回退」。'
            },
            {
