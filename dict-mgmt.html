<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>字典管理 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .dict-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dict-table th, .dict-table td { border-bottom: 1px solid #e5e7eb; padding: 10px 12px; text-align: left; vertical-align: middle; }
    .dict-table th { background: #f8fafc; color: #64748b; font-weight: 500; }
    .dict-table tbody tr:hover { background: #f8fafc; }
    .expand-btn { width: 18px; height: 18px; border: 1px solid #cbd5e1; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #64748b; cursor: pointer; background: #fff; }
    .expand-btn.open { background: #2563eb; color: #fff; border-color: #2563eb; }
    .sub-table-wrap { background: #fafafa; padding: 12px 12px 12px 48px; }
    .sub-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid #e5e7eb; }
    .sub-table th, .sub-table td { border: 1px solid #e5e7eb; padding: 8px 10px; }
    .sub-table th { background: #f1f5f9; color: #64748b; font-weight: 500; }
    .drawer-mask { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(0,0,0,.35); }
    .drawer-mask.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; z-index: 51; width: 420px; max-width: 100%; height: 100%; background: #fff; box-shadow: -4px 0 24px rgba(15,23,42,.12); transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
    .drawer-mask.open .drawer { transform: translateX(0); }
    .form-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; font-size: 13px; }
    .form-row > label { width: 88px; flex-shrink: 0; padding-top: 7px; text-align: right; color: #64748b; }
    .form-row > label .req { color: #ef4444; }
    .form-row .ctrl { flex: 1; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; outline: none; font-size: 13px; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #3b82f6; }
    .form-row input:read-only { background: #f8fafc; color: #64748b; cursor: not-allowed; }
    .form-hint { margin-top: 4px; font-size: 11px; color: #94a3b8; line-height: 1.4; }
    .form-hint.is-bound { color: #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      字典管理
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <!-- 搜索 -->
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="flex flex-wrap items-end gap-x-6 gap-y-3">
        <div class="flex items-center gap-2"><label class="whitespace-nowrap text-sm text-slate-600">字典名称</label><input id="f_name" class="w-40 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="请输入" /></div>
        <div class="flex items-center gap-2"><label class="whitespace-nowrap text-sm text-slate-600">字典类型</label><input id="f_type" class="w-40 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="请输入" /></div>
        <div class="flex items-center gap-2"><label class="whitespace-nowrap text-sm text-slate-600">字典状态</label><select id="f_status" class="w-36 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500"><option value="">请选择</option><option>正常</option><option>停用</option></select></div>
        <div class="flex items-center gap-2"><label class="whitespace-nowrap text-sm text-slate-600">创建时间</label><input class="w-52 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="开始日期 ~ 结束日期" /></div>
        <button onclick="renderTable()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i> 查询</button>
        <button onclick="resetFilter()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
      </div>
    </div>

    <!-- 工具栏 + 表格 -->
    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="mb-3 flex flex-wrap items-center gap-2">
        <button onclick="openTypeDrawer('add')" class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-plus"></i> 新增</button>
        <button onclick="alert('导入（原型演示）')" class="rounded border border-slate-300 px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-upload"></i> 导入</button>
        <button onclick="alert('导出（原型演示）')" class="rounded bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-download"></i> 导出</button>
        <button onclick="alert('缓存已刷新（原型演示）')" class="rounded border border-slate-300 px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i> 刷新缓存</button>
      </div>
      <div class="overflow-x-auto">
        <table class="dict-table min-w-[1000px]">
          <thead>
            <tr>
              <th class="w-10"></th>
              <th class="w-10"><input type="checkbox" /></th>
              <th class="w-16">字典编号</th>
              <th>字典名称</th>
              <th>字典类型</th>
              <th class="w-20">状态</th>
              <th class="w-40">创建时间</th>
              <th>备注</th>
              <th class="w-28">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="dictCount">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
      </div>
    </div>
  </div>

  <!-- 字典类型抽屉 -->
  <div id="typeDrawerMask" class="drawer-mask">
    <div id="typeDrawer" class="drawer">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 id="typeDrawerTitle" class="text-base font-medium">添加字典类型</h3>
        <button onclick="closeTypeDrawer()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-5 py-4">
        <div class="form-row"><label><span class="req">*</span> 字典名称</label><div class="ctrl"><input id="t_name" placeholder="请输入" data-annotate="dict-type-name" /><p id="t_name_hint" class="form-hint is-bound hidden"></p></div></div>
        <div class="form-row"><label><span class="req">*</span> 字典类型</label><div class="ctrl"><input id="t_type" placeholder="请输入" /></div></div>
        <div class="form-row"><label>状态</label><div class="ctrl"><select id="t_status"><option>正常</option><option>停用</option></select></div></div>
        <div class="form-row"><label>备注</label><div class="ctrl"><textarea id="t_remark" rows="4" placeholder="请输入"></textarea></div></div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-3">
        <button onclick="closeTypeDrawer()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="saveType()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">保存</button>
      </div>
    </div>
  </div>

  <!-- 字典数据抽屉 -->
  <div id="dataDrawerMask" class="drawer-mask">
    <div id="dataDrawer" class="drawer">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 id="dataDrawerTitle" class="text-base font-medium">添加字典数据</h3>
        <button onclick="closeDataDrawer()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-5 py-4">
        <div class="form-row"><label>字典类型</label><div class="ctrl"><input id="d_type" readonly /></div></div>
        <div class="form-row"><label><span class="req">*</span> 数据标签</label><div class="ctrl"><input id="d_label" placeholder="请输入" /></div></div>
        <div class="form-row"><label><span class="req">*</span> 数据键值</label><div class="ctrl"><input id="d_value" placeholder="请输入" /></div></div>
        <div class="form-row"><label><span class="req">*</span> 数据排序</label><div class="ctrl"><input id="d_sort" type="number" value="0" /></div></div>
        <div class="form-row"><label>状态</label><div class="ctrl"><select id="d_status"><option>正常</option><option>停用</option></select></div></div>
        <div class="form-row"><label>备注</label><div class="ctrl"><textarea id="d_remark" rows="4" placeholder="请输入"></textarea></div></div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-3">
        <button onclick="closeDataDrawer()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="saveData()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">保存</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/mock-dict.js"></script>
  <script src="js/entrust-field-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var dictTypes = MockDictStore.load();

    var editingTypeId = null;
    var editingDataCtx = null; /* { typeId, itemIndex } */

    function persistDictTypes() {
      MockDictStore.save(dictTypes);
    }

    function getBoundEntrustField(dictType) {
      if (!dictType || !window.EntrustFieldConfig) return null;
      return EntrustFieldConfig.getFieldByDictType(EntrustFieldConfig.load(), dictType);
    }

    function applyTypeNameLock(dictType) {
      var nameInput = document.getElementById('t_name');
      var hintEl = document.getElementById('t_name_hint');
      var boundField = dictType ? getBoundEntrustField(dictType) : null;
      if (boundField) {
        nameInput.readOnly = true;
        nameInput.value = boundField.placeholder || nameInput.value;
        hintEl.textContent = '该字典已与「业务流程配置 › 委托信息设置」中的「' + boundField.label + '」字段绑定，名称由字段别名同步，不可在此修改。';
        hintEl.classList.remove('hidden');
      } else {
        nameInput.readOnly = false;
        hintEl.textContent = '';
        hintEl.classList.add('hidden');
      }
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function renderTable() {
      var html = '';
      dictTypes.forEach(function (row) {
        html += '<tr>' +
          '<td><span class="expand-btn' + (row.expanded ? ' open' : '') + '" onclick="toggleExpand(' + row.id + ')">' + (row.expanded ? '−' : '+') + '</span></td>' +
          '<td><input type="checkbox" /></td>' +
          '<td>' + row.id + '</td>' +
          '<td>' + row.name + '</td>' +
          '<td>' + row.type + '</td>' +
          '<td>' + row.status + '</td>' +
          '<td class="whitespace-nowrap">' + row.time + '</td>' +
          '<td class="text-slate-500">' + row.remark + '</td>' +
          '<td class="whitespace-nowrap">' +
            '<button onclick="openTypeDrawer(\'edit\',' + row.id + ')" class="text-blue-600 hover:underline"><i class="fa fa-pencil"></i> 修改</button>' +
            '<button onclick="deleteType(' + row.id + ')" class="ml-2 text-red-500 hover:underline"><i class="fa fa-trash-o"></i> 删除</button>' +
          '</td></tr>';
        if (row.expanded) {
          html += '<tr><td colspan="9" class="!p-0 !border-b-0"><div class="sub-table-wrap">' +
            '<button onclick="openDataDrawer(' + row.id + ')" class="mb-2 rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700"><i class="fa fa-plus"></i> 新增</button>' +
            renderSubTable(row) + '</div></td></tr>';
        }
      });
      document.getElementById('tableBody').innerHTML = html;
      document.getElementById('dictCount').textContent = '共 ' + dictTypes.length + ' 条';
    }

    function renderSubTable(row) {
      if (!row.items.length) return '<p class="text-sm text-slate-400 py-2">暂无字典数据</p>';
      var head = '<table class="sub-table"><thead><tr><th class="w-10"><input type="checkbox"/></th><th>字典编码</th><th>数据标签</th><th>数据键值</th><th>数据排序</th><th>状态</th><th>创建时间</th><th>备注</th><th class="w-28">操作</th></tr></thead><tbody>';
      var body = row.items.map(function (it, ii) {
        return '<tr><td><input type="checkbox"/></td><td>' + it.id + '</td><td>' + it.label + '</td><td>' + it.value + '</td><td>' + it.sort + '</td><td>' + it.status + '</td><td class="whitespace-nowrap">' + it.time + '</td><td class="text-slate-500">' + it.remark + '</td><td class="whitespace-nowrap">' +
          '<button onclick="openDataDrawer(' + row.id + ',' + ii + ')" class="text-blue-600 hover:underline"><i class="fa fa-pencil"></i> 修改</button>' +
          '<button onclick="deleteData(' + row.id + ',' + ii + ')" class="ml-2 text-red-500 hover:underline"><i class="fa fa-trash-o"></i> 删除</button></td></tr>';
      }).join('');
      return head + body + '</tbody></table>';
    }

    function toggleExpand(id) {
      var row = dictTypes.find(function (r) { return r.id === id; });
      row.expanded = !row.expanded;
      renderTable();
    }

    function resetFilter() {
      document.getElementById('f_name').value = '';
      document.getElementById('f_type').value = '';
      document.getElementById('f_status').value = '';
      renderTable();
    }

    function openTypeDrawer(mode, id) {
      editingTypeId = mode === 'edit' ? id : null;
      document.getElementById('typeDrawerTitle').textContent = mode === 'edit' ? '修改字典类型' : '添加字典类型';
      var dictTypeKey = null;
      if (mode === 'edit') {
        var t = dictTypes.find(function (r) { return r.id === id; });
        dictTypeKey = t.type;
        document.getElementById('t_name').value = t.name;
        document.getElementById('t_type').value = t.type;
        document.getElementById('t_status').value = t.status;
        document.getElementById('t_remark').value = t.remark;
      } else {
        document.getElementById('t_name').value = '';
        document.getElementById('t_type').value = '';
        document.getElementById('t_status').value = '正常';
        document.getElementById('t_remark').value = '';
      }
      applyTypeNameLock(dictTypeKey);
      document.getElementById('typeDrawerMask').classList.add('open');
      if (window.PrototypeAnnotation && PrototypeAnnotation.applyFocusScope) PrototypeAnnotation.applyFocusScope();
    }

    function closeTypeDrawer() {
      document.getElementById('typeDrawerMask').classList.remove('open');
      if (window.PrototypeAnnotation && PrototypeAnnotation.applyFocusScope) PrototypeAnnotation.applyFocusScope();
    }

    function saveType() {
      var name = document.getElementById('t_name').value.trim();
      var type = document.getElementById('t_type').value.trim();
      if (!name || !type) { alert('请填写必填项'); return; }
      var status = document.getElementById('t_status').value;
      var remark = document.getElementById('t_remark').value.trim();
      if (editingTypeId) {
        var t = dictTypes.find(function (r) { return r.id === editingTypeId; });
        var boundField = getBoundEntrustField(t.type);
        t.name = boundField ? (boundField.placeholder || t.name) : name;
        t.type = type; t.status = status; t.remark = remark;
      } else {
        dictTypes.push({ id: dictTypes.length + 1, name: name, type: type, status: status, time: '2026-07-15 08:00:00', remark: remark, expanded: false, items: [] });
      }
      closeTypeDrawer();
      persistDictTypes();
      renderTable();
      alert('保存成功（原型演示）');
    }

    function deleteType(id) {
      if (!confirm('确定删除该字典类型？')) return;
      dictTypes = dictTypes.filter(function (r) { return r.id !== id; });
      persistDictTypes();
      renderTable();
    }

    function openDataDrawer(typeId, itemIndex) {
      var row = dictTypes.find(function (r) { return r.id === typeId; });
      editingDataCtx = { typeId: typeId, itemIndex: itemIndex };
      var isEdit = typeof itemIndex === 'number';
      document.getElementById('dataDrawerTitle').textContent = isEdit ? '修改字典数据' : '添加字典数据';
      document.getElementById('d_type').value = row.type;
      if (isEdit) {
        var it = row.items[itemIndex];
        document.getElementById('d_label').value = it.label;
        document.getElementById('d_value').value = it.value;
        document.getElementById('d_sort').value = it.sort;
        document.getElementById('d_status').value = it.status;
        document.getElementById('d_remark').value = it.remark;
      } else {
        document.getElementById('d_label').value = '';
        document.getElementById('d_value').value = '';
        document.getElementById('d_sort').value = '0';
        document.getElementById('d_status').value = '正常';
        document.getElementById('d_remark').value = '';
      }
      document.getElementById('dataDrawerMask').classList.add('open');
    }

    function closeDataDrawer() { document.getElementById('dataDrawerMask').classList.remove('open'); }

    function saveData() {
      var label = document.getElementById('d_label').value.trim();
      var value = document.getElementById('d_value').value.trim();
      var sort = document.getElementById('d_sort').value;
      if (!label || value === '' || sort === '') { alert('请填写必填项'); return; }
      var row = dictTypes.find(function (r) { return r.id === editingDataCtx.typeId; });
      var item = { label: label, value: value, sort: +sort, status: document.getElementById('d_status').value, time: '2026-07-15 08:00:00', remark: document.getElementById('d_remark').value.trim() };
      if (typeof editingDataCtx.itemIndex === 'number') {
        item.id = row.items[editingDataCtx.itemIndex].id;
        row.items[editingDataCtx.itemIndex] = item;
      } else {
        item.id = row.items.length ? Math.max.apply(null, row.items.map(function (x) { return x.id; })) + 1 : 1;
        row.items.push(item);
        row.expanded = true;
      }
      closeDataDrawer();
      persistDictTypes();
      renderTable();
      alert('保存成功（原型演示）');
    }

    function deleteData(typeId, ii) {
      if (!confirm('确定删除该字典数据？')) return;
      dictTypes.find(function (r) { return r.id === typeId; }).items.splice(ii, 1);
      persistDictTypes();
      renderTable();
    }

    document.getElementById('typeDrawerMask').addEventListener('click', function (e) { if (e.target === this) closeTypeDrawer(); });
    document.getElementById('dataDrawerMask').addEventListener('click', function (e) { if (e.target === this) closeDataDrawer(); });

    renderTable();

    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'dict-type-name-bound',
          selector: '[data-annotate="dict-type-name"]',
          position: 'top-left',
          title: '字典名称（绑定后只读）',
          wide: true,
          content: '<strong>需求逻辑：</strong>同一个字典名称可能被两处维护（字典管理与委托信息设置的字段别名），必须指定唯一数据源，否则两边显示不一致。<br>' +
            '<strong>展示规则：</strong>当该字典类型已在「业务流程配置 › 委托信息设置」中与下拉字段绑定时，字典名称在本页<strong>只读不可修改</strong>，以委托信息设置的字段别名为唯一数据源。<br>' +
            '<strong>交互逻辑：</strong>保存委托信息设置时自动把别名同步到这里；解除绑定后字典名称恢复可编辑且不再随别名同步；可打开已绑定字典（如「任务类型 / lims_task_type」）的「修改」抽屉查看只读效果。',
          tag: '字典绑定'
        }
      ]
    });
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
