<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品数据 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .cat-card {
      position: relative;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 45%, #93c5fd 100%);
    }
    .cat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,.18); }
    .cat-card .title { position: relative; z-index: 2; padding: 20px 24px; font-size: 18px; font-weight: 600; color: #1e3a8a; }
    .cat-card .illus {
      position: absolute; right: 0; bottom: 0; width: 55%; height: 100%;
      opacity: .35; display: flex; align-items: flex-end; justify-content: flex-end;
      font-size: 72px; color: #2563eb; padding-right: 16px; padding-bottom: 8px;
    }
    .cat-card:nth-child(2) { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%); }
    .cat-card:nth-child(3) { background: linear-gradient(135deg, #ecfdf5 0%, #a7f3d0 50%, #6ee7b7 100%); }
    .cat-card:nth-child(3) .title { color: #065f46; }
    .cat-card:nth-child(3) .illus { color: #059669; }
    .cat-card:nth-child(4) { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%); }
    .cat-card:nth-child(4) .title { color: #92400e; }
    .cat-card:nth-child(4) .illus { color: #d97706; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="sample-category.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">样品分类</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      样品数据
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="flex min-h-[calc(100vh-80px)] flex-col items-center justify-start px-6 py-10">
    <h1 class="mb-10 text-2xl font-semibold tracking-wide text-slate-800">样品数据</h1>
    <div class="grid w-full max-w-5xl grid-cols-1 gap-6 sm:grid-cols-2">
      <div class="cat-card" onclick="enterCategory('dlwz')">
        <div class="title">电力物资类</div>
        <div class="illus"><i class="fa fa-bolt"></i></div>
      </div>
      <div class="cat-card" onclick="enterCategory('aqgqj')">
        <div class="title">安全工器具类</div>
        <div class="illus"><i class="fa fa-shield"></i></div>
      </div>
      <div class="cat-card" onclick="enterCategory('hjjc')">
        <div class="title">环境检测</div>
        <div class="illus"><i class="fa fa-leaf"></i></div>
      </div>
      <div class="cat-card" onclick="enterCategory('gcjc')">
        <div class="title">工程检测</div>
        <div class="illus"><i class="fa fa-building"></i></div>
      </div>
    </div>
    <p class="mt-8 text-sm text-slate-400">点击大类卡片进入对应样品数据维护（原型演示）</p>
  </div>

  <script src="js/tab-bar.js"></script>
  <script>
    var CAT_NAMES = { dlwz: '电力物资类', aqgqj: '安全工器具类', hjjc: '环境检测', gcjc: '工程检测' };
    function enterCategory(id) {
      alert('进入「' + CAT_NAMES[id] + '」样品数据列表（原型演示，待后续补充明细页）');
    }
  </script>
</body>
</html>
