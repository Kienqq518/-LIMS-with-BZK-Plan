<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品数据详情 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .layout { display: flex; min-height: calc(100vh - 42px); background: #fff; border-top: 1px solid #e2e8f0; }
    .tree-panel { width: 300px; flex-shrink: 0; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; background: #fff; }
    .tree-head { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
    .tree-head .back { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; color: #334155; margin-bottom: 10px; cursor: pointer; }
    .tree-head .back:hover { color: #2563eb; }
    .tree-search { position: relative; }
    .tree-search i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 13px; }
    .tree-search input { width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 7px 10px 7px 30px; font-size: 13px; outline: none; }
    .tree-body { flex: 1; overflow-y: auto; padding: 6px 0; font-size: 13px; }
    .tree-node { padding: 7px 12px; cursor: pointer; color: #475569; display: flex; align-items: center; gap: 4px; user-select: none; }
    .tree-node:hover { background: #f8fafc; }
    .tree-node.active { background: #e0f2fe; color: #0369a1; font-weight: 500; }
    .tree-toggle { width: 14px; flex-shrink: 0; color: #94a3b8; font-size: 10px; text-align: center; }
    .main-panel { flex: 1; min-width: 0; background: #f1f5f9; overflow: auto; }
    .main-empty { min-height: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; gap: 6px; }
    .section-card { background: #fff; border-radius: 4px; padding: 16px 20px 18px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .section-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 14px; }
    .form-3col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 20px; }
    .form-item label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .form-item .req { color: #ef4444; margin-right: 2px; }
    .form-item input, .form-item select, .form-item textarea {
      width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 7px 10px; font-size: 13px; outline: none; background: #fff;
    }
    .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: #3b82f6; }
    .form-item textarea { resize: vertical; min-height: 38px; }
    /* 样品信息：标签与控件同一行，更紧凑 */
    [data-annotate="sample-info"] .form-3col { gap: 10px 14px; }
    [data-annotate="sample-info"] .form-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    [data-annotate="sample-info"] .form-item > label:not(.toggle) {
      display: block;
      flex: 0 0 118px;
      width: 118px;
      margin-bottom: 0;
      font-size: 13px;
      color: #64748b;
      text-align: right;
      line-height: 1.35;
      white-space: nowrap;
    }
    [data-annotate="sample-info"] .form-item > input,
    [data-annotate="sample-info"] .form-item > select,
    [data-annotate="sample-info"] .form-item > textarea,
    [data-annotate="sample-info"] .form-item > .radio-row,
    [data-annotate="sample-info"] .form-item > .phase-tags {
      flex: 1;
      min-width: 0;
    }
    [data-annotate="sample-info"] .form-item > .toggle,
    [data-annotate="sample-info"] .form-item > .upload-box {
      flex: 0 0 auto;
    }
    [data-annotate="sample-info"] .form-item > .upload-box {
      align-self: flex-start;
    }
    .radio-row, .phase-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; min-height: 36px; font-size: 13px; color: #475569; }
    .radio-row label, .phase-row label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; margin: 0; color: #475569; }
    .phase-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; align-items: center; }
    .phase-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 12px; }
    .phase-tag .rm { cursor: pointer; color: #94a3b8; }
    .phase-tag .rm:hover { color: #ef4444; }
    .upload-box {
      width: 88px; height: 88px; border: 1px dashed #cbd5e1; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 28px; cursor: pointer; background: #fff;
    }
    .upload-box:hover { border-color: #2563eb; color: #2563eb; }
    .file-link { color: #2563eb; font-size: 13px; cursor: pointer; }
    .file-link:hover { color: #1d4ed8; }
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; vertical-align: middle; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 11px; cursor: pointer; transition: .2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .toggle input:checked + .toggle-slider { background: #2563eb; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
    .btn-save { border-radius: 4px; background: #2563eb; color: #fff; padding: 7px 22px; font-size: 13px; }
    .btn-save:hover { background: #1d4ed8; }
    .btn-outline { border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; color: #334155; padding: 6px 14px; font-size: 13px; }
    .btn-outline:hover { background: #f8fafc; }
    .btn-primary { border-radius: 4px; background: #2563eb; color: #fff; padding: 6px 14px; font-size: 13px; }
    .btn-primary:hover { background: #1d4ed8; }
    .spec-tabs { display: flex; align-items: center; gap: 0; border: 1px solid #e2e8f0; border-radius: 4px; overflow: hidden; width: fit-content; max-width: 100%; }
    .spec-tab { padding: 8px 16px; font-size: 13px; color: #64748b; cursor: pointer; background: #fff; border-right: 1px solid #e2e8f0; white-space: nowrap; }
    .spec-tab:last-of-type { border-right: none; }
    .spec-tab.active { background: #e0f2fe; color: #0284c7; font-weight: 500; }
    .spec-tab-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #2563eb; font-size: 16px; }
    .spec-tab-actions .fa-trash { color: #ef4444; }
    .spec-tab-actions i { cursor: pointer; }
    .spec-fields { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px 18px; margin-top: 14px; max-width: 860px; }
    .mark-preview {
      display: flex; gap: 8px; align-items: stretch;
    }
    .mark-preview textarea {
      flex: 1; min-height: 64px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 8px 10px; font-size: 13px; outline: none; resize: vertical; background: #fff;
    }
    .mark-preview .ops { display: flex; flex-direction: column; gap: 6px; }
    .mark-preview .ops button { border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; padding: 4px 12px; font-size: 12px; color: #475569; }
    .mark-tools { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 12px; font-size: 13px; color: #64748b; }
    .mark-tools select, .mark-tools input { border: 1px solid #dcdfe6; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; background: #fff; }
    .sym-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .sym-btns button { min-width: 32px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; padding: 4px 8px; font-size: 12px; color: #334155; }
    .sym-btns button:hover { border-color: #93c5fd; color: #2563eb; }
    .model-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .model-chip {
      min-width: 64px; text-align: center; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 4px;
      background: #fff; color: #475569; font-size: 13px; cursor: pointer;
    }
    .model-chip.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; font-weight: 500; }
    .icon-btn { color: #2563eb; cursor: pointer; font-size: 16px; margin-left: 8px; }
    .icon-btn.danger { color: #ef4444; }
    .param-card { border: 1px solid #e2e8f0; border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
    .param-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: #334155; }
    .param-card-head .ops { display: flex; gap: 12px; color: #2563eb; font-size: 15px; }
    .param-card-head .ops .fa-trash { color: #ef4444; }
    .param-card-head .ops i { cursor: pointer; }
    .option-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .option-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: #eff6ff; color: #2563eb; border-radius: 999px; font-size: 12px; }
    .option-tag .rm { cursor: pointer; color: #94a3b8; }
    .option-tag .rm:hover { color: #ef4444; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    .data-table th, .data-table td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; vertical-align: middle; }
    .data-table th { background: #f8fafc; color: #64748b; font-weight: 500; white-space: nowrap; }
    .data-table td { color: #334155; }
    .link { color: #2563eb; cursor: pointer; }
    .link:hover { color: #1d4ed8; }
    .link.danger { color: #ef4444; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 12px; }
    .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #64748b; }
    .pager .pg { min-width: 24px; height: 24px; border: 1px solid #e2e8f0; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: #fff; }
    .pager .pg.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .cable-only.hidden, .model-only.hidden, .sample-spec-body.hidden, #sampleWorkspace.hidden, #emptyState.hidden { display: none !important; }
    .empty-table { padding: 36px 16px; text-align: center; color: #94a3b8; font-size: 13px; }
    .empty-table i { display: block; font-size: 36px; margin-bottom: 8px; color: #cbd5e1; }
    .section-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .section-title-row .section-title { margin-bottom: 0; }
    .section-title-row .icon-btn { margin-left: 0; }
    /* 型号面板：凸显当前型号下的配置区块 */
    .model-scope-panel.is-model {
      margin-bottom: 12px;
      padding: 14px 14px 6px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 56px, #f1f5f9 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 3px rgba(37,99,235,.06);
    }
    .model-scope-panel.is-model .section-card {
      border: 1px solid #bfdbfe;
      box-shadow: none;
      background: #fff;
    }
    .model-scope-panel.is-model .section-card:last-child { margin-bottom: 8px; }
    .model-scope-head {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 2px 4px 10px;
      border-bottom: 1px dashed #93c5fd;
    }
    .model-scope-panel.is-model .model-scope-head { display: flex; }
    .model-scope-head .left {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: #1d4ed8;
    }
    .model-scope-head .left .badge {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
      background: #2563eb; color: #fff; font-size: 12px; font-weight: 600;
    }
    .model-scope-head .hint { font-size: 12px; color: #64748b; font-weight: 400; }
    @media (max-width: 1100px) {
      .form-3col { grid-template-columns: 1fr 1fr; }
      .spec-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="sample-data.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="sample-data.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">样品数据</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      样品数据详情
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="layout">
    <aside class="tree-panel">
      <div class="tree-head">
        <div class="back" onclick="goBack()"><i class="fa fa-angle-left"></i> <span id="catTitle">电力物资类</span></div>
        <div class="tree-search">
          <i class="fa fa-search"></i>
          <input type="text" id="treeSearch" placeholder="搜索关键字" oninput="renderTree()" />
        </div>
      </div>
      <div class="tree-body" id="treeBody"></div>
    </aside>

    <div class="main-panel" id="mainPanel">
      <div class="main-empty" id="emptyState">
        <i class="fa fa-sitemap text-3xl text-slate-300"></i>
        <div>请选择具体样品</div>
        <div class="text-xs text-slate-400">当前选中的是分类/标准节点，请在左侧选择样品叶节点后进行配置</div>
      </div>

      <div id="sampleWorkspace" class="hidden p-4">
        <!-- 图1/3：样品信息 -->
        <div class="section-card" data-annotate="sample-info">
          <div class="section-title">样品信息：</div>
          <div class="form-3col">
            <div class="form-item">
              <label><span class="req">*</span>名称</label>
              <input id="b_name" type="text" />
            </div>
            <div class="form-item">
              <label>样品代码</label>
              <input id="b_code" type="text" placeholder="请输入" />
            </div>
            <div class="form-item">
              <label><span class="req">*</span>排序</label>
              <input id="b_sort" type="number" min="1" />
            </div>

            <div class="form-item">
              <label><span class="req">*</span>样品分类</label>
              <select id="b_category"></select>
            </div>
            <div class="form-item">
              <label><span class="req">*</span>标准号</label>
              <select id="b_standard" disabled class="bg-slate-50 text-slate-500"></select>
            </div>
            <div class="form-item">
              <label>默认费用(元)</label>
              <input id="b_fee" type="text" placeholder="请输入" />
            </div>

            <div class="form-item">
              <label><span class="req">*</span>最大检测周期(月)</label>
              <input id="b_cycle" type="number" min="0" />
            </div>
            <div class="form-item">
              <label><span class="req">*</span>区分型号</label>
              <select id="b_diffModel" onchange="onDiffModelChange()">
                <option value="是">是</option>
                <option value="否">否</option>
              </select>
            </div>
            <div class="form-item">
              <label>单位</label>
              <input id="b_unit" type="text" />
            </div>

            <div class="form-item">
              <label>备注</label>
              <input id="b_remark" type="text" />
            </div>

            <div class="form-item">
              <label><span class="req">*</span>是否电缆</label>
              <label class="toggle">
                <input id="b_isCable" type="checkbox" onchange="onCableToggle()" />
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="form-item cable-only">
              <label><span class="req">*</span>电缆结构</label>
              <div class="radio-row">
                <label><input type="radio" name="cableStruct" value="单芯" /> 单芯</label>
                <label><input type="radio" name="cableStruct" value="多芯" checked /> 多芯</label>
              </div>
            </div>
            <div class="form-item cable-only">
              <label><span class="req">*</span>芯数</label>
              <select id="b_cores">
                <option>2芯</option>
                <option selected>3芯</option>
                <option>4芯</option>
                <option>5芯</option>
              </select>
            </div>

            <div class="form-item cable-only">
              <label><span class="req">*</span>线芯颜色</label>
              <div class="radio-row">
                <label><input type="radio" name="coreColor" value="绝缘分色" checked /> 绝缘分色</label>
                <label><input type="radio" name="coreColor" value="数字标识" /> 数字标识</label>
              </div>
            </div>
            <div class="form-item cable-only" style="grid-column: span 2;">
              <label><span class="req">*</span>相别</label>
              <div class="phase-tags" id="b_phases">
                <span class="phase-tag">红 <i class="fa fa-times rm"></i></span>
                <span class="phase-tag">黄 <i class="fa fa-times rm"></i></span>
                <span class="phase-tag">绿 <i class="fa fa-times rm"></i></span>
              </div>
            </div>

            <div class="form-item" id="sampleImageItem">
              <label>样品图片</label>
              <div class="upload-box" title="上传图片"><i class="fa fa-plus"></i></div>
            </div>
          </div>
          <div class="mt-5 flex items-center justify-between">
            <a class="file-link"><i class="fa fa-file-text-o"></i> 上传附件</a>
            <button class="btn-save" onclick="toast('样品信息已保存（原型）')">保存</button>
          </div>
        </div>

        <!-- 样品级规格参数：区分型号=否且无参数时仅标题+加号（图2） -->
        <div class="section-card" data-annotate="sample-specs">
          <div class="section-title-row">
            <div class="section-title">规格参数：</div>
            <i class="fa fa-plus-circle icon-btn" title="新增" onclick="toast('新增规格参数（原型）')"></i>
            <div class="spec-tab-actions sample-spec-body" id="sampleSpecActions">
              <i class="fa fa-copy" title="复制" onclick="toast('复制规格参数（原型）')"></i>
              <i class="fa fa-trash" title="删除" onclick="toast('删除规格参数（原型）')"></i>
            </div>
          </div>
          <div class="sample-spec-body" id="sampleSpecBody">
            <div class="flex items-center gap-3 mb-3">
              <div class="spec-tabs" id="sampleSpecTabs"></div>
            </div>
            <div class="spec-fields">
              <div class="form-item">
                <label><span class="req">*</span>参数名称</label>
                <input id="ss_name" type="text" />
              </div>
              <div class="form-item">
                <label>符号</label>
                <input id="ss_symbol" type="text" />
              </div>
              <div class="form-item">
                <label>单位</label>
                <input id="ss_unit" type="text" />
              </div>
            </div>
            <div class="mt-5 flex justify-end"><button class="btn-save" onclick="toast('规格参数已保存（原型）')">保存</button></div>
          </div>
        </div>

        <!-- 产品标记 / 试验项 / 样品判定 始终展示；型号专属区随「区分型号」显隐 -->
        <div data-annotate="model-panel">
          <div class="section-card" data-annotate="mark-switch">
            <div class="section-title flex items-center gap-3">产品标记：
              <label class="toggle"><input type="checkbox" id="markEnabledSwitch" onchange="onMarkEnabledChange(this.checked)" /><span class="toggle-slider"></span></label>
              <span id="markEnabledHint" class="text-xs font-normal text-slate-400"></span>
            </div>
            <div id="markPanelOff" class="hidden mb-3 text-sm text-slate-400">未开启：无需配置产品标记规则，LIMS 其它涉及样品信息的页面也不展示「产品标记」字段。</div>
            <div id="markPanel">
            <div class="text-sm text-slate-500 mb-2">产品标记规则预览</div>
            <div class="mark-preview" data-annotate="mark-rule">
              <textarea id="markRule" readonly></textarea>
              <div class="ops">
                <button type="button" onclick="toast('已复制规则')">复制</button>
                <button type="button" onclick="toast('已回退')">回退</button>
                <button type="button" onclick="clearMarkRule()">清除</button>
              </div>
            </div>
            <div class="mark-tools">
              <div class="flex items-center gap-2">
                <span>可用元素</span>
                <select id="markElement">
                  <option value="">请选择</option>
                  <option>型号信息.型号</option>
                  <option>规格参数.额定电压.值</option>
                  <option>样品信息.是否电缆.芯数</option>
                  <option>规格参数.导体标称截面积.值</option>
                  <option>样品信息.标准号</option>
                </select>
                <button class="btn-outline" type="button" onclick="insertMarkElement()">插入</button>
              </div>
              <div class="flex items-center gap-2">
                <span>选择符号</span>
                <div class="sym-btns">
                  <button type="button" onclick="insertMarkText('-')">-</button>
                  <button type="button" onclick="insertMarkText('X')">X</button>
                  <button type="button" onclick="insertMarkText('/')">/</button>
                  <button type="button" onclick="insertMarkText('(')">(</button>
                  <button type="button" onclick="insertMarkText(')')">)</button>
                  <button type="button" onclick="insertMarkText('.')">.</button>
                  <button type="button" onclick="insertMarkText('空格')">空格</button>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span>字母或数值</span>
                <input id="markCustom" type="text" placeholder="请输入" class="w-36" />
                <button class="btn-outline" type="button" onclick="insertMarkCustom()">插入</button>
              </div>
            </div>
            <div class="mt-5 flex justify-end"><button class="btn-save" onclick="toast('产品标记已保存（原型）')">保存</button></div>
            </div>
          </div>

          <!-- 区分型号=是：型号/分类选择条 -->
          <div class="model-only" id="modelOnlyBlock">
            <div class="section-card">
              <div class="mb-3 flex items-center">
                <div class="section-title mb-0">型号/分类：</div>
                <i class="fa fa-plus-circle icon-btn" title="新增型号" onclick="toast('新增型号（原型）')"></i>
                <i class="fa fa-copy icon-btn" title="复制型号" onclick="toast('复制型号（原型）')"></i>
              </div>
              <div class="model-tabs" id="modelTabs"></div>
            </div>
          </div>

          <!-- 型号面板：型号信息 / 规格参数 / 试验项 / 样品判定 -->
          <div class="model-scope-panel" id="modelScopePanel" data-annotate="model-scope">
            <div class="model-scope-head">
              <div class="left">
                <i class="fa fa-cube"></i>
                <span>型号面板</span>
                <span class="badge" id="modelScopeName">-</span>
              </div>
              <div class="hint">以下配置均归属当前型号</div>
            </div>

            <div class="model-only">
              <div class="section-card">
                <div class="mb-3 flex items-center justify-between">
                  <div class="section-title mb-0">型号信息：</div>
                  <a class="link danger text-sm" onclick="toast('删除该型号（原型）')"><i class="fa fa-trash"></i> 删除该型号</a>
                </div>
                <div class="form-3col">
                  <div class="form-item">
                    <label><span class="req">*</span>型号</label>
                    <input id="m_code" type="text" />
                  </div>
                  <div class="form-item" style="grid-column: span 2;">
                    <label><span class="req">*</span>名称</label>
                    <input id="m_name" type="text" />
                  </div>
                  <div class="form-item">
                    <label><span class="req">*</span>排序</label>
                    <input id="m_sort" type="number" min="1" />
                  </div>
                  <div class="form-item">
                    <label><span class="req">*</span>最大检测周期(月)</label>
                    <input id="m_cycle" type="number" min="0" />
                  </div>
                  <div class="form-item" style="grid-column: span 1;">
                    <label>描述</label>
                    <input id="m_desc" type="text" />
                  </div>
                </div>
                <div class="mt-5 flex items-center justify-between">
                  <a class="file-link"><i class="fa fa-paperclip"></i> 上传附件</a>
                  <button class="btn-save" onclick="toast('型号信息已保存（原型）')">保存</button>
                </div>
              </div>

              <div class="section-card">
                <div class="section-title">规格参数：</div>
                <div id="modelSpecCards"></div>
              </div>
            </div>

            <div class="section-card">
              <div class="mb-3 flex items-center justify-between">
                <div class="section-title mb-0">试验项：</div>
                <div class="flex gap-2">
                  <button class="btn-outline" type="button" onclick="toast('复制试验（原型）')">复制试验</button>
                  <button class="btn-primary" type="button" onclick="toast('新增试验（原型）')"><i class="fa fa-plus"></i> 新增试验</button>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="data-table min-w-[1100px]">
                  <thead>
                    <tr>
                      <th style="width:56px">序号</th>
                      <th style="width:160px">检测项目</th>
                      <th style="width:100px">质量特性</th>
                      <th style="width:100px">检验类别</th>
                      <th style="width:140px">试验依据</th>
                      <th>标准要求</th>
                      <th style="width:70px">状态</th>
                      <th style="width:150px">操作</th>
                    </tr>
                  </thead>
                  <tbody id="testTableBody"></tbody>
                </table>
              </div>
              <div class="pager" id="testPager">
                <span>共<span id="testTotal">0</span>条</span>
                <span class="pg active">1</span>
                <select class="rounded border border-slate-200 px-2 py-1 text-xs"><option>10条/页</option></select>
              </div>
            </div>

            <div class="section-card" data-annotate="sample-judge">
              <div class="mb-3 flex items-center justify-between">
                <div class="section-title mb-0">样品判定：</div>
                <button class="btn-outline" type="button" onclick="goReportJudgment()">去设置</button>
              </div>
              <div class="overflow-x-auto">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th style="width:70px">序号</th>
                      <th style="width:140px">检测类别</th>
                      <th>规则判定方案</th>
                      <th style="width:90px">详情</th>
                    </tr>
                  </thead>
                  <tbody id="judgeTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script>
    var CAT_META = {
      dlwz: { name: '电力物资类' },
      aqgqj: { name: '安全工器具类' },
      hjjc: { name: '环境检测' },
      gcjc: { name: '工程检测' }
    };

    // 样品分类树与样品 Mock 已抽为共享模块 js/sample-data-store.js（与委托登记「添加样品」同源）
    var TREES = window.SampleDataStore.TREES;
    var SAMPLE_MOCK = window.SampleDataStore.SAMPLE_MOCK;

    function defaultSample(label) {
      return {
        name: label,
        code: '',
        sort: 1,
        category: CAT_META[state.cat].name,
        standard: '-',
        fee: '',
        cycle: 12,
        diffModel: '否',
        unit: '',
        remark: '',
        isCable: false,
        cableStruct: '多芯',
        cores: '3芯',
        coreColor: '绝缘分色',
        phases: [],
        sampleSpecs: [],
        markRule: '',
        models: [],
        tests: [],
        judges: []
      };
    }

    var params = new URLSearchParams(window.location.search);
    var cat = params.get('cat') || 'dlwz';
    if (!CAT_META[cat]) cat = 'dlwz';

    var state = {
      cat: cat,
      selectedId: null,
      selectedIsLeaf: false,
      openIds: {},
      sampleSpecIdx: 0,
      modelIdx: 0
    };

    function toast(msg) { alert(msg); }
    function goBack() { window.location.href = 'sample-data.html'; }

    function goReportJudgment() {
      window.location.href = 'report-judgment.html?cat=' + encodeURIComponent(state.cat) +
        (state.selectedId ? '&sample=' + encodeURIComponent(state.selectedId) : '');
    }

    function collectOpenIds(nodes) {
      (nodes || []).forEach(function (n) {
        if (n.open) state.openIds[n.id] = true;
        if (n.children) collectOpenIds(n.children);
      });
    }

    function findFirstLeaf(nodes) {
      for (var i = 0; i < (nodes || []).length; i++) {
        var n = nodes[i];
        if (n.leaf) return n.id;
        var child = findFirstLeaf(n.children);
        if (child) return child;
      }
      return null;
    }

    function findNode(nodes, id) {
      for (var i = 0; i < (nodes || []).length; i++) {
        var n = nodes[i];
        if (n.id === id) return n;
        var c = findNode(n.children, id);
        if (c) return c;
      }
      return null;
    }

    function matchKw(node, kw) {
      if (!kw) return true;
      if ((node.label || '').toLowerCase().indexOf(kw) >= 0) return true;
      return (node.children || []).some(function (c) { return matchKw(c, kw); });
    }

    function renderNodes(nodes, depth, kw) {
      var html = '';
      (nodes || []).forEach(function (n) {
        if (!matchKw(n, kw)) return;
        var pad = 12 + depth * 16;
        var isOpen = !!state.openIds[n.id];
        var hasChildren = !!(n.children && n.children.length);
        var active = state.selectedId === n.id ? ' active' : '';
        if (n.leaf) {
          html += '<div class="tree-node' + active + '" style="padding-left:' + pad + 'px" onclick="selectLeaf(\'' + n.id + '\')">' +
            '<span class="tree-toggle"></span><span>' + n.label + '</span></div>';
        } else {
          html += '<div class="tree-node' + active + '" style="padding-left:' + pad + 'px" onclick="selectBranch(\'' + n.id + '\')">' +
            '<span class="tree-toggle" onclick="toggleNode(event,\'' + n.id + '\')">' + (hasChildren ? (isOpen ? '▼' : '▶') : '') + '</span>' +
            '<span>' + n.label + '</span></div>';
          if (hasChildren && (isOpen || kw)) html += renderNodes(n.children, depth + 1, kw);
        }
      });
      return html;
    }

    function renderTree() {
      var kw = (document.getElementById('treeSearch').value || '').trim().toLowerCase();
      var html = renderNodes(TREES[state.cat] || [], 0, kw);
      document.getElementById('treeBody').innerHTML = html || '<div class="px-4 py-10 text-center text-slate-400 text-sm">暂无样品分类数据</div>';
    }

    function toggleNode(e, id) {
      if (e) e.stopPropagation();
      state.openIds[id] = !state.openIds[id];
      renderTree();
    }

    function selectLeaf(id) {
      state.selectedId = id;
      state.selectedIsLeaf = true;
      state.sampleSpecIdx = 0;
      state.modelIdx = 0;
      renderTree();
      renderWorkspace();
    }

    function selectBranch(id) {
      state.selectedId = id;
      state.selectedIsLeaf = false;
      renderTree();
      renderWorkspace();
    }

    function currentSample() {
      var node = findNode(TREES[state.cat], state.selectedId);
      var label = node ? node.label : '-';
      return SAMPLE_MOCK[state.selectedId] || defaultSample(label);
    }

    function currentModel(sample) {
      sample = sample || currentSample();
      if (!sample.models || !sample.models.length) return null;
      if (state.modelIdx >= sample.models.length) state.modelIdx = 0;
      return sample.models[state.modelIdx];
    }

    function setDiffModelMode(show) {
      document.querySelectorAll('.model-only').forEach(function (el) {
        el.classList.toggle('hidden', !show);
      });
      document.getElementById('modelScopePanel').classList.toggle('is-model', !!show);
    }

    function onDiffModelChange() {
      var show = document.getElementById('b_diffModel').value === '是';
      setDiffModelMode(show);
      renderSharedPanels(currentSample());
      if (show) renderModelPanel(currentSample());
      else document.getElementById('modelScopeName').textContent = '-';
    }

    function onCableToggle() {
      var on = document.getElementById('b_isCable').checked;
      document.querySelectorAll('.cable-only').forEach(function (el) {
        el.classList.toggle('hidden', !on);
      });
    }

    function fillSelect(sel, values, selected) {
      sel.innerHTML = values.map(function (v) {
        return '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
      }).join('');
    }

    function renderSampleSpecTabs(sample) {
      var specs = sample.sampleSpecs || [];
      var hasSpecs = specs.length > 0;
      document.getElementById('sampleSpecBody').classList.toggle('hidden', !hasSpecs);
      document.getElementById('sampleSpecActions').classList.toggle('hidden', !hasSpecs);
      if (!hasSpecs) return;
      if (state.sampleSpecIdx >= specs.length) state.sampleSpecIdx = 0;
      document.getElementById('sampleSpecTabs').innerHTML = specs.map(function (s, i) {
        return '<div class="spec-tab' + (i === state.sampleSpecIdx ? ' active' : '') + '" onclick="switchSampleSpec(' + i + ')">规格参数' + (i + 1) + '</div>';
      }).join('');
      var cur = specs[state.sampleSpecIdx];
      document.getElementById('ss_name').value = cur.name || '';
      document.getElementById('ss_symbol').value = cur.symbol || '';
      document.getElementById('ss_unit').value = cur.unit || '';
    }

    function switchSampleSpec(idx) {
      var sample = currentSample();
      if (SAMPLE_MOCK[state.selectedId] && SAMPLE_MOCK[state.selectedId].sampleSpecs && SAMPLE_MOCK[state.selectedId].sampleSpecs[state.sampleSpecIdx]) {
        SAMPLE_MOCK[state.selectedId].sampleSpecs[state.sampleSpecIdx] = {
          name: document.getElementById('ss_name').value,
          symbol: document.getElementById('ss_symbol').value,
          unit: document.getElementById('ss_unit').value
        };
      }
      state.sampleSpecIdx = idx;
      renderSampleSpecTabs(sample);
    }

    function renderModelTabs(sample) {
      var models = sample.models || [];
      document.getElementById('modelTabs').innerHTML = models.map(function (m, i) {
        return '<div class="model-chip' + (i === state.modelIdx ? ' active' : '') + '" onclick="switchModel(' + i + ')">' + m.code + '</div>';
      }).join('') || '<span class="text-sm text-slate-400">暂无型号，请点击 + 新增</span>';
    }

    function switchModel(idx) {
      state.modelIdx = idx;
      var sample = currentSample();
      renderModelPanel(sample);
      renderSharedPanels(sample);
    }

    function renderModelSpecCards(model) {
      var specs = (model && model.specs) || [];
      document.getElementById('modelSpecCards').innerHTML = specs.map(function (sp, idx) {
        var isSelect = sp.type === '用户选择';
        var name = 'modelSpecType_' + idx;
        return '<div class="param-card" data-spec-idx="' + idx + '">' +
          '<div class="param-card-head"><span>' + sp.title + '</span>' +
          '<div class="ops"><i class="fa fa-check-square" title="确认"></i><i class="fa fa-copy" title="复制"></i><i class="fa fa-trash" title="删除"></i></div></div>' +
          '<div class="form-item"><label><span class="req">*</span>类型</label>' +
          '<div class="radio-row">' +
          '<label><input type="radio" name="' + name + '" value="用户输入" ' + (!isSelect ? 'checked' : '') +
          ' onchange="onModelSpecTypeChange(' + idx + ',\'用户输入\')" /> 用户输入</label>' +
          '<label><input type="radio" name="' + name + '" value="用户选择" ' + (isSelect ? 'checked' : '') +
          ' onchange="onModelSpecTypeChange(' + idx + ',\'用户选择\')" /> 用户选择</label>' +
          '</div></div>' +
          '<div class="form-item mt-3 model-spec-options"' + (isSelect ? '' : ' style="display:none"') + '>' +
          '<label><span class="req">*</span>可选项</label>' +
          '<div class="option-tags">' + (sp.options || []).map(function (o) {
            return '<span class="option-tag">' + o + ' <i class="fa fa-times rm"></i></span>';
          }).join('') + '</div></div></div>';
      }).join('') || '<div class="text-sm text-slate-400">暂无规格参数配置</div>';
    }

    function onModelSpecTypeChange(idx, type) {
      var sample = currentSample();
      var model = currentModel(sample);
      if (!model || !model.specs || !model.specs[idx]) return;
      model.specs[idx].type = type;
      // 同步回 mock，便于切换型号后保留
      if (SAMPLE_MOCK[state.selectedId] && SAMPLE_MOCK[state.selectedId].models) {
        SAMPLE_MOCK[state.selectedId].models[state.modelIdx] = model;
      }
      renderModelSpecCards(model);
    }

    function emptyTableRow(colspan, text) {
      return '<tr><td colspan="' + colspan + '"><div class="empty-table"><i class="fa fa-inbox"></i>' + (text || '暂无数据') + '</div></td></tr>';
    }

    function renderTests(tests) {
      tests = tests || [];
      document.getElementById('testTotal').textContent = String(tests.length);
      document.getElementById('testPager').style.display = tests.length ? '' : 'none';
      document.getElementById('testTableBody').innerHTML = tests.map(function (t, i) {
        return '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + t.name + '</td>' +
          '<td>' + (t.quality || '') + '</td>' +
          '<td><span class="tag">' + t.category + '</span></td>' +
          '<td>' + t.basis + '</td>' +
          '<td>' + t.req + '</td>' +
          '<td><label class="toggle"><input type="checkbox" ' + (t.on ? 'checked' : '') + ' /><span class="toggle-slider"></span></label></td>' +
          '<td class="whitespace-nowrap">' +
          '<a class="link mr-2" title="上移"><i class="fa fa-arrow-up"></i></a>' +
          '<a class="link mr-2" title="下移"><i class="fa fa-arrow-down"></i></a>' +
          '<a class="link mr-2" onclick="toast(\'编辑试验（原型）\')"><i class="fa fa-pencil"></i> 编辑</a>' +
          '<a class="link danger" onclick="toast(\'删除试验（原型）\')"><i class="fa fa-trash"></i> 删除</a>' +
          '</td></tr>';
      }).join('') || emptyTableRow(8, '暂无数据');
    }

    function renderJudges(judges) {
      judges = judges || [];
      document.getElementById('judgeTableBody').innerHTML = judges.map(function (j, i) {
        return '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + j.category + '</td>' +
          '<td>' + j.scheme + '</td>' +
          '<td><a class="link" onclick="toast(\'查看判定详情（原型）\')">详情</a></td>' +
          '</tr>';
      }).join('') || emptyTableRow(4, '暂无数据');
    }

    // 产品标记开关：关闭时收起规则面板、无需配置；开启时才需要配置规则，且下游页面才展示该字段
    function applyMarkEnabled(id) {
      var on = window.SampleDataStore ? SampleDataStore.isMarkEnabled(id) : false;
      var sw = document.getElementById('markEnabledSwitch');
      if (sw) sw.checked = on;
      document.getElementById('markPanel').classList.toggle('hidden', !on);
      document.getElementById('markPanelOff').classList.toggle('hidden', on);
      document.getElementById('markEnabledHint').textContent = on
        ? '已开启：需配置产品标记规则'
        : '已关闭：无需配置产品标记规则';
    }
    function onMarkEnabledChange(on) {
      if (window.SampleDataStore && state.selectedId) SampleDataStore.setMarkEnabled(state.selectedId, on);
      applyMarkEnabled(state.selectedId);
      toast(on ? '已开启产品标记：请配置规则（样品信息相关页面将展示该字段）'
               : '已关闭产品标记：无需配置规则，样品信息相关页面不再展示该字段');
    }

    function renderSharedPanels(sample) {
      document.getElementById('markRule').value = sample.markRule || '';
      applyMarkEnabled(state.selectedId);
      var diffYes = (document.getElementById('b_diffModel').value || sample.diffModel) === '是';
      if (diffYes) {
        var model = currentModel(sample);
        renderTests(model ? model.tests : []);
        renderJudges(model ? model.judges : []);
      } else {
        renderTests(sample.tests || []);
        renderJudges(sample.judges || []);
      }
    }

    function renderModelPanel(sample) {
      var model = currentModel(sample);
      renderModelTabs(sample);
      if (!model) {
        document.getElementById('modelScopeName').textContent = '-';
        document.getElementById('m_code').value = '';
        document.getElementById('m_name').value = '';
        document.getElementById('m_sort').value = '';
        document.getElementById('m_cycle').value = '';
        document.getElementById('m_desc').value = '';
        document.getElementById('modelSpecCards').innerHTML = '<div class="text-sm text-slate-400">请先新增型号</div>';
        return;
      }
      document.getElementById('modelScopeName').textContent = model.code || '-';
      document.getElementById('m_code').value = model.code || '';
      document.getElementById('m_name').value = model.name || '';
      document.getElementById('m_sort').value = model.sort || 1;
      document.getElementById('m_cycle').value = model.cycle || '';
      document.getElementById('m_desc').value = model.desc || '';
      renderModelSpecCards(model);
    }

    function renderWorkspace() {
      var empty = document.getElementById('emptyState');
      var ws = document.getElementById('sampleWorkspace');
      if (!state.selectedIsLeaf) {
        empty.classList.remove('hidden');
        ws.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      ws.classList.remove('hidden');

      var sample = currentSample();
      document.getElementById('b_name').value = sample.name || '';
      document.getElementById('b_code').value = sample.code || '';
      document.getElementById('b_sort').value = sample.sort || 1;
      fillSelect(document.getElementById('b_category'), [sample.category], sample.category);
      fillSelect(document.getElementById('b_standard'), [sample.standard], sample.standard);
      document.getElementById('b_fee').value = sample.fee || '';
      document.getElementById('b_cycle').value = sample.cycle || '';
      document.getElementById('b_diffModel').value = sample.diffModel || '否';
      document.getElementById('b_unit').value = sample.unit || '';
      document.getElementById('b_remark').value = sample.remark || '';
      document.getElementById('b_isCable').checked = !!sample.isCable;
      document.getElementById('b_cores').value = sample.cores || '3芯';
      document.querySelectorAll('input[name="cableStruct"]').forEach(function (el) {
        el.checked = el.value === (sample.cableStruct || '多芯');
      });
      document.querySelectorAll('input[name="coreColor"]').forEach(function (el) {
        el.checked = el.value === (sample.coreColor || '绝缘分色');
      });
      document.getElementById('b_phases').innerHTML = (sample.phases || []).map(function (p) {
        return '<span class="phase-tag">' + p + ' <i class="fa fa-times rm"></i></span>';
      }).join('') || '<span class="text-xs text-slate-400">请选择相别</span>';

      onCableToggle();
      renderSampleSpecTabs(sample);
      var diffYes = sample.diffModel === '是';
      setDiffModelMode(diffYes);
      if (diffYes) renderModelPanel(sample);
      else document.getElementById('modelScopeName').textContent = '-';
      renderSharedPanels(sample);
    }

    function insertMarkElement() {
      var v = document.getElementById('markElement').value;
      if (!v) return;
      var el = document.getElementById('markRule');
      el.value += '[' + v + ']';
    }
    function insertMarkText(t) {
      var el = document.getElementById('markRule');
      el.value += '[' + t + ']';
    }
    function insertMarkCustom() {
      var v = (document.getElementById('markCustom').value || '').trim();
      if (!v) return;
      insertMarkText(v);
      document.getElementById('markCustom').value = '';
    }
    function clearMarkRule() {
      document.getElementById('markRule').value = '';
    }

    function init() {
      document.getElementById('catTitle').textContent = CAT_META[state.cat].name;
      collectOpenIds(TREES[state.cat] || []);
      var first = findFirstLeaf(TREES[state.cat] || []);
      if (first) {
        state.selectedId = first;
        state.selectedIsLeaf = true;
      }
      renderTree();
      renderWorkspace();

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({
          annotations: [
            {
              id: 'sample-info',
