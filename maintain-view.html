<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备维护记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sheet-table th, .sheet-table td { border: 1px solid #cbd5e1; padding: 7px 8px; text-align: left; }
    .sheet-table th { background: #f1f5f9; color: #475569; font-weight: 500; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-700">
  <div class="mx-auto max-w-xl p-4 pt-6">
    <div class="overflow-hidden rounded-xl bg-white shadow-lg">
      <div class="bg-blue-600 px-5 py-4 text-white">
        <a id="backLink" href="report-verify.html" class="mb-2 inline-flex items-center gap-1 text-xs text-blue-100 hover:text-white">
          <i class="fa fa-angle-left"></i> 返回溯源页
        </a>
        <h1 class="text-lg font-semibold">设备维护记录</h1>
        <p id="topSub" class="mt-1 text-xs text-blue-100">公开只读 · 签发时冻结的设备台账维护记录</p>
      </div>
      <div id="body" class="px-5 py-5"></div>
    </div>
  </div>
  <script src="js/report-trace.js"></script>
  <script src="js/report-trace-l1.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      if (code) document.getElementById('backLink').href = 'report-verify.html?code=' + encodeURIComponent(code);
      var res = code ? ReportTrace.getVerify(code) : { ok: false };
      var reportNo = (res.ok && res.entry) ? res.entry.reportNo : params.get('report');
      var recs = ReportTrace.getMaintainRecords(reportNo);
      var eq = (ReportTrace.snapshots[reportNo] || {}).equipment || {};
      var body = document.getElementById('body');
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      if (!recs.length) {
        body.innerHTML = '<p class="text-sm text-slate-500">本报告无维护记录。</p>';
        return;
      }
      document.getElementById('topSub').textContent = (eq.code || '') + '　·　' + recs.length + ' 条';
      var rows = recs.map(function (r) {
        return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.type) + '</td><td>' + esc(r.item) + '</td><td>' + esc(r.result) + '</td><td>' + esc(r.by) + '</td></tr>';
      }).join('');
      body.innerHTML =
        '<div class="overflow-x-auto rounded-lg border border-slate-200">' +
          '<table class="sheet-table min-w-[520px]"><thead><tr><th>日期</th><th>类型</th><th>项目</th><th>结果</th><th>经办</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '</div>' +
        '<p class="mt-3 text-center text-[11px] text-slate-400">公开页只读展示签发时冻结的维护记录，不可编辑。</p>';
    })();
  </script>

  <script src="js/message-store.js?v=2" defer></script>
  <script src="js/message-center.js?v=2" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
