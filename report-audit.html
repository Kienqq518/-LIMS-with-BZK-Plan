<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告审核 · AI 审查 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="report-list.html">
    <a href="report-list.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告编制</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告审核
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4 space-y-4 max-w-4xl">
    <div id="ai-liability" class="rounded border border-blue-200 bg-blue-50 px-4 py-2 text-sm text-blue-900">
      AI 只输出预审意见与问题清单，最终签发由授权签字人确认。
    </div>

    <div id="report-meta" class="text-sm text-slate-600"></div>

    <div id="ai-card" class="rounded bg-white p-4 shadow-sm border border-slate-200">
      <h2 class="text-base font-semibold text-slate-800 mb-2">AI 审查结果（自动触发）</h2>
      <p class="text-sm">总结论：<span id="ai-conclusion" class="font-medium text-slate-900">—</span></p>
      <div id="ai-notices" class="mt-2 text-xs text-amber-700"></div>
      <div id="ai-issues" class="mt-3 space-y-2"></div>
      <label class="mt-4 block text-xs text-slate-500">案例标注
        <select id="case-label" class="ml-1 rounded border border-slate-300 px-2 py-1 text-sm">
          <option value="正常">正常</option>
          <option value="误报">误报</option>
          <option value="漏报">漏报</option>
        </select>
      </label>
      <button id="btn-audit-settle" type="button" class="mt-3 rounded bg-emerald-600 px-4 py-2 text-sm text-white hover:bg-emerald-700">完成审核处置</button>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script>
    var auditState = { report: null, result: null, dispositions: {} };

    function getQueryReportId() {
      var m = /[?&]report=([^&]+)/.exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    function renderCard() {
      var rid = getQueryReportId();
      if (!rid) {
        document.getElementById('report-meta').textContent = '缺少 report 参数';
        return;
      }
      AiReviewStore.reset();
      var report = AiReviewStore.getReport(rid);
      if (!report) {
        document.getElementById('report-meta').textContent = '未找到报告 ' + rid;
        return;
      }
      auditState.report = report;
      document.getElementById('report-meta').textContent =
        '报告编号：' + (report.report_no || rid) + ' · 业务类型：' + report.biz_type;
      var rules = AiReviewStore.getRules();
      var res = AiReviewEngine.run(report, rules, AiReviewStore.getCategories(), AiReviewStore.getBindings());
      auditState.result = res;
      window.__lastAuditResult = res;
      AiReviewStore.saveResult(res);
      document.getElementById('ai-conclusion').textContent = res.conclusion;
      document.getElementById('ai-notices').innerHTML = (res.notices || [])
        .map(function (n) { return '<span>' + n.code + '：' + n.message + '</span>'; })
        .join('<br>');
      var box = document.getElementById('ai-issues');
      box.innerHTML = '';
      res.issues.forEach(function (iss) {
        var div = document.createElement('div');
        div.className = 'issue rounded border border-slate-200 p-2';
        div.setAttribute('data-rule-id', iss.rule_id);
        div.innerHTML =
          '<button data-action="接受" type="button" class="rounded bg-slate-100 px-2 py-1 text-xs mr-2">接受</button>' +
          '<button data-action="覆盖" type="button" class="rounded bg-amber-100 px-2 py-1 text-xs mr-2">覆盖</button>' +
          '<input class="override-reason ml-1 rounded border border-slate-200 px-2 py-1 text-xs" placeholder="覆盖理由" />' +
          '<span class="ml-2 text-xs text-slate-600">' + iss.rule_id + ' · ' + iss.message + '</span>';
        div.querySelectorAll('button').forEach(function (btn) {
          btn.onclick = function () {
            var action = btn.getAttribute('data-action');
            var reason = div.querySelector('.override-reason').value.trim();
            if (action === '覆盖' && !reason) { alert('须填写理由'); return; }
            auditState.dispositions[iss.rule_id] = { rule_id: iss.rule_id, action: action, reason: reason || '' };
          };
        });
        box.appendChild(div);
      });
    }

    document.getElementById('btn-audit-settle').onclick = function () {
      if (!auditState.report || !auditState.result) return;
      var dispositions = Object.keys(auditState.dispositions).map(function (k) { return auditState.dispositions[k]; });
      if (!dispositions.length && auditState.result.issues.length) {
        auditState.result.issues.forEach(function (i) {
          dispositions.push({ rule_id: i.rule_id, action: '接受', reason: '' });
        });
      }
      AiReviewStore.saveFeedback({
        report_id: auditState.report.id,
        ai_conclusion: auditState.result.conclusion,
        final_conclusion: auditState.result.conclusion,
        dispositions: dispositions,
        at: new Date().toISOString(),
      });
      AiReviewStore.appendCase({
        case_id: 'case-audit-' + Date.now(),
        report_id: auditState.report.id,
        report_snapshot: auditState.report,
        biz_type: auditState.report.biz_type,
        ai_conclusion: auditState.result.conclusion,
        ai_issues: auditState.result.issues,
        dispositions: dispositions,
        final_conclusion: auditState.result.conclusion,
        label: (document.getElementById('case-label') || {}).value || '正常',
        created_at: new Date().toISOString(),
      });
      alert('审核处置已记录');
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderCard);
    else renderCard();
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
