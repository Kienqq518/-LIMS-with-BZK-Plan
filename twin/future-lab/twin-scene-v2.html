<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未来实验室数字孪生 · 运行大屏 V2</title>
<link rel="stylesheet" href="../../css/ui-baseline.css">
<link rel="stylesheet" href="twin-scene-v2.css?v=5">
<script src="../../js/ui-a11y.js" defer></script>
<script src="../js/twin-api-mock.js" defer></script>
<script src="../src/runtime-audit.js"></script>
</head>
<body>
<!-- 控制三层（决策 Q1/Q7 定稿）：① 叙事=模式按钮+区域下拉 ② 渲染=图层菜单 ③ 演示动作=系统流/收起/低配。5M1E 切片已按决策 Q7 移除。 -->
<header class="topbar">
  <div class="brand"><img src="assets/yingmin.png" alt="应敏科技"><span>应敏科技 · 未来实验室数字孪生</span></div>

  <nav class="modes" aria-label="叙事视图（MVP：总览 + 区域下钻）">
    <button class="mode active" data-mode="S1">S1 实验室总览</button>
    <label class="zsel"><span>区域</span><select id="zoneSel" aria-label="选择区域（等同原 S2 重点监控，106 为完整视图）"></select></label>
  </nav>

  <nav class="acts" aria-label="渲染图层与演示控制">
    <div class="layers" role="group" aria-label="渲染图层">
      <button class="lic on" data-layer="path" aria-pressed="true" title="调度路径：机器人行进折线、掉头拐点与走廊范围带" desc="调度路径">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15h5V9h4V4"/><circle cx="3" cy="15" r="1.7"/><circle cx="16" cy="4" r="1.7"/></svg><span>路径</span></button>
      <button class="lic on" data-layer="labels" aria-pressed="true" title="设备状态标签：设备顶部状态光点 + 场景内房间/节点文字标签" desc="设备状态标签">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h7l5 5-5 5-7-5z"/><circle cx="8" cy="8" r="1.4"/></svg><span>标签</span></button>
      <button class="lic" data-layer="heatmap" aria-pressed="false" title="工位负荷热力：106 无人化区设备为高负荷，其他区域降到最低" desc="工位负荷热力">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3c2 3 4 4 4 7a4 4 0 01-8 0c0-3 2-4 4-7z"/><path d="M10 13.5a1.8 1.8 0 001.8-1.8c0-1.3-1.8-2.4-1.8-2.4s-1.8 1.1-1.8 2.4A1.8 1.8 0 0010 13.5z"/></svg><span>热力</span></button>
    </div>
    <button class="pill" id="stripBtn" aria-pressed="false" title="收起/展开今日任务表">▾ 收起底栏</button>
    <button class="pill fsbtn" id="fsBtn" aria-pressed="false" title="全屏演示（快捷键 F；再按一次或 Esc 退出）">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5"/></svg><span class="fs-t">全屏</span></button>
    <time class="clock" id="clock" datetime="" aria-label="当前时间">–</time>
</header>

<aside class="rail" aria-label="运行指标">
  <div class="period" role="tablist" aria-label="统计周期">
    <button class="seg active" data-period="day" role="tab">本日</button>
    <button class="seg" data-period="month" role="tab">本月</button>
    <button class="seg" data-period="year" role="tab">本年</button>
  </div>
  <div class="tables" id="tables"></div>
  <div class="cycle" id="cycleBox" title="无人化任务循环剧本：小机器人按调度任务明细顺序在各工位间行走停靠">
    <div class="cy-top"><b id="cyNow">–</b><span id="cyLabel">无人化循环</span></div>
    <div class="cy-bar"><i id="cyBar"></i></div>
    <div class="cy-sub" id="cySub">等待剧本</div>
  </div>
  <!-- 数据源胶囊 / draw calls / 风格预览 按 2026-11-06 反馈移除；来源与更新时间改为写进每张表头（诚实口径不丢） -->
  <!-- 避让校验常驻徽标已按 2026-11-06 反馈移除；自检照跑，结果写 body[data-route-audit] 供 QA，违规时才瞬时提示 -->
  <span id="freshDot" class="dot live" hidden></span><span id="freshTxt" hidden></span>
</aside>

<main class="stage">
  <iframe id="scene" src="tour-space-v3-1.html?v2=1&native-nodes=1" title="未来实验室三维场景" allow="fullscreen"></iframe>

  <section class="stream" id="alarmStream" aria-live="polite" aria-label="告警流（滚动）">
    <header>
      <div class="sh-top"><b>告警流</b><span id="streamMeta">当前告警</span></div>
      <div class="alarm-sum" id="alarmSum" aria-live="polite">
        <span class="open">未解除 –</span><span class="done">已解除 –</span>
        <span class="ga">A –</span><span class="gb">B –</span><span class="gc">C –</span>
      </div>
      <div class="filter" role="group" aria-label="告警筛选">
        <button class="mini active" data-alarmfilter="open">只看未解除</button><button class="mini" data-alarmfilter="all">全部</button>
      </div>
    </header>
    <div class="stream-view"><div class="stream-track" id="streamTrack"></div></div>
  </section>
  <!-- 区域视图五类信息（2026-11-05 信息模型）：设备 / 环境数据 / 任务统计 / 正在运行的任务 / 告警 -->
  <aside class="zonepanel" id="zonePanel" hidden aria-label="区域运行面板">
    <header><b id="zpName">–</b><span id="zpMeta">–</span><button class="close" id="zpClose" aria-label="返回总览">×</button></header>
    <div class="zp-scroll">
      <section id="zpDevices"><h4><i class="k dev"></i>设备<em id="zpDevicesN"></em></h4><div class="zp-body"></div></section>
      <section id="zpEnv"><h4><i class="k env"></i>环境数据<em id="zpEnvN"></em></h4><div class="zp-body"></div></section>
      <section id="zpStats"><h4><i class="k stat"></i>任务统计<em id="zpStatsPeriod"></em></h4><div class="zp-body"></div></section>
      <section id="zpRunning"><h4><i class="k run"></i>正在运行的任务<em id="zpRunningN"></em></h4><div class="zp-body"></div></section>
      <section id="zpAlarms"><h4><i class="k ab"></i>告警<em id="zpAlarmsN"></em></h4><div class="zp-body"></div></section>
    </div>
  </aside>

  <footer class="tasktable" id="taskStrip" aria-label="今日任务（滚动表格）">
    <div class="tt-head"><span>委托单号</span><span>样品 / 试验项目</span><span>状态</span><span>设备链</span><span>进度</span></div>
    <div class="tt-view"><div class="tt-track" id="ttTrack"></div></div>
  </footer>

  <aside class="detail" id="detail" hidden aria-label="详情面板">
    <button class="close" id="detailClose" aria-label="关闭详情">×</button>
    <div id="detailBody"></div>
  </aside>



  <p class="remote-hint" id="remoteHint" hidden aria-hidden="true">翻页提示</p>
</main>
<script src="twin-scene-v2.js?v=5" defer></script>
</body>
</html>
