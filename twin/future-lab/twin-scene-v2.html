<!doctype html>
<html lang="zh-CN">
<head><link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未来实验室数字孪生 · 运行大屏 V2</title>
<link rel="stylesheet" href="../../css/ui-baseline.css">
<link rel="stylesheet" href="twin-tokens.css?v=1">
<link rel="stylesheet" href="twin-scene-v2.css?v=6">
<script src="../../js/ui-a11y.js" defer></script>
<script src="../js/twin-api-mock.js" defer></script>
<script src="../src/runtime-audit.js"></script>
</head>
<body>
<!-- 控制三层（决策 Q1/Q7 定稿）：① 叙事=模式按钮+区域下拉 ② 渲染=图层菜单 ③ 演示动作=系统流/收起/低配。5M1E 切片已按决策 Q7 移除。 -->
<header class="topbar">
  <!-- 顶栏不做"导航栏"：无底色、无边框、无模糊条，只是浮在三维画面上的文字与 icon（2026-11-07 反馈）
       顺序＝logo（左上角）→ 区域切换（标题左侧）→ 总览 → 标题 → 右侧 icon 组 -->
  <div class="brand"><img src="assets/yingmin.png" alt="应敏科技" title="应敏科技"></div>

  <!-- 视图层级拆成两个组件（2026-11-08 产品负责人）：
       组件1＝实验室总览 / 区域（默认总览）；组件2＝区域房间，只在选中「区域」时出现，
       且默认不选中任何房间——只有真的挑了房间，下方三维才刷新跳过去。 -->
  <nav class="modes" aria-label="视图层级（先选层级，再选房间）">
    <div class="lvgrp" role="group" aria-label="视图层级">
      <button class="mode lv active" data-mode="S1" data-level="overview" aria-pressed="true">实验室总览</button>
      <button class="mode lv" data-mode="ZONE" data-level="zone" aria-pressed="false">区域</button>
    </div>
    <label class="zsel" id="roomWrap" hidden><span>区域房间</span>
      <select id="zoneSel" aria-label="选择区域房间（选中后三维空间跳转到该房间）"></select></label>
  </nav>

  <h1 class="title" data-text="未来实验室数字孪生">未来实验室数字孪生</h1>

  <nav class="acts" aria-label="渲染图层与演示控制">
    <div class="layers" role="group" aria-label="渲染图层">
      <button class="lic on" data-layer="path" aria-pressed="true" title="调度路径：机器人行进折线、掉头拐点与走廊范围带" desc="调度路径">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15h5V9h4V4"/><circle cx="3" cy="15" r="1.7"/><circle cx="16" cy="4" r="1.7"/></svg><span>路径</span></button>
      <button class="lic on" data-layer="labels" aria-pressed="true" title="场地标签：只显示/隐藏各房间名称标签（不影响设备状态光点与物联节点标签）" desc="场地标签">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h7l5 5-5 5-7-5z"/><circle cx="8" cy="8" r="1.4"/></svg><span>场地标签</span></button>
      <button class="lic" data-layer="heatmap" aria-pressed="false" title="工位负荷热力：106 无人化区设备为高负荷，其他区域降到最低" desc="工位负荷热力">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3c2 3 4 4 4 7a4 4 0 01-8 0c0-3 2-4 4-7z"/><path d="M10 13.5a1.8 1.8 0 001.8-1.8c0-1.3-1.8-2.4-1.8-2.4s-1.8 1.1-1.8 2.4A1.8 1.8 0 0010 13.5z"/></svg><span>热力</span></button>
    </div>
    <button class="pill" id="stripBtn" aria-pressed="false" title="收起/展开今日任务表">▾ 收起底栏</button>
    <button class="pill fsbtn" id="fsBtn" aria-pressed="false" title="全屏演示（快捷键 F；再按一次或 Esc 退出）">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5"/></svg><span class="fs-t">全屏</span></button>
    <time class="clock" id="clock" datetime="" aria-label="当前时间">–</time>
</header>

<aside class="rail" aria-label="运行指标">
  <!-- 运行指标（FR-41 压缩版）：一组两行——标题｜大数｜环比 + 一行分解值；
       只有「分解相加==大数」的组才多一条 5px 分段条。
       KPI 胶囊与来源/时间戳小字都已撤掉（同一批数字不写两遍，口径转 aria-label）。 -->
  <section class="railpanel" id="railPanel" aria-label="运行指标（合并面板）">
    <!-- 周期开关搬进标题行右侧（2026-11-08 圈图）：它原来单独占一行，左栏第一屏全是"控件"不是内容 -->
    <header class="rp-head"><b>运行指标</b>
      <div class="period" role="tablist" aria-label="统计周期">
        <button class="seg active" data-period="day" role="tab">本日</button>
        <button class="seg" data-period="month" role="tab">本月</button>
        <button class="seg" data-period="year" role="tab">本年</button>
      </div><span class="rp-src" id="rpSrc" aria-label="来源与更新时间">—</span></header>
    <div class="tables" id="tables"></div>
  </section>
  <!-- 设备运行状态（FR-42 从底栏挪进左栏）：圆环 + 四行图例 + 机器人一行。
       左栏从此只有两件事：读数（运行指标）与设备状态；AGV 与调度任务归到底栏。 -->
  <section class="raildev" id="railDev" aria-label="设备运行状态">
    <header><b>设备运行状态</b><span class="src" id="dkDevSrc" aria-label="来源 数采">—</span></header>
    <div class="rd-wrap">
      <div class="tw-chart" id="chartDevices" role="img" aria-label="设备运行状态 3D 圆环图：运行中/待机/停机/异常 四档数量与占比，中心为建档合计"></div>
      <div class="dk-body" id="dkDevBody"></div>
    </div>
  </section>
  <!-- AGV 机器人（2026-11-08 产品负责人：设备运行状态下面加一块 AGV 状态与电量，两块之间留间隙）。
       原来只有一行「机器人 2 台 · 在跑 1 · 停靠充电 1」的文字，看不出每台在干什么、还剩多少电。 -->
  <section class="raildev railagv" id="railAgv" aria-label="AGV 机器人状态与电量">
    <header><b>AGV 机器人</b><span class="src" id="agvCnt">—</span></header>
    <div class="agv-list" id="agvList"></div>
  </section>
  <!-- 数据源胶囊 / draw calls / 风格预览 按 2026-11-06 反馈移除；来源与更新时间改为写进每张表头（诚实口径不丢） -->
  <!-- 避让校验常驻徽标已按 2026-11-06 反馈移除；自检照跑，结果写 body[data-route-audit] 供 QA，违规时才瞬时提示 -->
  <span id="freshDot" class="dot live" hidden></span><span id="freshTxt" hidden></span>
</aside>

<main class="stage">
  <iframe id="scene" src="tour-space-v3-1.html?v2=1&native-nodes=1" title="未来实验室三维场景" allow="fullscreen"></iframe>

  <!-- 右列（2026-11-07 改版）：上移到 top:14 填满原来空着的 112px；
       告警流高度固定、不再切 A/B/C 三区，按发生时间平铺；组态物联信息挪到告警流下方。 -->
  <div class="rcol" id="rightCol">
    <section class="stream" id="alarmStream" aria-live="polite" aria-label="告警流（按发生时间滚动）">
      <header>
        <div class="sh-top"><b>告警流</b><span id="streamMeta">今日 – 条</span></div>
        <div class="sh-filter" role="group" aria-label="告警筛选">
          <button class="mini" data-sfilter="open">只看未解除</button>
          <button class="mini active" data-sfilter="all">全部</button>
        </div>
      </header>
      <div class="stream-view"><div class="stream-board" id="streamTrack"></div></div>
    </section>
    <!-- 4 路视觉节点实时画面（2026-11-08 圈图：告警流下方这块位置就是给它们的）。
         上一版我拿 `</section>\n  </aside>` 当锚点插进去，结果匹配到左栏那个 aside，
         整块根本没落到右列——#cctvBox 为 null、renderCams 直接 return，画面一格都没出。
         这次锚在右列自己的收尾上，并且下面这条注释就是防再犯的标记。 -->
    <section class="cctv" id="cctvBox" aria-label="视觉节点实时画面">
      <header><b>视觉节点实时画面</b><span class="src" id="cctvCnt">—</span></header>
      <div class="cam-grid" id="camGrid"></div>
    </section>
  </div>
  <!-- 区域视图五类信息（2026-11-05 信息模型）：设备 / 环境数据 / 任务统计 / 正在运行的任务 / 告警 -->
  <aside class="zonepanel" id="zonePanel" hidden aria-label="区域运行面板">
    <header><b id="zpName">–</b><span id="zpMeta">–</span><button class="close" id="zpClose" aria-label="返回总览">×</button></header>
    <!-- 左栏在非 106 房间隐藏后，周期切换器必须跟着进面板：检测项目数统计就是按周期变的 -->
    <div class="zp-period" id="zpPeriod" role="group" aria-label="统计周期" hidden>
      <span class="lb">统计周期</span>
      <button class="mini seg" data-period="day">本日</button>
      <button class="mini seg" data-period="month">本月</button>
      <button class="mini seg" data-period="year">本年</button>
    </div>
    <div class="zp-scroll">
      <section id="zpDevices"><h4><i class="k dev"></i>设备<em id="zpDevicesN"></em></h4><div class="zp-body"></div></section>
      <section id="zpEnv"><h4><i class="k env"></i>环境数据<em id="zpEnvN"></em></h4><div class="zp-body"></div></section>
      <section id="zpStats"><h4><i class="k stat"></i>任务统计<em id="zpStatsPeriod"></em></h4><div class="tw-chart" id="chartZoneStats" role="img" aria-label="任务统计 3D 柱状图：完成/执行中/异常/排队"></div><div class="zp-body"></div></section>
      <section id="zpTestItems" hidden><h4><i class="k stat"></i>检测项目数统计<em id="zpTestItemsPeriod"></em></h4><div class="tw-chart" id="chartZoneItems" role="img" aria-label="检测项目数 3D 柱状图：检测中/待检测/已完成/逾期"></div><div class="zp-body"></div></section>
      <section id="zpSamples" hidden><h4><i class="k dev"></i>样品台账<em id="zpSamplesN"></em></h4><div class="tw-chart" id="chartZoneSamples" role="img" aria-label="样品按名称分布 3D 环形图：各类支数与占比，相加等于在库存量"></div><div class="zp-body"></div></section>
      <section id="zpRunning"><h4><i class="k run"></i>正在运行的任务<em id="zpRunningN"></em></h4><div class="zp-body"></div></section>
      <section id="zpAlarms"><h4><i class="k ab"></i>告警<em id="zpAlarmsN"></em></h4><div class="zp-body"></div></section>
    </div>
  </aside>

  <!-- 底栏三块（FR-45 铺满整屏宽）：① 上=AGV 当前任务，下=调度任务三列（进行中/未派单/已完成）
       ② 委托单试验项完成情况 ③ 组态物联节点（从右列挪下来，位置几乎没变，但底栏因此能铺满）。
       右列从此只剩告警流，高度反而更大。设备运行状态在左栏（FR-42）。 -->
  <footer class="dock" id="taskStrip" aria-label="底部三块铺满整屏宽：安全管家场景监测 / 无人化调度任务 / 组态物联节点">
    <!-- 安全管家场景监测（2026-11-08 产品负责人：这块替掉「试验项完成情况」，并放到最左、与调度任务交换位置）。
         每行=场景名 + 运行状态 + 所用节点 icon + 所在房间号；状态由告警与点位阈值现算（见 mock）。 -->
    <section class="dk scpanel" id="dkScenes" aria-label="安全管家场景监测状态">
      <header><b>安全管家场景监测</b><span class="src" id="scCnt">—</span></header>
      <div class="sc-grid" id="dkScenesGrid" role="list"></div>
    </section>
    <section class="dk dkq" id="dkQueue" aria-label="AGV 与无人化调度任务">
      <header><b>无人化调度任务</b></header>   <!-- 「流程配置 N 条 · 循环同步：xxxxx」按 2026-11-08 圈图撤除：
       同一条流程号下面 AGV 任务行已经写了，屏上不重复第二遍；口径转进块级 aria-label -->
      <div class="cycle" id="cycleBox">
        <div class="cy-top"><b id="cyNow">–</b><span id="cyLabel">AGV 任务</span></div>
        <div class="cy-bar"><i id="cyBar"></i></div>
        <div class="cy-sub" id="cySub">等待剧本</div>
      </div>
      <div class="dq3">
        <div class="dq-col" data-state="running"><h4>进行中 <b id="dqNRunning">0</b></h4><div class="dk-view"><div class="dk-track" id="dqTrackRunning"></div></div></div>
        <div class="dq-col" data-state="unassigned"><h4>未派单 <b id="dqNUnassigned">0</b></h4><div class="dk-view"><div class="dk-track" id="dqTrackUnassigned"></div></div></div>
        <div class="dq-col" data-state="done"><h4>已完成 <b id="dqNDone">0</b></h4><div class="dk-view"><div class="dk-track" id="dqTrackDone"></div></div></div>
      </div>
    </section>
      <section class="dk nodepanel" id="iotPanel" aria-label="组态物联节点状态监测">
      <header><b>组态物联节点状态监测</b><span class="src" id="dkNodesCnt">—</span></header>
      <div class="th-wrap"><div class="tw-chart th" id="chartTH" role="img" aria-label="未来实验室平均温湿度 3D 平滑折线带：温度与湿度两条序列，取全部温湿度点位当前均值"></div></div>
      <div class="np-view"><div class="dk-track" id="dkNodesTrack"></div></div>
    </section>
</footer>

  <aside class="detail" id="detail" hidden aria-label="详情面板">
    <button class="close" id="detailClose" aria-label="关闭详情">×</button>
    <div id="detailBody"></div>
  </aside>



  <p class="remote-hint" id="remoteHint" hidden aria-hidden="true">翻页提示</p>
</main>
<script src="twin-charts.js?v=1" defer></script>
<script src="twin-scene-v2.js?v=5" defer></script>
</body>
</html>
