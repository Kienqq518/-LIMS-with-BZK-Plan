<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告编制编辑 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 24px; font-size: 13px; }
    .info-grid .lbl { color: #64748b; }
    .info-grid .val { color: #334155; }
    .sub-tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b; }
    .sub-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 500; }
    .sample-group { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .sample-group-title { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 12px; }
    .specimen-tests { font-size: 12px; color: #64748b; line-height: 1.6; }
    .pick-all-row { margin: 12px 0; font-size: 13px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="report-list.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="report-list.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">报告编制</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      报告编制编辑
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="border-b border-slate-200 bg-white px-4">
    <div class="flex gap-4">
      <div class="sub-tab active" data-annotate="tab-detect">检测信息</div>
      <div class="sub-tab">委托信息</div>
    </div>
  </div>

  <div class="p-4 space-y-4">
    <!-- 按样品分组：选取检测信息 -->
    <div class="rounded bg-white p-4 shadow-sm" data-annotate="pick-detect-info">
      <div class="mb-3 text-sm font-medium text-slate-700">选取检测信息</div>
      <div id="sampleGroupsContainer"></div>
    </div>

    <!-- 生成报告按钮单独一行 -->
    <div class="rounded bg-white px-4 py-5 shadow-sm text-center" data-annotate="btn-generate-row">
      <button onclick="openGenerateModal()" class="rounded bg-blue-600 px-12 py-2 text-sm text-white hover:bg-blue-700">生成报告</button>
    </div>

    <!-- 报告文件 -->
    <div class="rounded bg-white p-4 shadow-sm" data-annotate="report-files">
      <div class="mb-3 text-sm font-medium text-slate-700">报告文件</div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[900px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="whitespace-nowrap border border-slate-200 px-3 py-2 font-medium w-12">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">试样编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">报告</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">生成时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">修改时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="reportFileBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 生成确认弹窗 -->
  <div id="generateModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[90vh] w-[560px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">生成报告确认</h3>
        <button type="button" onclick="closeGenerateModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-auto px-6 py-4 space-y-5 text-sm">
        <div class="rounded border border-blue-100 bg-blue-50 px-4 py-3 text-blue-800">
          已勾选 <strong id="modalCheckedCount">0</strong> 个试样。请确认导出方式与模版变体（已预填默认值，可修改）。
        </div>
        <div data-annotate="modal-export-mode">
          <div class="mb-2 font-medium text-slate-700">导出方式</div>
          <div class="space-y-2" id="modalExportModes"></div>
        </div>
        <div data-annotate="modal-variant">
          <div class="mb-2 font-medium text-slate-700">报告模版变体</div>
          <div id="modalVariantBlocks" class="space-y-3"></div>
        </div>
        <div class="rounded border border-slate-200 bg-slate-50 px-4 py-3 text-slate-600" data-annotate="modal-preview">
          预览：将生成 <strong id="modalPreviewCount" class="text-blue-600">0</strong> 份报告
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button type="button" onclick="closeGenerateModal()" class="rounded border border-slate-300 px-5 py-1.5 text-sm text-slate-600">取消</button>
        <button type="button" onclick="confirmGenerate()" class="rounded bg-blue-600 px-6 py-1.5 text-sm text-white" data-annotate="confirm-generate">确认生成</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/report-export.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var ENTRUST_CODE = new URLSearchParams(location.search).get('entrust') || 'SCZN202508/0009';

    var REPORT_EXPORT_RULES = [
      { id: 1, bindType: 'category', bindTarget: '电力物资类', modeKey: 'specimen-each' },
      { id: 2, bindType: 'category', bindTarget: '安全工器具类', modeKey: 'model-batch' },
      { id: 3, bindType: 'category', bindTarget: '环境检测', modeKey: 'model-batch' },
      { id: 4, bindType: 'category', bindTarget: '工程检测', modeKey: 'model-batch' }
    ];

    var TEMPLATE_INDEX = {
      'pvc-c': [
        { id: 1, name: '标准版', isDefault: true, file: 'PVC-C报告模板_标准版.doc', templates: [{ enabled: true }] },
        { id: 2, name: '英文版', isDefault: false, file: 'PVC-C报告模板_英文版.doc', templates: [{ enabled: true }] },
        { id: 3, name: '简版', isDefault: false, file: 'PVC-C报告模板_简版.doc', templates: [{ enabled: true }] }
      ]
    };

    var SAMPLE_GROUPS = [
      {
        id: 'g-pvc-c',
        templateKey: 'pvc-c',
        name: '实壁塑料电缆导管',
        model: 'PVC-C',
        marking: 'DS 150*8*600 SN12 PVC-C DL/T 802.3-2023',
        inspectCategory: '出厂检验',
        qty: 3,
        unit: '根',
        manufacturer: 'xxx',
        mfgAddress: 'xxxx',
        mfgOrigin: 'xxxxx',
        remark: 'xxxxx',
        category: '电力物资类',
        categoryPath: ['电力物资类', 'WZ电网物资'],
        tests: '颜色外观|尺寸检查|密度|压扁试验|维卡软化温度|纵向回缩率',
        specimens: [
          { id: 's1', specimenId: 'SCZN202508/0009-0101', checked: true },
          { id: 's2', specimenId: 'SCZN202508/0009-0102', checked: true },
          { id: 's3', specimenId: 'SCZN202508/0009-0103', checked: false }
        ]
      }
    ];

    var reportFiles = [
      { id: 1, reportNo: 'BGSCZN2025080009-001', specimenIds: ['SCZN202508/0009-0101'], fileName: '报告名称.docx', createdAt: '2026-07-17 10:00', modifiedAt: '2026-07-17 10:00' },
      { id: 2, reportNo: 'BGSCZN2025080009-002', specimenIds: ['SCZN202508/0009-0102', 'SCZN202508/0009-0103'], fileName: '报告名称1.docx', createdAt: '2026-07-17 11:30', modifiedAt: '2026-07-17 11:30' }
    ];
    var reportFileNextId = 3;
    var modalSelectedVariants = {};

    function renderSampleGroups() {
      var annotateFlags = { group: false, pickAll: false, table: false };
      var html = SAMPLE_GROUPS.map(function (group) {
        var rows = group.specimens.map(function (sp) {
          return '<tr class="hover:bg-slate-50">' +
            '<td class="border border-slate-200 px-3 py-2"><input type="checkbox" class="specimen-check" data-group="' + group.id + '" data-id="' + sp.id + '" ' + (sp.checked ? 'checked' : '') + ' onchange="onSpecimenCheckChange()" /></td>' +
            '<td class="border border-slate-200 px-3 py-2">' + sp.specimenId + '</td>' +
            '<td class="border border-slate-200 px-3 py-2 specimen-tests">' + group.tests + '</td></tr>';
        }).join('');

        var groupAnnotate = !annotateFlags.group ? ' data-annotate="sample-group"' : '';
        if (!annotateFlags.group) annotateFlags.group = true;
        var pickAllAnnotate = !annotateFlags.pickAll ? ' data-annotate="pick-all-tests"' : '';
        if (!annotateFlags.pickAll) annotateFlags.pickAll = true;
        var tableAnnotate = !annotateFlags.table ? ' data-annotate="specimen-table"' : '';
        if (!annotateFlags.table) annotateFlags.table = true;

        return '<div class="sample-group" data-group-id="' + group.id + '"' + groupAnnotate + '>' +
          '<div class="sample-group-title">样品信息</div>' +
          '<div class="info-grid mb-4">' +
          '<div><span class="lbl">样品名称：</span><span class="val">' + group.name + '</span></div>' +
          '<div><span class="lbl">型号：</span><span class="val">' + group.model + '</span></div>' +
          '<div class="col-span-2" data-annotate="product-mark"><span class="lbl">产品标识：</span><span class="val">' + group.marking + '</span></div>' +
          '<div><span class="lbl">检测类别：</span><span class="val">' + group.inspectCategory + '</span></div>' +
          '<div><span class="lbl">样品数量：</span><span class="val">' + group.qty + '</span></div>' +
          '<div><span class="lbl">样品单位：</span><span class="val">' + group.unit + '</span></div>' +
          '<div><span class="lbl">生产厂家：</span><span class="val">' + group.manufacturer + '</span></div>' +
          '<div><span class="lbl">厂家地址：</span><span class="val">' + group.mfgAddress + '</span></div>' +
          '<div><span class="lbl">厂家产地：</span><span class="val">' + group.mfgOrigin + '</span></div>' +
          '<div class="col-span-2"><span class="lbl">备注：</span><span class="val">' + group.remark + '</span></div>' +
          '</div>' +
          '<div class="pick-all-row"' + pickAllAnnotate + '><label class="inline-flex items-center gap-2 cursor-pointer">' +
          '<input type="checkbox" class="group-check-all" data-group="' + group.id + '" onchange="toggleGroupAll(\'' + group.id + '\', this.checked)" /> 勾选全部样品所有检测项目</label></div>' +
          '<div class="overflow-x-auto"' + tableAnnotate + '><table class="w-full min-w-[700px] border-collapse text-left text-sm">' +
          '<thead><tr class="bg-slate-100 text-slate-600">' +
          '<th class="border border-slate-200 px-3 py-2 w-10"></th>' +
          '<th class="border border-slate-200 px-3 py-2 font-medium">样品编号</th>' +
          '<th class="border border-slate-200 px-3 py-2 font-medium">检测项目</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div></div>';
      }).join('');
      document.getElementById('sampleGroupsContainer').innerHTML = html;
      SAMPLE_GROUPS.forEach(function (g) { syncGroupCheckAll(g.id); });
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function getCheckedSpecimens() {
      var result = [];
      SAMPLE_GROUPS.forEach(function (group) {
        group.specimens.forEach(function (sp) {
          var el = document.querySelector('.specimen-check[data-group="' + group.id + '"][data-id="' + sp.id + '"]');
          if (el && el.checked) {
            result.push({
              id: sp.id,
              specimenId: sp.specimenId,
              templateKey: group.templateKey,
              name: group.name,
              model: group.model,
              category: group.category,
              categoryPath: group.categoryPath,
              groupId: group.id
            });
          }
        });
      });
      return result;
    }

    function resolveDefaultExportMode(checked) {
      if (!checked || !checked.length) return 'specimen-each';
      var first = checked[0];
      var sampleMeta = { name: first.name, model: first.model, category: first.category, categoryPath: first.categoryPath };
      return ReportExport.resolveReportExportMode(sampleMeta, REPORT_EXPORT_RULES).modeKey;
    }

    function onSpecimenCheckChange() {
      SAMPLE_GROUPS.forEach(function (g) { syncGroupCheckAll(g.id); });
    }

    function toggleGroupAll(groupId, checked) {
      document.querySelectorAll('.specimen-check[data-group="' + groupId + '"]').forEach(function (el) { el.checked = checked; });
      onSpecimenCheckChange();
    }

    function syncGroupCheckAll(groupId) {
      var boxes = document.querySelectorAll('.specimen-check[data-group="' + groupId + '"]');
      var all = boxes.length && Array.prototype.every.call(boxes, function (b) { return b.checked; });
      var master = document.querySelector('.group-check-all[data-group="' + groupId + '"]');
      if (master) master.checked = all;
    }

    function openGenerateModal() {
      var checked = getCheckedSpecimens();
      if (!checked.length) { alert('请至少勾选一个试样'); return; }
      document.getElementById('modalCheckedCount').textContent = String(checked.length);

      var exportMode = resolveDefaultExportMode(checked);
      document.getElementById('modalExportModes').innerHTML = ReportExport.REPORT_EXPORT_MODES.map(function (m) {
        return '<label class="flex items-center gap-2"><input type="radio" name="modalExportMode" value="' + m.key + '" ' +
          (m.key === exportMode ? 'checked' : '') + ' onchange="updateModalPreview()" /> ' + m.label + '</label>';
      }).join('');

      var templateKeys = {};
      checked.forEach(function (s) { templateKeys[s.templateKey] = true; });
      modalSelectedVariants = {};
      var blocks = '';
      Object.keys(templateKeys).forEach(function (key) {
        var variants = ReportExport.getVariantsForModel(TEMPLATE_INDEX, key);
        var def = ReportExport.getDefaultVariant(TEMPLATE_INDEX, key);
        modalSelectedVariants[key] = def ? def.id : '';
        var sampleLabel = checked.filter(function (c) { return c.templateKey === key; })[0];
        var label = sampleLabel.name + (sampleLabel.model ? ' - ' + sampleLabel.model : '');
        blocks += '<div class="rounded border border-slate-200 p-3"><div class="mb-2 text-slate-600">' + label + '</div>' +
          '<select class="w-full rounded border border-slate-300 px-3 py-2" data-template-key="' + key + '" onchange="onModalVariantChange(this)">' +
          variants.map(function (v) {
            return '<option value="' + v.id + '"' + (def && v.id === def.id ? ' selected' : '') + '>' + v.name + (v.isDefault ? '（默认）' : '') + '</option>';
          }).join('') + '</select></div>';
      });
      document.getElementById('modalVariantBlocks').innerHTML = blocks;
      updateModalPreview();

      var modal = document.getElementById('generateModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeGenerateModal() {
      document.getElementById('generateModal').classList.add('hidden');
      document.getElementById('generateModal').classList.remove('flex');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function onModalVariantChange(sel) {
      modalSelectedVariants[sel.getAttribute('data-template-key')] = sel.value;
      updateModalPreview();
    }

    function getModalExportMode() {
      var el = document.querySelector('input[name="modalExportMode"]:checked');
      return el ? el.value : resolveDefaultExportMode(getCheckedSpecimens());
    }

    function updateModalPreview() {
      var files = ReportExport.buildReportFilePreview(ENTRUST_CODE, getCheckedSpecimens(), getModalExportMode(), modalSelectedVariants, TEMPLATE_INDEX);
      document.getElementById('modalPreviewCount').textContent = String(files.length);
    }

    function confirmGenerate() {
      var checked = getCheckedSpecimens();
      var exportMode = getModalExportMode();
      var files = ReportExport.buildReportFilePreview(ENTRUST_CODE, checked, exportMode, modalSelectedVariants, TEMPLATE_INDEX);
      var blocked = files.filter(function (f) { return f.status === 'missing-template'; });
      if (blocked.length) { alert(blocked[0].statusMessage); return; }

      var now = new Date();
      var ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      files.forEach(function (f) {
        reportFiles.unshift({
          id: reportFileNextId++,
          reportNo: 'BG' + ENTRUST_CODE.replace(/\//g, '') + '-' + String(reportFileNextId).padStart(3, '0'),
          specimenIds: f.specimenIds,
          fileName: f.fileName,
          createdAt: ts,
          modifiedAt: ts
        });
      });

      renderReportFiles();
      closeGenerateModal();
      alert('已生成 ' + files.length + ' 份报告（原型演示）');
    }

    function renderReportFiles() {
      var tbody = document.getElementById('reportFileBody');
      if (!reportFiles.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="border border-slate-200 px-3 py-6 text-center text-slate-400">暂无报告，请勾选试样后生成</td></tr>';
        return;
      }
      tbody.innerHTML = reportFiles.map(function (row, i) {
        var spec = row.specimenIds.length > 1 ? row.specimenIds.join('、') : (row.specimenIds[0] || '—');
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.reportNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + spec + '</td>' +
          '<td class="border border-slate-200 px-3 py-2"><a href="#" class="text-blue-600 hover:underline" onclick="return false;">' + row.fileName + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + row.createdAt + '</td>' +
          '<td class="border border-slate-200 px-3 py-2" id="modTime-' + row.id + '">' + row.modifiedAt + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' +
          '<button class="text-blue-600 hover:underline" onclick="addReportImage(' + row.id + ')">添加报告图片</button> ' +
          '<button class="ml-2 text-blue-600 hover:underline" onclick="exportPdf(' + row.id + ')">导出 pdf</button></td></tr>';
      }).join('');
    }

    function addReportImage(id) {
      alert('打开 PageOffice 弹窗，手动复制粘贴报告图片（原型演示）');
      var now = new Date();
      var ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      var row = reportFiles.filter(function (r) { return r.id === id; })[0];
      if (row) {
        row.modifiedAt = ts;
        var cell = document.getElementById('modTime-' + id);
        if (cell) cell.textContent = ts;
      }
    }

    function exportPdf(id) {
      var row = reportFiles.filter(function (r) { return r.id === id; })[0];
      alert('导出 PDF：' + (row ? row.fileName.replace('.docx', '.pdf') : '') + '（原型演示）');
    }

    renderSampleGroups();
    renderReportFiles();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({
        annotations: [
          {
            id: 'rc-tab-detect',
            selector: '[data-annotate="tab-detect"]',
            position: 'bottom',
            title: '检测信息',
            content: '<strong>需求逻辑：</strong>报告编制的第一步是确定「本次给哪些试样出报告」，因此进入页面默认停在本 Tab；样品信息只读，唯一可操作的是试样勾选。<br>' +
            '<strong>展示规则：</strong>Tab 名「检测信息」，其下按样品组展开：只读样品信息块 + 试样勾选表；本 Tab 不提供任何字段编辑控件。<br>' +
            '<strong>交互逻辑：</strong>切换 Tab 不丢已勾选状态；勾选结果是「生成报告」的唯一输入，未勾选时生成按钮不可用。',
            tag: '检测信息'
          },
          {
            id: 'rc-pick-detect',
            selector: '[data-annotate="pick-detect-info"]',
            position: 'top-left',
            title: '选取检测信息',
            wide: true,
            content: '<strong>需求逻辑：</strong>报告以「样品名称(型号)」为单位产出，分组边界必须与委托收样的样品分组一致，避免一份报告混装不同型号。<br>' +
            '<strong>展示规则：</strong>按样品名称(型号)分组，每组含只读「样品信息」与该组试样勾选表；导出方式不在这里配置，放在点「生成报告」后的确认弹窗。<br>' +
            '<strong>交互逻辑：</strong>各组勾选互不影响；至少一个组有勾选才能生成报告。',
            tag: '检测信息'
          },
          {
            id: 'rc-sample-group',
            selector: '[data-annotate="sample-group"]',
            position: 'top-right',
            title: '样品信息（只读）',
            wide: true,
