<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大类管理 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 11px; cursor: pointer; transition: .2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .toggle input:checked + .toggle-slider { background: #2563eb; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
    .modal-mask { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); padding: 16px; }
    .modal-mask.open { display: flex; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      大类管理
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4 space-y-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-2 gap-3 xl:grid-cols-6">
        <div class="flex items-center gap-2"><label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">大类名称</label><input id="f_name" class="min-w-0 flex-1 rounded border border-slate-300 px-2 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="请输入大类名称" /></div>
        <div class="flex items-center gap-2"><label class="w-16 flex-shrink-0 text-right text-sm text-slate-600">编号</label><input id="f_code" class="min-w-0 flex-1 rounded border border-slate-300 px-2 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="请输入编号" /></div>
        <div class="flex items-center gap-2"><label class="w-16 flex-shrink-0 text-right text-sm text-slate-600">状态</label><select id="f_status" class="min-w-0 flex-1 rounded border border-slate-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-blue-500"><option value="">请选择状态</option><option value="1">启用</option><option value="0">停用</option></select></div>
        <div class="flex items-center gap-2"><label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">创建人员</label><input id="f_creator" class="min-w-0 flex-1 rounded border border-slate-300 px-2 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="请输入创建人员" /></div>
        <div class="flex items-center gap-2"><label class="w-20 flex-shrink-0 text-right text-sm text-slate-600">创建时间</label><input id="f_date" class="min-w-0 flex-1 rounded border border-slate-300 px-2 py-1.5 text-sm outline-none focus:border-blue-500" placeholder="开始 ~ 结束" /></div>
        <div class="flex items-center justify-end gap-2">
          <button onclick="renderTable()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i> 查询</button>
          <button onclick="resetFilter()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
        </div>
      </div>
    </div>

    <div class="rounded bg-white p-4 shadow-sm">
      <div class="mb-3"><button onclick="openModal()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-plus"></i> 新增</button></div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[900px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-600">
              <th class="whitespace-nowrap border border-slate-200 px-3 py-2 font-medium w-16">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">大类名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-24">状态</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">备注</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">创建时间</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">创建人员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-32">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <select class="rounded border border-slate-200 px-2 py-1 text-sm"><option>50条/页</option></select>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal-mask">
    <div class="w-[480px] max-w-full rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <h3 id="modalTitle" class="text-base font-medium">添加大类</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="space-y-4 px-5 py-4 text-sm">
        <div class="flex items-center gap-3"><label class="w-24 text-right text-slate-600"><span class="text-red-500">*</span> 大类名称</label><input id="m_name" class="flex-1 rounded border border-slate-300 px-3 py-1.5 outline-none focus:border-blue-500" placeholder="请输入" /></div>
        <div class="flex items-center gap-3"><label class="w-24 text-right text-slate-600">编号</label><input id="m_code" class="flex-1 rounded border border-slate-300 px-3 py-1.5 outline-none focus:border-blue-500" placeholder="请输入" /></div>
        <div class="flex items-center gap-3"><label class="w-24 text-right text-slate-600"><span class="text-red-500">*</span> 状态</label><label class="toggle"><input type="checkbox" id="m_status" checked /><span class="toggle-slider"></span></label></div>
        <div class="flex items-center gap-3"><label class="w-24 text-right text-slate-600"><span class="text-red-500">*</span> 排序</label><input id="m_sort" type="number" class="flex-1 rounded border border-slate-300 px-3 py-1.5 outline-none focus:border-blue-500" value="1" /></div>
        <div class="flex items-start gap-3"><label class="w-24 pt-2 text-right text-slate-600">封面图片</label><div class="flex h-24 w-24 cursor-pointer items-center justify-center rounded border border-dashed border-slate-300 bg-slate-50 text-2xl text-slate-400" onclick="alert('上传封面（原型演示）')">+</div></div>
        <div class="flex items-start gap-3"><label class="w-24 pt-2 text-right text-slate-600">备注</label><textarea id="m_remark" rows="3" class="flex-1 rounded border border-slate-300 px-3 py-1.5 outline-none focus:border-blue-500" placeholder="请输入"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-3">
        <button onclick="closeModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm">取消</button>
        <button onclick="saveModal()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white">确定</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var DATA = [
      { id: 1, name: '电力物资类', code: 'DLWZ', enabled: true, remark: '', time: '2026-05-05 17:21:00', creator: 'admin', sort: 1 },
      { id: 2, name: '安全工器具类', code: 'AQGQJ', enabled: true, remark: '', time: '2026-05-05 17:21:20', creator: 'admin', sort: 2 },
      { id: 3, name: '环境检测', code: 'HJJC', enabled: true, remark: '环境检测', time: '2026-05-05 17:21:38', creator: 'admin', sort: 3 },
      { id: 4, name: '工程检测', code: 'SN', enabled: true, remark: '', time: '2026-05-05 17:22:03', creator: 'admin', sort: 4 }
    ];
    var editingId = null;

    function getFiltered() {
      var name = document.getElementById('f_name').value.trim();
      var code = document.getElementById('f_code').value.trim();
      var status = document.getElementById('f_status').value;
      var creator = document.getElementById('f_creator').value.trim();
      return DATA.filter(function (d) {
        if (name && !d.name.includes(name)) return false;
        if (code && !d.code.includes(code)) return false;
        if (status === '1' && !d.enabled) return false;
        if (status === '0' && d.enabled) return false;
        if (creator && !d.creator.includes(creator)) return false;
        return true;
      });
    }

    function renderTable() {
      var rows = getFiltered();
      document.getElementById('tableBody').innerHTML = rows.map(function (d, i) {
        return '<tr class="hover:bg-slate-50"><td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.code + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><label class="toggle"><input type="checkbox" ' + (d.enabled ? 'checked' : '') + ' onchange="toggleStatus(' + d.id + ', this.checked)" /><span class="toggle-slider"></span></label></td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (d.remark || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap">' + d.time + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + d.creator + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 whitespace-nowrap"><button onclick="openModal(' + d.id + ')" class="text-blue-600 hover:underline">编辑</button> <button onclick="removeRow(' + d.id + ')" class="ml-2 text-red-500 hover:underline">删除</button></td></tr>';
      }).join('');
      document.getElementById('totalText').textContent = '共 ' + rows.length + ' 条';
    }

    function resetFilter() {
      ['f_name', 'f_code', 'f_creator', 'f_date'].forEach(function (id) { document.getElementById(id).value = ''; });
      document.getElementById('f_status').value = '';
      renderTable();
    }

    function toggleStatus(id, checked) {
      var row = DATA.find(function (d) { return d.id === id; });
      if (row) row.enabled = checked;
    }

    function openModal(id) {
      editingId = id || null;
      document.getElementById('modalTitle').textContent = id ? '编辑大类' : '添加大类';
      var row = id ? DATA.find(function (d) { return d.id === id; }) : null;
      document.getElementById('m_name').value = row ? row.name : '';
      document.getElementById('m_code').value = row ? row.code : '';
      document.getElementById('m_status').checked = row ? row.enabled : true;
      document.getElementById('m_sort').value = row ? row.sort : (DATA.length + 1);
      document.getElementById('m_remark').value = row ? row.remark : '';
      document.getElementById('editModal').classList.add('open');
    }

    function closeModal() { document.getElementById('editModal').classList.remove('open'); }

    function saveModal() {
      var name = document.getElementById('m_name').value.trim();
      if (!name) { alert('请输入大类名称'); return; }
      if (editingId) {
        var row = DATA.find(function (d) { return d.id === editingId; });
        row.name = name;
        row.code = document.getElementById('m_code').value.trim();
        row.enabled = document.getElementById('m_status').checked;
        row.sort = parseInt(document.getElementById('m_sort').value, 10) || 1;
        row.remark = document.getElementById('m_remark').value.trim();
      } else {
        DATA.push({
          id: Date.now(), name: name, code: document.getElementById('m_code').value.trim(),
          enabled: document.getElementById('m_status').checked, remark: document.getElementById('m_remark').value.trim(),
          time: '2026-07-14 09:00:00', creator: 'admin', sort: parseInt(document.getElementById('m_sort').value, 10) || 1
        });
      }
      closeModal();
      renderTable();
    }

    function removeRow(id) {
      if (!confirm('确定删除该大类？')) return;
      DATA = DATA.filter(function (d) { return d.id !== id; });
      renderTable();
    }

    document.getElementById('editModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    renderTable();
  </script>
  <script src="js/modal-drag.js"></script>
  <script src="js/message-store.js" defer></script>
  <script src="js/message-center.js" defer></script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
