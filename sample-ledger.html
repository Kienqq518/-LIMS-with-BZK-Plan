<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品台账 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .st { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; }
    .st-wait { background: #eff6ff; color: #2563eb; }
    .st-run { background: #fff7ed; color: #c2410c; }
    .st-ok { background: #dcfce7; color: #15803d; }
    .st-ng { background: #fef2f2; color: #b91c1c; }
    .st-exp { background: #f1f5f9; color: #475569; }
    .st-keep { background: #ecfeff; color: #0e7490; }
    .st-done { background: #f1f5f9; color: #475569; }
    .st-back { background: #fff7ed; color: #c2410c; }
    .overdue-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #fef2f2; color: #b91c1c; font-size: 11px; line-height: 16px; }
    .op-link { color: #2563eb; white-space: nowrap; }
    .op-link:hover { text-decoration: underline; }
    .back-tag { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 3px; background: #fff7ed; color: #c2410c; font-size: 11px; line-height: 16px; }
    .ms-dropdown { position: relative; flex: 1; min-width: 0; }
    .ms-trigger {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; font-size: 14px; line-height: 1.5;
      background: #fff; color: #334155; cursor: pointer; text-align: left;
    }
    .ms-trigger:hover { border-color: #94a3b8; }
    .ms-dropdown.open .ms-trigger { border-color: #3b82f6; }
    .ms-trigger-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-trigger-text.is-placeholder { color: #94a3b8; }
    .ms-caret { color: #94a3b8; font-size: 12px; flex-shrink: 0; }
    .ms-panel {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40;
      max-height: 320px; overflow-y: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 4px;
      box-shadow: 0 8px 24px rgba(15,23,42,.12);
    }
    .ms-dropdown.open .ms-panel { display: block; }
    .ms-option { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; color: #334155; cursor: pointer; }
    .ms-option:hover { background: #f8fafc; }
    .ms-option input { flex-shrink: 0; }
    tbody tr:hover td { background: #f8fafc; }
    #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 9999; background: rgba(0,0,0,.76); color: #fff; padding: 8px 22px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      样品台账
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div id="noPerm" class="hidden p-4">
    <div class="rounded bg-white p-10 text-center shadow-sm">
      <i class="fa fa-lock mb-3 text-3xl text-slate-300"></i>
      <p class="text-sm text-slate-600">当前角色没有「样品台账」页面权限，无法查看样品全库台账。</p>
      <p id="noPermWho" class="mt-1 text-xs text-slate-400"></p>
      <a href="role-mgmt.html" class="mt-4 inline-block rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">去「角色管理」看权限怎么勾</a>
    </div>
  </div>

  <div id="mainWrap" class="p-4">
    <div class="rounded bg-white p-4 shadow-sm" data-annotate="ledger-query">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input id="q_code" type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品编号</label>
          <input id="q_no" type="text" placeholder="扫码枪或粘贴后回车" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" data-annotate="ledger-scan" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input id="q_name" type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input id="q_customer" type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 xl:col-span-2" data-annotate="ledger-dates">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">日期范围</label>
          <select id="q_dateKind" class="w-28 flex-shrink-0 rounded border border-slate-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-blue-500">
            <option value="order">委托日期</option>
            <option value="receive">收样日期</option>
          </select>
          <input id="q_from" type="date" class="flex-1 min-w-0 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" title="开始日期" />
          <span class="text-slate-400">~</span>
          <input id="q_to" type="date" class="flex-1 min-w-0 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" title="结束日期" />
        </div>
        <div class="flex items-center gap-2" data-annotate="ledger-nodes">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">当前节点</label>
          <div class="ms-dropdown" id="q_nodes">
            <button type="button" class="ms-trigger" id="q_nodes_btn">
              <span class="ms-trigger-text is-placeholder" id="q_nodes_text">请选择当前节点</span>
              <i class="fa fa-angle-down ms-caret"></i>
            </button>
            <div class="ms-panel" id="q_nodes_panel"></div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">流转状态</label>
          <select id="q_status" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500">
            <option value="">全部</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">检测结果</label>
          <select id="q_result" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500">
            <option value="">全部</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="w-28 flex-shrink-0 text-right text-sm text-slate-600">检测时效</label>
          <select id="q_time" class="flex-1 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-blue-500">
            <option value="">全部</option>
            <option>未逾期</option>
            <option>逾期</option>
          </select>
        </div>
        <div class="flex items-center gap-2 xl:col-span-4 xl:justify-end">
          <button type="button" onclick="doSearch()" class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button type="button" onclick="doReset()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
          <button type="button" onclick="doExport()" class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-download"></i>导出</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1280px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="whitespace-nowrap border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="whitespace-nowrap border border-slate-200 px-3 py-2 font-medium">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">流转状态</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">检测结果</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">当前节点</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">收样日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">要求完成日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品大类</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <p id="emptyBox" class="hidden py-10 text-center text-sm text-slate-400">没有匹配的样品。请核对样品编号，或缩短委托号 / 名称 / 客户关键词。</p>
      <div class="mt-4 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="totalText">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>50条/页</option></select>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="js/tab-bar.js"></script>
  <script src="js/web-perms.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-ledger-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    (function () {
      if (window.WebPerms && !WebPerms.can('样品台账')) {
        document.getElementById('mainWrap').classList.add('hidden');
        document.getElementById('noPerm').classList.remove('hidden');
        var role = WebPerms.current();
        document.getElementById('noPermWho').textContent = '当前登录角色：' + role.name + '（' + role.desc + '）';
        return;
      }

      var L = window.SampleLedger;
      var selectedNodes = [];
      var lastRows = [];

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
      }
      function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function () { el.classList.remove('show'); }, 1800);
      }
      function flowClass(st) {
        if (st === '留样' || st === '已完成') return 'st st-ok';
        if (st === '在检') return 'st st-run';
        if (st === '待审核') return 'st st-wait';
        if (st === '已处置') return 'st st-done';
        if (st === '退回') return 'st st-back';
        if (st === '待检') return 'st st-keep';
        return 'st st-wait';
      }
      function resultClass(st) {
        if (st === '合格') return 'st st-ok';
        if (st === '不合格') return 'st st-ng';
        if (st === '已过期') return 'st st-exp';
        return '';
      }
      function catOf(name) {
        return (window.SampleDataStore && SampleDataStore.catLabelOfNames(name)) || '—';
      }
      function paintNodes() {
        var text = document.getElementById('q_nodes_text');
        if (!selectedNodes.length) {
          text.textContent = '请选择当前节点';
          text.classList.add('is-placeholder');
        } else {
          text.textContent = selectedNodes.join('、');
          text.classList.remove('is-placeholder');
        }
        [].slice.call(document.querySelectorAll('#q_nodes_panel input[type="checkbox"]')).forEach(function (box) {
          box.checked = selectedNodes.indexOf(box.value) >= 0;
        });
      }
      function setNodes(list) {
        selectedNodes = (list || []).filter(Boolean);
        paintNodes();
      }

      function readForm() {
        var from = document.getElementById('q_from').value;
        var to = document.getElementById('q_to').value;
        if (from && to && from > to) { var tmp = from; from = to; to = tmp; }
        return {
          code: document.getElementById('q_code').value,
          sampleNo: document.getElementById('q_no').value,
          name: document.getElementById('q_name').value,
          customer: document.getElementById('q_customer').value,
          dateKind: document.getElementById('q_dateKind').value,
          from: from,
          to: to,
          nodes: selectedNodes.slice(),
          status: document.getElementById('q_status').value,
          result: document.getElementById('q_result').value,
          timeliness: document.getElementById('q_time').value
        };
      }
      function writeForm(q) {
        q = q || {};
        document.getElementById('q_code').value = q.code || '';
        document.getElementById('q_no').value = q.sampleNo || '';
        document.getElementById('q_name').value = q.name || '';
        document.getElementById('q_customer').value = q.customer || '';
        document.getElementById('q_dateKind').value = q.dateKind || 'order';
        document.getElementById('q_from').value = q.from || '';
        document.getElementById('q_to').value = q.to || '';
        document.getElementById('q_status').value = q.status || '';
        if (document.getElementById('q_status').value === '全部') document.getElementById('q_status').value = '';
        document.getElementById('q_result').value = q.result || '';
        document.getElementById('q_time').value = q.timeliness || '';
        var nodes = q.nodes;
        if (!nodes && q.node) nodes = Array.isArray(q.node) ? q.node : [q.node];
        setNodes(nodes || []);
      }
      function persist(extra) {
        var q = readForm();
        if (extra) Object.keys(extra).forEach(function (k) { q[k] = extra[k]; });
        L.persistQuery(q);
      }

      function flowHtml(s) {
        var st = L.flowStatus(s);
        return '<span class="' + flowClass(st) + '">' + esc(st) + '</span>';
      }
      function resultHtml(s) {
        var st = L.resultLabel(s);
        if (st === '/') return '<span class="text-slate-400">/</span>';
        var cls = resultClass(st);
        if (st === '合格') {
          return '<a class="' + cls + '" href="cert-print-single.html?code=' + encodeURIComponent(s.code) + '">' + esc(st) + '</a>';
        }
        return '<span class="' + cls + '">' + esc(st) + '</span>';
      }

      window.renderTable = function renderTable() {
        var q = readForm();
        lastRows = L.query(q);
        persist({ scrollY: window.scrollY || 0 });
        var body = document.getElementById('tableBody');
        var emptyBox = document.getElementById('emptyBox');
        if (!lastRows.length) {
          body.innerHTML = '';
          emptyBox.classList.remove('hidden');
          document.getElementById('totalText').textContent = '共 0 条';
          if (window.ColumnConfig && ColumnConfig.refresh) ColumnConfig.refresh();
          return;
        }
        emptyBox.classList.add('hidden');
        body.innerHTML = lastRows.map(function (s, i) {
          var node = L.taskNode(s);
          var back = L.hasBack(s) ? '<span class="back-tag">含回退</span>' : '';
          var overdue = L.signOverdue(s);
          var overdueTag = overdue.overdue ? '<span class="overdue-tag">' + esc(overdue.text) + '</span>' : '';
          var printHref = 'label-print-preview.html?nos=' + encodeURIComponent(s.sampleNo) + '&code=' + encodeURIComponent(s.code) + '&from=ledger';
          return '<tr>' +
            '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
            '<td class="whitespace-nowrap border border-slate-200 px-3 py-2"><a class="text-blue-600 hover:underline" href="sample-ledger-detail.html?no=' + encodeURIComponent(s.sampleNo) + '">' + esc(s.sampleNo) + '</a>' + overdueTag + '</td>' +
            '<td class="whitespace-nowrap border border-slate-200 px-3 py-2"><a class="text-blue-600 hover:underline" href="entrust-detail.html?code=' + encodeURIComponent(s.code) + '">' + esc(s.code) + '</a></td>' +
            '<td class="border border-slate-200 px-3 py-2">' + esc(s.name) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + flowHtml(s) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + resultHtml(s) + '</td>' +
            '<td class="whitespace-nowrap border border-slate-200 px-3 py-2">' + esc(node) + back + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + esc(s.orderDate) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + esc(s.receivedAt) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + esc(s.due) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2" data-cat-col>' + esc(catOf(s.name)) + '</td>' +
            '<td class="border border-slate-200 px-3 py-2">' + esc(s.customer) + '</td>' +
            '<td class="whitespace-nowrap border border-slate-200 px-3 py-2">' +
              '<a class="op-link" href="sample-ledger-detail.html?no=' + encodeURIComponent(s.sampleNo) + '">查看</a>' +
              '<span class="px-1 text-slate-300">|</span>' +
              '<a class="op-link" href="' + printHref + '">打印标签</a>' +
            '</td>' +
            '</tr>';
        }).join('');
        document.getElementById('totalText').textContent = '共 ' + lastRows.length + ' 条';
        if (window.ColumnConfig && ColumnConfig.refresh) ColumnConfig.refresh();
        if (window.SampleCatFilter && SampleCatFilter.apply) SampleCatFilter.apply();
      };

      window.doSearch = function () { renderTable(); };
      window.doReset = function () {
        writeForm({});
        var cat = document.getElementById('qSampleCat');
        if (cat) cat.value = '';
        L.persistQuery({});
        renderTable();
      };
      window.doExport = function () {
        var rows = L.query(readForm());
        var catSel = document.getElementById('qSampleCat');
        var want = catSel ? catSel.value : '';
        if (want) {
          rows = rows.filter(function (s) { return catOf(s.name) === want; });
        }
        if (!rows.length) { toast('没有可导出的样品'); return; }
        var lines = [['样品编号', '委托编号', '样品名称', '流转状态', '检测结果', '当前节点', '委托日期', '收样日期', '要求完成日期', '样品大类', '客户单位']];
        rows.forEach(function (s) {
          lines.push([s.sampleNo, s.code, s.name, L.flowStatus(s), L.resultLabel(s), L.taskNode(s), s.orderDate, s.receivedAt, s.due, catOf(s.name), s.customer]);
        });
        var csv = '\ufeff' + lines.map(function (r) {
          return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
        }).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = '样品台账.csv';
        a.click();
        toast('已导出当前筛选结果 ' + rows.length + ' 条');
      };

      document.getElementById('q_status').innerHTML = '<option value="">全部</option>' + L.LIST_FILTERS.map(function (n) {
        return '<option>' + n + '</option>';
      }).join('');
      document.getElementById('q_result').innerHTML = '<option value="">全部</option>' + L.RESULT_FILTERS.map(function (n) {
        return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
      }).join('');
      document.getElementById('q_nodes_panel').innerHTML = L.FLOW_NODES.map(function (n) {
        return '<label class="ms-option"><input type="checkbox" value="' + esc(n) + '" /><span>' + esc(n) + '</span></label>';
      }).join('');

      var nodeDrop = document.getElementById('q_nodes');
      document.getElementById('q_nodes_btn').addEventListener('click', function (e) {
        e.stopPropagation();
        nodeDrop.classList.toggle('open');
      });
      document.getElementById('q_nodes_panel').addEventListener('change', function () {
        selectedNodes = [].slice.call(document.querySelectorAll('#q_nodes_panel input:checked')).map(function (box) { return box.value; });
        paintNodes();
      });
      document.addEventListener('click', function (e) {
        if (!nodeDrop.contains(e.target)) nodeDrop.classList.remove('open');
      });

      document.getElementById('q_no').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
      });
      ['q_code', 'q_name', 'q_customer'].forEach(function (id) {
        document.getElementById(id).addEventListener('keydown', function (e) {
          if (e.key === 'Enter') doSearch();
        });
      });

      var saved = L.loadQuery();
      var urlCode = new URLSearchParams(location.search).get('code') || '';
      if (urlCode) saved.code = urlCode;
      writeForm(saved);
      renderTable();
      if (saved.scrollY) window.scrollTo(0, saved.scrollY);

      window.addEventListener('beforeunload', function () { persist({ scrollY: window.scrollY || 0 }); });

      if (window.PrototypeAnnotation) {
        PrototypeAnnotation.init({
          annotations: [
            {
              id: 'ledger-query', selector: '[data-annotate="ledger-query"]', position: 'bottom-left', wide: true, tag: '样品台账',
              title: '全库样品查询',
              content: '<strong>需求逻辑：</strong>样品台账是样品管理的只读全库查询，一行一件样品，不替代收样 / 发样 / 还样 / 退样。<br>' +
                '<strong>展示规则：</strong>查询区为 Web 端下拉与输入。日期范围可自选开始、结束日期，按委托日期或收样日期过滤。名单固定按样品编号倒序。导出只出当前筛选结果。<br>' +
                '<strong>交互逻辑：</strong>查询条件写入 sessionStorage，从详情返回时原样还原。'
            },
            {
              id: 'ledger-scan', selector: '[data-annotate="ledger-scan"]', position: 'bottom-left', tag: '样品台账',
              title: '样品编号回车即查',
              content: '<strong>需求逻辑：</strong>Web 不做相机扫码，样品编号框接收扫码枪或粘贴标签号。<br>' +
                '<strong>交互逻辑：</strong>在样品编号框按回车等同点查询。'
            },
            {
              id: 'ledger-nodes', selector: '[data-annotate="ledger-nodes"]', position: 'bottom-left', tag: '样品台账',
              title: '当前节点可多选',
              content: '<strong>交互逻辑：</strong>当前节点是勾选下拉，选项为委托登记到任务完成的全部流程节点。不选表示全部节点。'
            }
          ]
        });
      }
    })();
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
