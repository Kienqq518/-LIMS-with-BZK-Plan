<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI报告审核面板 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88); --line: rgba(20,60,154,.12); --ink: #1e2a44;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08); border-radius: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }
    .kpi { min-width: 0; }
    .kpi .n { font-size: 18px; font-weight: 700; color: var(--brand); line-height: 1.1; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
    .seg button { padding: 4px 12px; font-size: 12px; color: #64748b; }
    .seg button.is-on { background: var(--brand); color: #fff; font-weight: 600; }
    .list-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .list-tab { position: relative; padding: 10px 16px; font-size: 13px; color: #64748b; background: transparent; }
    .list-tab .n { margin-left: 6px; font-size: 11px; font-weight: 600; color: #94a3b8; }
    .list-tab.is-on { color: var(--brand); font-weight: 700; }
    .list-tab.is-on .n { color: var(--brand); }
    .list-tab.is-on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--brand); border-radius: 2px; }
    .ai-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; border: 1px solid; background: #fff; padding: 1px 7px 1px 5px; font-size: 11px; font-weight: 600; }
    .ai-chip .ai-mark { font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 3px; color: #fff; }
    .ai-pass { color: #047857; border-color: #6ee7b7; } .ai-pass .ai-mark { background: #059669; }
    .ai-warn { color: #b45309; border-color: #fcd34d; } .ai-warn .ai-mark { background: #d97706; }
    .ai-fail { color: #b91c1c; border-color: #fca5a5; } .ai-fail .ai-mark { background: #dc2626; }
    .ai-run { color: #1d4ed8; border-color: #93c5fd; } .ai-run .ai-mark { background: #2563eb; }
    .roster { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .roster th { position: sticky; top: 0; z-index: 1; background: #f8fafc; color: #64748b; font-weight: 600; text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
    .roster td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .roster tbody tr { cursor: pointer; }
    .roster tbody tr:hover { background: #f8fafc; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 4px; }
    .hbar { height: 8px; border-radius: 99px; background: #eef2ff; overflow: hidden; }
    .hbar > span { display: block; height: 100%; border-radius: 99px; background: #d97706; }
  </style>
</head>
<body class="text-slate-700">

  <div class="flex h-screen flex-col overflow-hidden">
    <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="dashboard.html">
      <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
      <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
        AI报告审核面板
        <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
      </span>
    </div>

    <div class="flex flex-1 flex-col gap-3 overflow-hidden p-3" style="min-height:0">
      <section class="glass px-4 py-3" data-annotate="ap-kpi">
        <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
          <div class="text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-line-chart mr-1"></i>窗口 KPI
            <span class="ml-2 text-xs font-normal text-slate-400">业务日 <span id="kpi-today" class="mono"></span> · 闭环目标 ≥ 95%</span></div>
          <div id="range-seg" class="seg" data-annotate="ap-range">
            <button type="button" data-range="7天" class="is-on">近 7 天</button>
            <button type="button" data-range="30天">近 30 天</button>
            <button type="button" data-range="本月">本月</button>
            <button type="button" data-range="全部">全部</button>
          </div>
        </div>
        <div id="kpi-row" class="grid grid-cols-7 gap-2"></div>
      </section>

      <section class="grid min-h-0 grid-cols-1 gap-3 lg:grid-cols-3" data-annotate="ap-charts">
        <div class="glass flex min-h-0 flex-col px-4 py-3">
          <div class="mb-1 text-xs font-semibold text-slate-600">AI 三态分布</div>
          <div id="chart-concl" class="flex flex-1 items-center gap-3"></div>
        </div>
        <div class="glass flex min-h-0 flex-col px-4 py-3">
          <div class="mb-1 text-xs font-semibold text-slate-600">近 7 日任务量</div>
          <div id="chart-trend" class="flex-1"></div>
        </div>
        <div class="glass flex min-h-0 flex-col px-4 py-3">
          <div class="mb-1 text-xs font-semibold text-slate-600">规则命中 TOP</div>
          <div id="chart-rules" class="flex-1"></div>
        </div>
      </section>

      <section class="glass flex min-h-0 flex-1 flex-col overflow-hidden" data-annotate="ap-tabs">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-white/50 px-2">
          <div id="list-tabs" class="list-tabs" role="tablist">
            <button type="button" class="list-tab is-on" data-tab="queue" role="tab">正在审核中 · 排队序列<span class="n" id="n-queue">0</span></button>
            <button type="button" class="list-tab" data-tab="process" role="tab">过程中 · 未签发<span class="n" id="n-process">0</span></button>
            <button type="button" class="list-tab" data-tab="archive" role="tab">归档 · 已签发 / 已删除<span class="n" id="n-archive">0</span></button>
          </div>
          <div class="flex flex-wrap items-center gap-2 px-2 py-1.5 text-sm" data-annotate="ap-filter">
            <label class="text-slate-500">行业包
              <select id="f-pack" class="ml-1 rounded-lg border border-slate-200 bg-white px-2 py-1 text-sm">
                <option value="全部">全部</option>
                <option value="电力电缆">电力电缆</option>
                <option value="未配置行业包">未配置行业包</option>
              </select>
            </label>
            <label class="text-slate-500">结论
              <select id="f-concl" class="ml-1 rounded-lg border border-slate-200 bg-white px-2 py-1 text-sm">
                <option value="全部">全部</option>
                <option value="通过">通过</option>
                <option value="需复核">需复核</option>
                <option value="不通过">不通过</option>
                <option value="审核中">审核中</option>
                <option value="异常">异常</option>
              </select>
            </label>
            <label class="text-slate-500">任务态
              <select id="f-task" class="ml-1 rounded-lg border border-slate-200 bg-white px-2 py-1 text-sm">
                <option value="全部">全部</option>
                <option value="排队">排队</option>
                <option value="审核中">审核中</option>
                <option value="成功">成功</option>
                <option value="异常暂停">异常暂停</option>
              </select>
            </label>
          </div>
        </div>
        <div id="roster-wrap" class="flex-1 overflow-auto" style="min-height:0">
          <table class="roster">
            <thead id="roster-head"></thead>
            <tbody id="roster-body"></tbody>
          </table>
          <div id="roster-empty" class="hidden px-3 py-10 text-center text-sm text-slate-400"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }

    var state = { range: '7天', pack: '全部', concl: '全部', task: '全部', tab: 'queue', ds: null };

    function tone(c) { return c === '通过' ? 'pass' : (c === '需复核' ? 'warn' : (c === '审核中' ? 'run' : 'fail')); }
    function aiChip(c) { return '<span class="ai-chip ai-' + tone(c) + '"><span class="ai-mark">AI</span>' + esc(c) + '</span>'; }
    function taskChip(t) {
      var cls = t === '成功' ? 'bg-emerald-50 text-emerald-700' : (t === '审核中' ? 'bg-blue-50 text-blue-700' : (t === '排队' ? 'bg-indigo-50 text-indigo-700' : 'bg-red-50 text-red-700'));
      return '<span class="chip ' + cls + '">任务 ' + esc(t) + '</span>';
    }
    function humanChip(h) {
      var cls = /同意|覆盖/.test(h) ? 'bg-slate-100 text-slate-600' : (/自动退回/.test(h) ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800');
      return '<span class="chip ' + cls + '">' + esc(h) + '</span>';
    }
    function waitText(sec) {
      sec = Number(sec) || 0;
      if (sec < 60) return sec + ' 秒';
      return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    }

    function passFilter(row) {
      if (state.pack !== '全部' && row.pack !== state.pack) return false;
      if (state.concl !== '全部' && row.conclusion !== state.concl) return false;
      if (state.task !== '全部' && row.aiTask !== state.task) return false;
      return true;
    }
    function rankProcess(row) {
      if (row.aiTask === '异常暂停' || row.conclusion === '异常') return 0;
      if (row.human === '待处置' && (row.conclusion === '不通过' || row.conclusion === '需复核')) return 1;
      if (row.human === '待处置') return 3;
      return 4;
    }

    function kpiCard(label, value, hint) {
      return '<div class="kpi rounded-xl border border-white/70 bg-white/70 px-3 py-2"><div class="text-[11px] text-slate-400">' + esc(label) + '</div><div class="n">' + esc(value) + '</div><div class="text-[11px] text-slate-400">' + esc(hint || '') + '</div></div>';
    }
    function renderKpi(ds) {
      $('kpi-today').textContent = ds.today;
      var k = ds.kpi;
      $('kpi-row').innerHTML =
        kpiCard('AI 审核报告数', k.reports, '含排队 / 进行中 / 失败 / 已删除') +
        kpiCard('闭环成功率', k.closeRate, '已出三态 / 已触发') +
        kpiCard('通过率', k.passRate, 'AI 通过 / 已出结论') +
        kpiCard('需复核率', k.reviewRate, '三态占比') +
        kpiCard('不通过率', k.failRate, '三态占比') +
        kpiCard('人工采纳率', k.adoptRate, '同意 AI / 同意+覆盖') +
        kpiCard('异常率', k.errorRate, '超时 / 失败任务');
    }

    function donutHtml(slices) {
      var total = slices.reduce(function (s, x) { return s + x.n; }, 0);
      if (!total) return '<div class="py-6 text-center text-xs text-slate-400">窗口内尚无三态结论</div>';
      var r = 36, c = 2 * Math.PI * r, acc = 0;
      var rings = slices.map(function (s) {
        var frac = s.n / total;
        var dash = frac * c;
        var gap = c - dash;
        var rot = -90 + acc * 360;
        acc += frac;
        return '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="12" stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) + '" transform="rotate(' + rot.toFixed(2) + ' 48 48)"></circle>';
      }).join('');
      var legend = slices.map(function (s) {
        return '<div class="text-xs text-slate-600"><i style="background:' + s.color + '"></i>' + esc(s.key) + ' <b>' + s.n + '</b></div>';
      }).join('');
      return '<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">' +
        '<circle cx="48" cy="48" r="36" fill="none" stroke="#eef2ff" stroke-width="12"></circle>' + rings +
        '<text x="48" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#143C9A">' + total + '</text>' +
        '<text x="48" y="62" text-anchor="middle" font-size="10" fill="#64748b">已出结论</text></svg>' +
        '<div class="chart-legend flex-1">' + legend + '</div>';
    }
    function trendHtml(points) {
      var max = Math.max.apply(null, points.map(function (p) { return p.n; }).concat([1]));
      return '<div class="flex h-[108px] items-end gap-1.5">' + points.map(function (p) {
        var h = Math.max(6, Math.round((p.n / max) * 84));
        return '<div class="flex h-full flex-1 flex-col items-center justify-end">' +
          '<div class="mb-1 text-[10px] font-semibold text-slate-500">' + p.n + '</div>' +
          '<div class="w-full rounded-t-md" style="height:' + h + 'px;background:linear-gradient(180deg,#5B8DEF,#143C9A)" title="' + esc(p.day) + ' · ' + p.n + ' 份"></div>' +
          '<div class="mt-1 text-[10px] text-slate-400">' + esc(p.label) + '</div></div>';
      }).join('') + '</div>';
    }
    function rulesHtml(rules) {
      if (!rules.length) return '<div class="py-6 text-center text-xs text-slate-400">窗口内无命中项</div>';
      var max = Math.max.apply(null, rules.map(function (r) { return r.n; }));
      return '<div class="space-y-2 pt-1">' + rules.map(function (r) {
        var pct = Math.round((r.n / max) * 100);
        return '<div><div class="mb-0.5 flex items-center justify-between text-xs"><span class="truncate text-slate-600">' + esc(r.name) + '</span><b class="ml-2 text-slate-800">' + r.n + '</b></div>' +
          '<div class="hbar"><span style="width:' + pct + '%"></span></div></div>';
      }).join('') + '</div>';
    }
    function renderCharts(ds) {
      $('chart-concl').innerHTML = donutHtml(ds.charts.slices);
      $('chart-trend').innerHTML = trendHtml(ds.charts.trend);
      $('chart-rules').innerHTML = rulesHtml(ds.charts.rules);
    }

    function headHtml(tab) {
      if (tab === 'queue') return '<tr><th>排队位</th><th>报告编号</th><th>委托 / 客户</th><th>任务态</th><th>已等待</th><th>预计</th><th>触发时间</th></tr>';
      if (tab === 'archive') return '<tr><th>报告编号</th><th>委托 / 客户</th><th>任务态</th><th>AI 结论</th><th>人工</th><th>签发 / 删除</th><th>业务节点</th></tr>';
      return '<tr><th>报告编号</th><th>委托 / 客户</th><th>任务态</th><th>AI 结论</th><th>人工</th><th>业务节点</th><th>轮次</th><th>触发时间</th></tr>';
    }
    function rowCells(row, tab) {
      var no = '<div class="font-semibold text-slate-800 mono">' + esc(row.reportNo) + ' · ' + esc(row.revision) + '</div>' +
        (row.deleted ? '<span class="chip bg-slate-800 text-white">已删除</span>' : '');
      var who = '<div class="mono text-slate-700">' + esc(row.entrust) + '</div><div class="text-[11px] text-slate-400">' + esc(row.customer) + '</div>';
      if (tab === 'queue') {
        var pos = row.queuePos === 0 ? '执行中' : ('第 ' + row.queuePos + ' 位');
        return '<td class="mono font-semibold" style="color:var(--brand)">' + esc(pos) + '</td><td>' + no + '</td><td>' + who + '</td><td>' + taskChip(row.aiTask) + '</td><td>' + esc(waitText(row.waitSec)) + '</td><td>' + esc(waitText(row.etaSec)) + '</td><td class="text-slate-500">' + esc(row.at) + '</td>';
      }
      if (tab === 'archive') {
        var when = row.deleted ? ('删除 ' + (row.deletedAt || row.archivedAt || '—')) : ('签发 ' + (row.signedAt || row.archivedAt || '—'));
        return '<td>' + no + '</td><td>' + who + '</td><td>' + taskChip(row.aiTask) + '</td><td>' + aiChip(row.conclusion) + '</td><td>' + humanChip(row.human) + '</td><td class="text-slate-500">' + esc(when) + '</td><td>' + esc(row.bizNode) + '</td>';
      }
      return '<td>' + no + '</td><td>' + who + '</td><td>' + taskChip(row.aiTask) + '</td><td>' + aiChip(row.conclusion) + '</td><td>' + humanChip(row.human) + '</td><td>' + esc(row.bizNode) + '</td><td>第 ' + row.round + ' 轮</td><td class="text-slate-500">' + esc(row.at) + '</td>';
    }

    function renderLists() {
      state.ds = ReportReviewMock.getPanelDataset(state.range);
      renderKpi(state.ds);
      renderCharts(state.ds);
      var queue = state.ds.queue.filter(passFilter);
      var process = state.ds.process.filter(passFilter).slice().sort(function (a, b) { return rankProcess(a) - rankProcess(b); });
      var archive = state.ds.archive.filter(passFilter).slice().sort(function (a, b) {
        if (a.deleted !== b.deleted) return a.deleted ? -1 : 1;
        return String(b.archivedAt || b.at).localeCompare(String(a.archivedAt || a.at));
      });
      $('n-queue').textContent = queue.length;
      $('n-process').textContent = process.length;
      $('n-archive').textContent = archive.length;
      var map = { queue: queue, process: process, archive: archive };
      var rows = map[state.tab] || [];
      $('roster-head').innerHTML = headHtml(state.tab);
      var emptyHint = state.tab === 'queue' ? '窗口内无排队 / 正在执行的任务' : (state.tab === 'archive' ? '窗口内无归档' : '窗口内无过程中任务');
      if (!rows.length) {
        $('roster-body').innerHTML = '';
        $('roster-empty').classList.remove('hidden');
        $('roster-empty').textContent = emptyHint;
      } else {
        $('roster-empty').classList.add('hidden');
        $('roster-body').innerHTML = rows.map(function (r) {
          return '<tr class="row-card" data-id="' + esc(r.id) + '" data-kind="' + esc(r.kind || state.tab) + '">' + rowCells(r, state.tab) + '</tr>';
        }).join('');
        document.querySelectorAll('#roster-body tr').forEach(function (tr) {
          tr.addEventListener('click', function () {
            location.href = 'ai-review-snapshot.html?id=' + encodeURIComponent(tr.getAttribute('data-id')) + '&kind=' + encodeURIComponent(tr.getAttribute('data-kind'));
          });
        });
      }
    }

    $('list-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]'); if (!b) return;
      state.tab = b.getAttribute('data-tab');
      [].forEach.call($('list-tabs').querySelectorAll('.list-tab'), function (x) { x.classList.toggle('is-on', x === b); });
      renderLists();
    });
    $('range-seg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-range]'); if (!b) return;
      state.range = b.getAttribute('data-range');
      [].forEach.call($('range-seg').querySelectorAll('button'), function (x) { x.classList.toggle('is-on', x === b); });
      renderLists();
    });
    ['f-pack', 'f-concl', 'f-task'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        state.pack = $('f-pack').value; state.concl = $('f-concl').value; state.task = $('f-task').value;
        renderLists();
      });
    });

    renderLists();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'ap-kpi', selector: '[data-annotate="ap-kpi"]', position: 'bottom', title: '窗口 KPI', content: '<strong>需求逻辑：</strong>入口 A 看全系统 AI 任务健康度，不替代审核工作台。<br><strong>展示规则：</strong>默认近 7 天。报告数含排队、进行中、失败与已删除归档。', tag: 'AI面板' },
        { id: 'ap-range', selector: '[data-annotate="ap-range"]', position: 'bottom', title: '时间窗口', content: '业务日锚定演示日 2026-09-08，使近 7 天能罩住 0238 簇。', tag: 'AI面板' },
        { id: 'ap-charts', selector: '[data-annotate="ap-charts"]', position: 'bottom', title: '窗口图表', content: '三态环图、近 7 日任务量、规则命中 TOP。随时间窗口重算，与下方名单同一口径。', tag: 'AI面板' },
