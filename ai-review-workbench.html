<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI报告审核面板 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <script src="js/ai-review-store.js"></script>
  <script src="js/ai-review-engine.js"></script>
  <script src="js/report-review-mock.js"></script>
  <style>
    :root {
      --brand: #143C9A; --brand-2: #2E5BD6; --brand-3: #5B8DEF;
      --glass: rgba(255,255,255,.88); --line: rgba(20,60,154,.12); --ink: #1e2a44;
    }
    html, body { height: 100%; }
    body {
      color: var(--ink);
      font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(46,91,214,.05), transparent 62%),
        radial-gradient(900px 500px at 98% 4%, rgba(91,141,239,.04), transparent 58%),
        linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
      background-attachment: fixed;
    }
    .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 30px rgba(20,60,154,.08); border-radius: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; line-height: 1.6; }
    .kpi { min-width: 0; transition: transform .18s ease, box-shadow .18s ease; }
    .kpi .n { font-size: 20px; font-weight: 700; color: var(--brand); line-height: 1.1; }
    .kpi.pop { animation: kpiPop .55s ease; }
    @keyframes kpiPop {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(20,60,154,.0); }
      40% { transform: scale(1.04); box-shadow: 0 0 0 6px rgba(46,91,214,.16); }
      100% { transform: scale(1); }
    }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
    .seg button { padding: 4px 12px; font-size: 12px; color: #64748b; }
    .seg button.is-on { background: var(--brand); color: #fff; font-weight: 600; }
    .ai-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; border: 1px solid; background: #fff; padding: 1px 7px 1px 5px; font-size: 11px; font-weight: 600; }
    .ai-chip .ai-mark { font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 3px; color: #fff; }
    .ai-pass { color: #047857; border-color: #6ee7b7; } .ai-pass .ai-mark { background: #059669; }
    .ai-warn { color: #b45309; border-color: #fcd34d; } .ai-warn .ai-mark { background: #d97706; }
    .ai-fail { color: #b91c1c; border-color: #fca5a5; } .ai-fail .ai-mark { background: #dc2626; }
    .ai-run { color: #1d4ed8; border-color: #93c5fd; } .ai-run .ai-mark { background: #2563eb; }
    .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 4px; }
    .hbar { height: 8px; border-radius: 99px; background: #eef2ff; overflow: hidden; }
    .hbar > span { display: block; height: 100%; border-radius: 99px; background: #d97706; }
    .panel-grid {
      display: grid; gap: 12px; height: 100%; min-height: 0;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.72fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1.55fr) minmax(210px, 0.92fr);
    }
    #blk-kpi { grid-column: 1 / 3; grid-row: 1; }
    #blk-pending { grid-column: 3; grid-row: 1; }
    #blk-trend { grid-column: 1; grid-row: 2; }
    #blk-archive { grid-column: 2; grid-row: 2; }
    #blk-queue { grid-column: 3; grid-row: 2; }
    .marquee { overflow: hidden; position: relative; }
    .marquee-track { transition: transform .6s ease; }
    .q-card { border: 1px solid rgba(20,60,154,.1); border-radius: 12px; background: #fff; padding: 8px 10px; }
    .q-card.run { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .q-card.done { border-color: #6ee7b7; background: #f0fdf4; }
    .q-bar { height: 4px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
    .q-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2E5BD6, #5B8DEF); }
    .q-card.run .q-bar > i { animation: qfill 2.1s linear forwards; }
    @keyframes qfill { from { width: 0; } to { width: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track, .ex-track, .q-card.run .q-bar > i, .kpi.pop { animation: none !important; }
    }
  </style>
</head>
<body class="text-slate-700">

  <div class="flex h-screen flex-col overflow-hidden">
    <div id="pageTabs" class="flex flex-shrink-0 items-center gap-1 overflow-x-auto border-b border-white/50 bg-white/60 px-4 pt-2 text-sm whitespace-nowrap backdrop-blur" data-close-target="dashboard.html">
      <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
      <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-white/60 bg-white/80 px-3 py-1.5" style="color:var(--brand)">
        AI报告审核面板
        <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
      </span>
    </div>

    <div class="flex-1 overflow-hidden p-3" style="min-height:0">
      <div class="panel-grid">
        <section id="blk-kpi" class="glass flex min-h-0 flex-col overflow-hidden px-4 py-3" data-annotate="ap-kpi">
          <div class="mb-2 flex items-center justify-between gap-3" style="flex-wrap:nowrap">
            <div class="min-w-0 truncate text-sm font-semibold" style="color:var(--brand)"><i class="fa fa-line-chart mr-1"></i>窗口 KPI
              <span class="ml-2 text-xs font-normal text-slate-400">业务日 <span id="kpi-today" class="mono"></span></span></div>
            <div id="range-seg" class="seg flex-shrink-0" data-annotate="ap-range">
              <button type="button" data-range="7天" class="is-on">近 7 天</button>
              <button type="button" data-range="30天">近 30 天</button>
              <button type="button" data-range="本月">本月</button>
              <button type="button" data-range="全部">全部</button>
            </div>
          </div>
          <div id="kpi-row" class="grid gap-2" style="grid-template-columns:repeat(5,minmax(0,1fr))"></div>
          <div class="mt-3 grid min-h-0 flex-1 grid-cols-1 gap-3 overflow-hidden md:grid-cols-[minmax(0,1.2fr)_minmax(180px,.7fr)]">
            <div class="flex min-h-0 flex-col">
              <div class="mb-1 text-xs font-semibold text-slate-600">AI 审核结论三态分布</div>
              <div id="chart-concl" class="flex flex-1 items-center gap-3"></div>
            </div>
            <div class="flex min-h-0 flex-col">
              <div class="mb-1 text-xs font-semibold text-slate-600">AI 审核平均时长</div>
              <div id="chart-avg" class="flex flex-1 items-center"></div>
            </div>
          </div>
          <div class="mt-2 min-h-0" data-annotate="ap-rules">
            <div class="mb-1 text-xs font-semibold text-slate-600">规则命中不通过 TOP</div>
            <div id="chart-rules"></div>
            <div id="chart-sev" class="mt-2"></div>
          </div>
        </section>

        <section id="blk-pending" class="glass flex min-h-0 flex-col overflow-hidden" data-annotate="ap-pending">
          <div class="flex items-center justify-between border-b border-white/50 px-4 py-2">
            <div class="text-sm font-semibold" style="color:var(--brand)">过程中 · 待处理 <span id="n-pending" class="text-xs font-normal text-slate-400"></span></div>
          </div>
          <div id="pending-marquee" class="marquee flex-1 px-2 py-2" style="min-height:0"></div>
          <div class="border-t border-white/50 px-4 py-2">
            <div class="mb-1.5 flex items-center justify-between text-xs font-semibold text-red-600"><span><i class="fa fa-exclamation-triangle mr-1"></i>审核异常</span><span id="n-ex" class="font-normal text-slate-400"></span></div>
            <div id="ex-marquee" class="marquee" style="height:88px"></div>
          </div>
        </section>

        <section id="blk-trend" class="glass flex min-h-0 flex-col overflow-hidden px-4 py-3" data-annotate="ap-trend">
          <div class="mb-1 flex items-center justify-between gap-2">
            <div class="text-sm font-semibold" style="color:var(--brand)">审核任务量走势</div>
            <div id="grain-seg" class="seg flex-shrink-0">
              <button type="button" data-grain="年">年</button>
              <button type="button" data-grain="季">季</button>
              <button type="button" data-grain="月" class="is-on">月</button>
            </div>
          </div>
          <div id="chart-volume" class="flex-1"></div>
        </section>

        <section id="blk-archive" class="glass flex min-h-0 flex-col overflow-hidden px-4 py-3" data-annotate="ap-archive">
          <div class="mb-2 flex items-center justify-between">
            <div class="text-sm font-semibold" style="color:var(--brand)">已归档数据</div>
            <a id="archive-jump" class="inline-flex h-7 w-7 items-center justify-center rounded-full border border-slate-200 text-slate-500 hover:bg-white" href="ai-review-archive.html" title="查看已归档报告"><i class="fa fa-arrow-right"></i></a>
          </div>
          <div id="archive-stats" class="flex flex-1 items-center"></div>
        </section>

        <section id="blk-queue" class="glass flex min-h-0 flex-col overflow-hidden px-4 py-3" data-annotate="ap-queue">
          <div class="mb-2 flex items-center justify-between">
            <div class="text-sm font-semibold" style="color:var(--brand)">排队中</div>
            <span id="queue-status" class="text-xs text-slate-400">模拟 3 份任务流转</span>
          </div>
          <div id="queue-viz" class="flex-1 overflow-hidden"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    AiReviewStore.reset();
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function $(id) { return document.getElementById(id); }
    var state = { range: '7天', grain: '月', ds: null, simDone: 0, simOver: false };

    function tone(c) { return c === '通过' ? 'pass' : (c === '需复核' ? 'warn' : (c === '审核中' ? 'run' : 'fail')); }
    function aiChip(c) { return '<span class="ai-chip ai-' + tone(c) + '"><span class="ai-mark">AI</span>' + esc(c) + '</span>'; }
    function waitText(sec) {
      sec = Number(sec) || 0;
      if (sec < 60) return sec + ' 秒';
      return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    }
    function kpiCard(id, label, value, hint) {
      return '<div class="kpi rounded-xl border border-white/70 bg-white/70 px-3 py-2" data-kpi="' + id + '"><div class="text-[11px] text-slate-400">' + esc(label) + '</div><div class="n">' + esc(value) + '</div><div class="text-[11px] text-slate-400">' + esc(hint || '') + '</div></div>';
    }
    function popKpis() {
      document.querySelectorAll('#kpi-row .kpi').forEach(function (el) {
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      });
    }
    function withSim(k) {
      var extra = state.simDone;
      var audits = (k.auditN || k.audits) + extra;
      return {
        audits: audits,
        successN: k.counts.success + extra,
        closeRate: audits ? Math.round(((k.counts.success + extra) / audits) * 100) + '%' : k.closeRate,
        errorN: k.counts.abnormal,
        errorRate: k.errorRate,
        done: k.counts.done + extra,
        adoptRate: k.adoptRate,
        avgDurationSec: k.avgDurationSec,
      };
    }
    function renderKpi(ds) {
      $('kpi-today').textContent = ds.today;
      var k = withSim(ds.kpi);
      $('kpi-row').innerHTML =
        kpiCard('audits', '审核次数', k.audits, '窗口内触发的 AI 任务') +
        kpiCard('success', '成功率', k.closeRate, '成功 ' + k.successN + ' 次') +
        kpiCard('error', '异常率', k.errorRate, '异常 ' + k.errorN + ' 次') +
        kpiCard('done', '已完成报告', k.done, '已出三态结论') +
        kpiCard('adopt', '人工采纳率', k.adoptRate, '同意 AI / 同意+覆盖');
    }
    function donutHtml(slices) {
      var total = slices.reduce(function (s, x) { return s + x.n; }, 0);
      if (!total) return '<div class="py-4 text-center text-xs text-slate-400">窗口内尚无三态结论</div>';
      var r = 38, c = 2 * Math.PI * r, acc = 0;
      var rings = slices.map(function (s) {
        var frac = s.n / total;
        var dash = frac * c, gap = c - dash, rot = -90 + acc * 360;
        acc += frac;
        return '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="12" stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) + '" transform="rotate(' + rot.toFixed(2) + ' 50 50)"></circle>';
      }).join('');
      var legend = slices.map(function (s) {
        return '<div class="text-xs text-slate-600"><i style="background:' + s.color + '"></i>' + esc(s.key) + ' <b>' + s.n + '</b> · ' + esc(s.pct || '') + '</div>';
      }).join('');
      return '<svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">' +
        '<circle cx="50" cy="50" r="38" fill="none" stroke="#eef2ff" stroke-width="12"></circle>' + rings +
        '<text x="50" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#143C9A">' + total + '</text>' +
        '<text x="50" y="64" text-anchor="middle" font-size="10" fill="#64748b">已出结论</text></svg>' +
        '<div class="flex-1 space-y-1.5">' + legend + '</div>';
    }
    function avgHtml(sec) {
      return '<div class="w-full rounded-xl bg-gradient-to-br from-indigo-50 to-white px-3 py-3">' +
        '<div class="text-[11px] text-slate-400">已成功任务平均耗时</div>' +
        '<div class="mt-1 text-2xl font-bold" style="color:var(--brand)">' + esc(waitText(sec)) + '</div>' +
        '<div class="mt-1 text-[11px] text-slate-400">引擎领取到写出三态</div></div>';
    }
    function rulesHtml(rules) {
      if (!rules.length) return '<div class="text-xs text-slate-400">窗口内无命中项</div>';
      var max = Math.max.apply(null, rules.map(function (r) { return r.n; }));
      return '<div class="space-y-1.5">' + rules.map(function (r) {
        var pct = Math.round((r.n / max) * 100);
        return '<div><div class="mb-0.5 flex items-center justify-between text-xs"><span class="truncate text-slate-600">' + esc(r.name) + '</span><b class="ml-2">' + r.n + '</b></div>' +
          '<div class="hbar"><span style="width:' + pct + '%"></span></div></div>';
      }).join('') + '</div>';
    }
    function sevHtml(fs) {
      var keys = ['严重', '一般', '轻微'];
      var colors = { 严重: '#dc2626', 一般: '#d97706', 轻微: '#64748b' };
      return '<div class="flex flex-wrap items-center gap-2 text-xs text-slate-500">不通过项严重度' + keys.map(function (k) {
        return '<span class="chip" style="background:' + colors[k] + '1a;color:' + colors[k] + '">' + k + ' ' + (fs.n[k] || 0) + ' · ' + (fs.pct[k] || '0%') + '</span>';
      }).join('') + '</div>';
    }
    function volumeHtml(points) {
      if (!points.length) return '<div class="py-6 text-center text-xs text-slate-400">窗口内无任务量</div>';
      var w = 320, h = 120, pad = 22;
      if (points.length === 1) {
        return '<div class="flex h-full flex-col items-center justify-center"><div class="text-3xl font-bold" style="color:var(--brand)">' + points[0].n + '</div><div class="mt-1 text-xs text-slate-400">' + esc(points[0].label) + ' · 窗口内任务量</div></div>';
      }
      var max = Math.max.apply(null, points.map(function (p) { return p.n; }).concat([1]));
      var coords = points.map(function (p, i) {
        var x = pad + (points.length === 1 ? (w - pad * 2) / 2 : i * (w - pad * 2) / (points.length - 1));
        var y = h - pad - (p.n / max) * (h - pad * 2);
        return { x: x, y: y, p: p };
      });
      var line = coords.map(function (c, i) { return (i ? 'L' : 'M') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
      var dots = coords.map(function (c) {
        return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.5" fill="#143C9A"></circle>' +
          '<text x="' + c.x.toFixed(1) + '" y="' + (c.y - 8) + '" text-anchor="middle" font-size="10" fill="#334155">' + c.p.n + '</text>';
      }).join('');
      var labels = coords.map(function (c) {
        return '<text x="' + c.x.toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="10" fill="#64748b">' + esc(c.p.label) + '</text>';
      }).join('');
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="h-full w-full" preserveAspectRatio="none">' +
        '<path d="' + line + '" fill="none" stroke="#2E5BD6" stroke-width="2"></path>' + dots + labels + '</svg>';
    }
    function pendingCard(row) {
      return '<a class="mb-1.5 block rounded-xl border border-slate-100 bg-white px-3 py-2 hover:border-blue-200" href="ai-review-snapshot.html?id=' + encodeURIComponent(row.id) + '&kind=process">' +
        '<div class="flex items-center justify-between gap-2"><span class="mono text-sm font-semibold text-slate-800">' + esc(row.reportNo) + '</span>' + aiChip(row.conclusion) + '</div>' +
        '<div class="mt-0.5 text-[11px] text-slate-400">' + esc(row.entrust) + ' · ' + esc(row.customer) + '</div>' +
        '<div class="mt-1 text-[11px] text-slate-500">' + esc(row.human) + ' · ' + esc(row.bizNode) + '</div></a>';
    }
    function exCard(row) {
      var err = row.error || { code: 'ERROR', message: '审核异常暂停' };
      return '<a class="mb-1.5 block rounded-xl border border-red-100 bg-red-50/70 px-3 py-2 hover:border-red-200" href="report-review-detail.html?code=' + encodeURIComponent(row.entrust) + '">' +
        '<div class="flex items-center justify-between gap-2"><span class="mono text-xs font-semibold text-slate-800">' + esc(row.reportNo) + '</span><span class="chip bg-red-100 text-red-700">异常</span></div>' +
        '<div class="mt-0.5 text-[11px] text-red-700">' + esc(err.code) + ' · 去人工重跑</div></a>';
    }
    var marqueeTimers = {};
    function fillMarquee(box, html) {
      if (marqueeTimers[box.id]) { clearInterval(marqueeTimers[box.id]); delete marqueeTimers[box.id]; }
      if (!html) { box.innerHTML = '<div class="px-2 py-4 text-center text-xs text-slate-400">暂无</div>'; return; }
      box.innerHTML = '<div class="marquee-track">' + html + '</div>';
      var track = box.querySelector('.marquee-track');
      var cards = track.children;
      var n = cards.length;
      if (n < 1) return;
      var idx = 0;
      var paused = false;
      box.onmouseenter = function () { paused = true; };
      box.onmouseleave = function () { paused = false; };
      marqueeTimers[box.id] = setInterval(function () {
        if (paused) return;
        idx += 1;
        var h = cards[0] ? cards[0].offsetHeight + 6 : 64;
        if (idx >= n) {
          track.style.transition = 'none';
          track.style.transform = 'translateY(0)';
          idx = 0;
          void track.offsetHeight;
          track.style.transition = 'transform .6s ease';
        } else {
          track.style.transform = 'translateY(' + (-idx * h) + 'px)';
        }
      }, 3200);
    }
    function archiveHtml(st) {
      return '<div class="grid w-full grid-cols-2 gap-2">' +
        '<div class="rounded-xl bg-emerald-50 px-3 py-3"><div class="text-[11px] text-emerald-700">已签发 / 已发放</div><div class="mt-1 text-2xl font-bold text-emerald-800">' + st.signed + '</div></div>' +
        '<div class="rounded-xl bg-slate-100 px-3 py-3"><div class="text-[11px] text-slate-500">已删除</div><div class="mt-1 text-2xl font-bold text-slate-800">' + st.deleted + '</div></div>' +
        '<div class="col-span-2 text-xs text-slate-400">合计 ' + st.total + ' 份 · 点右上角进入归档名单</div></div>';
    }

    var queueJobs = [];
    function seedQueue(ds) {
      var src = (ds.queue || []).slice(0, 3);
      while (src.length < 3 && ds.queue && ds.queue[src.length]) src.push(ds.queue[src.length]);
      if (!src.length) {
        src = [
          { id: 'q1', reportNo: 'SC2026/0240-01' },
          { id: 'q2', reportNo: 'SC2026/0241-01' },
          { id: 'q3', reportNo: 'SC2026/0238-05' },
        ];
      }
      queueJobs = src.map(function (r, i) {
        return { id: r.id, reportNo: r.reportNo, stage: i === 0 ? 'run' : 'wait' };
      });
      state.simDone = 0; state.simOver = false;
    }
    function renderQueue() {
      var doneN = queueJobs.filter(function (j) { return j.stage === 'done'; }).length;
      if (state.simOver) {
        $('queue-status').textContent = '本轮 3 份已出结论';
        $('queue-viz').innerHTML = '<div class="flex h-full flex-col items-center justify-center text-center"><div class="text-emerald-600"><i class="fa fa-check-circle text-2xl"></i></div><div class="mt-1 text-sm font-semibold text-slate-700">排队流转完毕</div><div class="text-xs text-slate-400">3 / 3 已写入三态，窗口数字已跳动</div></div>';
        return;
      }
      $('queue-status').textContent = '已完成 ' + doneN + ' / 3';
      $('queue-viz').innerHTML = '<div class="space-y-1.5">' + queueJobs.map(function (j) {
        var tag = j.stage === 'run' ? '审核中' : (j.stage === 'done' ? '已出结论' : '排队');
        return '<div class="q-card ' + j.stage + '"><div class="flex items-center justify-between gap-2"><span class="mono text-xs font-semibold">' + esc(j.reportNo) + '</span><span class="chip ' + (j.stage === 'run' ? 'bg-blue-50 text-blue-700' : (j.stage === 'done' ? 'bg-emerald-50 text-emerald-700' : 'bg-indigo-50 text-indigo-700')) + '">' + tag + '</span></div>' +
          (j.stage === 'run' ? '<div class="q-bar mt-2"><i></i></div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    function tickQueue() {
      if (state.simOver) return;
      var run = null;
      queueJobs.forEach(function (j) { if (j.stage === 'run') run = j; });
      if (run) run.stage = 'done';
      var next = null;
      queueJobs.forEach(function (j) { if (!next && j.stage === 'wait') next = j; });
      if (next) next.stage = 'run';
      state.simDone += 1;
      if (queueJobs.every(function (j) { return j.stage === 'done'; })) state.simOver = true;
      renderKpi(state.ds);
      popKpis();
      renderQueue();
      if (!state.simOver) setTimeout(tickQueue, 2200);
    }

    function renderAll() {
      state.ds = ReportReviewMock.getPanelDataset(state.range);
      renderKpi(state.ds);
      $('chart-concl').innerHTML = donutHtml(state.ds.charts.slices);
      $('chart-avg').innerHTML = avgHtml(state.ds.kpi.avgDurationSec);
      $('chart-rules').innerHTML = rulesHtml(state.ds.charts.rules);
      $('chart-sev').innerHTML = sevHtml(state.ds.charts.failSev);
      $('chart-volume').innerHTML = volumeHtml(state.ds.charts.volume[state.grain] || []);
      $('archive-stats').innerHTML = archiveHtml(state.ds.archiveStats);
      var pending = state.ds.pending || [];
      $('n-pending').textContent = pending.length + ' 份';
      fillMarquee($('pending-marquee'), pending.map(pendingCard).join(''));
      var ex = state.ds.exceptions || [];
      $('n-ex').textContent = ex.length + ' 条';
      fillMarquee($('ex-marquee'), ex.map(exCard).join(''));
    }

    $('range-seg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-range]'); if (!b) return;
      state.range = b.getAttribute('data-range');
      [].forEach.call($('range-seg').querySelectorAll('button'), function (x) { x.classList.toggle('is-on', x === b); });
      renderAll();
    });
    $('grain-seg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-grain]'); if (!b) return;
      state.grain = b.getAttribute('data-grain');
      [].forEach.call($('grain-seg').querySelectorAll('button'), function (x) { x.classList.toggle('is-on', x === b); });
      $('chart-volume').innerHTML = volumeHtml(state.ds.charts.volume[state.grain] || []);
    });

    renderAll();
    seedQueue(state.ds);
    renderQueue();
    setTimeout(tickQueue, 2200);

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({ annotations: [
        { id: 'ap-kpi', selector: '[data-annotate="ap-kpi"]', position: 'bottom', title: '窗口 KPI', content: '右上角切近 7 天 / 30 天 / 本月 / 全部。五张卡：审核次数、成功率（及次数）、异常率（及次数）、已完成报告、人工采纳率。下层为三态饼图与平均时长，再下层为不通过规则 TOP 与严重度占比。', tag: 'AI面板' },
        { id: 'ap-range', selector: '[data-annotate="ap-range"]', position: 'bottom', title: '日期范围', content: '业务日锚定 2026-09-08。', tag: 'AI面板' },
        { id: 'ap-pending', selector: '[data-annotate="ap-pending"]', position: 'left', title: '过程中待处理', content: '上下轮播待处理报告，点击进入审核快照；快照可返回本面板或点「人工处置」进报告审核。下方为审核异常轮播，点击进报告审核去人工重跑。', tag: 'AI面板' },
        { id: 'ap-trend', selector: '[data-annotate="ap-trend"]', position: 'top', title: '审核任务量走势', content: '按当前日期范围汇总，右上角切年 / 季 / 月。', tag: 'AI面板' },
        { id: 'ap-archive', selector: '[data-annotate="ap-archive"]', position: 'top', title: '已归档数据', content: '已签发与已删除数量。标题右侧箭头进入归档名单。', tag: 'AI面板' },
        { id: 'ap-queue', selector: '[data-annotate="ap-queue"]', position: 'left', title: '排队中', content: '演示 3 份任务依次领取、出结论；每完成一份，左侧 KPI 会跳动。3 份完成后显示本轮完毕。', tag: 'AI面板' },
      ] });
    }
  </script>
