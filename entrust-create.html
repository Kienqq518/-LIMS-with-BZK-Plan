<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>委托编辑 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; }
    .form-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .form-item label { flex-shrink: 0; width: 96px; text-align: right; font-size: 13px; color: #64748b; }
    .form-item.span-full { grid-column: span 4; }
    .form-item label .req { color: #ef4444; }
    .form-item input, .form-item select, .form-item textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; }
    .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: #3b82f6; }
    /* 合同信息带出字段：只读置灰，只能通过合同编号带出 */
    .form-item input:disabled, .form-item textarea:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { border: 1px solid #e5e7eb; padding: 8px 10px; font-size: 13px; text-align: left; }
    .data-table th { background: #f1f5f9; color: #64748b; font-weight: 500; }
    .preview-doc { font-family: SimSun, serif; font-size: 13px; line-height: 1.8; color: #1e293b; }
    .preview-doc table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    .preview-doc td, .preview-doc th { border: 1px solid #333; padding: 4px 6px; font-size: 12px; }
    .modal-form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 20px; }
    .modal-form-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .modal-form-item label { flex-shrink: 0; width: 108px; text-align: right; font-size: 13px; color: #64748b; }
    .modal-form-item.span-2 { grid-column: span 2; }
    .modal-form-item.span-full { grid-column: 1 / -1; }
    /* 产品标记开关关闭时，整列不展示（样品数据 › 产品标记开关） */
    #sampleInfoTable.hide-mark-col .col-mark { display: none; }
    /* 样品名称树形下拉（结构对齐「样品数据」左侧树，支持搜索） */
    .tree-select { position: relative; flex: 1; min-width: 0; }
    .ts-control { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 32px; padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; cursor: pointer; background: #fff; }
    .ts-control:hover { border-color: #3b82f6; }
    .ts-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; }
    .ts-text.ph { color: #94a3b8; }
    .ts-caret { color: #94a3b8; }
    .ts-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; display: none; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; box-shadow: 0 8px 20px rgba(15,23,42,.12); }
    .ts-panel.open { display: block; }
    .ts-search { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #f1f5f9; color: #94a3b8; }
    .ts-search input { flex: 1; min-width: 0; border: none; outline: none; font-size: 13px; padding: 2px 0; }
    .ts-tree { max-height: 240px; overflow-y: auto; padding: 4px 0; }
    .ts-node { display: flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 13px; color: #475569; cursor: pointer; white-space: nowrap; }
    .ts-node:hover { background: #f1f5f9; }
    .ts-node.branch { color: #64748b; }
    .ts-node.leaf.is-active { color: #2563eb; background: #eff6ff; }
    .ts-node .ts-tw { width: 14px; flex-shrink: 0; text-align: center; color: #94a3b8; font-size: 11px; }
    .ts-node .ts-lbl { overflow: hidden; text-overflow: ellipsis; }
    .ts-empty { padding: 14px 10px; text-align: center; color: #94a3b8; font-size: 12px; }
    /* 带清除按钮的输入（样品别名 / 样品单位由样品数据自动带出） */
    .ts-input-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
    .ts-input-wrap input { flex: 1; min-width: 0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 26px 6px 10px; font-size: 13px; outline: none; }
    .ts-input-wrap input:focus { border-color: #3b82f6; }
    .ts-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #cbd5e1; cursor: pointer; font-size: 13px; display: none; }
    .ts-input-wrap.has-value .ts-clear { display: block; color: #94a3b8; }
    .ts-input-wrap.has-value .ts-clear:hover { color: #64748b; }
    /* 规格参数：选中型号后出现，横向排列该型号的各规格参数下拉 */
    .spec-box { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; }
    .spec-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #64748b; }
    .spec-item span { flex-shrink: 0; white-space: nowrap; }
    .spec-item select { min-width: 130px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 5px 8px; font-size: 13px; background: #fff; outline: none; }
    .modal-form-item label .req { color: #ef4444; }
    .modal-form-item input, .modal-form-item select, .modal-form-item textarea { flex: 1; min-width: 0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; font-size: 13px; outline: none; }
    .modal-form-item input:focus, .modal-form-item select:focus, .modal-form-item textarea:focus { border-color: #3b82f6; }
    .test-table { width: 100%; border-collapse: collapse; }
    .test-table th, .test-table td { border: 1px solid #e5e7eb; padding: 8px 10px; font-size: 12px; text-align: left; vertical-align: top; }
    .test-table th { background: #f8fafc; color: #64748b; font-weight: 500; }
    .test-table td.max-w-xs { max-width: 180px; }
    .client-combo { position: relative; flex: 1 1 auto; min-width: 0; width: 100%; }
    .form-item .client-combo input[type="text"] { width: 100%; min-width: 0; flex: none; box-sizing: border-box; }
    .client-combo-list {
      display: none; position: absolute; z-index: 20; left: 0; right: 0; top: 100%;
      margin-top: 2px; max-height: 220px; overflow: auto; background: #fff;
      border: 1px solid #cbd5e1; border-radius: 4px; box-shadow: 0 8px 20px rgba(15,23,42,.12);
    }
    .client-combo.open .client-combo-list { display: block; }
    .client-combo-list button {
      display: block; width: 100%; text-align: left; padding: 7px 10px; font-size: 13px; color: #334155; background: #fff; border: 0; cursor: pointer;
    }
    .client-combo-list button:hover, .client-combo-list button.active { background: #eff6ff; color: #1d4ed8; }
    .client-combo-list .empty { padding: 10px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="entrust-register.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <a href="entrust-register.html" class="cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">委托登记</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      委托编辑
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="space-y-4 p-4 pb-24">
    <!-- 样品信息 -->
    <section class="rounded bg-white p-4 shadow-sm" data-annotate="create-sample-table">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="flex items-center gap-2 text-sm font-semibold text-slate-800"><span class="h-4 w-1 rounded bg-blue-500"></span>样品信息</h2>
        <button onclick="openSampleModal()" class="rounded bg-blue-600 px-3 py-1 text-xs text-white hover:bg-blue-700">添加样品</button>
      </div>
      <div class="overflow-x-auto">
        <table class="data-table min-w-[1400px]" id="sampleInfoTable">
          <thead><tr>
            <th>序号</th><th>样品名称</th><th class="col-mark">产品标记</th><th>型号/分类</th><th>检测类别</th><th>试验项</th><th>数量</th><th>单价（元）</th><th>总价（元）</th><th>备注</th><th>操作</th>
          </tr></thead>
          <tbody id="sampleTableBody"></tbody>
        </table>
      </div>
      <div class="mt-3 flex items-center justify-end gap-2 text-sm text-slate-500">
        <span id="sampleTotalCount">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1 text-sm"><option>10 条/页</option></select>
      </div>
    </section>

    <!-- 合同信息 -->
    <section class="rounded bg-white p-4 shadow-sm" data-annotate="create-contract">
      <h2 class="mb-3 flex items-center gap-2 text-sm font-semibold text-slate-800"><span class="h-4 w-1 rounded bg-blue-500"></span>合同信息</h2>
      <div class="form-grid">
        <div class="form-item"><label>合同编号</label><select id="f_contractCode" onchange="applyContract(this.value)">
          <option value="">请选择合同编号</option>
          <option value="KJHT2025112001">KJHT2025112001</option>
          <option value="HT11213253">HT11213253</option>
        </select></div>
        <div class="form-item"><label>合同名称</label><input id="f_contractName" type="text" disabled placeholder="请先选择合同编号" /></div>
        <div class="form-item"><label>签订时间</label><input id="f_signDate" type="text" disabled placeholder="请先选择合同编号" /></div>
        <div class="form-item"><label>服务年限</label><input id="f_serviceYears" type="text" disabled placeholder="请先选择合同编号" /></div>
        <div class="form-item"><label>中标价</label><input id="f_bidPrice" type="text" disabled placeholder="请先选择合同编号" /></div>
        <div class="form-item span-full"><label>合同样品</label><textarea id="f_contractSample" rows="2" disabled placeholder="请先选择合同编号"></textarea></div>
      </div>
    </section>

    <!-- 委托信息 -->
    <section class="rounded bg-white p-4 shadow-sm">
      <h2 class="mb-3 flex items-center gap-2 text-sm font-semibold text-slate-800"><span class="h-4 w-1 rounded bg-blue-500"></span>委托信息</h2>
      <div class="form-grid">
        <div class="form-item" data-annotate="create-code"><label><span class="req">*</span> 委托编号</label><input id="f_code" type="text" readonly class="bg-slate-50" /></div>
        <div class="form-item" data-annotate="create-major-cat"><label><span class="req">*</span> 样品大类</label><input id="f_majorCat" type="text" readonly class="bg-slate-50" /></div>
        <div class="form-item"><label><span class="req">*</span> 任务类型</label><select id="f_taskType"><option value="">请选择</option><option value="electrical">电气（输配电类）</option><option value="electrical_lv">电气（低压电器类）</option><option value="electrical_ee">电气（电工电子产品类）</option><option value="electrical_seismic">电气（抗震检测类）</option><option value="material_safety">材料（安全工器具类）</option><option value="material_cable">材料（电线电缆、金具、金属材料类）</option></select></div>
        <div class="form-item"><label><span class="req">*</span> 优先等级</label><select id="f_priority"><option>常规</option><option>加急</option></select></div>
        <div class="form-item"><label>检测类型</label><select id="f_testType"><option>常规</option></select></div>
        <div class="form-item"><label>检测类别</label><select id="f_testCategory"><option>例行试验</option></select></div>
        <div class="form-item" data-annotate="create-client-unit"><label><span class="req">*</span> 客户单位</label>
          <div class="client-combo" id="customerCombo">
            <input id="f_customer_display" type="text" placeholder="请选择 / 输入名称或编码" autocomplete="off" />
            <input type="hidden" id="f_customer" />
            <div id="f_customer_list" class="client-combo-list"></div>
          </div>
        </div>
        <div class="form-item"><label>客户地址</label><input id="f_address" type="text" placeholder="请输入" /></div>
        <div class="form-item"><label>客户邮政编码</label><input id="f_zip" type="text" placeholder="请输入" /></div>
        <div class="form-item"><label><span class="req">*</span> 客户联系人</label><select id="f_contact"><option value="">请选择</option><option>安可</option></select></div>
        <div class="form-item"><label><span class="req">*</span> 客户联系方式</label><input id="f_phone" type="text" placeholder="请输入" /></div>
        <div class="form-item"><label><span class="req">*</span> 业务员</label><select id="f_salesman"><option value="">请选择</option><option>梁倩</option><option>业务员A</option></select></div>
        <div class="form-item"><label>签约地点</label><select id="f_signPlace"><option>湖北</option></select></div>
        <div class="form-item"><label><span class="req">*</span> 实验室检测中心</label><select id="f_lab"><option>应敏科技有限公司</option></select></div>
        <div class="form-item"><label><span class="req">*</span> 委托受理日期</label><input id="f_acceptDate" type="text" /></div>
        <div class="form-item"><label>客户要求完成日期</label><input id="f_requireDate" type="text" placeholder="请选择日期" /></div>
        <div class="form-item"><label><span class="req">*</span> 要求检测完成天数</label><input id="f_days" type="text" placeholder="请输入" /></div>
        <div class="form-item"><label><span class="req">*</span> 编制人</label><input id="f_editor" type="text" readonly class="bg-slate-50" value="admin" /></div>
        <div class="form-item"><label>代理单位</label><select id="f_agent"><option value="">请选择</option></select></div>
        <div class="form-item"><label>代理人联系方式</label><input id="f_agentPhone" type="text" placeholder="请输入" /></div>
        <div class="form-item span-full"><label>备注</label><textarea id="f_remark" rows="2" placeholder="请输入"></textarea></div>
      </div>
    </section>

    <!-- 付款信息 -->
    <section class="rounded bg-white p-4 shadow-sm">
      <h2 class="mb-3 flex items-center gap-2 text-sm font-semibold text-slate-800"><span class="h-4 w-1 rounded bg-blue-500"></span>付款信息</h2>
      <div class="form-grid">
        <div class="form-item"><label><span class="req">*</span> 样品检测总价(元)</label><input id="f_totalPrice" type="text" /></div>
        <div class="form-item"><label><span class="req">*</span> 实际费用(元)</label><input id="f_actualFee" type="text" /></div>
        <div class="form-item"><label><span class="req">*</span> 折扣率(%)</label><input id="f_discount" type="text" value="0" /></div>
        <div class="form-item"><label>付款单位</label><input id="f_payer" type="text" placeholder="请输入" /></div>
        <div class="form-item"><label>付款方式</label><select id="f_payMethod"><option value="">请选择</option><option>电汇</option><option>对公转账</option></select></div>
        <div class="form-item"><label>费用备注</label><input id="f_feeRemark" type="text" placeholder="请输入" /></div>
      </div>
    </section>

    <!-- 报告信息 -->
    <section class="rounded bg-white p-4 shadow-sm">
      <h2 class="mb-3 flex items-center gap-2 text-sm font-semibold text-slate-800"><span class="h-4 w-1 rounded bg-blue-500"></span>报告信息</h2>
      <div class="form-grid">
        <div class="form-item"><label>报告传送方式</label><select id="f_reportDelivery"><option>邮寄</option><option>自取</option></select></div>
        <div class="form-item"><label><span class="req">*</span> 报告资质</label><select id="f_reportQual"><option>CNAS CMA</option></select></div>
        <div class="form-item"><label>报告描述</label><select id="f_reportDesc"><option>全部生成一份</option></select></div>
        <div class="form-item"><label>报告数量</label><input id="f_reportCount" type="text" value="1" /></div>
        <div class="form-item"><label>结果方式</label><select id="f_resultType"><option>判定</option></select></div>
      </div>
    </section>
  </div>

  <!-- 底部固定操作栏 -->
  <div class="fixed bottom-0 left-0 right-0 z-30 flex items-center justify-between border-t border-slate-200 bg-white px-6 py-3 shadow-lg">
    <button class="flex items-center gap-1 text-sm text-blue-600 hover:text-blue-700"><i class="fa fa-paperclip"></i> 上传附件</button>
    <div class="flex items-center gap-3">
      <button class="rounded border border-slate-300 px-6 py-2 text-sm text-slate-600 hover:bg-slate-50">保存</button>
      <button onclick="openPreview()" class="rounded border border-slate-300 px-6 py-2 text-sm text-slate-600 hover:bg-slate-50">预览委托单</button>
      <button class="rounded bg-blue-600 px-6 py-2 text-sm text-white hover:bg-blue-700">提交</button>
    </div>
  </div>

  <!-- 添加样品弹窗 -->
  <div id="sampleModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="flex max-h-[92vh] w-[1100px] max-w-full flex-col rounded-lg bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">添加样品</h3>
        <button onclick="closeSampleModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <div class="modal-form-grid">
          <div class="modal-form-item"><label><span class="req">*</span> 样品名称</label>
            <div class="tree-select">
              <div class="ts-control" onclick="toggleSampleTree(event)">
                <span class="ts-text ph" id="m_sampleName_text">请选择样品名称</span>
                <i class="fa fa-angle-down ts-caret"></i>
              </div>
              <div class="ts-panel" id="m_sampleName_panel">
                <div class="ts-search"><i class="fa fa-search"></i><input id="m_sampleName_kw" placeholder="搜索关键字" oninput="renderSampleTree()" /></div>
                <div class="ts-tree" id="m_sampleName_tree"></div>
              </div>
              <input type="hidden" id="m_sampleName" />
            </div>
          </div>
          <div class="modal-form-item"><label>样品别名</label>
            <div class="ts-input-wrap" id="wrap_alias"><input id="m_alias" type="text" placeholder="请输入样品别名" /><i class="fa fa-times-circle ts-clear" onclick="clearAutoField('m_alias')"></i></div>
          </div>
          <!-- 有的样品不分型号，所以该字段要等选定样品名称、确认该样品有型号后才展示 -->
          <div class="modal-form-item" id="modelRow" style="display:none"><label><span class="req">*</span> 型号/分类</label>
            <select id="m_model" onchange="onModelChange()"><option value="">请选择型号/分类</option></select>
          </div>

          <!-- 规格参数：选中型号后出现（导体标称截面积 / 额定电压等，随型号配置变化） -->
          <div class="modal-form-item span-full" id="specRow" style="display:none"><label>规格参数：</label>
            <div class="spec-box" id="m_spec_box"></div>
          </div>

          <div class="modal-form-item"><label><span class="req">*</span> 检测类别</label>
            <select id="m_testCategory"><option value="">请选择检测类别</option></select>
          </div>
          <div class="modal-form-item"><label><span class="req">*</span> 样品数量</label><input id="m_qty" type="text" value="1" oninput="recalcSamplePrice()" /></div>
          <div class="modal-form-item"><label><span class="req">*</span> 样品单位</label>
            <select id="m_unit"><option value="">请选择样品单位</option></select>
          </div>

          <div class="modal-form-item"><label>样品单价(元)</label><input id="m_unitPrice" type="text" placeholder="请输入样品单价" oninput="recalcSamplePrice()" /></div>
          <div class="modal-form-item"><label><span class="req">*</span> 总价(元)</label><input id="m_totalPrice" type="text" placeholder="请输入总价" /></div>
          <div class="modal-form-item"><label>生产日期</label><input id="m_prodDate" type="text" placeholder="请选择日期" /></div>

          <div class="modal-form-item"><label>生产厂家</label><input id="m_factory" type="text" placeholder="请输入生产厂家" /></div>
          <div class="modal-form-item"><label>生产厂家地址</label><input id="m_factoryAddr" type="text" placeholder="请输入生产厂家地址" /></div>
          <div class="modal-form-item"><label>制造商</label><input id="m_manufacturer" type="text" placeholder="请输入制造商" /></div>

    (function applyEntrustFieldConfig() {

    // 样品单位：下拉选项来自字典 lims_sample_unit（件/根/个/盘），默认「件」
    var SAMPLE_UNIT_DEFAULT = '件';
    function sampleUnitOptions() {
      var list = [];

        list = MockDictStore.getActiveItems(MockDictStore.load(), 'lims_sample_unit').map(function (it) { return it.label; });
      }
      return list.length ? list : [SAMPLE_UNIT_DEFAULT];

    function fillSampleUnitOptions() {
      var sel = document.getElementById('m_unit');

      sel.innerHTML = '<option value="">请选择样品单位</option>' + sampleUnitOptions().map(function (u) {

    // 样品数据里维护了单位且在选项内则带出，否则回到默认「件」
    function setSampleUnit(unit) {
      var sel = document.getElementById('m_unit');
      if (!sel) return;

      var want = (unit && list.indexOf(unit) >= 0) ? unit : SAMPLE_UNIT_DEFAULT;

    function findCustomer(nameOrId) {
      if (!nameOrId || !window.CustomerStore) return null;

    function applyCustomer(c, fillAddr) {
      var hidden = document.getElementById('f_customer');
      var display = document.getElementById('f_customer_display');
      if (!hidden || !display) return;
      if (!c) {
        hidden.value = '';
        display.value = '';

      display.value = CustomerStore.displayLabel(c);

        var addr = document.getElementById('f_address');

    function bindCustomerCombo() {
      var combo = document.getElementById('customerCombo');
      var display = document.getElementById('f_customer_display');
      var listEl = document.getElementById('f_customer_list');
      if (!combo || !display || !window.CustomerStore) return;

      function renderList(q) {
        q = (q || '').toLowerCase();
        var list = CustomerStore.loadCustomers().filter(function (c) {
          if (!q) return true;
          return (c.name || '').toLowerCase().indexOf(q) >= 0 || (c.code || '').toLowerCase().indexOf(q) >= 0;
        });
        if (!list.length) {
          listEl.innerHTML = '<div class="empty">无匹配客户</div>';
          return;
        }
        listEl.innerHTML = list.map(function (c) {
          return '<button type="button" data-id="' + c.id + '">' + CustomerStore.displayLabel(c) + '</button>';
        }).join('');
      }

      display.addEventListener('focus', function () {
        combo.classList.add('open');
        renderList(display.value.replace(/（.*）$/, ''));
      });
      display.addEventListener('input', function () {
        document.getElementById('f_customer').value = '';
        combo.classList.add('open');
        renderList(display.value);
      });

        var btn = e.target.closest('button[data-id]');
        if (!btn) return;
        applyCustomer(findCustomer(btn.getAttribute('data-id')), true);
        combo.classList.remove('open');
      });
      document.addEventListener('click', function (e) {
        if (!combo.contains(e.target)) combo.classList.remove('open');
      });

    bindCustomerCombo();

    // 树容器内部点击不冒泡到 document，避免重绘后误判成「点了外面」

      if (e.target.closest && e.target.closest('.tree-select')) return;
      closeSampleTree();
    });
    // 样品试验项 mock 已迁至 js/sample-data-store.js（与「样品数据」模块同源，弹窗不再自带一份）

    function fillForm(data) {

    function renderSamples(samples) {
      var tbody = document.getElementById('sampleTableBody');
      document.getElementById('sampleTotalCount').textContent = '共 ' + samples.length + ' 条';
      // 只要有一行样品开启了产品标记就保留该列；全部关闭时整列隐藏

          '<td>' + esc(s.qty || '') + '</td><td>' + esc(s.price || '') + '</td><td>' + esc(s.total || '') + '</td>' +
          '<td>' + esc(s.remark || '') + '</td>' +
          '<td class="whitespace-nowrap"><button onclick="editSample(' + i + ')" class="text-blue-600 hover:underline"><i class="fa fa-pencil"></i> 编辑</button> ' +
          '<button onclick="deleteSample(' + i + ')" class="ml-2 text-red-500 hover:underline"><i class="fa fa-trash-o"></i> 删除</button></td></tr>';
      }).join('');
      syncTotalPriceFromSamples(samples);

    function esc(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function syncTotalPriceFromSamples(samples) {
      var sum = samples.reduce(function (acc, s) { return acc + (parseFloat(s.total) || 0); }, 0);
      document.getElementById('f_totalPrice').value = String(sum);
      document.getElementById('f_actualFee').value = String(sum);
      if (window._formData) window._formData.totalPrice = String(sum);
    }

    /* ===== 样品名称：树形下拉（结构 = 样品数据左侧树：大类 › 类别 › 额定电压 › 标准 › 材质 › 样品） ===== */
    var sampleTreeState = { open: {}, selectedId: '', kw: '' };

    function currentSampleCat() { return window._majorCat || 'dlwz'; }
    function store() { return window.SampleDataStore || null; }
    function currentSample() { var st = store(); return st ? st.getSample(sampleTreeState.selectedId) : null; }

    function treeRoots() {
      var st = store(); if (!st) return [];
      var cat = currentSampleCat();
      return [{ id: '__cat__' + cat, label: st.CAT_LABELS[cat] || '样品分类', children: st.getTree(cat) }];
    }
    function filterNodes(nodes, kw) {
      if (!kw) return nodes;
      var out = [];
      (nodes || []).forEach(function (n) {
        var kids = filterNodes(n.children, kw);
        if (n.label.indexOf(kw) >= 0 || kids.length) {
          var c = {}; Object.keys(n).forEach(function (k) { c[k] = n[k]; });
          c.children = kids; out.push(c);
        }
      });
      return out;
    }
    function toggleSampleTree(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      var panel = document.getElementById('m_sampleName_panel');
      var open = panel.classList.contains('open');
      panel.classList.toggle('open', !open);
      if (!open) { renderSampleTree(); document.getElementById('m_sampleName_kw').focus(); }
    }
    function closeSampleTree() {
      var panel = document.getElementById('m_sampleName_panel');
      if (panel) panel.classList.remove('open');
    }
    function toggleSampleNode(id) { sampleTreeState.open[id] = !sampleTreeState.open[id]; renderSampleTree(); }
    function renderSampleTree() {
      var box = document.getElementById('m_sampleName_tree');
      var st = store(); if (!st) { box.innerHTML = '<div class="ts-empty">样品数据未加载</div>'; return; }
      var kw = (document.getElementById('m_sampleName_kw').value || '').trim();
      sampleTreeState.kw = kw;
      var html = '';
      function walk(nodes, depth) {
        nodes.forEach(function (n) {
          var kids = n.children || [];
          var leaf = n.leaf === true || !kids.length;
          var open = !!sampleTreeState.open[n.id] || !!kw;
          var pad = 10 + depth * 16;
          if (leaf && kids.length) {
            // 有子节点但未定义为叶子的分类节点，按可展开处理
            leaf = false;
          }
          if (leaf) {
            var active = sampleTreeState.selectedId === n.id ? ' is-active' : '';
            html += '<div class="ts-node leaf' + active + '" style="padding-left:' + (pad + 18) + 'px" onclick="selectSampleName(\'' + n.id + '\')"><span class="ts-lbl">' + esc(n.label) + '</span></div>';
          } else {
            html += '<div class="ts-node branch" style="padding-left:' + pad + 'px" onclick="toggleSampleNode(\'' + n.id + '\')">' +
              '<span class="ts-tw"><i class="fa fa-caret-' + (open ? 'down' : 'right') + '"></i></span>' +
              '<span class="ts-lbl">' + esc(n.label) + '</span></div>';
            if (open) walk(kids, depth + 1);
          }
        });
      }
      walk(filterNodes(treeRoots(), kw), 0);
      box.innerHTML = html || '<div class="ts-empty">无匹配样品</div>';
    }
    function findLeafIdByName(name) {
      var st = store(); if (!st || !name) return '';
      var found = '';
      Object.keys(st.TREES).forEach(function (cat) {
        (function walk(nodes) {
          (nodes || []).forEach(function (n) {
            if (!found && n.label === name) found = n.id;
            walk(n.children);
          });
        })(st.getTree(cat));
      });
      return found;
    }
    function setAutoField(inputId, wrapId, val) {
      var el = document.getElementById(inputId);
      el.value = val || '';
      syncWrap(inputId, wrapId);
    }
    function syncWrap(inputId, wrapId) {
      var w = document.getElementById(wrapId);
      if (w) w.classList.toggle('has-value', !!(document.getElementById(inputId).value || '').trim());
    }
    function clearAutoField(inputId) {
      setAutoField(inputId, 'wrap_alias', '');
    }
    // 型号/分类行三种状态：hidden 未选样品不展示 / select 有型号需选择 / none 不分型号只读提示
    function setModelRow(mode) {
      var row = document.getElementById('modelRow');
      if (!row) return;
      row.style.display = mode === 'hidden' ? 'none' : '';
      var req = row.querySelector('.req');
      if (req) req.style.display = mode === 'select' ? '' : 'none';
    }

    function shortSpecLabel(title) {
      return String(title || '').replace(/^规格参数\d+:/, '').replace(/\s*[\(（].*$/, '');
    }
    function selectSampleName(id) {
      var st = store();
      var sample = st ? st.getSample(id) : null;
      var label = st ? (st.leafLabel(currentSampleCat(), id) || (sample && sample.name) || '') : '';
      if (!label) return;
      sampleTreeState.selectedId = id;
      document.getElementById('m_sampleName').value = id;
      var txt = document.getElementById('m_sampleName_text');
      txt.textContent = label; txt.classList.remove('ph');
      closeSampleTree();
      // 图二/图三：选完样品名称，自动带出「样品别名 = 样品名称」「样品单位 = 样品数据维护的单位」
      setAutoField('m_alias', 'wrap_alias', label);
      setSampleUnit((sample && sample.unit) || '');
      // 型号/分类下拉 = 该样品在样品数据里维护的型号；不分型号的样品不出现该字段
      var models = st ? st.modelsOf(sample) : [];
      var sel = document.getElementById('m_model');
      setModelRow(models.length ? 'select' : (sample ? 'none' : 'hidden'));
      if (models.length) {
        sel.innerHTML = '<option value="">请选择型号/分类</option>' + models.map(function (m) {
          return '<option value="' + esc(m.code) + '">' + esc(m.label) + '</option>';
        }).join('');
        sel.disabled = false;
      } else {
        sel.innerHTML = '<option value="">该样品不分型号</option>';
        sel.disabled = true;
      }
      document.getElementById('specRow').style.display = 'none';
      document.getElementById('m_spec_box').innerHTML = '';
      // 图二：未选型号前，选择样品试验为空；不分型号的样品直接带出试验项
      window._currentTests = models.length ? [] : ((sample && sample.tests) || []);
      renderTestTable(window._currentTests, true);
    }
    function onModelChange() {
      var st = store();
      var sample = currentSample();
      var code = document.getElementById('m_model').value;
      var row = document.getElementById('specRow');
      var box = document.getElementById('m_spec_box');
      var model = (st && sample) ? st.modelOf(sample, code) : null;
      if (!model) {
        row.style.display = 'none'; box.innerHTML = '';
        window._currentTests = [];
        renderTestTable([], false);
        return;
      }
      // 统一走 SampleSpecUI.specsOf：兼容样品数据里「title 写法」与「name+unit 写法」，
      // 保证每个规格参数都把参数名完整显示出来（之前导管这类用 name+unit 的样品标签渲染成了空）
      var specs = window.SampleSpecUI ? SampleSpecUI.specsOf(sample, code) : (model.specs || []).map(function (sp) {
        return { name: sp.name || '', unit: sp.unit || '', options: sp.options || [] };
      });
      box.innerHTML = specs.map(function (sp, i) {
        var opts = sp.options || [];
        var label = window.SampleSpecUI ? SampleSpecUI.label(sp) : (sp.name + (sp.unit ? '（' + sp.unit + '）' : ''));
        return '<div class="spec-item"><span title="' + esc(label) + '">' + esc(label) + '</span>' +
          '<select id="m_spec_' + i + '">' +
          (opts.length > 1 ? '<option value="">请选择</option>' : '') +
          opts.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') +
          '</select></div>';
      }).join('');
      row.style.display = specs.length ? '' : 'none';
      // 图三：候选值唯一的规格参数自动带出（额定电压 8.7/10），多值的仍需手选（导体标称截面积）
      specs.forEach(function (sp, i) {
        var el = document.getElementById('m_spec_' + i);
        if (el && (sp.options || []).length === 1) el.value = sp.options[0];
      });
      window._currentTests = model.tests || [];
      renderTestTable(window._currentTests, true); // 图四：试验项默认全选
    }

    function renderTestTable(tests, checked) {
      var tbody = document.getElementById('testTableBody');
      var all = document.getElementById('testCheckAll');
      if (!tests.length) {
        var tip = !document.getElementById('m_sampleName').value ? '请先选择样品名称'
          : (document.getElementById('m_model').disabled ? '该样品暂无试验项' : '请先选择型号/分类');
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">' + tip + '</td></tr>';
        all.checked = false;
        recalcSamplePrice();
        return;
      }
      var checkedNames = Array.isArray(checked) ? checked : null;
      tbody.innerHTML = tests.map(function (t, i) {
        var on = checkedNames ? (checkedNames.indexOf(t.name) >= 0 ? ' checked' : '') : (checked !== false ? ' checked' : '');
        var req = t.req || t.requirement || '';
        return '<tr><td class="text-center"><input type="checkbox" class="test-check" data-index="' + i + '"' + on + ' onchange="recalcSamplePrice()" /></td>' +
          '<td class="max-w-xs truncate" title="' + esc(t.name) + '">' + esc(t.name) + '</td>' +
          '<td>' + (t.price || 0) + '</td>' +
          '<td class="max-w-xs truncate" title="' + esc(t.basis) + '">' + esc(t.basis || '') + '</td>' +
          '<td class="max-w-xs truncate" title="' + esc(req) + '">' + esc(req) + '</td>' +
          '<td>' + (t.qty || 1) + '</td><td>' + esc(t.remark || '') + '</td></tr>';
      }).join('');
      all.checked = checkedNames ? tests.every(function (t) { return checkedNames.indexOf(t.name) >= 0; }) : checked !== false;
      recalcSamplePrice();
    }

    function toggleAllTests(checked) {
      document.querySelectorAll('.test-check').forEach(function (cb) { cb.checked = checked; });
      recalcSamplePrice();
    }

    function getSelectedTests() {
      var tests = window._currentTests || [];
      var selected = [];
      document.querySelectorAll('.test-check').forEach(function (cb) {
        if (cb.checked) selected.push(tests[parseInt(cb.getAttribute('data-index'), 10)]);
      });
      return selected;
    }

    function recalcSamplePrice() {
      var selected = getSelectedTests();
      var unitPrice = selected.reduce(function (sum, t) { return sum + (t.price || 0); }, 0);
      document.getElementById('m_unitPrice').value = String(unitPrice);
      var qty = parseFloat(document.getElementById('m_qty').value) || 1;
      document.getElementById('m_totalPrice').value = String(unitPrice * qty);
      var all = document.querySelectorAll('.test-check');
      var checked = document.querySelectorAll('.test-check:checked');
      document.getElementById('testCheckAll').checked = all.length > 0 && checked.length === all.length;
    }

    function resetSampleModal() {
      editingSampleIndex = -1;
      sampleTreeState = { open: {}, selectedId: '', kw: '' };
      ['m_alias','m_testCategory','m_factory','m_manufacturer','m_factoryAddr','m_manufacturerAddr',
        'm_prodDate','m_prepQty','m_sort','m_length','m_remark','m_unitPrice','m_totalPrice'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('m_sampleName').value = '';
      var txt = document.getElementById('m_sampleName_text');
      txt.textContent = '请选择样品名称'; txt.classList.add('ph');
      document.getElementById('m_sampleName_kw').value = '';
      var sel = document.getElementById('m_model');
      sel.innerHTML = '<option value="">请选择型号/分类</option>'; sel.disabled = false; sel.value = '';
      setModelRow('hidden');
      document.getElementById('specRow').style.display = 'none';
      document.getElementById('m_spec_box').innerHTML = '';
      syncWrap('m_alias', 'wrap_alias');
      setSampleUnit('');
      document.getElementById('m_qty').value = '1';
      document.getElementById('m_status').value = '完好';
      document.getElementById('m_needPrep').value = '否';
      closeSampleTree();
      window._currentTests = [];
      renderTestTable([], false);
    }

    function openSampleModal(index) {
      resetSampleModal();
      if (typeof index === 'number' && index >= 0) {
        editingSampleIndex = index;
        var s = window._formData.samples[index];
        var id = s.sampleId || findLeafIdByName(s.name);
        if (id) selectSampleName(id); else setModelRow('hidden');
        document.getElementById('m_alias').value = s.alias || '';
        syncWrap('m_alias', 'wrap_alias');
        setSampleUnit(s.unit);
        document.getElementById('m_testCategory').value = s.testCategory || '';
        document.getElementById('m_qty').value = s.qty || '1';
        document.getElementById('m_factory').value = s.factory || '';
        document.getElementById('m_manufacturer').value = s.manufacturer || '';
        document.getElementById('m_remark').value = s.remark || '';
        if (s.modelCode) {
          var sel = document.getElementById('m_model');
          if (!sel.disabled) {
            sel.value = s.modelCode;
            onModelChange();
            (s.specValues || []).forEach(function (v, i) {
              var el = document.getElementById('m_spec_' + i);
              if (el && v) el.value = v;
            });
          }
        }
        var names = (s.tests || []).map(function (t) { return t.name; });
        if (names.length) renderTestTable(window._currentTests, names);
        recalcSamplePrice();
      }
      showModal('sampleModal');
    }

    function closeSampleModal() { hideModal('sampleModal'); }

    function confirmSample() {
      var st = store();
      var id = document.getElementById('m_sampleName').value;
      var picked = st ? st.getSample(id) : null;
      var name = st ? (st.leafLabel(currentSampleCat(), id) || (picked && picked.name) || '') : '';
      var unit = document.getElementById('m_unit').value.trim();
      var category = document.getElementById('m_testCategory').value;
      var modelCode = document.getElementById('m_model').value;
      var hasModels = !!(st && st.modelsOf(picked).length);
      if (!name) { alert('请选择样品名称'); return; }
      if (hasModels && !modelCode) { alert('请选择型号/分类'); return; }
      if (!unit) { alert('请输入样品单位'); return; }
      if (!category) { alert('请选择检测类别'); return; }
      var selectedTests = getSelectedTests();
      if (!selectedTests.length) { alert('请至少选择一项样品试验'); return; }

      var specValues = [], specText = [];
      for (var i = 0; ; i++) {
        var el = document.getElementById('m_spec_' + i);
        if (!el) break;
        specValues.push(el.value);
        if (el.value) specText.push(el.value);
      }
      var model = (st && picked && modelCode) ? st.modelOf(picked, modelCode) : null;
      var alias = document.getElementById('m_alias').value.trim() || name;
      var qty = document.getElementById('m_qty').value || '1';
      var unitPrice = document.getElementById('m_unitPrice').value || '0';
      var total = document.getElementById('m_totalPrice').value || unitPrice;

      var sample = {
        sampleId: id,
        name: name,
        alias: alias,
        modelCode: modelCode,
        modelName: model ? model.name : '',
        spec: [modelCode].concat(specText).filter(Boolean).join(' '),
        specValues: specValues,
        mark: st ? st.markOf(id, modelCode, specValues) : '',
        unit: unit,
        testCategory: category,
        items: selectedTests.map(function (t) { return t.name; }).join(','),
        qty: qty,
        price: unitPrice,
        total: total,
        factory: document.getElementById('m_factory').value,
        manufacturer: document.getElementById('m_manufacturer').value,
        remark: document.getElementById('m_remark').value,
        tests: selectedTests
      };

      if (!window._formData.samples) window._formData.samples = [];
      if (editingSampleIndex >= 0) {
        window._formData.samples[editingSampleIndex] = sample;
      } else {
        window._formData.samples.push(sample);
      }
      renderSamples(window._formData.samples);
      closeSampleModal();
    }

    function editSample(index) { openSampleModal(index); }

    function deleteSample(index) {
      if (!confirm('确定删除该样品吗？')) return;
      window._formData.samples.splice(index, 1);
      renderSamples(window._formData.samples);
    }

    function showModal(id) {
      var m = document.getElementById(id);
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function hideModal(id) {
      var m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function todayStr() {
      var d = new Date();
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    (function init() {
      var params = getParams();
      var catMap = {
        dlwz: { name: '电力物资类', nextCode: 'SC2026/0210' },
        aqgqj: { name: '安全工器具类', nextCode: 'AQJYST-260013' },
        hjjc: { name: '环境检测', nextCode: 'SC2026/0006' },
        gcjc: { name: '工程检测', nextCode: 'SC2026/0010' }
      };
      var cat = catMap[params.cat] || catMap.dlwz;
      var data = (params.mode === 'copy') ? JSON.parse(JSON.stringify(copyData)) : JSON.parse(JSON.stringify(manualData));
      if (params.mode === 'copy' && params.cat && params.cat !== 'aqgqj') {
        data.samples = [];
      }
      if (params.mode !== 'edit') {
        data.code = params.code || cat.nextCode;
      } else if (params.code) {
        data.code = params.code;
      }
      data.majorCat = cat.name;
      if (params.mode !== 'edit') data.acceptDate = todayStr();
      fillForm(data);
      applyContract(data.contractCode || '');
      var catEl = document.getElementById('f_majorCat');
      if (catEl) catEl.value = cat.name;
      window._formData = data;
      window._majorCat = params.cat || 'dlwz';
    })();

    function openPreview() {
      var d = window._formData || manualData;
      var code = document.getElementById('f_code').value || d.code;
      var customer = selectedCustomerName() || d.customer;
      var contact = document.getElementById('f_contact').value || d.contact || '安可';
      var phone = document.getElementById('f_phone').value || d.phone || '17835503262';
      var fee = document.getElementById('f_actualFee').value || d.actualFee || '0';
      var acceptDate = document.getElementById('f_acceptDate').value || d.acceptDate;
      var requireDate = document.getElementById('f_requireDate').value || d.requireDate || '';
      var salesman = document.getElementById('f_salesman').value || d.salesman;
      var firstSample = (d.samples && d.samples[0]) ? d.samples[0] : null;
      var sampleName = firstSample ? (firstSample.alias || firstSample.name) : '绝缘操作杆';
      var samplePrice = firstSample ? firstSample.price : '0';
      var sampleItems = firstSample ? firstSample.items : '';

      document.getElementById('previewContent').innerHTML =
        '<div style="text-align:center;font-size:18px;font-weight:bold;margin-bottom:12px">检测委托合同（电气类）</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">' +
          '<span>杭州数蚕智能科技有限公司</span><span>合同编号：' + code + '</span><span>第1页 共2页</span></div>' +
        '<table><tr><td width="50%">委托方：' + (customer || '') + '</td><td>报告发送方式：☑邮寄 ☐自取 ☐传真 ☐E-mail</td></tr>' +
        '<tr><td>地址：' + (d.address || '') + '</td><td>付款方式：☑电汇 ☐支票 ☐现金</td></tr>' +
        '<tr><td>委托日期：' + acceptDate + '</td><td>联系人：' + contact + '　电话：' + phone + '</td></tr>' +
        '<tr><td>客户要求时间：' + requireDate + '</td><td>经办人：' + salesman + '　检测类型：☑委托检测</td></tr></table>' +
        '<p style="margin:8px 0"><b>检测费用：</b>合计金额：' + fee + '元</p>' +
        '<div style="text-align:center;font-size:16px;font-weight:bold;margin:16px 0 8px">委托内容明细表</div>' +
        '<table><tr><th>序号</th><th>样品名称</th><th>型号规格</th><th>数量</th><th>检测项目</th><th>单价</th><th>总价</th></tr>' +
        '<tr><td>1</td><td>' + sampleName + '</td><td>' + (firstSample ? firstSample.spec || '' : '') + '</td><td>' + (firstSample ? firstSample.qty || '1' : '1') + '</td><td>' + sampleItems + '</td><td>' + samplePrice + '</td><td>' + (firstSample ? firstSample.total || samplePrice : samplePrice) + '</td></tr></table>';

      showModal('previewModal');
    }

    function closePreview() { hideModal('previewModal'); }

    ['previewModal', 'sampleModal'].forEach(function (id) {
      document.getElementById(id).addEventListener('click', function (e) {
        if (e.target === this) hideModal(id);
      });
    });

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({
        annotations: [
          {
            id: 'create-contract',
            selector: '[data-annotate="create-contract"]',
            position: 'bottom-right',
            title: '合同信息带出与置灰',
            wide: true,
            content: '<strong>需求逻辑：</strong>合同信息不由登记人手工填写，只能由「合同编号」带出，避免与合同台账不一致。<br><strong>展示规则：</strong>未选合同编号时，合同名称 / 签订时间 / 服务年限 / 中标价 / 合同样品 全部禁用置灰、内容为空，占位提示「请先选择合同编号」；选中后自动带出对应值并保持只读；合同里没维护的项显示「合同未维护该信息」。<br><strong>交互逻辑：</strong>切换合同编号即重新带出；把合同编号改回「请选择合同编号」则清空这五个字段并继续禁用。数据来源与「合同管理 › 框架合同」一致。',
            tag: '委托编辑'
          },
          {
            id: 'create-sample-table',

            position: 'bottom-right',
            title: '样品信息表列与产品标记',
            wide: true,
            content: '<strong>需求逻辑：</strong>样品明细以「一行一个样品」维护；产品标记按样品数据里配置的产品标记规则实时拼装（型号 + 规格参数取值 + 芯数 + 标准号），不由登记人填写。<br><strong>展示规则：</strong>列为序号、样品名称、<strong>产品标记</strong>、型号/分类、检测类别、试验项、数量、单价（元）、总价（元）、备注、操作。其中「产品标记」仅在样品数据的产品标记开关开启时展示，位置固定在「样品名称」与「型号/分类」之间；本委托内所有样品都关闭时整列隐藏；开关开启但未配置规则时显示「未配置规则」。样品名称为树形下拉，层级与样品数据左侧树一致，只列当前委托锁定的大类；<strong>「型号/分类」字段在选定样品名称后才展示</strong>（部分样品不分型号，未选样品前无法判断）。<br><strong>交互逻辑：</strong>点「添加样品」→ 树形下拉选样品名称（点分类节点只展开/收起，下拉不关闭）→ 带出别名/单位/样品单位 → 该样品有型号时展示必填「型号/分类」，选型号后出现规格参数并自动加载试验项；不分型号的样品不展示型号字段、直接带出其试验项；确定后写入本表，可编辑、删除；金额按勾选试验项单价合计自动计算。',

          },
          {
            id: 'create-code',
            selector: '[data-annotate="create-code"]',
            position: 'top-right',
            title: '委托编号（按大类规则生成）',
            wide: true,
            content: '<strong>需求逻辑：</strong>委托号必须在选定样品大类后生成，才能命中该大类编号规则，使单号体现电力 / 环境等业务属性。<br><strong>展示规则：</strong>只读。电力物资类示例 SC2026/0210；安全工器具类示例 AQJYST-260013（前缀与分类码按该大类规则）。<br><strong>交互逻辑：</strong>登记入口已选定大类后带入，本页不可改号、不可换大类。复制任务也不沿用源单旧号。',
            tag: '委托编辑'
          },
          {
            id: 'create-major-cat',
            selector: '[data-annotate="create-major-cat"]',
            position: 'top-right',
            title: '样品大类（登记锁定）',
            wide: true,
            content: '<strong>需求逻辑：</strong>一个委托单只对应一个大类。登记时前置选择后锁定，后续样品必须属于该大类。<br><strong>展示规则：</strong>只读，回显登记弹窗所选大类。<br><strong>交互逻辑：</strong>不可在编辑页改大类。若选错大类需作废本单后重新登记。添加样品时仅可选该大类下的样品主数据。',
            tag: '委托编辑'
          },
          {
            id: 'create-client-unit',
            selector: '[data-annotate="create-client-unit"]',
            position: 'bottom-right',
            title: '委托单位（带单位编码）',
            wide: true,
            content: '<strong>需求逻辑：</strong>客户管理允许同名同地区并存，下拉只显示名称会分不清点哪一家。选择客户时必须能看到单位编码。<br><strong>展示规则：</strong>选项与选中态均为「单位名称（单位编码）」，如 杭州数蚕智能科技有限公司（121001）。预览/套打仍只打名称。<br><strong>交互逻辑：</strong>输入名称或编码均可过滤。选中后回填地址、邮编、联系人。取值仍是客户 id。',
            tag: '委托编辑'
          }
        ]
      });
    }
  </script>
