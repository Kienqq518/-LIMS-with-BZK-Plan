<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>还样确认 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    /* 变更删掉的样品：没有还样动作，整行灰到底并标「已删除」 */
    #returnRecordModal tr.is-deleted { background: #fbfcfe; color: #b6bcc7; }
    #returnRecordModal tr.is-deleted td { border-color: #f1f3f7; }
    .del-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px;
      background: #fdeeee; color: #cf1322; font-size: 11px; line-height: 16px; }
    .thumb-strip { display: flex; flex-wrap: wrap; gap: 4px; }
    .thumb { width: 40px; height: 40px; border-radius: 3px; overflow: hidden; border: 1px solid #e2e8f0; background: #f1f5f9; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cell-none { color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">

  <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto border-b border-slate-200 bg-white px-4 pt-2 text-sm whitespace-nowrap" data-close-target="dashboard.html">
    <a href="dashboard.html" class="tab-workbench cursor-pointer rounded-t px-3 py-1.5 text-slate-500 hover:text-slate-700">工作台</a>
    <span class="tab-active flex items-center gap-2 rounded-t border border-b-0 border-slate-200 bg-white px-3 py-1.5 text-blue-600">
      还样确认
      <i class="tab-close fa fa-times-circle cursor-pointer text-xs text-slate-400 hover:text-slate-600"></i>
    </span>
  </div>

  <div class="p-4">
    <div class="rounded bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-x-6 gap-y-3 md:grid-cols-3">
        <div class="flex items-center gap-2">
          <label class="w-24 flex-shrink-0 text-right text-sm text-slate-600">委托编号</label>
          <input type="text" placeholder="请输入委托编号" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-24 flex-shrink-0 text-right text-sm text-slate-600">样品名称</label>
          <input type="text" placeholder="请输入样品名称" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <label class="w-24 flex-shrink-0 text-right text-sm text-slate-600">客户单位</label>
          <input type="text" placeholder="请输入客户单位" class="flex-1 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
        </div>
        <div class="flex items-center gap-2 md:col-span-3 md:justify-end">
          <button class="flex items-center gap-1 rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700"><i class="fa fa-search"></i>查询</button>
          <button class="flex items-center gap-1 rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50"><i class="fa fa-refresh"></i>重置</button>
        </div>
      </div>
    </div>

    <div class="mt-4 rounded bg-white p-4 shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1200px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">委托编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">合同编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">客户单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">任务状态</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">编制人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">业务员</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作记录</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 还样记录弹窗 -->
  <div id="returnRecordModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[90vh] w-[820px] max-w-full flex-col rounded-lg bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-3">
        <h3 class="text-base font-medium text-slate-800">还样记录</h3>
        <button onclick="closeReturnRecordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <table class="w-full border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称(数量)</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">图片</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">还样人</th>
              <th class="border border-slate-200 px-3 py-2 font-medium" data-annotate="return-date-col">还样日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">还样退库确认表</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="recordModalBody"></tbody>
        </table>
        <div class="mt-4 rounded border border-blue-100 bg-blue-50 px-4 py-3 text-xs text-blue-800 leading-relaxed" data-annotate="return-writeback">
          <strong>流转单回填（还样确认）：</strong>检测流程 = 还样人部门 +「还样」；签名/日期 = 还样人电子签名 + 上表<strong>还样日期</strong>。多检测员还样各回填一行。
        </div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-100 px-6 py-3">
        <button onclick="closeReturnRecordModal()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">取消</button>
        <button onclick="approveAll()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700" data-annotate="approve-all">全部通过</button>
      </div>
    </div>
  </div>

  <script src="js/tab-bar.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/entrust-mock.js"></script>
  <script src="js/receive-store.js"></script>
  <script src="js/receive-history-mock.js"></script>
  <script src="js/image-viewer.js?v=2"></script>
  <script src="js/sample-cat-filter.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    var TESTERS = {
      '潘哲宁': { dept: '电气试验室' },
      '李四': { dept: '力学试验室' },
      'admin': { dept: '电气试验室' }
    };

    var listData = [
      { code: 'SC2026/0082', contract: 'SC2026/0082', customer: '杭州数蚕智能科技有限公司', sample: '安全带、安全绳', status: '任务完成', editor: 'admin', salesman: '梁倩',
        records: [
          { name: '安全带(1)安全绳(1)', returner: 'admin', returnDate: '2026-07-13', doc: 'SC2026/0082还样退库确认表.docx', confirmed: false },
          { name: '绝缘操作杆(1)', returner: '潘哲宁', returnDate: '2026-07-13', doc: 'SC2026/0082还样退库确认表.docx', confirmed: false }
        ]
      },
      { code: 'SC2026/0075', contract: '/', customer: '东集西造有限公司', sample: '安全帽', status: '任务完成', editor: 'admin', salesman: '业务员A',
        records: [{ name: '安全帽(2)', returner: '李四', returnDate: '2026-07-10', doc: 'SC2026/0075还样退库确认表.docx', confirmed: false }]
      }
    ];

    // 公共字段（委托单位 / 样品 / 日期 / 编制人 / 业务员 / 任务类型…）统一取自 js/entrust-mock.js，
    // 保证「列表看到的」与「点进详情页看到的」是同一份数据
    EntrustMock.enrich(listData);

    // 委托确认退回委托登记、变更删掉样品的委托：被删的样品不走收样也不走还样，
    // 要在退样环节做退样处理，因此连同其收样时上传的图片一起出现在还样记录里
    if (window.ReceiveHistory && ReceiveHistory.RETURN_REDO) {
      ReceiveHistory.RETURN_REDO.filter(function (e) { return (e.removed || []).length; }).forEach(function (e) {
        listData.push({
          code: e.code, contract: e.contract, customer: e.customer,
          sample: e.kept.map(function (sn) { return sn.name; }).join('、'),
          status: e.status, editor: e.editor, salesman: e.salesman,
          records: ReceiveHistory.redoReturnRecords(e)
        });
      });
    }

    var currentIndex = -1;

    function renderTable() {
      document.getElementById('tableBody').innerHTML = listData.map(function (item, i) {
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2.5">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="entrust-detail.html?code=' + encodeURIComponent(item.code) + '" class="text-blue-600 hover:underline">' + item.code + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">' + item.contract + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.customer + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.sample + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.status + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.editor + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + item.salesman + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' +
            '<button onclick="openReturnRecordModal(' + i + ')" class="text-blue-600 hover:underline" data-annotate="return-record-link"><i class="fa fa-list"></i> 还样记录</button>' +
          '</td></tr>';
      }).join('');
    }

    function renderRecordModal() {
      var item = listData[currentIndex];
      document.getElementById('recordModalBody').innerHTML = item.records.map(function (r, ri) {
        // 变更删掉的样品：没有还样动作 → 还样人 / 还样日期 / 还样退库确认表都是「/」，
        // 图片沿用收样时上传的，样品名称(数量)后标「已删除」，不参与确认
        if (r.deleted) {
          var pics = (r.images || []).length
            ? '<div class="thumb-strip">' + r.images.map(function (u) {
                return '<span class="thumb" data-img-src="' + u + '" data-img-name="' + r.name + ' 收样图片" title="' + u.split('/').pop() + '（点击看大图）">' +
                  '<img src="' + u + '" alt="收样图片" /></span>';
              }).join('') + '</div>'
            : '<span class="cell-none">/</span>';
          return '<tr class="is-deleted">' +
            '<td class="border border-slate-200 px-3 py-2.5">' + r.name + '<span class="del-tag">已删除</span></td>' +
            '<td class="border border-slate-200 px-3 py-2.5">' + pics + '</td>' +
            '<td class="border border-slate-200 px-3 py-2.5 cell-none">/</td>' +
            '<td class="border border-slate-200 px-3 py-2.5 cell-none">/</td>' +
            '<td class="border border-slate-200 px-3 py-2.5 cell-none">/</td>' +
            '<td class="border border-slate-200 px-3 py-2.5 text-center cell-none">/</td></tr>';
        }
        var confirmBtn = r.confirmed
          ? '<span class="text-green-600"><i class="fa fa-check-circle"></i></span>'
          : '<button onclick="confirmOne(' + ri + ')" class="text-blue-600 hover:text-blue-700" data-annotate="confirm-one" title="确认"><i class="fa fa-check"></i></button>';
        return '<tr>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + r.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-slate-400 text-xs">暂无图片</td>' +
          '<td class="border border-slate-200 px-3 py-2.5">' + r.returner + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5 font-medium text-orange-700">' + r.returnDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2.5"><a href="#" class="text-blue-600 hover:underline">' + r.doc + '</a></td>' +
          '<td class="border border-slate-200 px-3 py-2.5 text-center">' + confirmBtn + '</td></tr>';
      }).join('');
    }

    function showModal(id) { var m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
    function hideModal(id) { var m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

    function openReturnRecordModal(index) {
      currentIndex = index;
      renderRecordModal();
      showModal('returnRecordModal');
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function closeReturnRecordModal() { hideModal('returnRecordModal'); }

    function writebackMsg(r) {
      var t = TESTERS[r.returner] || { dept: '检测部' };
      return '检测任务及流转单已追加「' + t.dept + ' 还样」\n签名/日期：还样人电子签名 / ' + r.returnDate;
    }

    function confirmOne(ri) {
      var r = listData[currentIndex].records[ri];
      if (r.confirmed || r.deleted) return;
      r.confirmed = true;
      alert(writebackMsg(r) + '（原型演示）');
      renderRecordModal();
      if (window.PrototypeAnnotation && PrototypeAnnotation.refresh) PrototypeAnnotation.refresh();
    }

    function approveAll() {
      var item = listData[currentIndex];
      var pending = item.records.filter(function (r) { return !r.confirmed && !r.deleted; });
      if (!pending.length) { alert('已全部确认'); return; }
      pending.forEach(function (r) { r.confirmed = true; });
      alert('全部通过 ' + pending.length + ' 条还样记录，流转单已逐条回填（原型演示）。\n示例：' + writebackMsg(pending[0]));
      renderRecordModal();
    }

    document.getElementById('returnRecordModal').addEventListener('click', function (e) { if (e.target === this) closeReturnRecordModal(); });
    renderTable();

    if (window.PrototypeAnnotation) {
      PrototypeAnnotation.init({
        annotations: [
          { id: 'return-record-link', selector: '[data-annotate="return-record-link"]', position: 'top-right', title: '还样记录', content: '<strong>需求逻辑：</strong>检测员把试样退回承检方样品库后，需要样品员逐条确认，确认才算还样完成。<br>' +
            '<strong>展示规则：</strong>「还样记录」链接打开记录弹窗；流程节点为「还样确认」。<br>' +
            '<strong>交互逻辑：</strong>点击打开还样记录列表，可逐条确认或全部通过。', tag: '流转单' },
          { id: 'return-deleted-row', selector: '#recordModalBody', position: 'top-right',
            title: '还样记录里的「已删除」样品',
            wide: true,
            content: '<strong>需求逻辑：</strong>委托确认退回委托登记后删掉的样品，实物不在库里、也没有还样动作，它要走的是退样；但收样时留下的图片和数量必须还能查得到，所以这条记录留在还样记录里，只是不参与确认。<br>' +
              '<strong>展示规则：</strong>该行整行灰底，「样品名称(数量)」后带红色「已删除」标签；「还样人」「还样日期」「还样退库确认表」「操作」四列都显示「/」，不出确认按钮；「图片」列沿用收样时上传的图片（有图显示缩略图、点缩略图看大图，没上传显示「/」）。<br>' +
              '<strong>交互逻辑：</strong>已删除行不可确认，「全部通过」只统计未确认且未删除的行；演示委托 SC2026/0031（只删样品）与 SC2026/0029（既删又增）由 js/receive-history-mock.js › RETURN_REDO 提供。',
            tag: '退样' },
          { id: 'return-date-col', selector: '[data-annotate="return-date-col"]', position: 'bottom-left', title: '还样日期', content: '<strong>需求逻辑：</strong>还样日期是流转单签名的时间依据，必须与还样记录一致，不能在确认时另填。<br>' +
            '<strong>展示规则：</strong>「还样日期」列。<br>' +
            '<strong>交互逻辑：</strong>日期取自还样记录弹窗，写入流转单「样品交接人签名/日期」的日期部分。', tag: '流转单' },
          { id: 'confirm-one', selector: '[data-annotate="confirm-one"]', position: 'top-right', title: '单条确认', content: '<strong>需求逻辑：</strong>逐条确认可避免把有争议的还样一起放过。<br>' +
            '<strong>展示规则：</strong>行内「✓」按钮。<br>' +
            '<strong>交互逻辑：</strong>点击确认单条还样记录，同时触发流转单回填（检测流程 = 还样人部门 +「还样」，签名 = 还样人电子签名 + 还样日期）。', tag: '流转单' },
          { id: 'approve-all', selector: '[data-annotate="approve-all"]', position: 'top-left', title: '全部通过', wide: true, content: '<strong>需求逻辑：</strong>还样量大时逐条点确认效率低，需要批量通过，但留痕必须与逐条确认完全一致。<br>' +
            '<strong>展示规则：</strong>「全部通过」按钮，仅对未确认记录生效。<br>' +
            '<strong>交互逻辑：</strong>点击后对未确认记录逐条触发回填；多检测员各回填一行，不合并。', tag: '流转单' },
          { id: 'return-writeback', selector: '[data-annotate="return-writeback"]', position: 'top-right', title: '还样回填规则', wide: true, content: '<strong>需求逻辑：</strong>还样确认是试样回到承检方样品库的交接点，确认后必须立刻在流转单留痕，事后补记无法核对。<br>' +
            '<strong>展示规则：</strong>回填内容：检测流程 = 还样人部门 +「还样」；签名 / 日期 = 还样人电子签名 + 还样日期；还样人一般为对应检测员。<br>' +
            '<strong>交互逻辑：</strong>回填时机 = 本页点击行内 ✓ 或「全部通过」；多检测员还同一样品下的不同试样时各回填一行。', tag: '流转单' }
        ]
      });
    }
  </script>
  <script src="js/ui-a11y.js" defer></script>
</body>
</html>
