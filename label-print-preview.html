<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>样品标签打印 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/ui-baseline.css" />
  <style>
    .del-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px;
      background: #fdeeee; color: #cf1322; font-size: 11px; line-height: 16px; }
    tr.row-deleted, tr.row-deleted:hover { background: #fbfcfe; color: #b6bcc7; }
    tr.row-deleted td { border-color: #f1f3f7; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    @media print {
      .no-print { display: none !important; }
      .cert-preview-area { background: #fff !important; padding: 0 !important; width: 100% !important; }
      #previewContainer > div { page-break-after: always; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700 h-screen flex flex-col overflow-hidden" data-col-config="off" data-cat-col="off">

  <div class="no-print flex h-full">
    <!-- 左侧预览 -->
    <div class="cert-preview-area flex w-[400px] flex-shrink-0 flex-col border-r border-slate-200 bg-slate-50">
      <div class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-2.5">
        <a id="backLink" href="label-print.html" class="text-sm text-blue-600 hover:underline"><i class="fa fa-arrow-left"></i> 返回</a>
        <div class="flex items-center gap-3">
          <button onclick="clearPreview()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">清空待打印区域</button>
          <button onclick="window.print()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">打印</button>
        </div>
      </div>
      <div id="previewContainer" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- 右侧列表 -->
    <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
      <div class="border-b border-slate-200 bg-white px-4 py-3">
        <div class="flex flex-nowrap items-center gap-3">
          <div class="flex min-w-0 flex-1 items-center gap-2">
            <label class="shrink-0 text-sm text-slate-600">样品编号</label>
            <input id="s_no" type="text" placeholder="请输入样品编号" class="w-full min-w-0 max-w-[160px] rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <div class="flex min-w-0 flex-1 items-center gap-2">
            <label class="shrink-0 text-sm text-slate-600">样品名称</label>
            <input id="s_name" type="text" placeholder="请输入样品名称" class="w-full min-w-0 max-w-[160px] rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <div class="ml-auto flex shrink-0 items-center gap-2">
            <button onclick="filterSamples()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">查询</button>
            <button onclick="resetFilter()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
          </div>
        </div>
      </div>
      <div class="flex-1 overflow-auto p-4">
        <table class="w-full min-w-[1020px] border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-2 py-2 font-medium w-10"><input type="checkbox" id="sampleCheckAll" onchange="toggleSampleAll(this.checked)" checked /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[72px] whitespace-nowrap">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[150px]" data-annotate="void-label">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[104px]" data-annotate="unified-samples">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[92px]">规格</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[92px]">型号/分类</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[100px] whitespace-nowrap">收样日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[200px]">送检单位</th>
              <th class="border border-slate-200 px-3 py-2 font-medium w-[88px]">检测状态</th>
            </tr>
          </thead>
          <tbody id="sampleBody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-200 bg-white px-4 py-2 text-sm text-slate-500">
        <span id="sampleTotal">共 0 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 text-slate-300" disabled><i class="fa fa-angle-left"></i></button>
        <button id="page1" class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <button id="page2" class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50">2</button>
        <button class="flex h-7 w-7 items-center justify-center rounded border border-slate-200 hover:bg-slate-50"><i class="fa fa-angle-right"></i></button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10条/页</option></select>
      </div>
    </div>
  </div>

  <script src="js/flow-stages.js"></script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-spec-ui.js"></script>
  <script src="js/entrust-mock.js"></script>
  <script src="js/receive-store.js"></script>
  <script src="js/receive-history-mock.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script src="js/label-cert-samples.js"></script>
  <script src="js/label-cert-render.js"></script>
  <script src="js/short-link-qr.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    LabelCertRender.ensureStyles();
    var params = new URLSearchParams(location.search);
    var entrustCodes = (params.get('codes') || params.get('code') || 'SC2026/0079').split(',').filter(Boolean);
    var sampleNos = (params.get('nos') || '').split(',').filter(Boolean);
    if (params.get('from') === 'qualified') document.getElementById('backLink').href = 'cert-qualified-print.html';

    var SAMPLE_BY_NO = {
      'SC2026/00790101': { sampleNo: 'SC2026/00790101', entrustNo: 'SC2026/0079', name: '绝缘操作杆', model: '10kV', receiveDate: '2026-07-09', clientName: '杭州数蚕智能科技有限公司', detectStatus: '已检测', cat: 'aqgqj', masterId: 'rod' },
      'SC2026/00730101': { sampleNo: 'SC2026/00730101', entrustNo: 'SC2026/0073', name: '安全带', model: '', receiveDate: '2026-06-10', clientName: '杭州数蚕智能科技有限公司', detectStatus: '已检测', cat: 'aqgqj', masterId: 'belt976' },
      'SC2026/00800101': { sampleNo: 'SC2026/00800101', entrustNo: 'SC2026/0080', name: '安全帽', model: '', receiveDate: '2026-07-09', clientName: '杭州数蚕智能科技有限公司', detectStatus: '未检测', cat: 'aqgqj', masterId: 'helmet' },
      'SC2026/00780101': { sampleNo: 'SC2026/00780101', entrustNo: 'SC2026/0078', name: '绝缘操作杆', model: '10kV', receiveDate: '2026-07-08', clientName: '杭州数蚕智能科技有限公司', detectStatus: '未检测', cat: 'aqgqj', masterId: 'rod' },
      'SC2026/00720501': { sampleNo: 'SC2026/00720501', entrustNo: 'SC2026/0072', name: '安全绳', model: '', receiveDate: '2026-06-09', clientName: '杭州数蚕智能科技有限公司', detectStatus: '检测中', cat: 'aqgqj', masterId: 'rope1476' },
      'SC2026/00710101': { sampleNo: 'SC2026/00710101', entrustNo: 'SC2026/0071', name: '绝缘操作杆', model: '20kV', receiveDate: '2026-06-08', clientName: '杭州数蚕智能科技有限公司', detectStatus: '已检测', cat: 'aqgqj', masterId: 'rod' },
      'SC2026/00700101': { sampleNo: 'SC2026/00700101', entrustNo: 'SC2026/0070', name: '安全帽', model: '', receiveDate: '2026-06-07', clientName: '杭州数蚕智能科技有限公司', detectStatus: '已检测', cat: 'aqgqj', masterId: 'helmet' },
      // 以下两张委托演示「已收样后样品被删掉」：SC2026/0031 委托确认退回委托登记后删安全帽，
      // SC2026/0029 变更申请删绝缘硬梯。被删样品不进本页清单，也不进预览区。
      'SC2026/00310101': { sampleNo: 'SC2026/00310101', entrustNo: 'SC2026/0031', name: '遮蔽罩', model: '', receiveDate: '2026-10-19', clientName: '东集西造有限公司', detectStatus: '未检测', cat: 'aqgqj', masterId: 'shield' },
      'SC2026/00290101': { sampleNo: 'SC2026/00290101', entrustNo: 'SC2026/0029', name: '绝缘毯', model: '', receiveDate: '2026-10-17', clientName: '宇宙设想有限公司', detectStatus: '未检测', cat: 'aqgqj', masterId: 'blanket' },
      'SC2026/00290201': { sampleNo: 'SC2026/00290201', entrustNo: 'SC2026/0029', name: '10kV3芯电力电缆', model: 'YJV22', receiveDate: '2026-10-17', clientName: '宇宙设想有限公司', detectStatus: '未检测', cat: 'dlwz', masterId: 'cu6-3c' },
      'SC2026/00290401': { sampleNo: 'SC2026/00290401', entrustNo: 'SC2026/0029', name: '验电器', model: '', receiveDate: '', clientName: '宇宙设想有限公司', detectStatus: '未收样', cat: 'aqgqj', masterId: 'detector' }
    };

    var SAMPLE_CATALOG = {
      'SC2026/0079': [SAMPLE_BY_NO['SC2026/00790101']],
      'SC2026/0073': [SAMPLE_BY_NO['SC2026/00730101']],
      'SC2026/0080': [SAMPLE_BY_NO['SC2026/00800101']],
      'SC2026/0078': [SAMPLE_BY_NO['SC2026/00780101']],
      'SC2026/0072': [SAMPLE_BY_NO['SC2026/00720501']],
      'SC2026/0071': [SAMPLE_BY_NO['SC2026/00710101']],
      'SC2026/0070': [SAMPLE_BY_NO['SC2026/00700101']],
      'SC2026/0031': [SAMPLE_BY_NO['SC2026/00310101']],
      'SC2026/0029': [SAMPLE_BY_NO['SC2026/00290101'], SAMPLE_BY_NO['SC2026/00290201'], SAMPLE_BY_NO['SC2026/00290401']],
      'SC2026/0074': [{ sampleNo: 'SC2026/00740101', entrustNo: 'SC2026/0074', name: '卸扣', model: '', receiveDate: '2026-06-11', clientName: '杭州数蚕智能科技有限公司', detectStatus: '检测中', cat: 'aqgqj', masterId: 'shackle' }]
    };

    var EXTRA = [
      { sampleNo: 'SC2026/00730501', name: '卡线器', model: '', receiveDate: '2026-06-08', clientName: '杭州数蚕智能科技有限公司', detectStatus: '检测中', cat: 'aqgqj', masterId: 'shackle' },
      { sampleNo: 'SC2026/00730901', name: '安全带', model: '', receiveDate: '2026-06-06', clientName: '杭州数蚕智能科技有限公司', detectStatus: '未检测', cat: 'aqgqj', masterId: 'belt976' }
    ];

    var allSamples = [];
    function pushSample(s, entrustFallback) {
      // 已删除的样品不进打印清单：实物走退样，已不属于这张委托
      if (s && s.deleted) return;
      allSamples.push({
        sampleNo: s.sampleNo,
        entrustNo: s.entrustNo || entrustFallback || '',
        name: s.name,
        spec: s.spec || '',
        model: s.model || '',
        receiveDate: s.receiveDate || '',
        clientName: s.clientName || '杭州数蚕智能科技有限公司',
        detectStatus: s.detectStatus || '未检测',
        masterId: s.masterId || LabelCertConfig.masterIdFromName(s.name),
        cat: s.cat || 'aqgqj',
        _checked: true
      });
    }

    /* 统一数据源：委托下有哪些样品一律取 js/entrust-mock.js（与合格证、委托详情同源），
     * 只有共享数据缺失时才退回本页写死的样品表 */
    var unified = window.LabelCertSamples
      ? (sampleNos.length ? LabelCertSamples.byNos(sampleNos) : LabelCertSamples.ofCodes(entrustCodes))
      : null;
    if (unified && unified.length) {
      allSamples = unified;
    } else if (sampleNos.length) {
      sampleNos.forEach(function (no) {
        var s = SAMPLE_BY_NO[no.trim()];
        if (s) pushSample(s);
        else pushSample({
          sampleNo: no.trim(),
          entrustNo: '',
          name: '绝缘操作杆',
          model: '10kV',
          receiveDate: '2026-07-01',
          clientName: '杭州数蚕智能科技有限公司',
          detectStatus: '检测中',
          masterId: 'rod',
          cat: 'aqgqj'
        });
      });
    } else {
      entrustCodes.forEach(function (code) {
        var list = SAMPLE_CATALOG[code.trim()];
        if (list) list.forEach(function (s) { pushSample(s, code.trim()); });
        else pushSample({
          sampleNo: code.trim() + '0101',
          entrustNo: code.trim(),
          name: '绝缘操作杆',
          model: '10kV',
          receiveDate: '2026-07-01',
          clientName: '杭州数蚕智能科技有限公司',
          detectStatus: '检测中',
          masterId: 'rod',
          cat: 'aqgqj'
        }, code.trim());
      });
      if (!allSamples.length) EXTRA.forEach(function (s) { pushSample(s); });
    }

    var samples = allSamples.slice();
    var currentPage = 1;
    var pageSize = 10;

    function buildLabelHtml(item, idx) {
      var tpl = LabelCertConfig.resolveTemplate(item.cat || 'aqgqj', 'sample_label', item.masterId);
      if (!tpl) {
        return '<div class="mb-3 rounded border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-700">未配置模版：' + item.sampleNo + '</div>';
      }
      tpl = LabelCertConfig.clone(tpl);
      var html = LabelCertRender.renderSheet(tpl, item, { suffix: '-l' + idx });
      return '<div class="mb-4">' + html + '</div>';
    }

    function renderPreview() {
      var container = document.getElementById('previewContainer');
      var selected = samples.filter(function (s) { return s._checked; });
      if (!selected.length) {
        container.innerHTML = '<p class="text-center text-sm text-slate-400 py-12">暂无待打印样品标签</p>';
        return;
      }
      container.innerHTML = selected.map(function (item, i) { return buildLabelHtml(item, i); }).join('');
      LabelCertRender.mountQrs(container);
    }

    function getPageData() {
      var start = (currentPage - 1) * pageSize;
      return { slice: samples.slice(start, start + pageSize), start: start };
    }

    function renderSampleTable() {
      var pg = getPageData();
      document.getElementById('sampleBody').innerHTML = pg.slice.map(function (item, i) {
        var gIdx = pg.start + i;
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2"><input type="checkbox" class="sample-check" ' + (item._checked ? 'checked' : '') + ' onchange="onSampleCheck(' + gIdx + ', this.checked)" /></td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (gIdx + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.sampleNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (item.spec || '/') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + (item.model || '/') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.receiveDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 leading-tight">' + item.clientName + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + item.detectStatus + '</td></tr>';
      }).join('');
      document.getElementById('sampleTotal').textContent = '共 ' + samples.length + ' 条';
      var allChecked = samples.length && samples.every(function (s) { return s._checked; });
      document.getElementById('sampleCheckAll').checked = allChecked;
      renderPreview();
    }

    function onSampleCheck(idx, checked) {
      samples[idx]._checked = checked;
      renderPreview();
      document.getElementById('sampleCheckAll').checked = samples.length && samples.every(function (s) { return s._checked; });
    }

    function toggleSampleAll(checked) {
      samples.forEach(function (s) { s._checked = checked; });
      renderSampleTable();
    }

    function filterSamples() {
      var no = document.getElementById('s_no').value.trim();
      var name = document.getElementById('s_name').value.trim();
      samples = allSamples.filter(function (s) {
        if (no && s.sampleNo.indexOf(no) === -1) return false;
        if (name && s.name.indexOf(name) === -1) return false;
        return true;
      });
      currentPage = 1;
      renderSampleTable();
    }

    function resetFilter() {
      document.getElementById('s_no').value = '';
      document.getElementById('s_name').value = '';
      samples = allSamples.slice();
      currentPage = 1;
      renderSampleTable();
    }

    function clearPreview() {
      samples.forEach(function (s) { s._checked = false; });
      renderSampleTable();
    }

    document.getElementById('page1').addEventListener('click', function () { currentPage = 1; renderSampleTable(); });
    document.getElementById('page2').addEventListener('click', function () { currentPage = 2; renderSampleTable(); });

    renderSampleTable();

    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'unified-samples',
          selector: '[data-annotate="unified-samples"]',
          position: 'top-right',
          title: '样品标签与合格证共用同一份样品清单',
          wide: true,
          content: '<strong>需求逻辑：</strong>同一张委托，点「样品标签」和点「合格证」必须看到同一批样品。' +
            '以前样品标签预览、合格证单张、合格证批量、合格打印四个页面各写了一份样品表，' +
            'SC2026/0073 一边显示安全带、一边显示验电器，而委托详情里其实是绝缘操作杆。<br>' +
            '<strong>展示规则：</strong>委托下有哪些样品一律取 <code>js/entrust-mock.js</code>' +
            '（与委托详情 / 样品收样 / 变更记录同源），样品编号 = 委托号 + 两位组号 + 试样号（如 SC2026/00730101）；' +
            '「型号规格」字段（合格证与样品标签两个字段池同名）取值 = 「型号/分类」+「规格」，两段之间一个空格；规格段把该型号下的多个规格取值与各自单位用空格拼接，如 <code>YJV 185 mm² 8.7/10 kV</code>；样品没配规格参数时退回委托登记的规格文本（如 <code>300</code>、<code>10kV 二级</code>）。' + '列表里「型号/分类」「规格」两列是分开的两段，证面与标签上的「型号规格」是把它们拼成一段。' +
            '被删除的样品（变更删除、退回登记后删除）不进打印清单，但它占用的组号不回收——' +
            'SC2026/0029 的 03 号位留给被删的绝缘硬梯，变更新增的验电器排在 00290401；' +
            '收样日期与检测日期取委托收样日期，复检日期 = 检测日期 + 1 年 - 1 天；' +
            '检测状态按流程阶段推导（发样前未检测 / 检测环节在检 / 报告编制及之后已检测）。<br>' +
            '<strong>交互逻辑：</strong>标签上的二维码扫码后（<code>label-scan.html</code>）按样品编号回查同一份数据，' +
            '打印出来的样品与扫码看到的完全一致；判定不合格按委托号配置（演示单 SC2026/0074），' +
            '不合格与报告签发之前的委托照旧不出现合格证入口。',
          tag: '标签与合格证'
        },
        {
          id: 'lpv-void-label',
          selector: '[data-annotate="void-label"]',
          position: 'top-right',
          title: '已删除样品不进标签打印',
          wide: true,
          content: '<strong>需求逻辑：</strong>样品收样之后被删掉有两种来源：① 委托确认退回委托登记，把这件样品删了；② 变更申请删除样品。' +
            '删掉的样品实物要走退样还给委托方，已经不属于这张委托，标签打印再列出它就会出现"给一件不在库的样品打标签"的错。<br>' +
            '<strong>展示规则：</strong>被删样品<strong>不出现在样品清单，也不出现在预览区</strong>；底部计数只统计委托内的正常样品' +
            '（如 SC2026/0031 只列遮蔽罩 1 条，已删除的安全帽不再显示；SC2026/0029 只列绝缘毯、10kV3芯电力电缆、验电器，不显示绝缘硬梯）。<br>' +
            '<strong>交互逻辑：</strong>清单里没有的记录自然无法勾选，「全选」与批量打印只覆盖正常样品；样品编号不回收、永久占位，' +
            '客户补送同款样品走新增样品重新发号。演示数据在 js/receive-history-mock.js › DELETED_SAMPLES。',
