<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合格证打印 - 智慧实验室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .cert-sheet { width: 420px; min-height: 240px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .cert-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; border-bottom: 1px solid #f1f5f9; }
    .cert-body { display: flex; padding: 12px 16px 16px; gap: 12px; }
    .cert-fields { flex: 1; font-size: 13px; line-height: 1.9; color: #334155; }
    .cert-fields dt { display: inline; color: #64748b; }
    .cert-fields dd { display: inline; margin: 0; }
    @media print {
      .no-print { display: none !important; }
      .cert-preview-area { background: #fff !important; padding: 0 !important; }
      .cert-sheet { box-shadow: none; border: none; page-break-after: always; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-700 h-screen flex flex-col overflow-hidden">

  <div class="no-print flex h-full">
    <!-- 左侧：预览区 -->
    <div class="cert-preview-area flex w-[480px] flex-shrink-0 flex-col border-r border-slate-200 bg-slate-50">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 bg-white px-4 py-2.5">
        <a href="label-print.html" class="text-sm text-blue-600 hover:underline"><i class="fa fa-arrow-left"></i> 返回</a>
        <div class="flex flex-wrap items-center gap-2">
          <div data-annotate="shortlink-base" class="flex items-center gap-1.5 rounded border border-slate-200 bg-slate-50 px-2 py-1">
            <label for="shortlinkBaseMode" class="whitespace-nowrap text-xs text-slate-500">短链 Base</label>
            <select id="shortlinkBaseMode" class="rounded border border-slate-300 bg-white px-1.5 py-0.5 text-xs text-slate-700 outline-none focus:border-blue-500" onchange="onShortlinkBaseChange()">
              <option value="public">对外（公网）</option>
              <option value="internal">对内（内网）</option>
            </select>
          </div>
          <button onclick="clearPreview()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">清空待打印区域</button>
          <button onclick="window.print()" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">打印</button>
        </div>
      </div>
      <p id="shortlinkBaseHint" class="no-print border-b border-slate-100 bg-white px-4 py-1 text-[11px] text-slate-400 truncate"></p>
      <div id="previewContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    </div>

    <!-- 右侧：样品列表 -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <div class="border-b border-slate-200 bg-white px-4 py-3">
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-2">
            <label class="text-sm text-slate-600">样品编号</label>
            <input id="s_no" type="text" placeholder="请输入样品编号" class="w-40 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-slate-600">样品名称</label>
            <input id="s_name" type="text" placeholder="请输入样品名称" class="w-40 rounded border border-slate-300 px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
          </div>
          <button onclick="filterSamples()" class="rounded bg-blue-600 px-4 py-1.5 text-sm text-white hover:bg-blue-700">查询</button>
          <button onclick="resetFilter()" class="rounded border border-slate-300 px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-50">重置</button>
        </div>
      </div>
      <div class="flex-1 overflow-auto p-4">
        <table class="w-full border-collapse text-left text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-600">
              <th class="border border-slate-200 px-3 py-2 font-medium w-10"><input type="checkbox" id="sampleCheckAll" onchange="toggleSampleAll(this.checked)" /></th>
              <th class="border border-slate-200 px-3 py-2 font-medium">序号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品编号</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">样品名称</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">规格</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">型号规格</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">检验日期</th>
              <th class="border border-slate-200 px-3 py-2 font-medium">再检日期</th>
              <th id="thInspector" class="border border-slate-200 px-3 py-2 font-medium">检测员</th>
              <th id="thRecorder" class="border border-slate-200 px-3 py-2 font-medium hidden">记录员</th>
            </tr>
          </thead>
          <tbody id="sampleBody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-200 bg-white px-4 py-2 text-sm text-slate-500">
        <span id="sampleTotal">共 1 条</span>
        <button class="flex h-7 w-7 items-center justify-center rounded bg-blue-600 text-white">1</button>
        <select class="rounded border border-slate-200 px-2 py-1"><option>10条/页</option></select>
      </div>
    </div>
  </div>

  <script src="js/short-link-qr.js"></script>
  <script src="js/personnel-store.js"></script>
  <script src="js/inspector-select.js"></script>
  <script src="js/label-cert-config.js"></script>
  <script src="js/label-cert-render.js"></script>
  <script src="js/prototype-annotation.js"></script>
  <script>
    LabelCertRender.ensureStyles();
    var SHORTLINK_BASE_KEY = 'lims.shortlink.baseMode';
    var params = new URLSearchParams(location.search);
    var entrustCode = params.get('code') || 'SC2026/0079';
    var MAX_INSPECTORS = LabelCertConfig.getInspectorMax();
    var MAX_RECORDERS = LabelCertConfig.getRecorderMax();
    var inspParam = params.get('inspectors');
    var urlInspectors = PersonnelStore.pickRosterNames(
      inspParam === null ? [] : inspParam.split(',').filter(Boolean),
      MAX_INSPECTORS
    );
    var urlRecorders = (params.get('recorders') || '').split(',').filter(Boolean).slice(0, MAX_RECORDERS);

    function syncShortlinkBaseHint() {
      var mode = ShortLinkQR.getBaseMode();
      var hint = document.getElementById('shortlinkBaseHint');
      var sel = document.getElementById('shortlinkBaseMode');
      if (sel) sel.value = mode;
      if (hint) {
        hint.textContent = (mode === 'internal' ? '对内打印 · QR 写入 ' : '对外发放 · QR 写入 ') + ShortLinkQR.getBase() + '{code}（code 内外共用）';
      }
    }

    function onShortlinkBaseChange() {
      var mode = document.getElementById('shortlinkBaseMode').value;
      ShortLinkQR.setBaseMode(mode);
      try { sessionStorage.setItem(SHORTLINK_BASE_KEY, mode); } catch (e) {}
      syncShortlinkBaseHint();
      renderPreview();
      if (window.PrototypeAnnotation) PrototypeAnnotation.refresh();
    }

    (function initShortlinkBase() {
      var saved = '';
      try { saved = sessionStorage.getItem(SHORTLINK_BASE_KEY) || ''; } catch (e) {}
      ShortLinkQR.setBaseMode(saved === 'internal' ? 'internal' : 'public');
      syncShortlinkBaseHint();
    })();

    // 00790101 → 个性化不粘胶纸；00790201 → 未绑定个性化，走默认左文右码版式 mock
    var allSamples = [
      { sampleNo: 'SC2026/00790101', name: '绝缘操作杆', spec: '', model: '10kV', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', inspectors: urlInspectors.slice(), recorders: urlRecorders.slice(), entrust: 'SC2026/0079', cat: 'aqgqj', masterId: 'rod', judgment: '合格', status: '报告发放' },
      { sampleNo: 'SC2026/00790201', name: '验电器', spec: '', model: '35kV', inspectDate: '2026-07-09', reinspectDate: '2027-07-08', inspectors: urlInspectors.slice(), recorders: urlRecorders.slice(), entrust: 'SC2026/0079', cat: 'aqgqj', masterId: 'electroscope', judgment: '合格', status: '报告发放' }
    ];
    if (entrustCode !== 'SC2026/0079') {
      allSamples = [
        { sampleNo: entrustCode + '0101', name: '验电器', spec: '', model: '10kV', inspectDate: '2026-07-01', reinspectDate: '2027-07-01', inspectors: urlInspectors.slice(), recorders: urlRecorders.slice(), entrust: entrustCode, cat: 'aqgqj', masterId: 'electroscope', judgment: '合格', status: '报告签发' }
      ];
    }

    var samples = allSamples.slice();
    var INSPECTOR_OPTIONS = PersonnelStore.rosterNames();
    var RECORDER_OPTIONS = ['admin', 'cs222', 'cs3', '张三', '李四'];

    function rolesForItem(item) {
      var masterId = item.masterId || LabelCertConfig.masterIdFromName(item.name);
      var tpl = LabelCertConfig.resolveTemplate(item.cat || 'aqgqj', 'certificate', masterId);
      return LabelCertConfig.personnelRolesNeeded((tpl && tpl.elements) || []);
    }

    function pageRolesUnion(list) {
      var needI = false, needR = false;
      (list || []).forEach(function (s) {
        var r = rolesForItem(s);
        if (r.needInspectors) needI = true;
        if (r.needRecorders) needR = true;
      });
      return { needInspectors: needI, needRecorders: needR };
    }

    function buildCertHtml(item, idx) {
      var masterId = item.masterId || LabelCertConfig.masterIdFromName(item.name);
      var tpl = LabelCertConfig.resolveTemplate(item.cat || 'aqgqj', 'certificate', masterId);
      if (!tpl) {
        return '<div class="rounded border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-700">未配置合格证模版：' + item.sampleNo + '</div>';
      }
      tpl = LabelCertConfig.clone(tpl);
      var html = LabelCertRender.renderSheet(tpl, item, { suffix: '-' + (idx || 0) });
      if (idx === 0) html = html.replace('class="lc-qr"', 'class="lc-qr" data-annotate="qr-area"');
      return html;
    }

    function renderPreview() {
      var container = document.getElementById('previewContainer');
      var selected = samples.filter(function (s) { return s._checked; });
      if (!selected.length) {
        container.innerHTML = '<p class="text-center text-sm text-slate-400 py-12">暂无待打印合格证</p>';
        return;
      }
      container.innerHTML = selected.map(function (item, i) { return buildCertHtml(item, i); }).join('');
      LabelCertRender.mountQrs(container);
    }

    function renderSampleTable() {
      var union = pageRolesUnion(samples);
      document.getElementById('thInspector').classList.toggle('hidden', !union.needInspectors);
      document.getElementById('thRecorder').classList.toggle('hidden', !union.needRecorders);
      document.getElementById('sampleBody').innerHTML = samples.map(function (item, i) {
        item._checked = item._checked !== false;
        var roles = rolesForItem(item);
        var inspTd = union.needInspectors
          ? '<td class="border border-slate-200 px-3 py-2 min-w-[140px]" data-annotate-inspector="' + (i === 0 ? '1' : '') + '">' +
              (roles.needInspectors
                ? InspectorSelect.renderHTML({ inspectors: item.inspectors, options: INSPECTOR_OPTIONS, mode: 'cell', idx: i, prefix: 'insp', maxCount: MAX_INSPECTORS })
                : '<span class="text-xs text-slate-300">—</span>') +
            '</td>'
          : '';
        var recTd = union.needRecorders
          ? '<td class="border border-slate-200 px-3 py-2 min-w-[140px]">' +
              (roles.needRecorders
                ? InspectorSelect.renderHTML({ inspectors: item.recorders || [], options: RECORDER_OPTIONS, mode: 'cell', idx: i, prefix: 'rec', maxCount: MAX_RECORDERS })
                : '<span class="text-xs text-slate-300">—</span>') +
            '</td>'
          : '';
        return '<tr class="hover:bg-slate-50">' +
          '<td class="border border-slate-200 px-3 py-2"><input type="checkbox" class="sample-check" data-idx="' + i + '" ' + (item._checked ? 'checked' : '') + ' onchange="onSampleCheck(' + i + ', this.checked)" /></td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (i + 1) + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.sampleNo + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + item.name + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (item.spec || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2">' + (item.model || '') + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.inspectDate + '</td>' +
          '<td class="border border-slate-200 px-3 py-2 whitespace-nowrap">' + item.reinspectDate + '</td>' +
          inspTd + recTd + '</tr>';
      }).join('');
      document.getElementById('sampleTotal').textContent = '共 ' + samples.length + ' 条';
      renderPreview();
    }

    function onSampleCheck(idx, checked) {
      samples[idx]._checked = checked;
      renderPreview();
    }

    function toggleSampleAll(checked) {
      samples.forEach(function (s) { s._checked = checked; });
      renderSampleTable();
    }

    function onPersonnelAdd(idx, name, prefix) {
      if (idx == null || !samples[idx] || !name) return;
      if (prefix === 'rec') {
        if (!samples[idx].recorders) samples[idx].recorders = [];
        if (samples[idx].recorders.length >= MAX_RECORDERS) {
          alert('最多只能选择 ' + MAX_RECORDERS + ' 名记录员');
          return;
        }
        if (samples[idx].recorders.indexOf(name) === -1) samples[idx].recorders.push(name);
      } else {
        if (samples[idx].inspectors.length >= MAX_INSPECTORS) {
          alert('最多只能选择 ' + MAX_INSPECTORS + ' 名检测员');
          return;
        }
        if (samples[idx].inspectors.indexOf(name) === -1) samples[idx].inspectors.push(name);
      }
      renderSampleTable();
    }

    function onPersonnelRemove(idx, name, prefix) {
      if (idx == null || !samples[idx]) return;
      if (prefix === 'rec') {
        samples[idx].recorders = (samples[idx].recorders || []).filter(function (n) { return n !== name; });
      } else {
        samples[idx].inspectors = samples[idx].inspectors.filter(function (n) { return n !== name; });
      }
      renderSampleTable();
    }

    InspectorSelect.bind(document.getElementById('sampleBody'), {
      onAdd: onPersonnelAdd,
      onRemove: onPersonnelRemove
    });

    function filterSamples() {
      var no = document.getElementById('s_no').value.trim();
      var name = document.getElementById('s_name').value.trim();
      samples = allSamples.filter(function (s) {
        if (no && s.sampleNo.indexOf(no) === -1) return false;
        if (name && s.name.indexOf(name) === -1) return false;
        return true;
      });
      renderSampleTable();
    }

    function resetFilter() {
      document.getElementById('s_no').value = '';
      document.getElementById('s_name').value = '';
      samples = allSamples.slice();
      renderSampleTable();
    }

    function clearPreview() {
      samples.forEach(function (s) { s._checked = false; });
      renderSampleTable();
    }

    renderSampleTable();

    PrototypeAnnotation.init({
      annotations: [
        {
          id: 'qr-shortlink',
          selector: '[data-annotate="qr-area"]',
          position: 'bottom-right',
          title: '短链二维码整改',
          wide: true,
          content: '<strong>原问题：</strong>QR 编码完整验真 URL（60+ 字符），码点密集，微信/支付宝扫码易失败。<br><br>' +
            '<strong>技术方案：</strong><br>' +
            '① 打印时为试样编号生成唯一短链映射（如 SC2026/00790101 → https://lims-plan.vercel.app/l/Ab3K9）<br>' +
            '② QR 仅编码短链（≤20 字符）<br>' +
            '③ 扫码后短链服务 HTTP 302 跳转至 H5 验真页<br><br>' +
            '<strong>扫码方式：</strong>微信、支付宝、手机系统相机均可，无特殊限制<br><br>' +
            '<strong>跳转页面：</strong>「合格证验真」H5 页（原型 cert-verify.html）<br><br>' +
            '<strong>展示信息：</strong>试样编号/名称、型号规格、检验/再检日期、检测员、检验机构、验真结论<br><br>' +
            '<strong>验真有效：</strong>短链存在 + 处于报告签发后续流程 + 未超过再检日期 + 未作废<br>' +
            '<strong>验真无效：</strong>短链不存在/已失效、超过再检日期、已作废/撤回（含<strong>流程回退</strong>：从报告签发后续退至报告签发及之前，短链自动作废）<br><br>' +
            '<strong>演示：</strong>有效 Ab3K9 · 过期 Ex1p1 · 回退作废 Rv0k1 · 不存在 XXXXX<br><br>' +
            '<strong>预期效果：</strong>识别率提升；QR 可缩小仍清晰；URL 变更时只改短链映射，无需重印',
          tag: '核心整改'
        },
        {
          id: 'qr-display',
          selector: '[data-annotate="qr-area"]',
          position: 'top-left',
          title: '短链地址展示',
          content: '预览区二维码下方展示短链地址，便于打印前核对。点击 QR 可模拟扫码，打开验真页查看实际展示内容。',
          tag: '交互说明'
        },
        {
          id: 'shortlink-base',
          selector: '[data-annotate="shortlink-base"]',
          position: 'bottom-left',
          title: '方案2：打印前切换短链 Base',
          wide: true,
          content: '<strong>场景：</strong>局域网部署 + 对外发放标签时，内网扫码与外网 4G 扫码需要不同的短链域名前缀。<br><br>' +
            '<strong>做法：</strong>打印前在此切换「对内（内网）」/「对外（公网）」Base，再点打印。QR 写入 <code>Base + code</code>，因此<strong>二维码图案会随 Base 变化</strong>。<br><br>' +
            '<strong>不变：</strong>同一试样的短码 <code>code</code> 内外共用一张映射表，不会生成两套短码。<br><br>' +
            '<strong>示例：</strong>对内 <code>http://lims.local/l/Ab3K9</code> · 对外 <code>https://lims-plan.vercel.app/l/Ab3K9</code><br><br>' +
            '<strong>注意：</strong>外网扫到内网 Base 的标签打不开；对外发放请选「对外（公网）」。',
          tag: '方案2'
        },
        {
          id: 'inspector-edit',
          selector: '[data-annotate-inspector="1"]',
          position: 'top-right',
          title: '检测员选择',
          wide: true,
          content: '检测员取自基础数据 › 人员资质的<b>在岗</b>试验员。已离岗不出现。列按模版角色并集显示；修改后左侧合格证预览实时同步。记录员名单本期不变。',
          tag: '选人'
        }
      ]
    });
  </script>
  <script src="js/sample-data-store.js"></script>
  <script src="js/sample-cat-filter.js"></script>
</body>
</html>
